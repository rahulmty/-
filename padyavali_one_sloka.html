<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noarchive, nosnippet">
  <title>Padyāvalī</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vesper+Libre:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#fffaf0;
      --paper:#fffef9;
      --ink:#2d2417;
      --muted:#6f604c;
      --line:#e8d9bd;
      --accent:#8a4f15;
      --soft:#f5ead4;
      --shadow:0 18px 45px rgba(88,52,14,.12);
      --radius:22px;
      --font-scale:1;
    }

    body.dark {
      --bg:#17120c;
      --paper:#21180f;
      --ink:#f8edda;
      --muted:#cdbb9f;
      --line:#4b3925;
      --accent:#f0bc73;
      --soft:#302316;
      --shadow:0 18px 45px rgba(0,0,0,.35);
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      margin:0;
      color:var(--ink);
      background:radial-gradient(circle at top left, var(--soft), var(--bg) 36rem);
      font-family:'Vesper Libre', 'Noto Serif Devanagari', 'Nirmala UI', serif;
      line-height:1.7;
      -webkit-user-select:none;
      user-select:none;
    }

    .wrap { width:min(960px, calc(100% - 32px)); margin:0 auto; }

    header { padding:34px 0 18px; }

    .hero {
      background:linear-gradient(135deg, rgba(255,255,255,.76), rgba(255,245,225,.66));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:26px 28px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    body.dark .hero { background:linear-gradient(135deg, rgba(47,34,21,.82), rgba(31,24,15,.86)); }

    .hero::after {
      content:'ॐ';
      position:absolute;
      right:24px;
      top:-16px;
      font-size:8rem;
      opacity:.055;
      pointer-events:none;
    }

    h1 {
      margin:0;
      font-size:clamp(2.2rem, 7vw, 4.6rem);
      line-height:1.08;
      color:var(--accent);
      letter-spacing:.01em;
    }

    .toolbar {
      position:sticky;
      top:0;
      z-index:10;
      backdrop-filter:blur(14px);
      background:color-mix(in srgb, var(--bg) 86%, transparent);
      border-bottom:1px solid var(--line);
      padding:12px 0;
    }

    .controls {
      display:grid;
      grid-template-columns:auto auto minmax(110px, 150px) auto auto auto;
      gap:10px;
      align-items:center;
      justify-content:center;
    }

    input, button {
      border:1px solid var(--line);
      background:var(--paper);
      color:var(--ink);
      border-radius:14px;
      padding:10px 12px;
      font:inherit;
      min-height:44px;
    }

    button { cursor:pointer; color:var(--accent); font-weight:800; }
    button:hover, input:focus { outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    button:disabled { opacity:.45; cursor:not-allowed; }

    .jump { display:flex; align-items:center; gap:8px; color:var(--muted); }
    .jump input { width:100%; text-align:center; font-weight:800; }

    main { padding:26px 0 70px; }

    .reader {
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:clamp(18px, 4vw, 34px);
    }

    .card-top {
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      border-bottom:1px solid var(--line);
      padding-bottom:14px;
      margin-bottom:22px;
    }

    .meta { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .num {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:60px;
      height:40px;
      border-radius:999px;
      background:var(--soft);
      color:var(--accent);
      font-weight:900;
    }

    .topic {
      color:var(--accent);
      font-size:.98rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.05em;
    }

    .bookmark { font-size:1.25rem; line-height:1; min-width:48px; }
    .bookmark.saved { background:var(--accent); color:var(--paper); }

    .devanagari {
      font-size:calc(1.62rem * var(--font-scale));
      line-height:2;
      white-space:pre-wrap;
      text-align:center;
      margin:0 auto 18px;
      max-width:850px;
      font-weight:500;
    }

    .iast {
      font-size:calc(1.12rem * var(--font-scale));
      color:var(--muted);
      white-space:pre-wrap;
      font-style:italic;
      text-align:center;
      margin:0 auto 26px;
      max-width:850px;
    }

    .commentary-title {
      margin:24px auto 8px;
      max-width:760px;
      color:var(--accent);
      font-size:1.02rem;
      font-weight:900;
      letter-spacing:.03em;
      text-transform:uppercase;
    }

    .meaning {
      white-space:pre-wrap;
      font-size:calc(1.06rem * var(--font-scale));
      text-align:left;
      margin:0 auto;
      max-width:760px;
    }

    .source {
      margin:20px auto 0;
      max-width:760px;
      color:var(--muted);
      font-size:.96rem;
      border-top:1px dashed var(--line);
      padding-top:12px;
      text-align:left;
    }

    .hidden { display:none !important; }

    .toast {
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:var(--ink);
      color:var(--paper);
      padding:10px 14px;
      border-radius:999px;
      opacity:0;
      pointer-events:none;
      transition:.2s ease;
      z-index:99;
    }

    .toast.show { opacity:1; }

    @media (max-width:760px) {
      .controls { grid-template-columns:1fr 1fr; }
      .controls > * { width:100%; }
      .jump { grid-column:1 / -1; }
      .card-top { flex-direction:column; }
    }

    @media (max-width:460px) {
      .controls { grid-template-columns:1fr; }
      .hero { padding:22px; }
      .devanagari { font-size:calc(1.35rem * var(--font-scale)); }
    }

    @media print { body { display:none; } }
  </style>
</head>

  <script id="sloka-data" type="application/json">[{"number":1,"topic":"Padyāvalī","devanagari":"पद्यावली विरचिता रसिकैर्मुकुन्द-\nसम्बन्धबन्धुरपदा प्रमदोर्मिसिन्धुः।\nरम्या समस्तमसां दमनी क्रमेण\nसंगृह्यते कृतिकदम्बककौतुकाय।।","iast":"padyāvalī viracitā rasikairmukunda-\nsambandhabandhurapadā pramadormisindhuḥ|\nramyā samastamasāṃ damanī krameṇa\nsaṃgṛhyate kṛtikadambakakautukāya||","meaning":"The Padyāvalī --\nComprises verses composed by great devotees absorbed in the\nrelish of bhakti,\nIs endowed with delighting words springing forth from the\ninspiration of Śrī Mukunda,\nIs but an ocean, the waves of which are running riot in intoxication\nwith divine love,\nAnd is as charming as it is a dispeller of all ignorance.\nIn sequence of topics do I compile this multitude of devotional\nexpressions for the pleasure of all.","source":"Śrī Rūpa Gosvāmī"},{"number":2,"topic":"Invocatory Verses (Maṅgalācaranam)","devanagari":"नमो नलिननेत्राय वेणुवाद्यविनोदिने।\nराधाधरसुधापानशालिने वनमालिने।।","iast":"namo nalinanetrāya veṇuvādyavinodine|\nrādhādharasudhāpānaśāline vanamāline||","meaning":"I offer my obeisance unto the lotus-eyed Lord,\nWho pleases His devotees with the melodious sound of His flute,\nWho is adorned with a chaplet of flowers,\nAnd is blessed with the relish of the nectar of Śrī Rādhā's lips.","source":"Anonymous"},{"number":3,"topic":"Invocatory Verses (Maṅgalācaranam)","devanagari":"भक्तिप्रह्वविलोकनप्रणयिनी नीलोत्पलस्पर्धिनी\nध्यानालम्बनतां समाधिनिरतैनिर्तेहितप्राप्तये।\nलावण्यैक महानिधी रसिकतां राधादृशोस्तन्वती\nयुष्माकं कुरुतां भवार्तिशमनं नेत्रे तनुर्वा हरेः।।","iast":"bhaktiprahvavilokanapraṇayinī nīlotpalaspardhinī\ndhyānālambanatāṃ samādhiniratainirtehitaprāptaye|\nlāvaṇyaika mahānidhī rasikatāṃ rādhādṛśostanvatī\nyuṣmākaṃ kurutāṃ bhavārtiśamanaṃ netre tanurvā hareḥ||","meaning":"Lord Hari, Whose eyes rival the beauty of blue lotuses, casts affectionate glances on those lovingly devoted to Him.\nHe is the object of meditation for yogis absorbed in the trance of samādhi, who seek recourse to Him for their salvation.\nHe is the One plentitude of beauty, charm and grace, at Whose sight Rādhā's eyes blossom with profusion of loving emotion.\nMay that Lord Hari, His eyes and His very form, relieve the worldly suffering of all of you.","source":"Śrī Sāraṅga"},{"number":4,"topic":"Invocatory Verses (Maṅgalācaranam)","devanagari":"ये गोवर्धनमूलकर्दमसव्यादष्टबर्हाङ्गदा\nये वृन्दावनकुक्षिक्षु व्रजवधुनीलोपधानानि च ।\nये चाभ्यङ्गसुगन्धयः कुवलयापीडस्य दानाम्भसा\nते वो मङ्गलमादिशन्तु सततं कंसद्विषो बाहवः ।।","iast":"ye govardhanamūlakardamasavyādaṣṭabarhāṅgadā\nye vṛndāvanakukṣikṣu vrajavadhunīlopadhānāni ca |\nye cābhyaṅgasugandhayaḥ kuvalayāpīḍasya dānāmbhasā\nte vo maṅgalamādiśantu satataṃ kaṃsadviṣo bāhavaḥ ||","meaning":"The arms of the slayer of the demon Kamsa --\nAre adorned with armlets of peacock-feathers, smeared with moist mud from the base of Govardhana Hill.\nAre, in the bowers of Vrndāvana, like blue* pillows for (the comfort of) the maidens of Vraja.\nAnd are anointed with the fragrance of the exudation from the temples of the elephant Kuvalyāpīḍa.**\nMay those arms of the Lord grant you everlasting felicity.","source":"Śrī Śubhāṅka"},{"number":5,"topic":"Invocatory Verses (Maṅgalācaranam)","devanagari":"सायं व्यावर्तमानाखिलसुरभिकुलाह्वनसङ्केतनामा-\nन्याभीरीवृन्दचेतोठहर णकलसिद्धमन्त्राक्षराणि ।\nसौभाग्यं वः समन्ताद्दधतु मधुभिदः केलिगोपालमूर्तेः\nसानन्दाकृष्टवृन्दावनरसिकमृगश्रेणयो वेणुनादाः ।।","iast":"sāyaṃ vyāvartamānākhilasurabhikulāhvanasaṅketanāmā-\nnyābhīrīvṛndacetoṭhahara ṇakalasiddhamantrākṣarāṇi |\nsaubhāgyaṃ vaḥ samantāddadhatu madhubhidaḥ keligopālamūrteḥ\nsānandākṛṣṭavṛndāvanarasikamṛgaśreṇayo veṇunādāḥ ||","meaning":"The melodious sound of the flute of the slayer of the demon Madhu --\nBeckons the cows of His herd by their assigned names when they return home in the evening,\nArticulates the letters of the magical incantation that captivates the hearts of the group of gopīs (cowherd girls),\nAnd enchants the flocks of devotionally sentimental deer in Vṛndāvana.\nMay that sound of the flute of the Lord, Who assumes the form of a sportive cowherd, grant you good fortune from all sides.","source":"Śrī Hara"},{"number":6,"topic":"The Glories Of Lord Kṛṣṇa","devanagari":"अम्भोधिः स्थलतां स्थलं जलधितां धुलीलवः शैलतां\nशैलौ मृत्कणतां तृणं कुलिशतां वज्रं तृणक्षीणताम्।\nवह्निः शीतलतां हिमं दहनतामायाति यस्येच्छया\nलीलादुर्ललिताद्भुतव्यसनिने कृष्णाय तस्मै नमः।।","iast":"ambhodhiḥ sthalatāṃ sthalaṃ jaladhitāṃ dhulīlavaḥ śailatāṃ\nśailau mṛtkaṇatāṃ tṛṇaṃ kuliśatāṃ vajraṃ tṛṇakṣīṇatām|\nvahniḥ śītalatāṃ himaṃ dahanatāmāyāti yasyecchayā\nlīlādurlalitādbhutavyasanine kṛṣṇāya tasmai namaḥ||","meaning":"By the desire of Kṛṣṇa --\nThe ocean turns into land and land into ocean.\nA particle of dust assumes the form of a mountain and a mountain is reduced to a grain of sand.\nA piece of grass becomes a powerful thunderbolt and a flash of lightning diminishes into an insignificant blade of grass.\nFire turns cold and snow is able to burn.\nTo that Lord Kṛṣṇa,\nWho has a fancy for playing naughty pranks and creating marvelous wonders in His sportive pastimes,\nDo I offer my salutations.","source":"Anonymous"},{"number":7,"topic":"The Glories Of Lord Kṛṣṇa","devanagari":"वात्सल्यदाभयप्रदानसमयादार्तिनिर्वापणा-\nदौदार्यादघशोषणादगणितश्रेयःपदप्रापणात् ।\nसेव्यः श्रीपतिरेव सर्वजगतामेते यतः साक्षिणः\nप्रह्रादश्च विभीषणश्च करिराट् पाञ्चाल्यहल्य ध्रुवः ।।","iast":"vātsalyadābhayapradānasamayādārtinirvāpaṇā-\ndaudāryādaghaśoṣaṇādagaṇitaśreyaḥpadaprāpaṇāt |\nsevyaḥ śrīpatireva sarvajagatāmete yataḥ sākṣiṇaḥ\nprahrādaśca vibhīṣaṇaśca karirāṭ pāñcālyahalya dhruvaḥ ||","meaning":"The Lord, the consort of Śrī Lakṣmī, is the only One worthy of worship by the whole world, because --\nHe has parental affection for His devotees.\nHe pledges to grant fearlessness,\nHe relieves the suffering of devotees in distress,\nHe is magnanimous.\nHe destroys all sins.\nAnd He bestows immeasurably exalted positions to His devotees.\nPrahlāda, Vibhīṣaṇa, Karirāṭ (Gajendra), Pāñcālī (Draupadī), Ahilyā and Dhruva, have stood witness to these qualities of the Lord (in the respective order stated).","source":"Anonymous"},{"number":8,"topic":"The Glory Of Worship","devanagari":"व्याधस्याचरणं ध्रुवस्य च वयो विद्या गजेन्द्रस्य का\nकुब्जायाः किमु नाम रूपमधिकं किं तत् सुदाम्नो धनम्।\nवंशः को विदुरस्य यादवपतेरुग्रस्य किं पौरुषं\nभक्त्या तुष्यति केवलं न च गुणैर्भक्तिप्रियो माधवः।।","iast":"vyādhasyācaraṇaṃ dhruvasya ca vayo vidyā gajendrasya kā\nkubjāyāḥ kimu nāma rūpamadhikaṃ kiṃ tat sudāmno dhanam|\nvaṃśaḥ ko vidurasya yādavapaterugrasya kiṃ pauruṣaṃ\nbhaktyā tuṣyati kevalaṃ na ca guṇairbhaktipriyo mādhavaḥ||","meaning":"Lord Mādhava, Who cherishes the devotion of His devotees, is pleased by devotion alone rather than by virtuous qualities.\nWhat was so noble about the conduct of the hunter Dharmavyādha?\nWhat maturity of age did Dhruva have and how learned was Gajendra?\nHow beautiful could Kubjā possibly have been and how wealthy was Sudāmā?\nWas Vidura of noble descent or did Ugrasena, king of the Yādavas, have any martial prowess?","source":"A devotee from South India"},{"number":9,"topic":"The Glory Of Worship","devanagari":"अनुचितमुचितं वा कर्म कोऽयं विभागो\nभगवति परमास्तां भक्तियोगो द्रढीयान् ।\nकिरति विषमहीन्द्रः सान्द्रपीयूषमिन्दु-\nर्दूर्यमपि स महेशो निर्विशेषं बिभर्ति ।।","iast":"anucitamucitaṃ vā karma ko’yaṃ vibhāgo\nbhagavati paramāstāṃ bhaktiyogo draḍhīyān |\nkirati viṣamahīndraḥ sāndrapīyūṣamindu-\nrdūryamapi sa maheśo nirviśeṣaṃ bibharti ||","meaning":"I do not care if my actions are sinful or if they are virtuous.\nAll I desire is supreme and steadfast devotion to the Lord.\nWhile the dreaded serpent spews venom, the Moon bestows its\nambrosial moonlight in abundance.\nBut Lord Maheśa (Śiva), indifferent as He is to both poison and\nnectar, is adorned with both serpent and Moon.","source":"Śrī Viṣṇu Purī"},{"number":10,"topic":"The Glory Of Worship","devanagari":"यदि मधुमथन त्वङ्घ्रिसेवां\nहृदि विदधाति जहाति वा विवेकी ।\nतदखिलमपि दुष्कृतं त्रिलोके\nकृतमकृतं न-कृतं कृतं च सर्वम् ।।","iast":"yadi madhumathana tvaṅghrisevāṃ\nhṛdi vidadhāti jahāti vā vivekī |\ntadakhilamapi duṣkṛtaṃ triloke\nkṛtamakṛtaṃ na-kṛtaṃ kṛtaṃ ca sarvam ||","meaning":"O slayer of Madhu! If a person cherishes, in his heart, service\nto your feet, then even if he were to commit all the sins in the three\nworlds, they become undone.\nAnd as for a righteous person who forsakes Your service, all the sins committed in the three worlds accrue to him (as if committed by him).","source":"Śrī Viṣṇu Purī"},{"number":11,"topic":"The Glory Of Worship","devanagari":"काषायान्न च भोजनादिनियमान्नो वा वने वासतो\nव्याख्यानादथ वा मुनिव्रतभराच्चित्तोद्भवः क्षीयते ।\nकिं तु स्फीतकलिन्दशैलतनयातीरेषु विक्रीडतो\nगोविन्दस्य पदारविन्दभजनारम्भस्य लेशादपि ।।","iast":"kāṣāyānna ca bhojanādiniyamānno vā vane vāsato\nvyākhyānādatha vā munivratabharāccittodbhavaḥ kṣīyate |\nkiṃ tu sphītakalindaśailatanayātīreṣu vikrīḍato\ngovindasya padāravindabhajanārambhasya leśādapi ||","meaning":"Not by wearing the ochre dress of a sannyāsin,\nNor by restrictions on diet and activities,\nNor by solitary residence in a forest,\nNor by hearing sermons on philosophy,\nNor by undertaking ascetical vows,\nCan the vagaries of the mind be overcome.\nSerenity of mind can only be attained by undertaking, even in the slightest measure, the worship of the lotus feet of Lord Govinda;\nLord Govinda Who delights Himself (and His devotees) on the banks of the bountiful river Yamunā, the daughter* of Kalinda.","source":"Anonymous"},{"number":12,"topic":"The Glory Of Worship","devanagari":"अलमल मियमेव प्राणिनां पातकानां\nनिरसनविषये या कृष्ण कृष्णेति वाणी ।\nयदि भवति मुकुन्दे भक्तिरानन्दसान्द्रा\nविलुठति चरणब्जे मोक्षसाम्राज्यलक्ष्मीः ।।","iast":"alamala miyameva prāṇināṃ pātakānāṃ\nnirasanaviṣaye yā kṛṣṇa kṛṣṇeti vāṇī |\nyadi bhavati mukunde bhaktirānandasāndrā\nviluṭhati caraṇabje mokṣasāmrājyalakṣmīḥ ||","meaning":"The mere verbal utterance of \"O Kṛṣṇa! O Kṛṣṇa!\" is more\nthan sufficient to destroy all the sins of living beings.\nUpon the advent of devotion to Mukunda, in (the heart of) a\ndevotee, devotion that is the source of infinite divine bliss,\nDoes goddess Lakṣmī, the sovereign bestower of salvation, toss and\nroll about at the lotus-feet of such a devotee (craving his\nacceptance).","source":"Śrī Sarvajña"},{"number":13,"topic":"The Good Fortune Of Obtaining Divine Love","devanagari":"नानोपचारकृतपूजनमार्तबन्धोः\nप्रेम्णैव भक्तहृदयं सुखविद्रुतं स्यात् ।\nयावत् क्षुदस्ति जठरे जरठा पिपासा\nतावत् सुखाय भवतो ननु भक्ष्यपेये ।।","iast":"nānopacārakṛtapūjanamārtabandhoḥ\npremṇaiva bhaktahṛdayaṃ sukhavidrutaṃ syāt |\nyāvat kṣudasti jaṭhare jaraṭhā pipāsā\ntāvat sukhāya bhavato nanu bhakṣyapeye ||","meaning":"The Lord, the friend of distressed souls, is worshipped by various formal rituals (and which may yield little).\nBut it is only worship in the mode of pure love that can cause the devotee's heart to melt and become infused with bliss.\nThe devotee attains as much bliss as He has love for the Lord -- just as food and drink are certainly only as pleasing as the intensity of hunger and thirst.","source":"Śrī Rāmānanda Rāya"},{"number":14,"topic":"The Good Fortune Of Obtaining Divine Love","devanagari":"कृष्णभक्तिरसभाविता मतिः\nक्रीयतां यदि कुतोऽपि लभ्यते ।\nतत्र मूल्यमपि लौल्यमेकलं\nजन्मकोटिसुकृतैर्न लभ्यते ।।","iast":"kṛṣṇabhaktirasabhāvitā matiḥ\nkrīyatāṃ yadi kuto’pi labhyate |\ntatra mūlyamapi laulyamekalaṃ\njanmakoṭisukṛtairna labhyate ||","meaning":"If you ever happen to be offered, for sale, a state of consciousness imbued with the relish (rasa) of Kṛṣṇa bhakti, then purchase it at once.\nThe value of such a state is only in the intense desire it creates (for savouring the pastimes of the Lord).\nAnd pious deeds of several lifetimes cannot enable one to acquire such a state of consciousness.","source":"Śrī Rāmānanda Rāya"},{"number":15,"topic":"The Good Fortune Of Obtaining Divine Love","devanagari":"सिद्धिरैव तुलितात्र तुलायां\nकृष्णनाम तुलितं न तुलायाम् ।।","iast":"siddhiraiva tulitātra tulāyāṃ\nkṛṣṇanāma tulitaṃ na tulāyām ||","meaning":"Jñāna or metaphysical knowledge (which is devoid of bhakti) is measurable in a weighing balance, but prema or divine love is not measurable on a balance.\nOccult yogic powers can also be weighed, here in this world, on a scale, but Lord Kṛṣṇa's name cannot be weighed on a scale.","source":"Śrī Śrīdhara Svāmī"},{"number":16,"topic":"The Glory Of The Divine Name","devanagari":"अंहः संहरदखिलं सकृदुदयादेव सकललोकस्य।\nतरणिरिव तिमिरजलधिं जयति जगन्मङ्गलं हरेर्नाम।।","iast":"aṃhaḥ saṃharadakhilaṃ sakṛdudayādeva sakalalokasya|\ntaraṇiriva timirajaladhiṃ jayati jaganmaṅgalaṃ harernāma||","meaning":"The name of Lord Hari --\nIs a great benediction to the world,\nAnd, upon its utterance, at once destroys all the sins of all living beings, just as the rising sun dispels the vast expanse of darkness.\nGlory be to the name of Hari!","source":"Śrī Lakṣmīdhara"},{"number":17,"topic":"The Glory Of The Divine Name","devanagari":"चतुर्णां वेदानां हृदयमिमाकृष्य हरिणा\nचतुभिर्यद्वर्णैः स्फुटमघटि नारायणपदम्।\nतदेदगायन्यो वयमनिशमात्मानमधुना\nपुनीमो जानीमो न हरिपरितोषाय किमपि।।","iast":"caturṇāṃ vedānāṃ hṛdayamimākṛṣya hariṇā\ncatubhiryadvarṇaiḥ sphuṭamaghaṭi nārāyaṇapadam|\ntadedagāyanyo vayamaniśamātmānamadhunā\npunīmo jānīmo na hariparitoṣāya kimapi||","meaning":"Lord Hari extracted all the wisdom of the four Vedas and He expressed their quintessence in four syllables when He articulated His name 'Nārāyaṇa'.\nThus we may now purify our souls by incessantly singing this name of the Lord and we know not any other means of pleasing Lord Hari.","source":"Anonymous"},{"number":18,"topic":"The Glory Of The Divine Name","devanagari":"योगश्रुत्युपपत्तिनिर्जनवनध्यानाध्वसम्भावित-\nस्वाराज्यं प्रतिपद्य निर्भयममी मुक्ता भवन्तु द्विजाः।\nअस्माकं तु कदम्बकुञ्जकुहरप्रोन्मीलदिन्दीवर-\nश्यामश्यामलधामनाम जुषतां जन्मास्तु लाक्षावधि।।","iast":"yogaśrutyupapattinirjanavanadhyānādhvasambhāvita-\nsvārājyaṃ pratipadya nirbhayamamī muktā bhavantu dvijāḥ|\nasmākaṃ tu kadambakuñjakuharapronmīladindīvara-\nśyāmaśyāmaladhāmanāma juṣatāṃ janmāstu lākṣāvadhi||","meaning":"By means of yogic discipline,\nBy mastery over the Vedas,\nBy practicing meditation in a lonely forest,\nOr by undertaking pilgrimages,\nMay the dvijas*,\nUpon realizing their fearless, self-resplendent nature (as Pure Spirit),\nBe liberated from worldly existence.\nAs for us devotees (who have no desire for mokṣa),\nAll that we seek,\nIs to savour for a hundred thousand life-times,\nThe name of the Lord,\nThe Lord Who embodies the splendour of the multitudes of blue lotuses blooming in the enclosures of the bowers of Kadamba trees.","source":"Śrī Īśvara Purī"},{"number":19,"topic":"The Glory Of The Divine Name","devanagari":"कल्याणानां निधानं कलिमलमथनं पावनं पावनानां\nपाथेयं यन्मुमुक्षोः सपदि परपदप्राप्तये प्रोच्यमानम् ।\nविश्रामस्थानमेकं कविवरवचसां जीवनं सज्जलानां\nबीजं धर्मद्रुमस्य प्रभवतु भवतां भूतये कृष्णनाम ।।","iast":"kalyāṇānāṃ nidhānaṃ kalimalamathanaṃ pāvanaṃ pāvanānāṃ\npātheyaṃ yanmumukṣoḥ sapadi parapadaprāptaye procyamānam |\nviśrāmasthānamekaṃ kavivaravacasāṃ jīvanaṃ sajjalānāṃ\nbījaṃ dharmadrumasya prabhavatu bhavatāṃ bhūtaye kṛṣṇanāma ||","meaning":"The name of Kṛṣṇa --\nIs the treasure house of all auspiciousness and good fortune,\nCleanses the contamination of kali-yuga*.\nConsummates all purifactory and sanctifying undertakings (such as yajñas, austerities, charity, and pilgrimage),\nProvides sustenance for travelers on the path to mokṣa and leads to the swift attainment of their supreme destination,\nIs the one resting place for the expressions of the finest of poets (who seek bliss in the glorification of the name upon failing to find solace in mundane topics),\nIs the very life of noble souls,\nIs the seed of the tree of dharma,\nAnd is the ultimate source of your well being, prosperity and happiness.","source":"Anonymous"},{"number":20,"topic":"The Glory Of The Divine Name","devanagari":"वेपन्ते दुरितानि मोहमहिमा सम्मोहमालम्बते\nसाटङ्क नखरञ्जनौ कलयति श्रीचित्रगुप्तः कृती ।\nसानन्दं मधुपर्कसम्भृतिविधौ वेधाः करोत्युद्यमं\nवक्तुं नाम्नि तवेश्वराभिलषिते ब्रूमः किमन्पत् परम् ।।","iast":"vepante duritāni mohamahimā sammohamālambate\nsāṭaṅka nakharañjanau kalayati śrīcitraguptaḥ kṛtī |\nsānandaṃ madhuparkasambhṛtividhau vedhāḥ karotyudyamaṃ\nvaktuṃ nāmni taveśvarābhilaṣite brūmaḥ kimanpat param ||","meaning":"For those devotees who are desirous of the chanting of Your name,\nTheir sins begin to tremble,\nThe Great Delusion of worldliness itself becomes bewildered,\nThe artful Citragupta* too fearfully seizes his pen (to erase the sins of such devotees),\nAnd Lord Brahmā takes great pleasure in serving such devotees, within his creation, with preparations of madhuparka**.\nO Lord, what can we say is greater than Thy name?","source":"Anonymous"},{"number":21,"topic":"The Glory Of The Divine Name","devanagari":"कः प्रेतनगरीपुरन्दरः\nको भवेद्य तदीयकिङ्करः।\nकृष्णनाम जगदेकमङ्गलं\nकण्ठपीठमुररीकरोति चेत्।।","iast":"kaḥ pretanagarīpurandaraḥ\nko bhavedya tadīyakiṅkaraḥ|\nkṛṣṇanāma jagadekamaṅgalaṃ\nkaṇṭhapīṭhamurarīkaroti cet||","meaning":"Kṛṣṇa's name is the one and only benediction in the world, and it lies enthroned in the sacred altar of the speech of His devotees.\nWhat power has (Yama) the king of the realm of the dead, or have his agents, over such devotees?","source":"Śrī Ānanda Ācarya"},{"number":22,"topic":"The Glory Of The Divine Name","devanagari":"चेतोदर्पणमार्जनं भवमहादावाग्निनिर्वापणं\nश्रेयःकैरवचन्द्रिकावितरणं विद्यावधूजीवनम्।\nआनन्दाम्बुधिवर्धनं प्रतिपदं पूर्णामृतास्वादनं\nसर्वात्मस्पनं परं विजयते श्रीकृष्णसङ्कीर्तनम्।।","iast":"cetodarpaṇamārjanaṃ bhavamahādāvāgninirvāpaṇaṃ\nśreyaḥkairavacandrikāvitaraṇaṃ vidyāvadhūjīvanam|\nānandāmbudhivardhanaṃ pratipadaṃ pūrṇāmṛtāsvādanaṃ\nsarvātmaspanaṃ paraṃ vijayate śrīkṛṣṇasaṅkīrtanam||","meaning":"Saṅkirtana* of the (glorious) names of Kṛṣṇa --\nCleanses the mirror of our hearts,\nExtinguishes the great forest fire of worldly woes,\nBestows that benefic moonlight which brings to bloom the white-lotus* of salvation,\nIs the very life of the Bride of Enlightenment,\nExpands the ocean of transcendental bliss,\nGives complete relish of nectar with each syllable,\nBathes every fibre of our Being,\nAnd always reigns supreme (over all other modes of salvation**).","source":"Lord Caitanya"},{"number":23,"topic":"The Glory Of The Divine Name","devanagari":"तन्मे साध्यं साधनं जीवनं च ।।","iast":"tanme sādhyaṃ sādhanaṃ jīvanaṃ ca ||","meaning":"The millions of universes, their grandeur and all the sentient beings inhabiting them,\nConstitute but a fragment of the entity of the Lord.\nAnd all the glory of the Lord is manifest in His name 'Kṛṣṇa'.\nThat name is my final destination, my means of salvation, my very life.","source":"Anonymous"},{"number":24,"topic":"The Glory Of The Divine Name","devanagari":"विष्णोर्नामैव पुंसः शमलमहपत् पुण्यमुत्पादयच्च\nब्रह्मादिस्थानभोगाद्विरतिमथ गुरुश्रीपदद्वन्द्वभक्तिम्।\nतत्त्वज्ञानं च विष्णोरिह मृतिजननभ्रान्तिबीजं च दग्धा\nसम्पूर्णानन्दबोधे महति च पुरुषं स्थापयित्वा निवृत्तम्।।","iast":"viṣṇornāmaiva puṃsaḥ śamalamahapat puṇyamutpādayacca\nbrahmādisthānabhogādviratimatha guruśrīpadadvandvabhaktim|\ntattvajñānaṃ ca viṣṇoriha mṛtijananabhrāntibījaṃ ca dagdhā\nsampūrṇānandabodhe mahati ca puruṣaṃ sthāpayitvā nivṛttam||","meaning":"Only the name of Viṣṇu --\nCan remove a man's sins and give rise to religious merit,\nCan free one from the desire of attaining the abode of Brahmā and other heavenly realms,\nCan inspire devotion to the feet of the guru,\nAnd grant us knowledge of Viṣṇu, the supreme spiritual reality,\nUpon burning up the seed of ignorance, which is the cause of repeated birth and death in this world,\nAnd upon situating the puruṣa* in the Supreme Being, Who is of the nature of absolute bliss and enlightenment,\nThe name of the Lord finally attains its purpose.","source":"Lord Vyāsa"},{"number":25,"topic":"The Glory Of The Divine Name","devanagari":"नामचिन्तामणिः कृष्णश्चैतन्यरसविग्रहः।\nपूर्णः शुद्धो नित्यमुक्तोऽभिन्नत्वाम्नानामिनोः।।","iast":"nāmacintāmaṇiḥ kṛṣṇaścaitanyarasavigrahaḥ|\npūrṇaḥ śuddho nityamukto’bhinnatvāmnānāminoḥ||","meaning":"The Lord, Who is eternally free from the bondage of saṃsāra and is completely untainted by worldliness, is non-different from His name.\nBy virtue of being non-different from the Lord, the name is the wish-fulfilling philosopher’s stone.\nThe name verily is Kṛṣṇa Himself, Kṛṣṇa the embodiment of divine love.","source":"Lord Vyāsa"},{"number":26,"topic":"The Glory Of The Divine Name","devanagari":"मधुरमधुरमेतन्मङ्गलं मङ्गलानां\nसकलनिगमवल्लीसतफलं चित्स्वरूपम्\nसकृदपि परिगीतं श्रद्धया हेलया वा\nभृगुवर नरमात्रं तारयेत् कृष्णनाम।।","iast":"madhuramadhurametanmaṅgalaṃ maṅgalānāṃ\nsakalanigamavallīsataphalaṃ citsvarūpam\nsakṛdapi parigītaṃ śraddhayā helayā vā\nbhṛguvara naramātraṃ tārayet kṛṣṇanāma||","meaning":"O best among Bhṛgus,\nThe name of Kṛṣṇa,\nIs the sweetest of the sweet,\nIs the most benefic of all benefactors,\nIs the ripened fruit of the vine of all Vedic knowledge.\nAnd is of the nature of Pure Spirit.\nIf the name of Kṛṣṇa is chanted just once,\nWhether faithfully or frivolously,\nIt delivers all of mankind from worldly existence.","source":"Lord Vyāsa"},{"number":27,"topic":"The Glory Of The Divine Name","devanagari":"स्वर्गार्थिया व्यवसितरसौ दीनत्येव लोकान्\nमोक्षापेक्षा जनयति जनं केवलं क्लेशभाजम् ।\nयोगोद्योगः परमविरसस्तादृशैः किं प्रयासैः\nसर्वं त्यक्त्वा मम तु रसना कृष्ण कृष्णेति रौतु ।।","iast":"svargārthiyā vyavasitarasau dīnatyeva lokān\nmokṣāpekṣā janayati janaṃ kevalaṃ kleśabhājam |\nyogodyogaḥ paramavirasastādṛśaiḥ kiṃ prayāsaiḥ\nsarvaṃ tyaktvā mama tu rasanā kṛṣṇa kṛṣṇeti rautu ||","meaning":"Religious practices undertaken for the attainment of heaven impoverish one of higher spiritual virtues.\nThe quest for mokṣa (without devotional aspiration) entails only pain and suffering (as the path to mokṣa is extremely difficult).\nThe practice of aṣṭāṅga-yoga is completely devoid of the pleasure of divine love; what then is the benefit of such an endeavour?\nAbandoning every other spiritual practice, may my tongue be always engaged in chanting “Kṛṣṇa-Kṛṣṇa”.","source":"Anonymous"},{"number":28,"topic":"The Glory Of The Divine Name","devanagari":"सदा सर्वत्रास्ते ननु विमलमाद्यं तव पदं\nतथाप्येकं स्तोकं न हि भवतरोः पत्रमभिनत् ।\nक्षणं जिह्वाग्रस्थं तव तु भगवन्नाम निखिलं\nसमूलं संसारं कषति कतरत् सेव्यमनयोः ।।","iast":"sadā sarvatrāste nanu vimalamādyaṃ tava padaṃ\ntathāpyekaṃ stokaṃ na hi bhavataroḥ patramabhinat |\nkṣaṇaṃ jihvāgrasthaṃ tava tu bhagavannāma nikhilaṃ\nsamūlaṃ saṃsāraṃ kaṣati katarat sevyamanayoḥ ||","meaning":"The pristine, primordial aspect of Your Being (the Nirguna Brahman*), even though eternally all-pervasive, has failed to shed even a tiny leaf of the tree of worldly existence.\nBut if Your divine name is placed on one's tongue for even a moment, then the entire tree of samsāra is uprooted and destroyed.\nSo which of the two (the Nirguna Brahman or Your name) is worthy of worship?","source":"Śrī Śridhara Svāmī"},{"number":29,"topic":"The Glory Of The Divine Name","devanagari":"आकृष्टः कृतचेतसां सुमहतामुच्चाटनं चांहसा-\nमाचण्डालममूकलोकसुलभो वश्यश्च मोक्षश्रियः ।\nनो दीक्षां न च दक्षिणां न च पुरश्चर्यां मनागीक्षते\nमन्त्रोऽयं रसनास्पृगेव फलति श्रीकृष्णनामात्मकः ।।","iast":"ākṛṣṭaḥ kṛtacetasāṃ sumahatāmuccāṭanaṃ cāṃhasā-\nmācaṇḍālamamūkalokasulabho vaśyaśca mokṣaśriyaḥ |\nno dīkṣāṃ na ca dakṣiṇāṃ na ca puraścaryāṃ manāgīkṣate\nmantro’yaṃ rasanāspṛgeva phalati śrīkṛṣṇanāmātmakaḥ ||","meaning":"The mantra that bears Kṛṣṇa's name --\nIs irresistibly attractive to great and enlightened souls,\nRoots out all sins,\nIs accessible to the whole world, even to an outcaste and to a dumb\nperson,\nHolds under its dispensation the great benediction of mokṣa,\nIs not, in the slightest measure, conditional upon formal initiation,\nupon offerings to guru and brāhmaṇas, or upon consecratory\nrituals,\nAnd it bears fruit the moment it comes into contact with the\ndevotee's tongue.","source":"Śrī Lakṣmīdhara"},{"number":30,"topic":"The Glory Of The Divine Name","devanagari":"विचेयानि विचार्याणि विचिन्त्यानि पुनः पुनः।\nकृपणस्य धनानीव त्वन्नामानि भवन्तु नः।।","iast":"viceyāni vicāryāṇi vicintyāni punaḥ punaḥ|\nkṛpaṇasya dhanānīva tvannāmāni bhavantu naḥ||","meaning":"A miserly person searches hither and thither for wealth, thinks\nof all kinds of devices for its attainment, and then constantly\nworries about the safety of the riches he acquires.\nO Lord, just as a miser is disposed towards wealth, let me be\nconstantly engaged in the contemplation of Your names.","source":"Śrī Bhavānanda"},{"number":31,"topic":"The Glory Of The Divine Name","devanagari":"नाम्नामकारि बहुधा निजसर्वशक्ति-\nस्तत्रार्पिता नियमितः स्मरणे न कालः।\nएतादृशी तव कृपा भगवन्ममापि\nदुर्देवमीदृशमिहाजनि नानुरगः।।","iast":"nāmnāmakāri bahudhā nijasarvaśakti-\nstatrārpitā niyamitaḥ smaraṇe na kālaḥ|\netādṛśī tava kṛpā bhagavanmamāpi\ndurdevamīdṛśamihājani nānuragaḥ||","meaning":"Thou Who has numerous names,\nHas infused all Thy divine powers into them,\nAnd neither restrictions of time, nor any other rules, have Thou laid down for chanting them.\nBut, O Lord, even when so abundant is Thy grace,\nSuch is my misfortune that I have acquired no taste for Thy names.","source":"Lord Caitanya"},{"number":32,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"अथ नामकीर्तनम्\nतृणादपि सुनीचेन तरोरपि सहिष्णुना ।\nअमानिना मानदेन कीर्तनीयः सदा हरिः।।","iast":"atha nāmakīrtanam\ntṛṇādapi sunīcena tarorapi sahiṣṇunā |\namāninā mānadena kīrtanīyaḥ sadā hariḥ||","meaning":"Regarding oneself lower than a blade of grass,\nHaving more forbearance than a tree,\nHonouring all beings without any sense of self-importance;\nIn such a state of mind should one constantly sing the names of Lord Hari.","source":"Lord Caitanya"},{"number":33,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"श्रीरामेति जनार्दनेति जगतां नाथेति नारायणे-\nत्यानन्देति दयापरेति कमलाकान्तेति कृष्णेति च ।\nश्रीमन्नाममहामृताब्धिलहरीकल्लोलमग्नं मुहु-\nर्मुह्यन्तं गलदश्रुनेत्रमवशं मां नाथ नित्यं कुरु।।","iast":"śrīrāmeti janārdaneti jagatāṃ nātheti nārāyaṇe-\ntyānandeti dayāpareti kamalākānteti kṛṣṇeti ca |\nśrīmannāmamahāmṛtābdhilaharīkallolamagnaṃ muhu-\nrmuhyantaṃ galadaśrunetramavaśaṃ māṃ nātha nityaṃ kuru||","meaning":"O Śrī Rāma, O Janārdana, O Jagannātha, O Nārāyaṇa, O Ānanda, O Dayāpara, O Kamalakānta, O Kṛṣṇa!\nLet me be inundated by waves of delight, waves of the great ocean of the nectar of Your glorious names.\nLet me be perpetually intoxicated by Your names so that tears may constantly flow from my eyes.\nO my Lord! Let this state (of divine bliss) be everlasting.","source":"Śrī Lakṣmīdhara"},{"number":34,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"श्रीकान्त कृष्ण करुणामय कञ्जनाभ\nकैवल्यवल्लभ मुकुन्द मुरान्तकेति ।\nनामावली विमलमौक्तिकहारलक्ष्मी-\nलावण्यवञ्चनकरी करवाणि कण्ठे।।","iast":"śrīkānta kṛṣṇa karuṇāmaya kañjanābha\nkaivalyavallabha mukunda murāntaketi |\nnāmāvalī vimalamauktikahāralakṣmī-\nlāvaṇyavañcanakarī karavāṇi kaṇṭhe||","meaning":"O Śrīkānta, O Kṛṣṇa, O Karuṇāmaya, O Kañjanābha, O Kaivalyavallabha, O Mukunda, O Murāntaka!\nMay I adorn my neck with the garland of Your names -- the garland that renders pale all the lustre and beauty of a necklace of unblemished pearls.","source":"Śrī Lakṣmīdhara"},{"number":35,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"कृष्ण राम मुकुन्द वामन वासुदेव जगद्गुरो\nमत्स्य कच्छप नारसिंह वराह राघव पाहि माम् ।\nदेवदानवनारदादिमुनीन्द्रवन्द्य दयानिवे\nदेवकीसुत देहि मे तव पादभक्तिमचञ्चलाम् ।।","iast":"kṛṣṇa rāma mukunda vāmana vāsudeva jagadguro\nmatsya kacchapa nārasiṃha varāha rāghava pāhi mām |\ndevadānavanāradādimunīndravandya dayānive\ndevakīsuta dehi me tava pādabhaktimacañcalām ||","meaning":"O Kṛṣṇa, O Rāma, O Mukunda, O Vāmana, O Vāsudeva, O\nJagadguru, O Matsya, O Kūrma, O Nṛsiṃha, O Varāha, O\nRāghava!\nProtect me!\nO One Who is worshipped by gods, by demons and by great sages\nsuch as Nārada!\nO ocean of compassion! O son of Devakī!\nBestow upon me steadfast and unwavering devotion to Your feet.","source":"Anonymous"},{"number":36,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"हे गोपालक हे कृपाजलनिधे हे सिन्धुकन्यापते\nहे कंसान्तक हे गजेन्द्रकरुणापारीण हे माधव ।\nहे रामानुज हे जगत्त्रयगुरो हे पुण्डरीकाक्ष मां\nहे गोपीजननाथ पालय परं जानामि न त्वां विना ।।","iast":"he gopālaka he kṛpājalanidhe he sindhukanyāpate\nhe kaṃsāntaka he gajendrakaruṇāpārīṇa he mādhava |\nhe rāmānuja he jagattrayaguro he puṇḍarīkākṣa māṃ\nhe gopījananātha pālaya paraṃ jānāmi na tvāṃ vinā ||","meaning":"O protector of cows,\nO ocean of compassion,\nO consort of the Daughter of the Ocean*,\nO slayer of Kaṃsa,\nO One Who bestowed compassion on Gajendra, the beleaguered elephant,\nO husband of the Goddess of Fortune**,\nO younger brother of Balarāma,\nO preceptor of the three worlds,\nO lotus-eyed One,\nO lord and beloved of the milk-maids of Vṛndāvana!\nProtect me for I know not anyone else greater than Thee.","source":"Śrī Vaisnava"},{"number":37,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"श्रीनारायण पुण्डरीकनयन श्रीराम सीतापते\nगोविन्दाच्युत नन्दनन्दन मुकुन्दानन्द दामोदर ।\nविष्णो राघव वासुदेव नृहरे देवेन्द्रचूडामणे\nसंसारार्णवकर्णधारक हरे श्रीकृष्ण तुभ्यं नमः।।","iast":"śrīnārāyaṇa puṇḍarīkanayana śrīrāma sītāpate\ngovindācyuta nandanandana mukundānanda dāmodara |\nviṣṇo rāghava vāsudeva nṛhare devendracūḍāmaṇe\nsaṃsārārṇavakarṇadhāraka hare śrīkṛṣṇa tubhyaṃ namaḥ||","meaning":"O Nārāyaṇa, O Puṇḍarīkanayana, O Rāma, O Sītāpati, O Govinda, O Acyuta, O Nandanandana, O Mukunda, O Ānanda, O Dāmodara, O Viṣṇu, O Rāghava, O Vāsudeva, O Nṛhari!\nO crest-jewel among the principal gods!\nO steersman Who pilots the boat to cross over the ocean of worldly existence!\nO Hari! O Kṛṣṇa!\nMy salutations to Thee!","source":"Śrī Vaisnava"},{"number":38,"topic":"On Singing And Chanting The Names Of The Lord","devanagari":"भाण्डीरेश शिखण्डमण्डन वर श्रीखण्डलिप्ताङ्ग हे\nवृन्दारण्यपुरन्दर स्फुरदमन्देन्दीवरश्यामल ।\nकालिन्दीप्रिय नन्दनन्दन परानन्दारविन्देक्षण\nश्रीगोविन्द मुकुन्द सुन्दरतनो मां दीनमानन्दय ।।","iast":"bhāṇḍīreśa śikhaṇḍamaṇḍana vara śrīkhaṇḍaliptāṅga he\nvṛndāraṇyapurandara sphuradamandendīvaraśyāmala |\nkālindīpriya nandanandana parānandāravindekṣaṇa\nśrīgovinda mukunda sundaratano māṃ dīnamānandaya ||","meaning":"O deity of the fig trees of Govardhana, Who is adorned with\npeacock feathers!\nO most excellent One, Whose limbs are anointed with sandalwood\npaste!\nO proprietor of the forests of Vrndāvana, Who exudes the dark hue\nof blooming blue lotuses!\nO beloved of the Yamunā river, Who is the dear child of Nanda!\nO lotus-eyed One, Who is of the nature of the supreme bliss of the\nSpirit!\nO Govinda, O Mukunda, O embodiment of beauty!\nPray grant divine bliss to my fallen self!","source":"Śrī Gopāla Bhaṭṭa"},{"number":39,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"श्रुतम्प्यौपनिषदं दूरे हरिकथामृतात् ।\nयत्र सन्ति द्रवच्चित्तकम्पाश्रुपुलकोद्रमाः ।।","iast":"śrutampyaupaniṣadaṃ dūre harikathāmṛtāt |\nyatra santi dravaccittakampāśrupulakodramāḥ ||","meaning":"Upaniṣadic discourses (on Nirguṇa Brahman), that I have\nheard, are far removed from the ambrosial narrations of the glories\nof Lord Hari.\nPhilosophical discussions of the Upaniṣads cannot melt our hearts\nnor make us tremble with joy,\nThey cannot elicit tears of ecstasy nor enable our hair to stand on\nend,\nAnd nor can they bless us with any other experience (of devotional\nrapture).","source":"Lord Vyāsa"},{"number":40,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"नैव दिव्यसुखभोगमर्थये\nनापवर्गमपि नाथ कामये।\nयान्तु कर्णविवरं दिने दिने\nकृष्णकेलिचरितामृतानि मे।।","iast":"naiva divyasukhabhogamarthaye\nnāpavargamapi nātha kāmaye|\nyāntu karṇavivaraṃ dine dine\nkṛṣṇakelicaritāmṛtāni me||","meaning":"O my Lord, I do not wish to enjoy the pleasures of heaven, nor\ndo I seek liberation from worldly existence.\nAll I desire is to, day after day, savour in my ears, the nectar of the\nnarrations of the sportive exploits of Kṛṣṇa.","source":"Śrī Kaviratna"},{"number":41,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"अहो अहोभिर्न कलेर्विदूयते\nसुधासुधारामधुरं पदे पदे।\nदिने दिने चन्दनचन्द्रशीतलं\nयशो यशोदातनयस्य गीयते।।","iast":"aho ahobhirna kalervidūyate\nsudhāsudhārāmadhuraṃ pade pade|\ndine dine candanacandraśītalaṃ\nyaśo yaśodātanayasya gīyate||","meaning":"The glories of the son of Yaśodā are as sweet as streams of nectar, as soothing as sandalwood and as cooling as moonlight.\nOh! Whosoever sings the glories of the Lord, everyday and at every step, is never tormented by the evil days of kali-yuga*.","source":"Śrī Kaviratna"},{"number":42,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"नन्दनन्दनकैशोरलीलामृतमहाम्बुधौ।\nनिमग्नानां किमस्माकं निर्वाणलवणाम्भसा।।","iast":"nandanandanakaiśoralīlāmṛtamahāmbudhau|\nnimagnānāṃ kimasmākaṃ nirvāṇalavaṇāmbhasā||","meaning":"Having submerged ourselves in the vast ocean of the nectar of the adolescent līlās* of the beloved son of Nanda, what taste do we devotees have for the salty ocean of nirvāṇa**?","source":"Śrī Yādvendra Purī"},{"number":43,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"त्वत्कथामृतपाथोधौ विहरन्तो महामुदः।\nकुर्वन्ति कृतिनः केचिच्चतुर्वर्गं तृणोपमम्।।","iast":"tvatkathāmṛtapāthodhau viharanto mahāmudaḥ|\nkurvanti kṛtinaḥ keciccaturvargaṃ tṛṇopamam||","meaning":"O Lord, Your blessed devotees, having fulfilled scriptural obligations, and sailing blissfully in the ocean of Your ambrosial lilās, regard the cherished four puruṣārthas* to be as insignificant as blades of grass.","source":"Śrī Śridhara Svāmī"},{"number":44,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"तत्रैव गङ्गा यमुना च तत्र\nगोदावरी तत्र सरस्वती च।\nसर्वाणि तीर्थानि वसन्ति तत्र\nयत्राच्युतोदारकथाप्रसङ्गः।।","iast":"tatraiva gaṅgā yamunā ca tatra\ngodāvarī tatra sarasvatī ca|\nsarvāṇi tīrthāni vasanti tatra\nyatrācyutodārakathāprasaṅgaḥ||","meaning":"Wherever there is mention of the splendid deeds and exalted pastimes of the infallible Lord Acyuta,\nThere come to exist all the tīrthas*,\nAnd there converge the sacred rivers -- the Gaṅgā, the Yamuna, the Godāvarī, the Sarasvatī.","source":"Anonymous"},{"number":45,"topic":"The Glory Of Narrating The Sportive Exploits Of The Lord","devanagari":"या भुक्तिलक्ष्मीर्भुवि कामुकानां\nया मुक्तिलक्ष्मीर्हृदि योगभाजाम्।\nयानन्दलक्ष्मी रसिकेन्द्रमौलेः\nसा कापि लीलावतु माधवस्य।।","iast":"yā bhuktilakṣmīrbhuvi kāmukānāṃ\nyā muktilakṣmīrhṛdi yogabhājām|\nyānandalakṣmī rasikendramauleḥ\nsā kāpi līlāvatu mādhavasya||","meaning":"The felicity for enjoyment in this world, sought by passionate people,\nThe treasure of salvation which great yogis cherish in their hearts,\nThe wealth of divine bliss possessed by the best among the sentimental devotees,\nAre all but manifestations of Lord Mādhava’s divine līlā.\nMay the līlā of the Lord protect all of you.","source":"Śrī Śaṅkara"},{"number":46,"topic":"Meditations On Śrī Kṛṣṇa","devanagari":"फुल्लेन्दीवरकान्तिमिन्दुवदनं बर्हावतंसप्रियं\nश्रीवत्साङ्कमुदारकौस्तुभधरं पीताम्बरं सुन्दरम्।\nगोपीनां नयनोत्पलार्चिततनुं गोगोपसङ्घावृतं\nगोविन्दं कलवेणुवादनपरं दिव्याङ्गभूषं भजे।।","iast":"phullendīvarakāntiminduvadanaṃ barhāvataṃsapriyaṃ\nśrīvatsāṅkamudārakaustubhadharaṃ pītāmbaraṃ sundaram|\ngopīnāṃ nayanotpalārcitatanuṃ gogopasaṅghāvṛtaṃ\ngovindaṃ kalaveṇuvādanaparaṃ divyāṅgabhūṣaṃ bhaje||","meaning":"I worship Lord Govinda --\nWho exudes the effulgence of blooming blue lotuses,\nWhose face is radiant as the moon,\nWho is fond of ornaments of peacock feathers,\nWhose chest is graced with the Śrivatsa* mark,\nWho wears the splendid Kaustubha jewel,\nWho, dressed in yellow robes, is the epitome of beauty,\nWhose form is worshipped by the glances of the lotus eyes of the gopis,\nWho is surrounded by a host of cows and cowherds,\nWho plays to perfection, soft, sweet melodies on His flute,\nAnd Whose divine limbs are adorned with beautiful ornaments.","source":"Śrī Śāradākāra"},{"number":47,"topic":"Meditations On Śrī Kṛṣṇa","devanagari":"अंसालम्बितवामकुण्डलधरं मन्दोन्नतभ्रूलतं\nकिञ्चित्कुञ्चितकोमलाधरपुटं साचिप्रसारेक्षणम् ।।\nआलोलाङ्गुलिपल्लवैर्मुरलिकामापूरयन्तं मुदा\nमूले कल्पतरोस्त्रिभङ्गललितं ध्यायेज्जगन्मोहनम् ।।","iast":"aṃsālambitavāmakuṇḍaladharaṃ mandonnatabhrūlataṃ\nkiñcitkuñcitakomalādharapuṭaṃ sāciprasārekṣaṇam ||\nālolāṅgulipallavairmuralikāmāpūrayantaṃ mudā\nmūle kalpatarostribhaṅgalalitaṃ dhyāyejjaganmohanam ||","meaning":"May I meditate upon the Lord Who --\nSports beautiful earrings that reach up to His shoulders,\nGently raises His eyebrows,\nContracts slightly the folds of His delicate lips (to play His flute),\nCasts sidelong glances,\nDelightfully plays His flute that He holds firmly with His tender fingers,\nGraces the wish-fulfilling Kalpataru tree, as He stands at its base in His enchanting thrice-bent pose*,\nAnd Who charms the whole world.","source":"Anonymous"},{"number":48,"topic":"Meditations On Śrī Kṛṣṇa","devanagari":"अधरे विनिहितवंशं चम्पककुसुमेन कल्पितोत्संसम्।\nविनतं दधानमंसं वामं सततं नमामि जितकंसम्।।","iast":"adhare vinihitavaṃśaṃ campakakusumena kalpitotsaṃsam|\nvinataṃ dadhānamaṃsaṃ vāmaṃ satataṃ namāmi jitakaṃsam||","meaning":"The Lord Who vanquished the demon Kaṃsa,\nHas His flute ensconced on His lips,\nSports a chaplet of Champaka flowers on His crown,\nAnd has His left shoulder bent downwards (to play His flute).\nTo that Lord do I offer My salutations again and again.","source":"Śrī Puruṣottamadeva"},{"number":49,"topic":"Meditations On Śrī Kṛṣṇa","devanagari":"व्यत्यस्तपादकमलं ललितत्रिभङ्गी-\nसौभाग्यमंसविरलीकृतकेशपाशम् ।\nपिच्छावतंसमुररीकृतवंशनाल-\nमव्याजमोहनमुपैमि कृपाविशेषम् ।।","iast":"vyatyastapādakamalaṃ lalitatribhaṅgī-\nsaubhāgyamaṃsaviralīkṛtakeśapāśam |\npicchāvataṃsamurarīkṛtavaṃśanāla-\nmavyājamohanamupaimi kṛpāviśeṣam ||","meaning":"The lotus feet of the Lord are placed in crosswise pose.\nHis charming thrice-bent form is the source of all good fortune.\nHis luxuriant, delicately groomed hair fall on His shoulders.\nHis forehead is adorned with a wreath of peacock feathers.\nAnd His flute is placed on His lips.\nI worship that artlessly charming Lord (Kṛṣṇa) Who is abundant in mercy.","source":"Śrī Nārada"},{"number":50,"topic":"The Lord’S Parental Affection For His Devotees","devanagari":"अतन्द्रितचमूपतिप्रहितहस्तमस्वीकृत-\nप्रणीतमणिपादुकां किमिति विस्मितान्तःपुरम् ।\nअवाहनपरिष्क्रियं पतगराजमारोहतः\nकरिप्रवरबृंहिते भगवतस्त्वरायै नमः।।","iast":"atandritacamūpatiprahitahastamasvīkṛta-\npraṇītamaṇipādukāṃ kimiti vismitāntaḥpuram |\navāhanapariṣkriyaṃ patagarājamārohataḥ\nkaripravarabṛṃhite bhagavatastvarāyai namaḥ||","meaning":"Upon hearing the distress call of the king of elephants (Gajendra),\nThe Lord, Who is ever vigilant in attending to His devotees, forgot all about the comforts of His heavenly abode and rushed to the rescue.\nIn His haste He refused the helping hand of His commander-in-chief, did not care to wear the jewel-studded sandals presented by His attendants and did not even place a canopy upon His vehicle (Garuda), the king of birds.\nAt that moment His only thought was “who is calling Me?”\nTo that haste, speed and swiftness of the Lord, do I offer my salutations.","source":"A devotee from South India"},{"number":51,"topic":"Draupadī'S Expression (Of Gratitude) When The Lord Came To Her Rescue","devanagari":"तभसि रविरिवोद्यन्मज्जतामप्लवानां\nप्लव इव तृषितानां स्वादुवर्षैव मेघः ।\nनिधिरिव निधनानां तीव्रदुःखामयानां\nभिषगिव कुशलं नो दातुमायाति शौरिः ।।","iast":"tabhasi ravirivodyanmajjatāmaplavānāṃ\nplava iva tṛṣitānāṃ svāduvarṣaiva meghaḥ |\nnidhiriva nidhanānāṃ tīvraduḥkhāmayānāṃ\nbhiṣagiva kuśalaṃ no dātumāyāti śauriḥ ||","meaning":"\"Lord Śauri (Kṛṣṇa), Who is the likeness of --\nThe rising sun dispelling the darkness of night,\nA boat for rescuing ship-wrecked people who are drowning,\nA cloud that showers sweet rain for those tormented by thirst,\nA treasure trove for the poverty stricken,\nAnd of a physician for those plagued by severe disease,\nIs arriving to grace us with happiness and prosperity.\"","source":"Lord Vyāsa"},{"number":52,"topic":"Glory Of The Devotees Of The Lord","devanagari":"प्रह्लादनारदपराशरपुण्डरीक-\nव्यासाम्बरीषशुकशौनकभीष्मदालभ्यान् ।\nरुक्माङ्गदोद्धवविभीषणफाल्गुनादीन्\nपुण्यानिमान् परमभागवतान्नमामि ।।","iast":"prahlādanāradaparāśarapuṇḍarīka-\nvyāsāmbarīṣaśukaśaunakabhīṣmadālabhyān |\nrukmāṅgadoddhavavibhīṣaṇaphālgunādīn\npuṇyānimān paramabhāgavatānnamāmi ||","meaning":"To the greatest among the blessed devotees of the Lord,\nPrahlāda, Nārada, Parāśara, Puṇḍarīka, Vyāsa, Ambariṣa, Śuka, Śaunaka, Bhīṣma, Dālbhya, Rukmāṅgada, Udhava, Vibhīṣaṇa and Phālguna (Arjuna), among others,\nDo I offer my obeisance.","source":"A devotee from South India"},{"number":53,"topic":"Glory Of The Devotees Of The Lord","devanagari":"श्रीविष्णोः श्रवणे परीक्षितभवद् वैयासकिः कीर्तने\nप्रह्लादः स्मरणे पदाब्जभजने लक्ष्मीः पृथुः पूजने।\nअक्रू रस्तवभिवन्दने कपिपतिर्दास्येऽथ सख्येऽर्जुनः\nसर्वस्वात्मनिवेदने बलिरभूत् कृष्णाप्तिरेषा परम्।।","iast":"śrīviṣṇoḥ śravaṇe parīkṣitabhavad vaiyāsakiḥ kīrtane\nprahlādaḥ smaraṇe padābjabhajane lakṣmīḥ pṛthuḥ pūjane|\nakrū rastavabhivandane kapipatirdāsye’tha sakhye’rjunaḥ\nsarvasvātmanivedane balirabhūt kṛṣṇāptireṣā param||","meaning":"(Among time-honoured legends among devotees,)\nKing Parīkṣit attained complete absorption in hearing narrations about Lord Viṣṇu,\nŚukadeva, the son of Vyāsa, dedicated himself to singing the glories of the Lord (when he narrated the Bhāgavata Purāṇa),\nPrahlāda is known for his constant meditation on, and remembrance of, the Lord,\nAs is goddess Lakṣmī for Her service to the feet of the Lord,\nAnd king Pṛthu for worshipping the Lord,\nAkrūra is famous for offering extolling salutations to the Lord,\nHanumāna, the king of monkeys, for being a devoted servant,\nArjuna for being the Lord's friend,\nAnd King Bali for surrendering his every possession to the Lord.\nEach of these devotees (having practiced to perfection one of the nine modes of devotion) were blessed with Supreme Beatitude - the attainment of Kṛṣṇa.","source":"Anonymous"},{"number":54,"topic":"Glory Of The Devotees Of The Lord","devanagari":"तेभ्यो नमोऽस्तु भववारिधिजीर्णपङ्क-\nसम्पन्नमोक्षणविचक्षणपादुकेभ्यः।\nकृष्णेति वर्णयुगलश्रवणेन येषा-\nमानन्दथुर्भवति नर्तितरोमवृन्दः।।","iast":"tebhyo namo’stu bhavavāridhijīrṇapaṅka-\nsampannamokṣaṇavicakṣaṇapādukebhyaḥ|\nkṛṣṇeti varṇayugalaśravaṇena yeṣā-\nmānandathurbhavati nartitaromavṛndaḥ||","meaning":"I offer my salutations,\nTo those exalted devotees whose wooden sandals are like learned sages; sages who deliver those of us who are submerged in the ocean of worldly existence, which is but a timeless quagmire of sin,\nTo those great ones who, upon hearing the two syllables comprising (the name of the Lord) 'Kṛṣṇa', become ecstatic, with all their hair standing on end as if dancing to and fro.","source":"Śrī Autkala"},{"number":55,"topic":"Glory Of The Devotees Of The Lord","devanagari":"हरिस्मृत्याह्लादस्तिमितमनसो यस्य कृतिनः\nसरोमाञ्चः कायो नयनमपि सानन्दसलिलम्।\nतमेवाचन्द्राकं वह पुरुषधौरेयमवने\nकिमन्पैस्तै भारैर्यम सदनगत्यागतिपरैः।।","iast":"harismṛtyāhlādastimitamanaso yasya kṛtinaḥ\nsaromāñcaḥ kāyo nayanamapi sānandasalilam|\ntamevācandrākaṃ vaha puruṣadhaureyamavane\nkimanpaistai bhārairyama sadanagatyāgatiparaiḥ||","meaning":"O Mother Earth!\nAs long as the Sun and the Moon grace our world,\nMay you bear, in your care, those blessed souls,\nWhose hearts melt with joy upon remembrance of Lord Hari,\nWhose bodies become charged with horripilation and eyes become moist with tears of ecstasy.\nWhy do you bear the burden of those impious others who are condemned to repeated visitations to Yama's realm of the dead?","source":"Śrī Sarvānanda"},{"number":56,"topic":"Glory Of The Devotees Of The Lord","devanagari":"चिन्तारत्नचयं शिलाशकलवत् कल्पद्रुमं काष्ठवत्\nसंसारं तृणराशिवत् किमपरं देहं निजं भारवत् ।।","iast":"cintāratnacayaṃ śilāśakalavat kalpadrumaṃ kāṣṭhavat\nsaṃsāraṃ tṛṇarāśivat kimaparaṃ dehaṃ nijaṃ bhāravat ||","meaning":"(O Lord!)\nYour devotees,\nLook upon the ocean as a palm-full of water,\nThe Sun as a mere fire-fly,\nThe Meru mountain as a lump of earth,\nAn emperor as a mere servant,\nA heap of cintāmaṇi* jewels as fragments of rock,\nThe (fabled) wish-fulfilling Kalpa tree as a log of wood,\nThe whole world as a heap of straw,\nAnd (in Your absence or in separation from You) regard even their own bodies as a needless burden.","source":"Śrī Sarvajña"},{"number":57,"topic":"Glory Of The Devotees Of The Lord","devanagari":"मीमांसारजसा मलीमसदृशां तावन्न धीरीश्वरे\nगर्वोदर्ककुतर्ककर्कशधियां दूरेऽपि वार्ता हरेः।\nजानन्तोऽपि न जानते श्रुतिसुखं श्रीरङ्गिसङ्गादृते\nसुस्वादुं परिवेशयन्त्यपि रसं गुर्वी न दर्वी स्पृशेत्।।","iast":"mīmāṃsārajasā malīmasadṛśāṃ tāvanna dhīrīśvare\ngarvodarkakutarkakarkaśadhiyāṃ dūre’pi vārtā hareḥ|\njānanto’pi na jānate śrutisukhaṃ śrīraṅgisaṅgādṛte\nsusvāduṃ pariveśayantyapi rasaṃ gurvī na darvī spṛśet||","meaning":"Pandits of Veda, having obscured their spiritual vision due to excessive preoccupation with scriptural exegesis, are unable to take recourse to Īśvara.\nSeeking only the satisfaction of their intellectual pride, and their hearts hardened from misguided scholarly dialectic, they are far removed from hearing the glories of Lord Hari.\nDespite all their erudition, those learned ones are not able to know the true essence of the Vedas as they are indifferent to Lord Śrī-Raṅga.\nThey may be likened to the heavy ladle, that serves delicious preparations of food but knows not their taste.","source":"Śrī Mādhava Sarasvatī"},{"number":58,"topic":"Glory Of The Devotees Of The Lord","devanagari":"ज्ञानावलम्बकाः केचित् केचित् कर्मावलम्बकाः।\nवयं तु हरिदासानां पादत्राणावलम्बकाः।।","iast":"jñānāvalambakāḥ kecit kecit karmāvalambakāḥ|\nvayaṃ tu haridāsānāṃ pādatrāṇāvalambakāḥ||","meaning":"Some persons take recourse to jñāna* while other to karma.\nBut we devotees find shelter in none other than the sandals of the servants of Lord Hari.","source":"Anonymous"},{"number":59,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"सामानि श्रुतिशष्कुलीं मुरलिकाजातान्यलङ्कुर्वते\nकामानिवर्तचेतसामिह विभो नाशापि नः शोभते ।।","iast":"sāmāni śrutiśaṣkulīṃ muralikājātānyalaṅkurvate\nkāmānivartacetasāmiha vibho nāśāpi naḥ śobhate ||","meaning":"(O Lord!)\nYour names, being imbued with Your love, heighten the intensity of\nthe delight which Your pious devotees exude on their countenance.\nYour magnificent hue, splendid as a dark rain cloud, enhances the\nsheen of the black collyrium beautifying the eyes of Your devotees.\nAnd the melodious sound emanating from Your flute adorns their\nears.\nO Supreme One! As our minds have yet to renounce worldly\ndesires, we are unable to nurture pure aspirations for You.\n(How then can we ever aspire to be like Your devotees we admire\nso much?)","source":"Śrī Rūpa Gosvāmī"},{"number":60,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"संसाराम्भसि सम्भृतभ्रमभरे गम्भीरतापत्रय-\nग्राहेणाभिगृहीतमुग्रगतिना क्रोशन्तमन्र्तर्भयात्।\nदीप्रेणाद्य सुदर्शनेन विबुधक्लान्तिच्छिदाकारिणा\nचिन्तासन्ततिरुद्धमुद्धर हरे मच्छित्तदन्तीश्वरम्।।","iast":"saṃsārāmbhasi sambhṛtabhramabhare gambhīratāpatraya-\ngrāheṇābhigṛhītamugragatinā krośantamanrtarbhayāt|\ndīpreṇādya sudarśanena vibudhaklānticchidākāriṇā\ncintāsantatiruddhamuddhara hare macchittadantīśvaram||","meaning":"(O Lord!)\nI have been thrown into the overwhelming delusion of the ocean of\nsaṃsāra and inextricably seized am I by the ferocious crocodile of\nthe three-fold worldly torments*.\nTerrified as I am, I cry out to You as did the king of elephants (Gajendra)**, when he was seized by the crocodile.\nBesieged as I am by endless woes, I beseech You O Hari! That this day may You deliver me, just as You rescued the king of elephants, by Your dazzling Sudarśana Cakra***, which is all enlightened and which destroys all woes.","source":"Śrī Rūpa Gosvāmī"},{"number":61,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"विवृतविविधबाधे भ्रान्तिवेगादाधे\nबलवति भवपूरे मज्जतो मे विदूरे।\nअशरणगणबन्धो हा कृपाकौमुदीन्दो\nसकृदकृतविलम्बं देहि हस्तावलम्बम्।।","iast":"vivṛtavividhabādhe bhrāntivegādādhe\nbalavati bhavapūre majjato me vidūre|\naśaraṇagaṇabandho hā kṛpākaumudīndo\nsakṛdakṛtavilambaṃ dehi hastāvalambam||","meaning":"I have come out too far off shore and am drowning in this formidable ocean of saṃsāra.\nThis ocean is fraught with hosts of obstacles in every direction and is unfathomable in its power of worldly delusion.\nO friend of destitute souls! O bestower of the moonlight of compassion!\nOnly for once do away with delay and give me Your helping hand.\n(Or else I will drown in the ocean of saṃsāra.)","source":"Śrī Rūpa Gosvāmī"},{"number":62,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"नृत्यन् वायुविघूर्णितैः स्वविपटैगयन्नलीनां रुतै-\nमुञ्चन्नश्रु मरन्दबिन्दुभिरलं रोमाञ्चवानङ्कुरैः ।\nमाकन्दोऽपि मुकुन्द मूर्छति तव स्मृत्या नु वृन्दावने\nब्रूहि प्राणसमान चेतसि कथं नामापि नायाति ते ।।","iast":"nṛtyan vāyuvighūrṇitaiḥ svavipaṭaigayannalīnāṃ rutai-\nmuñcannaśru marandabindubhiralaṃ romāñcavānaṅkuraiḥ |\nmākando’pi mukunda mūrchati tava smṛtyā nu vṛndāvane\nbrūhi prāṇasamāna cetasi kathaṃ nāmāpi nāyāti te ||","meaning":"O Mukunda! As the mango trees of Vṛndāvana remember You, they --\nDance with joy when the wind causes their branches to sway to and fro,\nSing with the sound of the honey bees humming around their flowers,\nShed tears in the form of droplets of nectar flowing out of their flowers,\nAre graced with horripilation when their young sprouting shoots stand on end,\nAnd even faint and become lifeless (in their agony of separation from You).\nMy Lord! You are my very life!\nPray tell me, why does Your name not pervade my consciousness (and render me ecstatic in the manner of the mango trees of Vṛndāvana)?","source":"Śrī Īśvara Purī"},{"number":63,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"या द्रौपदीपरित्राणे या गजेन्द्रस्य मोक्षणे ।\nमय्यार्ते करणामूर्ते सा त्वरा का गता हरे ।।","iast":"yā draupadīparitrāṇe yā gajendrasya mokṣaṇe |\nmayyārte karaṇāmūrte sā tvarā kā gatā hare ||","meaning":"O embodiment of compassion, Lord Hari!\nYou acted so swiftly to rescue Draupadī (from the Kauravas) and to save Gajendra (from the crocodile).\nWhere has gone that haste of Yours in my time of distress?","source":"Śrī Autkala"},{"number":64,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"दीनबन्धुरिति नाम ते स्मरन् ।\nयादवेन्द्र पतितोऽहमुत्सहे ।\nभक्तवत्सलतया त्वयि श्रुते\nमामकं हृदयमाशु कम्पते ।।","iast":"dīnabandhuriti nāma te smaran |\nyādavendra patito’hamutsahe |\nbhaktavatsalatayā tvayi śrute\nmāmakaṃ hṛdayamāśu kampate ||","meaning":"O chief of the Yadu clan!\nOn meditating upon Your name Dīnabandhu*, my fallen self, feels inspired and encouraged (at the prospect of attaining Your grace).\nBut upon hearing that You are as affectionately and protectively disposed towards Your devotees as a cow is to her calf, my heart immediately begins palpitating (due to being overwhelmed with emotions of reverence and gratitude).","source":"Śrī Jagannatha Sena"},{"number":65,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"स्तावकास्त्व चतुर्मुखादयो\nभावकाश्च भगवन् भवादयः।\nसेवकाः शतमखादयः सुरा\nवासुदेव यदि के तदा वयम्।।","iast":"stāvakāstva caturmukhādayo\nbhāvakāśca bhagavan bhavādayaḥ|\nsevakāḥ śatamakhādayaḥ surā\nvāsudeva yadi ke tadā vayam||","meaning":"O Vāsudeva!\nLord Brahmā and other exalted ones eulogize Your glories.\nLord Śiva and the greatest of yogis meditate on You,\nWhile Lord Indra and other demigods are engaged in Your service.\nThen of what consequence are we ordinary mortals?","source":"Śrī Dhanañjaya"},{"number":66,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"परमकारुणिको न भवतपरः\nपरमशोच्यतमो न च मत्परः।\nइति विचिन्त्य हरे मयि पामरे\nयदुचितं यदुनाथ तदाचर।।","iast":"paramakāruṇiko na bhavataparaḥ\nparamaśocyatamo na ca matparaḥ|\niti vicintya hare mayi pāmare\nyaducitaṃ yadunātha tadācara||","meaning":"O Hari! O king of the Yadu clan!\nThere is none more merciful than Thee, just as there is none more\npitiable than me.\nThinking thus of me, dispose of my wretched self as Thou deem fit.","source":"Anonymous"},{"number":67,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"भवोद्भवक्लेशकशाशताहत:\nपरिश्रमन्निन्द्रियकापथान्तरे।\nनियम्यतां माधव मे मनोहय-\nस्तदङ्घ्रिशङ्कौ दृढ़भक्तिबन्धने।।","iast":"bhavodbhavakleśakaśāśatāhata:\npariśramannindriyakāpathāntare|\nniyamyatāṃ mādhava me manohaya-\nstadaṅghriśaṅkau dṛṛhabhaktibandhane||","meaning":"My mind is but a wild horse wandering on the dreadful path of sensuousness and is being constantly lashed by hundreds of worldly torments.\nO Mādhava! Subdue this horse by tying it, with the tether of steadfast devotion, to that (unshakable) peg that are Your (glorious) feet.","source":"Anonymous"},{"number":68,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"न ध्यातोऽसि न कीर्तितोऽसि न मनागाराधितोऽसि प्रभो\nनो जन्मान्तरगोचरे तव पदाम्भोजे च भक्ति: कृता।\nतेनाहं बहुदु:खभाजनतया प्राप्तो दशामीदृशीं\nत्वं कारुण्यनिधे विधेहि करुणां श्रीकृष्ण दीने मयि।।","iast":"na dhyāto’si na kīrtito’si na manāgārādhito’si prabho\nno janmāntaragocare tava padāmbhoje ca bhakti: kṛtā|\ntenāhaṃ bahudu:khabhājanatayā prāpto daśāmīdṛśīṃ\ntvaṃ kāruṇyanidhe vidhehi karuṇāṃ śrīkṛṣṇa dīne mayi||","meaning":"O Lord! In this life of mine I have failed to meditate upon Thee, or worship Thee,\nAnd I have failed to install Thee in my heart.\nAnd neither in my previous lives have I lovingly served Thy lotus-feet.\nHaving suffered intensely due to my failings, I have reached this wretched state.\nO Śrī Kṛṣṇa! O ocean of compassion! Bestow mercy upon my fallen self.","source":"Śrī Śankara"},{"number":69,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"शरणमसि हरे प्रभो मुरारे\nजय मधुसूदन वासुदेव विष्णो ।\nनिरवधि कलुषौघकारिणं मां\nगतिरहितं जगदीश रक्ष रक्ष।।","iast":"śaraṇamasi hare prabho murāre\njaya madhusūdana vāsudeva viṣṇo |\nniravadhi kaluṣaughakāriṇaṃ māṃ\ngatirahitaṃ jagadīśa rakṣa rakṣa||","meaning":"You are my refuge O Lord! O Hari! O Murāri!\nGlory be to You, O Madhusūdana! O Vāsudeva! O Viṣṇu!\nHaving committed countless sins, I have no hope of redemption.\nO Jagadīśa! Save me! Save me!","source":"Anonymous"},{"number":70,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"दिनादौ मुरारे निशानदौ मुरारे\nदिनार्धे मुरारे निशार्धे मुरारे ।\nदिनान्ते मुरारे निशान्ते मुरारे\nत्वमेको गतिर्नस्त्वमेको गतिर्नः ।।","iast":"dinādau murāre niśānadau murāre\ndinārdhe murāre niśārdhe murāre |\ndinānte murāre niśānte murāre\ntvameko gatirnastvameko gatirnaḥ ||","meaning":"In the morning, O Murāri!\nIn the evening, O Murāri!\nAt midday, O Murāri!\nAt midnight, O Murāri!\nAt dusk, O Murāri!\nAt dawn, O Murāri!\n(At all times) You are my only salvation! You are my only salvation!","source":"A devotee from South India"},{"number":71,"topic":"Devotees Humbly Express Their Helplessness","devanagari":"अयि नन्दनूनज किङ्करं\nपतितं मा विषमे भवाम्बुधौ ।\nकृपया तव पादपङ्कज-\nस्थितधूलीसदृशं विभावय ।।","iast":"ayi nandanūnaja kiṅkaraṃ\npatitaṃ mā viṣame bhavāmbudhau |\nkṛpayā tava pādapaṅkaja-\nsthitadhūlīsadṛśaṃ vibhāvaya ||","meaning":"O son of Nanda! I, Your servant, have fallen into this terrible ocean of saṃsāra.\nMay You have mercy upon me and look upon me as one among the specks of dust on Your lotus feet.","source":"Lord Caitanya"},{"number":72,"topic":"The Intensity Of Faith Of Devotees","devanagari":"न वयं कवयो न तार्किका\nन च वेदान्तनितान्तपारगाः ।\nन च वादिनिवारकाः परं\nकपटाभीरकिशोरकिङ्कराः।।","iast":"na vayaṃ kavayo na tārkikā\nna ca vedāntanitāntapāragāḥ |\nna ca vādinivārakāḥ paraṃ\nkapaṭābhīrakiśorakiṅkarāḥ||","meaning":"We devotees are not endowed with any poetical talent,\nWe have no skill in philosophical dialectics.\nHave not mastered the Vedānta philosophy.\nNor have we any prowess to refute the doctrines of opposing scholars.\nWe are merely humble servants of the mischievous cowherd boy (Gopāla).","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":73,"topic":"The Intensity Of Faith Of Devotees","devanagari":"परि‍वदतु जनो यथा तथायं\nननु मुखरो न वयं विचारयामः ।\nहरिरसमदिरामदातिमत्ता\nभुवि विलुठाम नटाम निर्विशाम ।।","iast":"pari‍vadatu jano yathā tathāyaṃ\nnanu mukharo na vayaṃ vicārayāmaḥ |\nharirasamadirāmadātimattā\nbhuvi viluṭhāma naṭāma nirviśāma ||","meaning":"We care not for those who ridicule us devotees and speak ill of us; but rather we tell them to talk as they please.\nWe are so very intoxicated in savouring the delectable wine of Lord Hari’s love, that we delight ourselves in dancing, in rolling about on the ground and also fainting in our moments of ecstasy.","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":74,"topic":"The Intensity Of Faith Of Devotees","devanagari":"गोपीभर्तुः पदकमलयोर्दासानुदासः ।।","iast":"gopībhartuḥ padakamalayordāsānudāsaḥ ||","meaning":"I am not a brāhmaṇa, nor am I a kṣatriya or vaiśya or śūdra.\nI am neither a student (brahmacārī), nor householder (gṛhastha), nor hermit (vānaprasthī) nor renunciant (sannyāsin).\nI am only the servant of the servant of the servant of the lotus-feet of the Lord, Who is the husband of the gopīs: of that Lord Who is but an ever waxing ocean of the nectar of divine bliss.","source":"Śrī Caitanya"},{"number":75,"topic":"The Intensity Of Faith Of Devotees","devanagari":"धन्यानां हृदि भासतां गिरिवरप्रत्यग्रकुञ्जौकसां\nसत्यानन्दरसं विकारविभवव्यावृत्तमन्तर्महः ।\nअस्माकं किल वल्लवीरतिसो वृन्दाटवीलालसो\nगोपः कोऽपि महेन्द्रनीलरुचिरश्चिन्ते मुहुः क्रीडतु ।।","iast":"dhanyānāṃ hṛdi bhāsatāṃ girivarapratyagrakuñjaukasāṃ\nsatyānandarasaṃ vikāravibhavavyāvṛttamantarmahaḥ |\nasmākaṃ kila vallavīratiso vṛndāṭavīlālaso\ngopaḥ ko’pi mahendranīlaruciraścinte muhuḥ krīḍatu ||","meaning":"The blissful experience of the realization of Brahman,\nWhich is but the effulgence of the inner Self, devoid of impurity and untainted by worldly glory,\nIllumines the hearts of saintly yogis dwelling in the verdant bowers of blessed mountains.\n(We devotees care not for the accomplishments and experiences of such yogis.)\nAll that we desire is that some cowherd boy,\nWho delights Himself in Vṛndāvana,\nWho embodies the amorous sentiments of the gopīs,\nWho is as resplendent as a blue-saphire,\nTo forever sport in our hearts.","source":"Śrī Īśvara Puri"},{"number":76,"topic":"The Intensity Of Faith Of Devotees","devanagari":"रसं प्रशंसन्तु कवित्वनिष्ठा\nब्रह्मामृतं वेदशिरोनिविष्टाः ।\nवयं तु गुञ्जाकलितवतंसं\nगृहीतवंशं कमपि श्रयामः ।।","iast":"rasaṃ praśaṃsantu kavitvaniṣṭhā\nbrahmāmṛtaṃ vedaśironiviṣṭāḥ |\nvayaṃ tu guñjākalitavataṃsaṃ\ngṛhītavaṃśaṃ kamapi śrayāmaḥ ||","meaning":"Those who delight in poetry extol the aesthetic experience of rasa, while those devoted to Vedānta glorify the nectarine bliss of Brahman realization.\nAs for us devotees, we take refuge in someone Who sports a flute in His hands and is adorned with a garland of Guñja berries.","source":"Śrī Yādavendra Purī"},{"number":77,"topic":"The Intensity Of Faith Of Devotees","devanagari":"ध्यानातीतं किम्पि परमं ये तु जानन्ति तत्त्वं\nतेषामास्तां हृदयकुहरे शुद्धचिन्मात्र आत्मा ।\nअस्माकं तु प्रकृति मधुर: स्मेरवक्त्रारविन्दो\nमेघश्याम: कनकपरिधि: पङ्कजाक्षोऽयमात्मा ।।","iast":"dhyānātītaṃ kimpi paramaṃ ye tu jānanti tattvaṃ\nteṣāmāstāṃ hṛdayakuhare śuddhacinmātra ātmā |\nasmākaṃ tu prakṛti madhura: smeravaktrāravindo\nmeghaśyāma: kanakaparidhi: paṅkajākṣo’yamātmā ||","meaning":"Having attained perfection in yogic meditation, some great ones realize the Supreme Absolute Reality (the Nirguna Brahman).\nMay they behold in the chambers of their hearts the pristine spirit, the Ātman.\n(To us devotees the attainments of such yogis is of little consequence.)\nWe care only for our Lord, the embodiment of sweetness, Whose lotus like visage is always graced with an enchanting smile,\nAnd, adorned with golden robes, is resplendent like the magnificent dark hue of a rain-cloud.\nThat lotus-eyed Lord is our Ātman, our very soul.","source":"Śrī Kaviratna"},{"number":78,"topic":"The Intensity Of Faith Of Devotees","devanagari":"जातु प्रार्थयते न पार्थिवपदं नैन्द्रे पदे मोदते\nसन्धत्ते न च योगसिद्धिषु धियं मोक्षं न चाकाङ्क्षति ।\nकालिन्दीवनसीम्नि स्थिरतडिन्मेघद्युतौ केवलं\nशुद्धे ब्रह्मणि वल्लवीभुजलताबद्धे मनो धावति ।।","iast":"jātu prārthayate na pārthivapadaṃ naindre pade modate\nsandhatte na ca yogasiddhiṣu dhiyaṃ mokṣaṃ na cākāṅkṣati |\nkālindīvanasīmni sthirataḍinmeghadyutau kevalaṃ\nśuddhe brahmaṇi vallavībhujalatābaddhe mano dhāvati ||","meaning":"I do not aspire for the title of emperor,\nNor cherish the position of Indra, the king of gods,\nNor desire to acquire occult yogic powers,\nAnd neither does my mind seek the emancipation of my soul in mokṣa.\nMy heart does none else than hasten towards my dear Lord, Who\nIs the embodiment of Brahman, the Supreme Pure Spirit,\nAlways graces the confines of the forests on the banks of the Kālindī (Yamunā) river,\nIs resplendent as a still and stately rain-cloud charged with lightening,\nAnd is bound by the loving embraces of the slender arms of the cowherd girls.","source":"Sri Kaviratna"},{"number":79,"topic":"The Intensity Of Faith Of Devotees","devanagari":"सन्ध्यावन्दन भद्रमस्तु भवते भो: स्नान तुभ्यं नमो\nभो देवा पितरश्च तर्पणविधौ नाहं क्षम: क्षम्यताम्।\nयत्र क्वापि निषद्य यादवकुलोत्तंसस्य कंसद्विष:\nस्मारं स्मारमघं हरामि तदलं मन्ये किमन्थेन मे।।","iast":"sandhyāvandana bhadramastu bhavate bho: snāna tubhyaṃ namo\nbho devā pitaraśca tarpaṇavidhau nāhaṃ kṣama: kṣamyatām|\nyatra kvāpi niṣadya yādavakulottaṃsasya kaṃsadviṣa:\nsmāraṃ smāramaghaṃ harāmi tadalaṃ manye kimanthena me||","meaning":"O sandhya* prayer! May you be blessed!\nO bathing ritual! My salutations to you!\n(Please forgive me for neglecting you.)\nO celestial ones in heaven! O revered spirits of my ancestors!\nForgive me for I am no longer able to perform sacramental rites for your gratification.\n(My absorption in my love for my Lord has rendered me negligent of my obligatory duties.)\n(My state of mind now is such that) wherever I find place, I sit down and incessantly meditate upon the crest jewel of the Yadava race, the foe of the demon Kamsa.\nIn doing so, I cleanse myself of sin.\nAnd since that for me is sufficient piety, what regard can I have for other religious observances?","source":"Sri Madhavendra Puri"},{"number":80,"topic":"The Intensity Of Faith Of Devotees","devanagari":"देवकीतनयसेवक्यभवन्\nयो भवानि स भवानि किं ततः।\nउत्पथे क्वचन सत्पथेऽपि वा\nमानसं व्रजतु दैवदेशितम्।।","iast":"devakītanayasevakyabhavan\nyo bhavāni sa bhavāni kiṃ tataḥ|\nutpathe kvacana satpathe’pi vā\nmānasaṃ vrajatu daivadeśitam||","meaning":"For the sake of being the servant of the son of Devakī, I care not for what may become of me (in the after-life).\nIn serving my Lord may my mind wander on whatever path destiny directs it, be it of vice or be it of virtue.","source":"Anonymous"},{"number":81,"topic":"The Intensity Of Faith Of Devotees","devanagari":"मुग्धं मां निगदन्तु नीतिनिपुणा भ्रान्तं मुहुर्वैदिका\nमन्दं बान्धवसञ्चया जडधियं मुक्तादराः सोदराः।\nउन्मत्तं धनिनो विवेकचतुराः कामं महादाम्भिकं\nमोक्तुं न क्षमते मनागपि मनो गोविन्दपादस्पृहाम्।।","iast":"mugdhaṃ māṃ nigadantu nītinipuṇā bhrāntaṃ muhurvaidikā\nmandaṃ bāndhavasañcayā jaḍadhiyaṃ muktādarāḥ sodarāḥ|\nunmattaṃ dhanino vivekacaturāḥ kāmaṃ mahādāmbhikaṃ\nmoktuṃ na kṣamate manāgapi mano govindapādaspṛhām||","meaning":"Men of wisdom consider me infatuated,\nPanditas of Veda repeatedly call me deluded,\nAll my friends dismiss me as slothful,\nMy kinsmen dispense with all courtesies and tell me that I am dull-witted,\nWealthy persons call me delirious,\nAnd those perceptive ones, who are conscious of propriety, find me an ostentatious hypocrite.\nYet, I tell them to revile me to their hearts' content.\nFor I am not in the least measure capable of renouncing my heart's yearning for the feet of my Lord Govinda.","source":"Śrī Mādhava"},{"number":82,"topic":"The Intensity Of Faith Of Devotees","devanagari":"श्याममेव परं रूपं पुरी मधुपुरी परा।\nवय: कैशोरकं ध्येयमाद्य एव परो रस:।।","iast":"śyāmameva paraṃ rūpaṃ purī madhupurī parā|\nvaya: kaiśorakaṃ dhyeyamādya eva paro rasa:||","meaning":"The dark-hued Śyāma is the Lord's most sublime form,\nMathurā is the best city in the universe,\nThe Lord's exploits and pastimes, during His adolescent years, are the most worthy of meditation,\nAnd of all the rasas, śṛngāra* is supreme.","source":"Śrī Raghupati Upādhyāya"},{"number":83,"topic":"The Intensity Of Faith Of Devotees","devanagari":"पुरतः स्फुरतु विमुक्तिश्चिरमिह राज्यं करोतु वैराज्यम्।\nपशुपालबालकपतेः सेवामेवाभियाच्छामि।।","iast":"purataḥ sphuratu vimuktiściramiha rājyaṃ karotu vairājyam|\npaśupālabālakapateḥ sevāmevābhiyācchāmi||","meaning":"If the great benediction of spiritual salvation (mukti),\nAnd if all the occult yogic powers,\nWere to appear personified before me,\nI will tell them to remain enthroned in their own domains.\n(For I have no use for them.)\nThe only craving in my heart is to be in the service of the chief of\nthe band of cowherd boys (Krsna).","source":"Śrī Surrottama Ācārya"},{"number":84,"topic":"The Intensity Of Faith Of Devotees","devanagari":"क्षौणीपतित्वमथवैकमकञ्चनत्वं\nनित्यं ददासि बहुमानमथापमानम् ।\nवैकुण्ठवासमथ वा नरके निवासं\nहा वासुदेव मम नास्ति गतिस्त्वदन्या ।।","iast":"kṣauṇīpatitvamathavaikamakañcanatvaṃ\nnityaṃ dadāsi bahumānamathāpamānam |\nvaikuṇṭhavāsamatha vā narake nivāsaṃ\nhā vāsudeva mama nāsti gatistvadanyā ||","meaning":"If Thou will, O Vāsudeva,\nMake me sovereign ruler of the earth or render me destitute,\nGive me glory or give me disgrace,\nGrant me residence in Thy transcendental abode Vaikunṭha or\nconsign me to hell.\n(Whatever be Thy will) I have no salvation other than Thee.","source":"Śrī Garbha Kavīndra"},{"number":85,"topic":"The Intensity Of Faith Of Devotees","devanagari":"दिशतु स्वाराज्यं वा वितरतु तापत्रयं वापि ।\nसुखितं दुःखितमपि मां न विमुञ्चतु केशवः स्वामी ।।","iast":"diśatu svārājyaṃ vā vitaratu tāpatrayaṃ vāpi |\nsukhitaṃ duḥkhitamapi māṃ na vimuñcatu keśavaḥ svāmī ||","meaning":"Bestow upon me the dominion of heaven if You will,\nOr condemn me to the three-fold earthly torments,\nGive me happiness or give me distress,\n(I care not),\nBut pray never forsake me, O my master, Keśava.","source":"Śrī Kavirāja Miśra"},{"number":86,"topic":"The Earnest Prayers Of Devotees","devanagari":"नन्दनन्दनपदारविन्दयोः\nस्यन्दमानमकरन्दबिन्दवः ।\nसिन्धवः परमसौख्यसम्पदां\nनन्दयन्तु हृदयं ममानिशम् ।।","iast":"nandanandanapadāravindayoḥ\nsyandamānamakarandabindavaḥ |\nsindhavaḥ paramasaukhyasampadāṃ\nnandayantu hṛdayaṃ mamāniśam ||","meaning":"May the droplets of nectar,\nThat are trickling from the lotus-feet of the son of Nanda,\nAnd that are like oceans of the plenitude of divine bliss,\nForever enravish my heart.","source":"Śrīkara Ācārya"},{"number":87,"topic":"The Earnest Prayers Of Devotees","devanagari":"इह वत्सान् समचारयदਿਹ नः स्वामी जगौ वंशीम्।\nइति सास्त्रं गदतो मे यमुनातीरे दिनं यायात्।।","iast":"iha vatsān samacārayadaਿਹ naḥ svāmī jagau vaṃśīm|\niti sāstraṃ gadato me yamunātīre dinaṃ yāyāt||","meaning":"Here, in this very place, did our Lord graze His flock of calves\nand did He tune His flute.\nNarrating thus (the deeds of my Lord) with tearful eyes,\nMay I spend my days here forever on the banks of the river\nYamunā.","source":"Śrī Raghupati Upādhyāya"},{"number":88,"topic":"The Earnest Prayers Of Devotees","devanagari":"अनुशीलितकुञ्जवाटिकायां\nजघनालम्बितपीतशाटिकायाम्।\nमुरलीकलकूजिते रतायां\nमम चेतोऽस्तु कदम्बदेवतायाम्।।","iast":"anuśīlitakuñjavāṭikāyāṃ\njaghanālambitapītaśāṭikāyām|\nmuralīkalakūjite ratāyāṃ\nmama ceto’stu kadambadevatāyām||","meaning":"Having an ardent fancy for sporting in forest-gardens and\norchards,\nAdorned in a golden robe around His waist,\nDevoted to playing His flute to sweet melodies,\nIn meditation of that Lord of the Kadamba trees (of Vṛndāvana),\nMay my mind be immersed.","source":"Śrī Govinda"},{"number":89,"topic":"The Earnest Prayers Of Devotees","devanagari":"आरक्तदीर्घनयनो नयनाभिरामः\nकन्दर्पकोटिललितं वपुरादधानः ।\nभूयात् स मेऽद्य हृदयाम्बुरुहाधिवर्ती\nवृन्दाटवीनगरनागरचक्रवर्ती ।।","iast":"āraktadīrghanayano nayanābhirāmaḥ\nkandarpakoṭilalitaṃ vapurādadhānaḥ |\nbhūyāt sa me’dya hṛdayāmburuhādhivartī\nvṛndāṭavīnagaranāgaracakravartī ||","meaning":"My Lord, Who has large eyes with reddish tinge,\nWho is a delight to one’s eyes,\nWho has assumed a bodily form as charming and beautiful as ten million Cupids,\nWho is the superintendent of the city of Vṛndāvana and is the sovereign ruler therein,\nMay He this day be enthroned upon the lotus of my heart.","source":"Śrī Bhavānanda"},{"number":90,"topic":"The Earnest Prayers Of Devotees","devanagari":"लावण्यामृतवन्या मधुरिमलहरीपरीपाकः ।\nकारुण्यानां हृदयं कपटकिशोरः परिस्फुरतु ।।","iast":"lāvaṇyāmṛtavanyā madhurimalaharīparīpākaḥ |\nkāruṇyānāṃ hṛdayaṃ kapaṭakiśoraḥ parisphuratu ||","meaning":"He Who is the essence of the sweet waves of the nectarian ocean of beauty,\nWhose heart is of the nature of kindness,\nMay that naughty cowherd boy,\nBecome visible to me.","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":91,"topic":"The Earnest Prayers Of Devotees","devanagari":"भवन्तु तानि जन्मानि यत्र ते मुरलीकलः ।\nकर्णपयत्वमायाति किं मे निर्वाणवार्तया ।।","iast":"bhavantu tāni janmāni yatra te muralīkalaḥ |\nkarṇapayatvamāyāti kiṃ me nirvāṇavārtayā ||","meaning":"(O Lord I pray to Thee)\nLet me always take birth where I can hear the sweet sound of Thy flute.\nWith those melodious notes gracing my ears, what taste do I have for discourses on nirvāṇa*?","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":92,"topic":"The Earnest Prayers Of Devotees","devanagari":"आस्वाद्यं प्रमदारदच्छद इव श्रव्यं नवं जल्पितं\nबालाया इव दृश्यमुत्तमवधूलावण्यलक्ष्मिरिव ।\nप्राद्वोष्यं चिरविप्रयुक्तवनितासन्देशवाणीव मे\nनैवेद्यं चरितं च रूपमनिशं श्रीकृष्ण नामास्तु ते ।।","iast":"āsvādyaṃ pramadāradacchada iva śravyaṃ navaṃ jalpitaṃ\nbālāyā iva dṛśyamuttamavadhūlāvaṇyalakṣmiriva |\nprādvoṣyaṃ ciraviprayuktavanitāsandeśavāṇīva me\nnaivedyaṃ caritaṃ ca rūpamaniśaṃ śrīkṛṣṇa nāmāstu te ||","meaning":"O Lord Kṛṣṇa!\nMay the offerings* made to Thee be as delectable to me as are the lips of a voluptuous woman.\nMay the narrations of Thy līlās be as pleasing for me to hear as the chatter of a newly wed bride.\nMay Thy form be as alluring to my sight as is a perfect bride; a bride endowed with all the wealth of beauty, charm and grace.\nMay I constantly chant Thy names, with the zeal of a devoted wife who goes about proclaiming loudly (to her friends) the wordings of\na message she receives from her husband who has been long away from home.","source":"Anonymous"},{"number":93,"topic":"The Earnest Prayers Of Devotees","devanagari":"नयनं गलदम्बुधारया\nवदनं गद्गदरुद्धया गिरा\nपुलकैर्निचितं वपुः कदा\nतव नामग्रहणे भविष्यति।।","iast":"nayanaṃ galadambudhārayā\nvadanaṃ gadgadaruddhayā girā\npulakairnicitaṃ vapuḥ kadā\ntava nāmagrahaṇe bhaviṣyati||","meaning":"When will it be, my Lord, that upon hearing Thy name,\nMy eyes will be blessed with an effusion of tears,\nMy mouth will be graced with faltering speech (due to ecstasy),\nAnd my body charged with horripilation.","source":"Lord Caitanya"},{"number":94,"topic":"The Earnest Prayers Of Devotees","devanagari":"न धनं न जनं न सुन्दरीं\nकवितां वा जगदीश कामये।\nमम जन्मनि जन्मनीश्वरे\nभवताद्भक्तिरहैतुकी त्वयि।।","iast":"na dhanaṃ na janaṃ na sundarīṃ\nkavitāṃ vā
