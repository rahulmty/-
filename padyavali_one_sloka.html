:\nसर्वा एव हि वञ्चिता: सखि वयं सोऽन्वेषणीयो यदि ।\nद्वे द्वे गच्छतमित्युदीर्य सहसा राधां गृहीत्वा करे\nगोपीवेशधरो निकुञ्जकुहरं प्राप्तो हरि: पातु व: ।।","iast":"dṛṣṭa: kvāpi sa mādhavo vrajavadhūmādāya kāñcidgata:\nsarvā eva hi vañcitā: sakhi vayaṃ so’nveṣaṇīyo yadi |\ndve dve gacchatamityudīrya sahasā rādhāṃ gṛhītvā kare\ngopīveśadharo nikuñjakuharaṃ prāpto hari: pātu va: ||","meaning":"Lord Hari assumed the guise of a gopi and said to the other gopis:\n\"O sakhis! Have you seen Mādhava anywhere? He has gone away with some gopi. We have all been cheated. If we are to search for Him, then we must set out in pairs.\"\nThus speaking, the Lord forcefully grasped Rādhā with His hand and entered into the interiors of a forest garden.\nMay Lord Hari protect you.","source":"Anonymous"},{"number":297,"topic":"The Utterances Of Rādhā'S Sakhī","devanagari":"अदोषाददोषाद्वा त्यजति विपिने तां यदि भवा-\nनभद्रं भद्रं वा त्रिभुवनपते त्वां वदतु क: ।\nइदं तु क्रूरं मे स्मरति हृदयं यत्किल तया\nत्वदर्थं कान्तारे कुलतिलक नात्मापि गणित: ।।","iast":"adoṣādadoṣādvā tyajati vipine tāṃ yadi bhavā-\nnabhadraṃ bhadraṃ vā tribhuvanapate tvāṃ vadatu ka: |\nidaṃ tu krūraṃ me smarati hṛdayaṃ yatkila tayā\ntvadarthaṃ kāntāre kulatilaka nātmāpi gaṇita: ||","meaning":"\"O chief of the residents of Vraja!\nFor some fault of Rādhā, or perhaps for no fault of Hers, You have forsaken Her in the forest.\nBut who can tell You if what You did was right or wrong?\nBut, O pride of the clan!\nMy heart recalls that terrible state of Rādhā in the forest, when for Your sake, She ceased to care even for Her own life.\"","source":"Śrī Rāmacandradāsa"},{"number":298,"topic":"The Utterances Of Rādhā'S Sakhī","devanagari":"लक्ष्मी मध्यगतेन रासवलये विस्तारयन्नात्मना\nकस्तूरीसुरभिर्विलास मुरलीविन्यस्त वक्त्रेन्दुना।\nक्रीडाताण्डवमण्डलेन परितो दृष्टेन तुष्यद्दृशा\nत्वां हलीशकशङ्कुकुंकुलपदा पायाद्विहारी हरिः।।","iast":"lakṣmī madhyagatena rāsavalaye vistārayannātmanā\nkastūrīsurabhirvilāsa muralīvinyasta vaktrendunā|\nkrīḍātāṇḍavamaṇḍalena parito dṛṣṭena tuṣyaddṛśā\ntvāṃ halīśakaśaṅkukuṃkulapadā pāyādvihārī hariḥ||","meaning":"Lord Hari enhances the beauty of the rāsa dance by His presence in its midst.\nHe places His moon-like visage on the flute that He sports with.\nHis eyes feel pleased as He glances, on all sides, at the band of dancing cowherd girls.\nAnd (the centre of) the circular array of the dancing girls is the peg that tie down His feet.\nMay that sportive Lord Hari, Who is endowed with the fragrance of musk, protect you.","source":"Anonymous"},{"number":299,"topic":"The Expressions Of Celestial Beings","devanagari":"मुक्तमुनीनां मृग्यं किमपि फलं देवकी फलति ।\nतत् पालयति यशोदा निकाममुपभुङ्क्ते गोप्यः ।।","iast":"muktamunīnāṃ mṛgyaṃ kimapi phalaṃ devakī phalati |\ntat pālayati yaśodā nikāmamupabhuṅkte gopyaḥ ||","meaning":"\"The fruit that is sought by liberated sages,\nIs borne by Devakī,\nIs nurtured by Yaśodā,\nAnd is relished by the gopīs to their hearts' content.\"","source":"A devotee from South India"},{"number":300,"topic":"The Expressions Of Celestial Beings","devanagari":"तप्तं तपोभिरन्यैः फलितं तद्गोपबालानाम ।\nआसां यत् कुचकुम्भे नीलनिचोलयति ब्रह्म ।।","iast":"taptaṃ tapobhiranyaiḥ phalitaṃ tadgopabālānāma |\nāsāṃ yat kucakumbhe nīlanicolayati brahma ||","meaning":"\"Many persons performed severe penances (to please the Lord). But it was the gopīs who reaped the fruit of the penances of others. For the Lord, Who is none other than the Supreme Brahman, (as a consequence of the penances performed) assumed the form of the blue cloth gracing the bosoms of the gopīs.\"","source":"Śrī Raghupati Upādhyāya"},{"number":301,"topic":"The Lord'S Water Sport","devanagari":"जलकेलितरलकरतलमुक्तपुनःपिरिताधिकावदनः।\nजगदवतु कोक्यूनोर्विघटनसङ्घटनकौतुकी कृष्णः।।","iast":"jalakelitaralakaratalamuktapunaḥpiritādhikāvadanaḥ|\njagadavatu kokyūnorvighaṭanasaṅghaṭanakautukī kṛṣṇaḥ||","meaning":"While sporting with Rādhā in the water, Krsna conceals Her face with His agile hands, and then removes them and reveals Her face once again.\nMay Lord Krsna Who causes a pair of Koka* to birds engage in their play of union and separation, protect the whole world.","source":"Anonymous"},{"number":302,"topic":"Candrāvalī'S Sakhī Addresses Rādhā'S Sakhī And Expresses Her Envy","devanagari":"मा गर्वमुद्रह कपोलतले चकास्ति\nकृष्णस्वहस्तलिखिता नवमञ्जरीति।\nअन्यापि किं न सखि भाजनमीदृशीनां\nवैरी न चेद्भवति वेपथुरन्तरायः।।","iast":"mā garvamudraha kapolatale cakāsti\nkṛṣṇasvahastalikhitā navamañjarīti|\nanyāpi kiṃ na sakhi bhājanamīdṛśīnāṃ\nvairī na cedbhavati vepathurantarāyaḥ||","meaning":"\"O sakhi! Be not proud if your cheeks are embellished with the flower bud that Kṛṣṇa has sketched on them with His own hands.\nFor can not anyone be blest with such an adornment if only the impediment of tremor* does not manifest itself in the likeness of an enemy?\"","source":"Śrī Dāmodara"},{"number":303,"topic":"The Meaningful Statements Of Rādhā'S Sakhī","devanagari":"यदवधि गोकुलमभितः समजनि कुसुमाचितासनश्रेणी।\nपीतांiशुकप्रियेयं तदवधि चन्द्रावली जाता।।","iast":"yadavadhi gokulamabhitaḥ samajani kusumācitāsanaśreṇī|\npītāṃiśukapriyeyaṃ tadavadhi candrāvalī jātā||","meaning":"\"Ever since, on every pathway, all around Gokula, did appear rows of heaps of flowers*,\nSince then has Candrāvalī been dear to our Lord Who wears yellow robes.\"","source":"Śrī Govardhana Ācārya"},{"number":304,"topic":"Rādhā'S Friends Address Her","devanagari":"सौजन्येन वशीकृता वयमतस्त्वां किञ्चिदाचक्ष्महे\nकालिन्दीं यदि यासि सुन्दरि पुनर्मा गाः कदम्बाटवीम् ।।\nकश्चित्तत्र नितान्तनिर्मलतमःस्तोमोज्झसि यस्मिन्मनाग्\nलग्ने लोचनसीम्नि नोत्पलदृशः पश्यन्ती पत्युर्गृहम् ।।","iast":"saujanyena vaśīkṛtā vayamatastvāṃ kiñcidācakṣmahe\nkālindīṃ yadi yāsi sundari punarmā gāḥ kadambāṭavīm ||\nkaścittatra nitāntanirmalatamaḥstomojjhasi yasminmanāg\nlagne locanasīmni notpaladṛśaḥ paśyantī patyurgṛham ||","meaning":"\"We are overwhelmed by Your kindness, O beautiful One! Therefore we say to You, that if You go to the Yamunā river, You must not visit the Kadamba forest.\nFor in the forest is some deep, inexorable expanse of darkness; darkness so severe that if it adheres, in the slightest measure, to the corners of the eyes, then lotus-eyed maidens (being unable to see clearly) are unable to locate the homes of their husbands.\"","source":"Śrī Govinda Bhaṭṭa"},{"number":305,"topic":"Rādhā'S Friends Address Her","devanagari":"श्यामोऽयं दिवसः पयोदपटलैः सायं तथाप्युत्सुका\nपुष्पार्थं सखि यासि यामुनतटं याहि व्यथा का मम ।\nकिन्त्वेकं खरकण्टकक्षतमुरस्यालोक्य सद्योऽन्यथा\nशङ्कां यत् कुटिलः करिष्यति जनो जातास्मि तेनाकुला ।।","iast":"śyāmo’yaṃ divasaḥ payodapaṭalaiḥ sāyaṃ tathāpyutsukā\npuṣpārthaṃ sakhi yāsi yāmunataṭaṃ yāhi vyathā kā mama |\nkintvekaṃ kharakaṇṭakakṣatamurasyālokya sadyo’nyathā\nśaṅkāṃ yat kuṭilaḥ kariṣyati jano jātāsmi tenākulā ||","meaning":"\"In this evening time, a blanket of clouds is making the day grow dark. Yet, O sakhi, in Your eagerness to gather flowers, You are going to the banks of the Yamunā. But why should I be concerned?\nBut upon seeing even a single thorn mark on Your bosom, wicked persons will immediately suspect otherwise. This is why I am so disturbed.\"","source":"Śrī Karṇapura"},{"number":306,"topic":"Rādhā'S Friends Address Her","devanagari":"गन्तव्या ते मनसि यमुना वर्तते चेत्तदानीं\nकुञ्जं मा गाः सहजरसले वाञ्छुलं मद्भचोभिः।\nगच्छेस्तत्राप्यहह यदि वा मा मुरारेरुदारे\nकुत्राप्येका रहसि मुरलीनादमाकर्णयेथाः।।","iast":"gantavyā te manasi yamunā vartate cettadānīṃ\nkuñjaṃ mā gāḥ sahajarasale vāñchulaṃ madbhacobhiḥ|\ngacchestatrāpyahaha yadi vā mā murārerudāre\nkutrāpyekā rahasi muralīnādamākarṇayethāḥ||","meaning":"\"O naive One! If, in Your mind, You entertain the desire to go to the Yamunā, then heed my advice and do not go to the bower of Aśoka trees.\nBut alas O noble One! If You happen to go there nevertheless, then wherever You may be, do not, in seclusion, and in a state of solitude, listen to the sound of Murāri's flute.\"","source":"Śrī Tairabhukta Kavi"},{"number":307,"topic":"Rādhā'S Friends Address Her","devanagari":"तरले न कुरु विलम्बं कुम्भं सम्भृत्य मन्दिरं याहि।\nयावन्न मोहनमन्त्रं शंसति कंसद्विषो वंशी।।","iast":"tarale na kuru vilambaṃ kumbhaṃ sambhṛtya mandiraṃ yāhi|\nyāvanna mohanamantraṃ śaṃsati kaṃsadviṣo vaṃśī||","meaning":"(When Rādhā went to the Yamunā to fetch water, Her friend addressed Her thus:)\n\"Do not delay, O fickle One! Fill up Your water-pitcher and hasten to Your house before the enemy of Kamsa sounds a bewitching incantation on His flute.\"","source":"Śrī Rūpa Gosvāmī"},{"number":308,"topic":"Rādhā'S Friends Address Her","devanagari":"पृष्ठेन नीपमवलम्ब्य कलिन्दजायाः\nकूले विलासमुरली क्वणयन्मुकुन्दः\nप्राक् पूरणात् कलसमम्भसि लोलयन्त्या\nवक्तुं विवर्तयति गोपकुलाङ्गनायाः।।","iast":"pṛṣṭhena nīpamavalambya kalindajāyāḥ\nkūle vilāsamuralī kvaṇayanmukundaḥ\nprāk pūraṇāt kalasamambhasi lolayantyā\nvaktuṃ vivartayati gopakulāṅganāyāḥ||","meaning":"(But Rādhā ignored the advice of Her friend and proceeded to fetch water.)\nMukunda sounds His sportive flute as He stands with His back resting on the Kadamba tree on the banks of the Yamunā.\nWhile the cowherd woman (Rādhā) rolls about Her pitcher in the river waters before filling it up.\nAnd (aroused by the sound of Kṛṣṇa's flute) She turns Her face (towards Him).","source":"Anonymous"},{"number":309,"topic":"Rādhā'S Friends Address Her","devanagari":"सख्यो ययुर्गृहमहं कलसीं वहन्ती\nपूर्णामतीवमहतीमनुलम्बितास्मि।\nएकाकिनीं स्पृशसि मां यदि नन्दसूनो\nमोक्ष्यामि जीवनमिदं सहसा पुरस्ते।।","iast":"sakhyo yayurgṛhamahaṃ kalasīṃ vahantī\npūrṇāmatīvamahatīmanulambitāsmi|\nekākinīṃ spṛśasi māṃ yadi nandasūno\nmokṣyāmi jīvanamidaṃ sahasā puraste||","meaning":"(The solitary Rādhā, Whose friends had all departed, said to Kṛṣṇa:)\n\"My sakhis have all gone home. I have been left behind as I am carrying this water-pitcher which is very large and is completely full.\nI am all alone, O son of Nanda. If You so much as touch Me, then I shall, that very moment, in Your very presence, give up My life.\"","source":"Sri Rupa Gosvami"},{"number":310,"topic":"A Sakhi Addresses Radha","devanagari":"वल्गन्त्या वनमालया तव हतं वक्षोजयोश्चन्दनं\nगण्डस्था मकरीघटा च मकरान्दोलन विध्वंसिता।\nक्लान्ता स्वैरतरङ्गकेलिभिरियं तन्वी च धूर्ते तनुः\nसत्यं जल्पसि भानुजामभि रसे मग्नाद्य हर्षादभूः।।","iast":"valgantyā vanamālayā tava hataṃ vakṣojayoścandanaṃ\ngaṇḍasthā makarīghaṭā ca makarāndolana vidhvaṃsitā|\nklāntā svairataraṅgakelibhiriyaṃ tanvī ca dhūrte tanuḥ\nsatyaṃ jalpasi bhānujāmabhi rase magnādya harṣādabhūḥ||","meaning":"(Radha returned to Her friend after Her dalliance with Krsna. Her friend alluded to the indications on Radha's person of Her having been intimate with Krsna. She addressed Her thus:)\n\"The sandalwood paste on Your breasts has been rubbed off by Your pendulating flower-garland.\nThe fish painted on Your cheeks has been washed away by the movements of the fish (in the river).\nYour slender-limbed body is exhausted by Your wanton play in the wavy waters (of the Yamuna).\nYou rightly say, O naughty One, that today You have been joyfully immersing Yourself in the waters of the Yamuna.\"","source":"Sri Rupa Gosvami"},{"number":311,"topic":"The Sakhī Addresses Candrāvalī","devanagari":"कात्यायनीकुसुमकामनया किमर्थं\nकान्तारकुक्षिकुहरं कुतुकाद् गतासि ।\nपश्य स्तनस्तवकयोस्तव कण्टकाङ्कं\nगोपः सुकण्ठ वत पश्यति जातकोपः ।।","iast":"kātyāyanīkusumakāmanayā kimarthaṃ\nkāntārakukṣikuharaṃ kutukād gatāsi |\npaśya stanastavakayostava kaṇṭakāṅkaṃ\ngopaḥ sukaṇṭha vata paśyati jātakopaḥ ||","meaning":"“Why did you, in your eagerness to gather flowers for (the worship of) the goddess Kātyāyanī, go into the deep interiors of the dreary forest?\nAlas O Sukhanthī! Look at the thorn marks on your blooming bosom, upon seeing which your husband has become angry.”","source":"Śrī Rūpa Gosvāmī"},{"number":312,"topic":"The Sakhī Addresses Candrāvalī’S Husband","devanagari":"सुभग मम प्रियसख्याः किमिव सशङ्कं मुहुर्विलोकयसि ।\nयामुनपवनविकीर्णप्रियकरजःपिञ्जरं पृष्ठम् ।।","iast":"subhaga mama priyasakhyāḥ kimiva saśaṅkaṃ muhurvilokayasi |\nyāmunapavanavikīrṇapriyakarajaḥpiñjaraṃ pṛṣṭham ||","meaning":"“O blessed one! Why do you look at my dear friend's back with suspicion, again and again?\nIt is the pollen of the flowers of the Kadamba trees, scattered by the breeze blowing along the banks of the Yamunā, that caused my friend's back to turn yellow.\"","source":"Śrī Rūpa Gosvāmī"},{"number":313,"topic":"Rādhā'S Sakhī Speaks Of Lord Hari'S Imminent Departure To Mathurā, His Departure Being Part Of His Manifest Līlā","devanagari":"अद्यैव यत् प्रतिपदुद्गतचन्द्रलेखा-\nसख्यं त्वया वपुरिदं गमितं वराक्याः ।\nकृष्णे गते कुसुमसायक तत् प्रभाते\nबाणावलिं कथय कुत्र विमोक्ष्यसि त्वम् ।।","iast":"adyaiva yat pratipadudgatacandralekhā-\nsakhyaṃ tvayā vapuridaṃ gamitaṃ varākyāḥ |\nkṛṣṇe gate kusumasāyaka tat prabhāte\nbāṇāvaliṃ kathaya kutra vimokṣyasi tvam ||","meaning":"(Rādhā's sakhi addresses Cupid:)\n\"You have today rendered the body of the woeful Rādhā as lean as the crescent of the new moon.\nTell me, O one who discharges arrows of flowers! After Krsna departs (for Mathura) at daybreak, where* will you shower your myriad arrows?\"","source":"Sri Rudra"},{"number":314,"topic":"The Utterances Of Sri Radha","devanagari":"प्रस्थानं वलयैः कृतं प्रियसखैरस्रैरजस्रं गतं\nधृत्या न क्षणमासितं व्यवसितं चित्तेन गन्तुं पुरः।\nगन्तुं निश्चितचेतसि प्रियतमे सर्वे समं प्रस्थिता\nगन्तव्ये सति जीवित प्रियसुहृत्सार्थः किमु त्यज्यते।।","iast":"prasthānaṃ valayaiḥ kṛtaṃ priyasakhairasrairajasraṃ gataṃ\ndhṛtyā na kṣaṇamāsitaṃ vyavasitaṃ cittena gantuṃ puraḥ|\ngantuṃ niścitacetasi priyatame sarve samaṃ prasthitā\ngantavye sati jīvita priyasuhṛtsārthaḥ kimu tyajyate||","meaning":"(While lamenting Krsna's departure, Radha addresses Her own soul thus:)\n\"My bracelets have departed*,\nMy tears, who are my dear friends, are flowing ceaselessly.\nMy fortitude did not stay with Me for even a moment,\nAnd My heart resolved to leave ahead of My beloved.\nNo sooner had My beloved decided to leave, did all of them depart along with Him.\nO My soul! If you are to go as well, then why are you leaving behind this group of your dear friends**?","source":"Śrī Amaru"},{"number":315,"topic":"Lord Hari Enters Mathurā","devanagari":"छायापि लोचनपथं न जगाम यस्याः\nसेयं वधूनगरमध्यमलङ्करोति ।\nकिं चाकलव्य मथुरा नगरे मुकुन्द-\nमन्धोऽपि बन्धुकरदत्तः प्रयाति ।।","iast":"chāyāpi locanapathaṃ na jagāma yasyāḥ\nseyaṃ vadhūnagaramadhyamalaṅkaroti |\nkiṃ cākalavya mathurā nagare mukunda-\nmandho’pi bandhukaradattaḥ prayāti ||","meaning":"Upon coming to know of Mukunda's arrival in the city of Mathurā,\nA noble lady, whose shadow even had never been seen (outside her home), comes to grace the very heart of Mathurā city.\nAnd even a blind person, with the helping hand of a friend, ventures out (to meet the Lord).","source":"Śrī Vāṇīvilāsa"},{"number":316,"topic":"Expressions Of The Women Of Mathurā","devanagari":"अस्त्रमजस्रं मोक्तुं धिङ् नः कर्णायते नयने ।\nद्रष्टव्यं परिदृष्टं तत्कैशोरं व्रजस्त्रीभिः ।।","iast":"astramajasraṃ moktuṃ dhiṅ naḥ karṇāyate nayane |\ndraṣṭavyaṃ paridṛṣṭaṃ tatkaiśoraṃ vrajastrībhiḥ ||","meaning":"“Our eyes (are so large that they) reach up to our ears.\nBut they are damned as they serve only to incessantly shed tears.\nMost worthy of beholding is the adolescent form of the Lord,\nAnd which has been witnessed by the (eyes of the) damsels of Vraja.\n(Blest are the eyes of the damsels of Vraja.)”","source":"Śrī Tairabhukta Kavi"},{"number":317,"topic":"Expressions Of The Women Of Mathurā","devanagari":"सान्द्रानन्दमनन्तभव्यमजं यद् योगिनोऽपि क्षणं\nसाक्षात्कर्तुमुपासते प्रतिदिनं ध्यनै कतानाः परम् ।\nधन्यास्ता व्रजवासिनां युवतयस्तद् ब्रह्म याः कौतुका-\nदालिङ्गन्ति समालपन्ति शतधाकर्षन्ति चुम्बन्ति च ।।","iast":"sāndrānandamanantabhavyamajaṃ yad yogino’pi kṣaṇaṃ\nsākṣātkartumupāsate pratidinaṃ dhyanai katānāḥ param |\ndhanyāstā vrajavāsināṃ yuvatayastad brahma yāḥ kautukā-\ndāliṅganti samālapanti śatadhākarṣanti cumbanti ca ||","meaning":"“The Supreme Brahman (that is none other than Lord Kṛṣṇa)\nis of the nature of ceaseless bliss, is infinite, is imperishable and is\nunborn.\nTo behold the Supreme Brahman, even for only a moment, do yogis, day after day, engage in meditation with single minded devotion.\nBlessed among the residents of Vraja are the young maidens who playfully embrace the Supreme Brahman, converse with Him on a hundred topics, wrestle with Him in playful frolic and kiss Him as well.","source":"Śrī Vāhinīpati"},{"number":318,"topic":"Expressions Of The Women Of Mathurā","devanagari":"प्रियसखि न जगाम वामशीलः\nस्फुटममुना नगरेण नन्दसूनुः ।\nअदलितनलिनिदलैव वापी\nयदहतपल्लव एव काननान्तः ।।","iast":"priyasakhi na jagāma vāmaśīlaḥ\nsphuṭamamunā nagareṇa nandasūnuḥ |\nadalitanalinidalaiva vāpī\nyadahatapallava eva kānanāntaḥ ||","meaning":"“My dear friend!\nThe charming son of Nanda has not been through this city.\nFor, unplucked* are the clusters of lotus flowers in the pond and unbroken are the twigs in the forest grove.”","source":"Śrī Kumāra"},{"number":319,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"सख्यः पश्यत जीवितप्रणयिनी दम्भादहं रोदिमि ।।","iast":"sakhyaḥ paśyata jīvitapraṇayinī dambhādahaṃ rodimi ||","meaning":"(After Kṛṣṇa's departure Rādhā said to Her friends:)\n\" 'I am leaving', so said My beloved as He was ready to depart, and I heard His words with complacent indifference.\nEven after He had gone far away, He would repeatedly turn around to look at Me, and yet I disregarded Him.\nI have now returned to this empty house and My soul still rests in My body.\nLook at Me, O sakhis! I, Who am so attached to My life, weep out of hypocrisy*.\"","source":"Śrī Rudra"},{"number":320,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"गतो यामो गतौ यामौ गता यामा गतं दिनम् ।\nहा हन्त किं करिष्यामि न पश्यामि हरेर्मुखम् ।।","iast":"gato yāmo gatau yāmau gatā yāmā gataṃ dinam |\nhā hanta kiṃ kariṣyāmi na paśyāmi harermukham ||","meaning":"\"Oh! One yāma* has passed!\nNow two yāmas have passed!\nAnd now three yāmas have passed!\nAnd finally the whole day has gone by!\nAlas! What shall I do? I have not yet seen the face of My beloved Hari.\"","source":"Śrī Śaṅkara"},{"number":321,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"यमुनापुलिने समुत्क्षिपन्\nनटवेश: कुसुमस्य कन्दुकम् ।\nन पुन: सखि लोकियिष्यते\nकपटाभीरकिशोरचन्द्रमा: ।।","iast":"yamunāpuline samutkṣipan\nnaṭaveśa: kusumasya kandukam |\nna puna: sakhi lokiyiṣyate\nkapaṭābhīrakiśoracandramā: ||","meaning":"(Rādhā tells Her friend:)\n\"O sakhi! Will I behold once again the moon-like visage of the deceitful cowherd boy, Who, on the banks of the Yamunā, in the guise of a juggler, tosses about a ball made of flowers?\"","source":"Śrī Saṣṭhidāsa"},{"number":322,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"या: पश्यन्ति प्रियं स्वप्ने धन्यास्ता: सखि योषित: ।\nअस्माकं तु गते कृष्णे गता निद्रापि वैरिणी ।।","iast":"yā: paśyanti priyaṃ svapne dhanyāstā: sakhi yoṣita: |\nasmākaṃ tu gate kṛṣṇe gatā nidrāpi vairiṇī ||","meaning":"\"O sakhi! Blessed are those maidens who see their beloved in their dreams.\nAs for Me, upon Kṛṣṇa’s departure, My wretched sleep has departed as well.\"","source":"Śrī Dhanya"},{"number":323,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"सोऽयं वसन्तसमयो विपिनं तदेतत्\nसोऽयं निकुञ्जविटपी निखिलं तदास्ते।\nहा हन्त किं तु नवनीरदकोमलाङ्गो\nनालोकि पुष्पधनुषः प्रथमावतारः।।","iast":"so’yaṃ vasantasamayo vipinaṃ tadetat\nso’yaṃ nikuñjaviṭapī nikhilaṃ tadāste|\nhā hanta kiṃ tu navanīradakomalāṅgo\nnāloki puṣpadhanuṣaḥ prathamāvatāraḥ||","meaning":"\"This is the spring time, this is the same forest and, enclosed by creepers, this is the same grove of trees. All of them are present here.\nBut alas! I do not see that foremost incarnation of Cupid*, Whose tender limbs are of the hue of a fresh rain cloud.\"","source":"Śrī Sañjaya Kaviśekhara"},{"number":324,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"युगायितं निमेषेण चक्षुषा प्रावृषायितम्।\nशून्यायितं जगत्यापि गोविन्दविरहेण मे।।","iast":"yugāyitaṃ nimeṣeṇa cakṣuṣā prāvṛṣāyitam|\nśūnyāyitaṃ jagatyāpi govindaviraheṇa me||","meaning":"\"Separation from Govinda makes for Me a moment as endless as an age,\nMakes My eyes shed tears like torrents of rain,\nAnd makes the whole world for Me a dreary void.\"","source":"Lord Caitanya"},{"number":325,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"प्रहरति विधिर्मर्मच्छेदी न कृन्तति जीवितम् ।।","iast":"praharati vidhirmarmacchedī na kṛntati jīvitam ||","meaning":"“My intense distress tears My heart, and yet My heart does not split into two halves (and thus end My life).\nMy languid body is swooning and yet it does not lose consciousness.\nThe fire of agony within Me scorches My body, but does not reduce Me to ashes.\nFate, which pierces the very core of My being, assaults Me, but does not relieve Me of My life.”","source":"Śrī Bhavabhūti"},{"number":326,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"भ्रमय जलदानम्भोगर्भान् प्रमोदय चातकान्\nकलय शिखिनः केकोत्कण्ठान् कठोरय केतकान् ।\nविरहिणि जने मूच्छर्छां लब्ध्वा विनोदयति व्यथा-\nमकरुण पुनः संज्ञाव्याधिं विधाय किमीहसे ।।","iast":"bhramaya jaladānambhogarbhān pramodaya cātakān\nkalaya śikhinaḥ kekotkaṇṭhān kaṭhoraya ketakān |\nvirahiṇi jane mūccharchāṃ labdhvā vinodayati vyathā-\nmakaruṇa punaḥ saṃjñāvyādhiṃ vidhāya kimīhase ||","meaning":"“(O Kṛṣṇa, if You will,)\nWhirl about the water-bearing clouds (in the sky),\nDelight the Cātaka birds,\nImpel the exited peacocks to cry out,\nAnd render the Ketaka flowers hard and stiff.\nBut O pitiless One!\nWhat is Your intent in inflicting the malaise of consciousness upon a lover Who, by chancing upon a spell of fainting, relieves Her* pain of separation from Her beloved?”","source":"Śrī Bhavabhūti"},{"number":327,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"दृष्टं केतकधूलिधूसरमिदं व्योम क्रमाद्वीक्षिता:\nकच्छान्ताश्च शिलीन्ध्रकन्दलभृत: सोढा: कदम्बानिला: ।\nसख्य: संवृणुताश्रु मुञ्चत भयं कस्मान्मुधैवाकुला\nएतानप्यधुनास्मि वज्रघटिता नूनं सहिष्ये घनान् ।।","iast":"dṛṣṭaṃ ketakadhūlidhūsaramidaṃ vyoma kramādvīkṣitā:\nkacchāntāśca śilīndhrakandalabhṛta: soḍhā: kadambānilā: |\nsakhya: saṃvṛṇutāśru muñcata bhayaṃ kasmānmudhaivākulā\netānapyadhunāsmi vajraghaṭitā nūnaṃ sahiṣye ghanān ||","meaning":"(Rādhā's friends were concerned that She would get wet in the rain. Rādhā assures Her friends thus:)\n\"I have seen the sky dusky with the pollen of Ketaka flowers.\nI have also had a view of the river-bank which resounds with the sound of fish,\nAnd I have endured the wind coming from the Kadamba trees.\nO sakhis! Restrain your tears and let go of your fear.\nWhy do you worry (for Me) for no reason?\nI was created out of a thunderbolt and can now surely endure these rain clouds.\"","source":"Śrī Rudra"},{"number":328,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"सेयं नदी कुमुदबन्धुकरास्त एव\nतद् यामुनं तटमिदं विपिनं तदेतत् ।\nते मल्लिकासुरभयो मरुतस्त्वमेव\nहा प्राणवल्लभ सुदुर्लभतां गतोऽसि ।।","iast":"seyaṃ nadī kumudabandhukarāsta eva\ntad yāmunaṃ taṭamidaṃ vipinaṃ tadetat |\nte mallikāsurabhayo marutastvameva\nhā prāṇavallabha sudurlabhatāṃ gato’si ||","meaning":"(Rādhā cries out to Kṛṣṇa thus:)\n\"This is the same river.\nThese are the same rays of the moon,\nThis is the same bank of the Yamunā,\nThis is the same forest grove.\nAnd this is the same breeze infused with the fragrance of Mallika flowers.\nBut alas! O beloved of My soul! (While all else is the same) You have become so very elusive.\"","source":"Śrī Hari Bhatta"},{"number":329,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"यदुनाथ भवन्तमागतं\nकथयिष्यन्ति कदा मदालयः।\nयुगपत् परितः प्रधाविता\nविकसद्वर्दनदेन्दुमण्डलैः।।","iast":"yadunātha bhavantamāgataṃ\nkathayiṣyanti kadā madālayaḥ|\nyugapat paritaḥ pradhāvitā\nvikasadvardanadendumaṇḍalaiḥ||","meaning":"\"O king of the Yadu clan!\nWhen will My friends come running to My house from all sides and all at the same time,\nAnd announce Your arrival by their blooming faces; faces blooming like the disk of the moon?\"","source":"Śrī Tairabhukta Kavi"},{"number":330,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"हृदयं त्वदलोककातरं\nदयित भ्राम्यति किं करोम्यहम् ।।","iast":"hṛdayaṃ tvadalokakātaraṃ\ndayita bhrāmyati kiṃ karomyaham ||","meaning":"\"O Lord Who abounds in compassion for the distressed!\nO king of Mathurā! When will You behold Me?\nMy beloved! My heart, that grieves Your absence from My sight, is fluttering.\nOh! What shall I do?\"","source":"Śrī Mādhavendra Purī"},{"number":331,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"प्रथयति न तथा ममार्तिमुच्चैः\nसहचरि वल्लवचन्द्रविप्रयोगः।\nकटुभिरसुरमण्डलैः परीते\nदनुजपतेर्नगरे यथास्य वासः।।","iast":"prathayati na tathā mamārtimuccaiḥ\nsahacari vallavacandraviprayogaḥ|\nkaṭubhirasuramaṇḍalaiḥ parīte\ndanujapaternagare yathāsya vāsaḥ||","meaning":"\"O friend! My separation from the cowherd chief (Kṛṣṇa) does not so greatly aggravate My distress, as does His stay in the city of the demon-king (Kamsa) which is infested with hosts of ferocious demons.\"","source":"Śrī Raghunāthadāsa"},{"number":332,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"चूताङ्कुरे स्फुरति हन्त नवे नवेऽस्मिन्\nजीवोऽपि यास्यतितरां तरलस्वभावः।\nकिं त्वेकमेव मम दुःखमभूदनल्पं\nप्राणेश्वरेण सहितो यदयं न यातः।।","iast":"cūtāṅkure sphurati hanta nave nave’smin\njīvo’pi yāsyatitarāṃ taralasvabhāvaḥ|\nkiṃ tvekameva mama duḥkhamabhūdanalpaṃ\nprāṇeśvareṇa sahito yadayaṃ na yātaḥ||","meaning":"\"Alas! With the sprouting forth of these tender mango shoots, shall My life, precarious of nature, most certainly depart (from My body).\nBut this one great regret has come upon Me -- that why did My life not depart along with the master of My soul (when He left for Mathurā)?\"","source":"Śrī Rāṅga"},{"number":333,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"आशैकतन्तुमवलम्ब्य विलम्बमाना\nरक्षामि जीवमवधिनियतो यदि स्यात्।\nनो चेद्विधिः सकललोकहितैककारी\nयत् कालकूटमसृजत्तदिदं किमर्थम्।।","iast":"āśaikatantumavalambya vilambamānā\nrakṣāmi jīvamavadhiniyato yadi syāt|\nno cedvidhiḥ sakalalokahitaikakārī\nyat kālakūṭamasṛjattadidaṃ kimartham||","meaning":"\"I shall preserve My life by taking refuge in the one thread of hope that this period of time (of waiting for My beloved), which is so very long, shall have its limit.\nIf this is not to be, then to what purpose has our Creator, who is the one benefactor of the whole world, created Kālakūṭam* ?\"","source":"Śrī Hari"},{"number":334,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"हृदयमधुना किञ्चित् कर्तुं ममान्यदिहेच्छति।।","iast":"hṛdayamadhunā kiñcit kartuṃ mamānyadihecchati||","meaning":"\"O winter season! May you spread the fragrance of jasmine flowers.\nO wind! May you blow as you will.\nO moon! May you illuminate all the directions.\nO Cupid! May you rejoice to your heart's content.\nO friends! This day, which was to end the period of absence (of My beloved), is over. (And He has not yet come.) So cease to speak of Him.\nOver here, at this moment, does My heart desire to do something else*.\"","source":"Śrī Rudra"},{"number":335,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"नायाति चेद् यदुपतिः सखि नैतु कामं\nप्राणास्तदीयविरहाद् यदि यान्ति यान्तु।\nएकः परं हृदि महान् मम वज्रपातो\nभूयो यदिन्दुवदनं न विलोकितं तत्।।","iast":"nāyāti ced yadupatiḥ sakhi naitu kāmaṃ\nprāṇāstadīyavirahād yadi yānti yāntu|\nekaḥ paraṃ hṛdi mahān mama vajrapāto\nbhūyo yadinduvadanaṃ na vilokitaṃ tat||","meaning":"\"If the chief of the Yadu clan does not come, O sakhi, then let Him not come if that be His desire.\nAnd if (the pain of) My separation from Him causes My soul to depart (from My body) then let it go.\nOnly one great thunderbolt strikes My heart: if I do not see His moon-like face again.\"\nBut the one supreme and mighty thunderbolt that has struck My heart is (the calamity) that I did not, for one more time, look upon that moon-like visage (of My beloved Kṛṣṇa).”","source":"Śrī Hari Bhaṭṭa"},{"number":336,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"पंचत्वं तनुरेतु भूतनिवहाः स्वांशे विशन्तु स्फुटं\nधातारं प्रणिपत्य हन्त शिरसा तत्रापि याचे वरम् ।\nतद्वापीषु पयस्तदीयमुकुरे ज्योतिस्तदीयाङ्गन-\nव्योम्नि व्योम तदीयवर्त्मनि धरा तत्तालवृन्तेऽनिलः ।।","iast":"paṃcatvaṃ tanuretu bhūtanivahāḥ svāṃśe viśantu sphuṭaṃ\ndhātāraṃ praṇipatya hanta śirasā tatrāpi yāce varam |\ntadvāpīṣu payastadīyamukure jyotistadīyāṅgana-\nvyomni vyoma tadīyavartmani dharā tattālavṛnte’nilaḥ ||","meaning":"“May My body attain death and may the assemblage of the five elements (constituting My body) enter into their respective primordial states.\nYet do I bow My head to our Maker and beseech Him for the benediction that (upon the dissolution of My body) may –\nMy water element merge with the water of His (Kṛṣṇa’s) bathing tub,\nMy light (fire element) merge into His mirror,\nMy space element merge with the space of His courtyard,\nMy earth element merge into (the earth on) His walking path,\nAnd that My air element merge into His hand-fan.”","source":"Śrī Ṣāṇmāṣika"},{"number":337,"topic":"Rādhā'S Lamentation (At Krsna'S Departure)","devanagari":"मत्प्राणनाथस्तु स एव नापरः।।","iast":"matprāṇanāthastu sa eva nāparaḥ||","meaning":"“May He embrace Me Who am devoted to His feet,\nOr may He trample upon Me,\nOr may He tear My heart by going out of My sight.\nIn whatever manner may that philanderer treat Me,\nHe shall be the lord of My soul,\nAnd there shall be none other than He.","source":"Lord Caitanya"},{"number":338,"topic":"When In Mathurā, Kṛṣṇa Reminisces About His Mother Yaśodā","devanagari":"ताम्बूलं स्वमुखार्धचर्वितमितः को मे मुखे निक्षिपे-\nदुन्मार्गप्रसृतं च चाटुवचनैः को मां वशे स्थापयेत्।\nएह्येहीति विदूरसारितभुजः स्वाङ्के निधायाधुना\nकेलिस्त्रस्तशिखण्डकं मम पुनर्व्याधूय बध्नातु कः।।","iast":"tāmbūlaṃ svamukhārdhacarvitamitaḥ ko me mukhe nikṣipe-\ndunmārgaprasṛtaṃ ca cāṭuvacanaiḥ ko māṃ vaśe sthāpayet|\nehyehīti vidūrasāritabhujaḥ svāṅke nidhāyādhunā\nkelistrastaśikhaṇḍakaṃ mama punarvyādhūya badhnātu kaḥ||","meaning":"“Who will smear My face with the half-chewed tāmbūla* from her mouth?\nAnd when I go astray (in My naughty pranks), who will bring Me under control with her sweet words?\n'Come! Come!' Beckoning Me thus, who will stretch out her arms from far and place Me on her lap now? And having done so, remove My crest of peacock feathers that would slip down during play and tie it up once again?\"","source":"Śrī Tairabhukta Kavi"},{"number":339,"topic":"Lord Hari Reminisces About Rādhā","devanagari":"यदि निभृतमरण्यं प्रान्तरं वाप्यपान्थं\nकथमपि चिरकालं पुण्यपाकेन लप्स्ये ।\nअविरलगलदश्रुर्घर्ध्वानमिश्रैः\nशशिमुखि तव शोकः प्लावयिष्ये जगन्ति ।।","iast":"yadi nibhṛtamaraṇyaṃ prāntaraṃ vāpyapānthaṃ\nkathamapi cirakālaṃ puṇyapākena lapsye |\naviralagaladaśrurghardhvānamiśraiḥ\nśaśimukhi tava śokaḥ plāvayiṣye jaganti ||","meaning":"\"O moon-faced One!\nIf, as a fruition of My pious merits, I were to somehow, for a long time to come, find Myself in an obscure and forsaken forest, or on a lonely and desolate pathway,\nThen shall I inundate the whole world with My incessantly flowing tears, tears that resound with the grief of separation from You.\"","source":"Śrī Tairabhukta Kavi"},{"number":340,"topic":"Lord Hari Addresses Uddhava","devanagari":"विषयेषु तावदबलास्तास्वपि गोप्यः स्वभावमृदुवाचः ।\nमध्ये तासामपि सा तस्यामपि साचीवीक्षितं किमपि ।।","iast":"viṣayeṣu tāvadabalāstāsvapi gopyaḥ svabhāvamṛduvācaḥ |\nmadhye tāsāmapi sā tasyāmapi sācīvīkṣitaṃ kimapi ||","meaning":"\"Blessed among all the objects of My love are the womenfolk (of Vraja).\nAnd the best among them are the gopīs who are sweet speaking by nature.\nBut most beloved among even the gopīs is She (Rādhā),\nAnd She is dearest when She gives Me sidelong glances.\"","source":"Anonymous"},{"number":341,"topic":"Uddhava Conveys Lord Hari'S Message To Rādhā","devanagari":"आविर्भावदिने न येन गणितो हेतुस्तनीयानपि\nक्षीयतेापि न चापराधविधिना नत्या न यो वर्धते ।\nपीयूषप्रतिवेदनस्त्रिजगतीदु:खद्रुह: साम्प्रतं\nप्रेम्णस्तस्य गुरो: कथं नु करवै वाङ्निष्ठतालाघवम् ।।","iast":"āvirbhāvadine na yena gaṇito hetustanīyānapi\nkṣīyateāpi na cāparādhavidhinā natyā na yo vardhate |\npīyūṣaprativedanastrijagatīdu:khadruha: sāmprataṃ\npremṇastasya guro: kathaṃ nu karavai vāṅniṣṭhatālāghavam ||","meaning":"\"On the day of its advent, the love between Us, was not in the least contingent upon any (extraneous) cause.\nThat love shall not wane upon Our offences to each other, nor will it increase by Our mutual entreaties.\nOur love is but the relish of the nectar of immortality that destroys the woes of the three worlds.\nAnd now, how can I render trivial the glory of that love by expressing it in speech?\"","source":"Anonymous"},{"number":342,"topic":"Uddhava Conveys Lord Hari'S Message To Rādhā","devanagari":"आस्तां तावद्वचनरचनाभाजनत्वं विदूर\nदूरे चास्तां तव तनुपरीरम्भसम्भावनापि।\nभूयो भूयः प्रणतिभिरिदं किं तु याचे विधेया\nस्मारं स्मारं स्वजनगणने कापि रेखा ममापि।।","iast":"āstāṃ tāvadvacanaracanābhājanatvaṃ vidūra\ndūre cāstāṃ tava tanuparīrambhasambhāvanāpi|\nbhūyo bhūyaḥ praṇatibhiridaṃ kiṃ tu yāce vidheyā\nsmāraṃ smāraṃ svajanagaṇane kāpi rekhā mamāpi||","meaning":"\"May those attributes that render Me worthy of speaking to You be far from Me,\nAnd may the prospect of embracing Your body also elude Me.\nEven then do I, while bowing before You again and again, implore You that when You count Your dear ones, (pray) think of Me over and over again and carve* a line for Me as well.\"","source":"Śrī Keśava Bhaṭṭācārya"},{"number":343,"topic":"Uddhava'S Utterances As He Was Going To Vrndāvana","devanagari":"इयं सा कालिन्दी कुवलयदल्सनिग्धमधुरा\nमदान्धव्याकूजत्तरलजललङ्कुप्रणयिनी ।\nपुरा यस्यास्तीरे सरभससतृष्णं मुरभिदो\nगताः प्रायो गोपीनिधुवनविनोदेन दिवसाः।।","iast":"iyaṃ sā kālindī kuvalayadalsanigdhamadhurā\nmadāndhavyākūjattaralajalalaṅkupraṇayinī |\npurā yasyāstīre sarabhasasatṛṣṇaṃ murabhido\ngatāḥ prāyo gopīnidhuvanavinodena divasāḥ||","meaning":"\"'This is the same sweet and charming Yamunā river who* abounds with clusters of blue lotuses,\nIn whom playful water creatures, being overwhelmed with delight, cry out affectionately.\nAnd on whose shores, a long time ago, did (Kṛṣṇa) the slayer of the demon Mura, possessed of desire and passion, spend most of His days in delighting Himself in erotic sports with the gopis.'\"","source":"Śrī Dasaratha"},{"number":344,"topic":"Uddhava'S Utterances As He Was Going To Vrndāvana","devanagari":"पुरेयं कालिन्दी व्रजजनवधूनां स्तनतटी-\nतनूरागैर्भिन्ना शबलसलिलाभूदनुदिनम् ।\nअहो तासां नित्यं रुदितगलितैः कज्जलजलै-\nरिदानीं यातेऽस्मिन् द्विगुमलनाभून्मुररिपौ।।","iast":"pureyaṃ kālindī vrajajanavadhūnāṃ stanataṭī-\ntanūrāgairbhinnā śabalasalilābhūdanudinam |\naho tāsāṃ nityaṃ ruditagalitaiḥ kajjalajalai-\nridānīṃ yāte’smin dvigumalanābhūnmuraripau||","meaning":"\"Each day in the past, did the waters of the Yamunā become variously hued as they were blended with the colourful anointments on the breasts and bodies of the maidens of Vraja.\nBut alas! The waters have now become twice as murky due to flowing in of the maidens' tears mixed with kajjala*, for they have been weeping everyday since the departure of Murāri.\"","source":"Śrī Sarvānanda"},{"number":345,"topic":"Uddhava'S Utterances As He Was Going To Vrndāvana","devanagari":"इदं तत् कालिन्दीपुलिनमिह कंसासुरभिदो\nयशः शृण्वद् वक्त्रस्खलितकवलं गोकुलमभूत् ।\nभ्रमद्वेणुक्वाणश्रवणमसूणोत्तरमधुर-\nस्वराभिर्गोपीभिर्दिशि दिशि समुद्रूर्णमनिशम् ।।","iast":"idaṃ tat kālindīpulinamiha kaṃsāsurabhido\nyaśaḥ śṛṇvad vaktraskhalitakavalaṃ gokulamabhūt |\nbhramadveṇukvāṇaśravaṇamasūṇottaramadhura-\nsvarābhirgopībhirdiśi diśi samudrūrṇamaniśam ||","meaning":"\"This is the same bank of the Yamunā,\nWhere fodder dropped out of the mouths of the (enthralled) herd of cows as they were hearing (narrations of) the glories of the slayer of the demon Kamsa,\nAnd where the gopis, whose speech is so charming and so exceedingly sweet, upon hearing the roving* sound of the flute (of Krsna), began to search relentlessly in every direction (for the source of the sound).\"","source":"Śrī Motaka"},{"number":346,"topic":"Uddhava'S Utterances As He Was Going To Vrndāvana","devanagari":"वक्ष:स्थले निःश्वसितै: कदुष्णै-\nर्लक्ष्मीपतेम्लायति वैजयन्ती ।।","iast":"vakṣa:sthale niḥśvasitai: kaduṣṇai-\nrlakṣmīpatemlāyati vaijayantī ||","meaning":"“As the husband of Goddess Lakṣmī ruminates upon the virtues of the gopis, His warm breaths cause the Vaijantī* garland of flowers on His chest to wither.\nTo those gopis do I offer My salutations.”","source":"Anonymous"},{"number":347,"topic":"Uddhava Addresses The Gopīs Of Vraja","devanagari":"वियोगिनीनामपि पद्धतिं वो\nन योगिनो गन्तुमपि क्षमन्ते।\nयद् ध्येयरूपस्य परस्य पुंसो\nयूयं गता ध्येयपदं दुरापम्।।","iast":"viyoginīnāmapi paddhatiṃ vo\nna yogino gantumapi kṣamante|\nyad dhyeyarūpasya parasya puṃso\nyūyaṃ gatā dhyeyapadaṃ durāpam||","meaning":"“Your mode of devotion, wherein you pine for your beloved (Kṛṣṇa) when in separation from Him, cannot be attained even by yogis.\nYou have attained that state of devotion to the worshipable form of the Supreme Person; a state of devotion that is worthy of veneration and is elusive as well.”","source":"Anonymous"},{"number":348,"topic":"Upon Seeing Uddhava, Rādhā Speaks To Her Friend","devanagari":"कल्याणं कथयामि किं सहचरि स्वैरेषु शश्वत् पुरा\nयस्या नाम समीरितं मुररिपोः प्राणेश्वरीति त्वया।\nसाहं प्रेमभिदाभयात् प्रियतमं दृष्ट्वापि दूतं प्रभोः\nसन्दिष्टास्मि न वेति संशयवती पृच्छामि नो किञ्चन।।","iast":"kalyāṇaṃ kathayāmi kiṃ sahacari svaireṣu śaśvat purā\nyasyā nāma samīritaṃ muraripoḥ prāṇeśvarīti tvayā|\nsāhaṃ premabhidābhayāt priyatamaṃ dṛṣṭvāpi dūtaṃ prabhoḥ\nsandiṣṭāsmi na veti saṃśayavatī pṛcchāmi no kiñcana||","meaning":"\"O friend! What can I say about My well being?\nDuring our casual conversations in the past, you would repeatedly\nutter My name and speak of Me as 'the Mistress of Murāri's heart'.\n(And now) I, the very same person you spoke of, am anxious about\nwhether or not I have been sent any message (from Murāri).\nThus, for fear of losing out in love, do I, even upon seeing\n(Uddhava) the dearest messenger of My Lord, ask for nothing*.\"","source":"Śrī Rāmacandradāsa"},{"number":349,"topic":"Uddhava Addresses Rādhā","devanagari":"मलिनं नयनाञ्नाम्बुभि-\nर्मुखचन्द्रं करभोरु मा कुरु।\nकरुणावरुणालयो हरि-\nस्त्वयि भूयः करुणां विधास्यति।।","iast":"malinaṃ nayanāñnāmbubhi-\nrmukhacandraṃ karabhoru mā kuru|\nkaruṇāvaruṇālayo hari-\nstvayi bhūyaḥ karuṇāṃ vidhāsyati||","meaning":"\"O Karabhorū*! Do not besmear Your moon like visage with tears charged with añjana**.\nFor Lord Hari, Who is but the ocean of compassion, shall once again bestow His grace upon You.\"","source":"Śrī Sasthidāsa"},{"number":350,"topic":"Rādhā'S Sakhī Addresses Uddhava","devanagari":"हस्तোদरे विनिहितैककपोलपाले-\nरश्रान्तलोचनजलस्नापितानायाः।\nप्रस्थानमङ्गलदिनावधि माधवस्य\nनिद्रालवोऽपि कुत एव सरोरुहाक्ष्याः।।","iast":"hastaোদre vinihitaikakapolapāle-\nraśrāntalocanajalasnāpitānāyāḥ|\nprasthānamaṅgaladināvadhi mādhavasya\nnidrālavo’pi kuta eva saroruhākṣyāḥ||","meaning":"(In describing Rādhā's miserable state to Uddhava, the sakhi says:)\n\"Ever since that providential day on which Murāri departed,\nShe has been simply sitting with Her cheek resting on the palm of Her hand,\nAnd has been bathing Her face with the tears flowing from Her weary eyes.\nSo how could the lotus-eyed One possibly have had even a wink of sleep?\"","source":"Śrī Harihara"},{"number":351,"topic":"Rādhā'S Sakhī Addresses Uddhava","devanagari":"निश्चन्दनानि वणिजामपि मन्दिराणि\nनिष्पल्लवानि च दिगन्तरकाननानि ।\nनिष्पङ्कजान्यपि सरित्सरसीकुलानि\nजातानि तद्विरहवेदनया न शान्तम् ।।","iast":"niścandanāni vaṇijāmapi mandirāṇi\nniṣpallavāni ca digantarakānanāni |\nniṣpaṅkajānyapi saritsarasīkulāni\njātāni tadvirahavedanayā na śāntam ||","meaning":"\"There is no sandalwood left, not even in the homes of merchants,\nThere are no more tender shoots in the forests in all the directions,\nAnd there are no more lotuses in all the rivers and lakes.\nAnd yet Her agony of separation from Her beloved does not subside.\"","source":"Śrī Harihara"},{"number":352,"topic":"Rādhā'S Sakhī Addresses Uddhava","devanagari":"प्राणस्त्वं जगतां हरेरपि पुरा सङ्केतवेणुस्वना-\nनादाय व्रजसुभ्रुवामिह भवान् मार्गोपदेशे गुरुः।\nहं हो माधुररनिष्ठुतानिल सखे सम्प्रत्यपि श्रीपते-\nरङ्गस्पर्शपवित्रशीतलतनुस्त्राता त्वमेकोऽसि नः।।","iast":"prāṇastvaṃ jagatāṃ harerapi purā saṅketaveṇusvanā-\nnādāya vrajasubhruvāmiha bhavān mārgopadeśe guruḥ|\nhaṃ ho mādhuraraniṣṭhutānila sakhe sampratyapi śrīpate-\nraṅgasparśapavitraśītalatanustrātā tvameko’si naḥ||","meaning":"(The sakhi addresses the wind thus:)\n\"You are the life-force of the universe!\nAs in the past, you carry the suggestive melodies of Lord Hari's flute to the lovely-browed maidens of Vraja and thus are the guru who guides them on their path (of devotion to the Lord).\nO friend! O wind who flows through the forest groves of Mathurā!\nBy virtue of touching the limbs of Śrīpati (Kṛṣṇa), you are the embodiment of purity and of tranquility.\nThus, at this time, you are our one and only guardian angel.\"","source":"Śrī Rāmacandradāsa"},{"number":353,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"तन्वा पञ्चमगीतगर्भितगिरा रात्रिन्दिवं स्थीयते।।","iast":"tanvā pañcamagītagarbhitagirā rātrindivaṃ sthīyate||","meaning":"(The sakhi describes Rādha’s state to Kṛṣṇa thus:)\n“Succumbing to a state of horripilation due to (the caress of) the gentle breeze flowing from Your land,\nGratifying Her eyes by (gazing at) the charming picture-board that bears Your form,\nNourishing Her ears by (the sound of) Your ambrosial names,\nAnd singing with Her voice charged with the ‘fifth note’, the slender-limbed One sits, night and day, on the window facing Your arrival path.”","source":"Śrī Trivikrama"},{"number":354,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"अङ्गेऽनङ्गज्जरहुतवहश्चक्षुषि ध्यानमुद्रा\nकण्ठे जीव: करकिशलये दीर्घशायी कपोल:।\nअंसे वेणी कुचपरिसरे चन्दनं वाचि मौनं\nतस्या: सर्वं स्थितमिति न च त्वां विना क्वापि चेत:।।","iast":"aṅge’naṅgajjarahutavahaścakṣuṣi dhyānamudrā\nkaṇṭhe jīva: karakiśalaye dīrghaśāyī kapola:|\naṃse veṇī kucaparisare candanaṃ vāci maunaṃ\ntasyā: sarvaṃ sthitamiti na ca tvāṃ vinā kvāpi ceta:||","meaning":"“The ‘fever of Cupid’ scorches Her body,\nHer eyes express a state of trance,\nHer vital breath chokes Her throat (in attempting to escape Her body),\nHer cheek rests for so very long on Her tender hands,\nHer (unkempt) hair fall on Her shoulders,\nHer bosom is smeared with sandal paste,\nAnd Her speech has assumed the mode of silence.\nThus is Her state. And (in such a state) She is conscious of nothing else but You.”","source":"Śrī Kṣemendra"},{"number":355,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"दृष्टे चन्द्रमसि प्रलुप्ततमसि व्योमाङ्गनस्थेयसि\nस्फूर्जन्नर्मलतेजसि त्वयि गते दूरं निजप्रेयसि ।\nश्वासः कैरवकोरकीयति मुखं तस्याः सरोजीयति\nक्षीरोदीयति मन्मथो दृगपि च द्राक् चन्द्रकान्तीयति ।।","iast":"dṛṣṭe candramasi praluptatamasi vyomāṅganastheyasi\nsphūrjannarmalatejasi tvayi gate dūraṃ nijapreyasi |\nśvāsaḥ kairavakorakīyati mukhaṃ tasyāḥ sarojīyati\nkṣīrodīyati manmatho dṛgapi ca drāk candrakāntīyati ||","meaning":"“When You, Her beloved, go far away,\nThen upon seeing the moon, the dispeller of darkness, seated in the firmament, glittering with unblemished effulgence,\nHer breaths become deep and intense as do white lotuses bloom at moonrise,\nHer countenance looses all expression in the likeness of a lotus-flower closing its petals at nightfall,\nHer emotions of love swell like a tide in the ocean of milk,\nAnd Her eyes spontaneously shed tears just as a moon-stone oozes as it dissolves under the moonlight.”","source":"Śrī Bhīmabhaṭṭa"},{"number":356,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"अस्याः सदा विरहवहिशिखाकलाप-\nतप्ते स्थितोऽसि हृदये त्वमिह प्रियायाः।\nप्रालयशकीरसम हृदि ते मुरारे\nराधा क्षणं वसति नैव कदापि धूर्त।।","iast":"asyāḥ sadā virahavahiśikhākalāpa-\ntapte sthito’si hṛdaye tvamiha priyāyāḥ|\nprālayaśakīrasama hṛdi te murāre\nrādhā kṣaṇaṃ vasati naiva kadāpi dhūrta||","meaning":"\"O Murāri! You forever reside in the heart of Your beloved which burns in the bundle of flames of the fire of agony of Her separation from You.\nBut O wicked One! Rādhā does not ever dwell, for even a moment, in Your heart which is (small and cold) like a flake of snow.\"","source":"Śrī Śankara"},{"number":357,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"अस्यास्तापमहं मुकुन्द कथयाम्येणीदृशस्ते कथं\nपद्मिन्याः सरसं दलं विनिहितं यस्याः सतापे हृदि।\nआदौ शुष्यति सङ्कुचत्यनु ततश्चूर्णत्वमापद्यते\nपश्चान्मुर्मुरतां दधद्दहति च श्वासावधूतः शिखी।।","iast":"asyāstāpamahaṃ mukunda kathayāmyeṇīdṛśaste kathaṃ\npadminyāḥ sarasaṃ dalaṃ vinihitaṃ yasyāḥ satāpe hṛdi|\nādau śuṣyati saṅkucatyanu tataścūrṇatvamāpadyate\npaścānmurmuratāṃ dadhaddahati ca śvāsāvadhūtaḥ śikhī||","meaning":"\"How can I relate to You, O Mukunda, the agony of the deer-eyed One.\nWho clasps a bunch of blooming lotuses against Her agonized heart.\nDrying up at first, the flowers wither away, and are then reduced to powder.\nAfter that they begin to crackle as they burn in the fire of agony that She releases with Her breaths.\"","source":"Śrī Śāntikara"},{"number":358,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"उद्धूयेत तनूलतेति नलिनीपत्रेण नो बीज्यते\nस्फोटः स्यादिति नाङ्ककं मलयजक्षोदाम्भसा सिच्यते ।\nस्यादस्यातिभरात् पराभव इति प्रायो न वा पल्लवा-\nरोपो वक्षसि तत् कथं कृशतनावाधिः समाधीयताम् ।।","iast":"uddhūyeta tanūlateti nalinīpatreṇa no bījyate\nsphoṭaḥ syāditi nāṅkakaṃ malayajakṣodāmbhasā sicyate |\nsyādasyātibharāt parābhava iti prāyo na vā pallavā-\nropo vakṣasi tat kathaṃ kṛśatanāvādhiḥ samādhīyatām ||","meaning":"\"We do not fan Her with lotus-leaves for Her delicate body may tremble,\nWe do not sprinkle on Her water blended with sandal-wood powder, for that may scald Her limbs,\nAnd we do not place flower buds on Her chest for their weight may be too much for Her to bear.\n(So tell us O Kṛṣṇa!) How can we relieve the anguish of the slender-bodied One?\"","source":"Śrī Ānanda"},{"number":359,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"निवसति यदि तव हृदये सा राधा वज्रघटितऽस्मिन् ।\nतत् खलु कुशलं तस्याः स्मरविशिखैस्ताड्यमानयाः ।।","iast":"nivasati yadi tava hṛdaye sā rādhā vajraghaṭita’smin |\ntat khalu kuśalaṃ tasyāḥ smaraviśikhaistāḍyamānayāḥ ||","meaning":"\"If Rādhā, Who is struck by the arrows of Cupid,\nWere to reside in Your heart which is made of a thunderbolt,\nThen blessed would She be.\"","source":"Anonymous"},{"number":360,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"इत्थं पल्लवदक्षिणानिलकुहू-कण्ठेषु साङ्केतिक-\nव्याहाराः सुभग त्वदीयविरहे राधासखीनां मिथः।।","iast":"itthaṃ pallavadakṣiṇānilakuhū-kaṇṭheṣu sāṅketika-\nvyāhārāḥ subhaga tvadīyavirahe rādhāsakhīnāṃ mithaḥ||","meaning":"\"O blessed One!\nWhile Rādhā laments Your absence. Her sakhis allude to flower buds, to the southern wind and to a cuckoo bird and speak thus to each other:\n'Pluck the sprouting ones with your nails.\nShield the draught with the skirt of your silken garment.\nFrighten it away with the sound of your bangles for it has entered the play-grove (of Rādhā and Kṛṣṇa).'\"","source":"Śrī Śambhu"},{"number":361,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"गलत्येका मूर्च्छा भवति पुनरन्या यदनयोः\nकिमप्यासीन्मध्यं सुभग निखिलायामपि निशि।\nलिखन्त्यास्तत्रास्याः कुसुमशरलेखं तव कृते\nसमाप्तं स्वस्तीति प्रथमपदभागोऽपि न गतः।।","iast":"galatyekā mūrcchā bhavati punaranyā yadanayoḥ\nkimapyāsīnmadhyaṃ subhaga nikhilāyāmapi niśi|\nlikhantyāstatrāsyāḥ kusumaśaralekhaṃ tava kṛte\nsamāptaṃ svastīti prathamapadabhāgo’pi na gataḥ||","meaning":"\"O blessed One!\n(As Rādhā pines for You) She swoons, and as soon as She awakens She swoons again.\nWhen, during the entire night, could She have had any respite between Her fainting spells?\nThen as She writes a love-letter to You, She does not complete even the first part of the word ‘svasti*.’","source":"Śrī Śacīpati"},{"number":362,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"चित्राय त्वयि चिन्तिते तनुभुवा चक्रे ततज्यं धनु-\nर्वतिं धर्तुमुपागतेऽङगुलियुगे बाणो गुणे योजितः।\nप्रारब्ध्ये तव चित्रकर्मणि धनुर्मुक्तास्त्रभिन्ना भृशं\nभित्तिं द्रागवलम्ब्य केशव चिरं सा तत्र चित्रायते।।","iast":"citrāya tvayi cintite tanubhuvā cakre tatajyaṃ dhanu-\nrvatiṃ dhartumupāgate’ṅaguliyuge bāṇo guṇe yojitaḥ|\nprārabdhye tava citrakarmaṇi dhanurmuktāstrabhinnā bhṛśaṃ\nbhittiṃ drāgavalambya keśava ciraṃ sā tatra citrāyate||","meaning":"“As She thinks of painting Your picture, Cupid strings his bow.\nAs She comes to grasp the paintbrush with Her fingers, he places an arrow against the bowstring.\nAs She commences the task of painting Your picture, he releases an arrow from his bow.\nAnd O Keśava! Upon being struck so very severely (by Cupid’s arrow), She hastily clings onto a wall, and for a very long time She remains (motionless) in the mode of painting Your picture.”","source":"Śrī Bāṇa"},{"number":363,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"त्वामन्तःस्थिरभावनापरिणतं मत्वा पुरोऽवस्थितं\nयावद्दोर्वलयं करोति रभसादग्रे समालिङ्गितुम्।\nतावत्तं निजमेव देहमचिरादालिङ्ग्य रोमाञ्चितां\nदृष्ट्वा वृष्टिजलच्छलेन रुदितं मन्ये पयोदैरपि।।","iast":"tvāmantaḥsthirabhāvanāpariṇataṃ matvā puro’vasthitaṃ\nyāvaddorvalayaṃ karoti rabhasādagre samāliṅgitum|\ntāvattaṃ nijameva dehamacirādāliṅgya romāñcitāṃ\ndṛṣṭvā vṛṣṭijalacchalena ruditaṃ manye payodairapi||","meaning":"\"Her steadfast feelings for You in Her heart make Her believe that You are present before Her.\nAs She fervently folds Her outstretched arms for embracing You, She happens to embrace Her very own body.\nAnd doing so She immediately succumbs to a state of horripilation.\nUpon seeing Her so, even the clouds shed rain water which I think to be their excuse for weeping (at Rādhā's miserable state).\"","source":"Anonymous"},{"number":364,"topic":"Rādhā’S Sakhī Delivers A Message To Krṣṇa","devanagari":"अच्छिन्नं नयनाम्बु बन्धुषु कृतं तापः सखीष्वाहितो\nदैन्यं न्यस्तमशेषतः परिजने चिन्ता गुरुभ्योऽर्पिता ।\nअद्य श्वः किल निर्वृतिं व्रजति सा श्वासैः परैः खिद्यते\nविस्त्रब्धो भव विप्रयोगजनितं दुःखं विभक्तं तया ।।","iast":"acchinnaṃ nayanāmbu bandhuṣu kṛtaṃ tāpaḥ sakhīṣvāhito\ndainyaṃ nyastamaśeṣataḥ parijane cintā gurubhyo’rpitā |\nadya śvaḥ kila nirvṛtiṃ vrajati sā śvāsaiḥ paraiḥ khidyate\nvistrabdho bhava viprayogajanitaṃ duḥkhaṃ vibhaktaṃ tayā ||","meaning":"\"Do believe what I say about how Your beloved shares Her pain of separation from You.\nShe gives Her incessantly flowing tears to Her kinsmen,\nShe places the agony of Her heart upon Her friends,\nShe confers completely Her pathetic state upon Her servants,\nAnd She surrenders Her anxiety to Her parents and elders.\nToday or tomorrow She shall most certainly attain to ultimate liberation (i.e. death), for even Her breaths are tormenting Her.\"","source":"Śrī Rudra"},{"number":365,"topic":"She (Rādhā) Speaks With Feelings Of Wistful Longing And Envy","devanagari":"मुखमाधुर्यसमृद्ध्या परहृदयस्य ग्रहीतरि प्रसभम् ।\nकृष्णात्मनि परपुरुषे सौहृदकामस्य का शरीराशा ।।","iast":"mukhamādhuryasamṛddhyā parahṛdayasya grahītari prasabham |\nkṛṣṇātmani parapuruṣe sauhṛdakāmasya kā śarīrāśā ||","meaning":"\"Why should One care for One's body*,\nWhile desiring the friendship of that Supreme Person, Kṛṣṇa\nHimself,\nWho perforce steals the hearts of others** by exuberance of\nsweetness of speech.\"","source":"Śrī Jagannātha Sena"},{"number":366,"topic":"A Jestful But Desperate Message From The Maidens Of Vraja","devanagari":"वाचा तृतीयजनसङ्कटदुःस्थया किं\nकिं वा निमेषविरसेन विलोकितेन ।\nहे नाथ नन्दसुत गोकुलसुन्दरीणा-\nमन्तश्चरी सहचरी त्वयि भक्तिरेव ।।","iast":"vācā tṛtīyajanasaṅkaṭaduḥsthayā kiṃ\nkiṃ vā nimeṣavirasena vilokitena |\nhe nātha nandasuta gokulasundarīṇā-\nmantaścarī sahacarī tvayi bhaktireva ||","meaning":"\"O Lord! O son of Nanda!\n(In our mutual relationship) what place is there for the distress call\nof a third person?\nWhat comfort to Me now is the look You gave Me (while leaving\nfor Mathurā), a look imbued with love and without the blinking of\nYour eyes?\nFor us damsels of Gokula, the devotion to You that sports in our\nhearts is our only companion (in this time of distress).\"","source":"Anonymous"},{"number":367,"topic":"A Candid Message (From The Gopīs)","devanagari":"मुरलीकलनिक्वणैर्या गुरुलज्जाभरमप्यजीगणन् ।\nविरहे तव गोपिकाः कथं समयं ता गमयन्तु माधव ।।","iast":"muralīkalanikvaṇairyā gurulajjābharamapyajīgaṇan |\nvirahe tava gopikāḥ kathaṃ samayaṃ tā gamayantu mādhava ||","meaning":"\"O Mādhava!\nThe gopis, upon hearing the sweet sound of Your flute, would\ndisregard even the overwhelming embarrassment of their elders*.\nSo how can these gopis beguile this time of separation from You?\"","source":"Śrī Ṣaṣṭhidāsa"},{"number":368,"topic":"A Candid Message (From The Gopīs)","devanagari":"मथुरापथिक मुरारेरुपगेयं द्वारि वल्लवीवचनम् ।\nपुनरपि यमुनासलिले कालियगरलानलो ज्वलति ।।","iast":"mathurāpathika murārerupageyaṃ dvāri vallavīvacanam |\npunarapi yamunāsalile kāliyagaralānalo jvalati ||","meaning":"“O traveler to Mathurā (Uddhava)!\nProclaim loudly upon the doorstep of Murāri, these words of the cowherd girls:\n‘Once again do the waters of the Yamunā burn with the fire of the venom of the serpent Kāliya*.’”","source":"Śrī Vīra Sarasvatī"},{"number":369,"topic":"While Residing In Dvārakā, Lord Hari Suffers Pain Of Separation (From Rādhā)","devanagari":"कालिन्दीमनुकूलकोमलयामिन्दीवरश्यामलाः\nशैलौपान्तभुवः कदम्बकुसुमैरामोदिनः कन्दरान् ।\nराधां च प्रथमाभिसारमधुरां जातानुतापः स्मर-\nस्त्वस्तु द्वारवतीपतिस्त्रिभुवनामोदाय दामोदरः।।","iast":"kālindīmanukūlakomalayāmindīvaraśyāmalāḥ\nśailaupāntabhuvaḥ kadambakusumairāmodinaḥ kandarān |\nrādhāṃ ca prathamābhisāramadhurāṃ jātānutāpaḥ smara-\nstvastu dvāravatīpatistribhuvanāmodāya dāmodaraḥ||","meaning":"Dāmodara, the lord of Dvārakā, remembers --\nThe smooth, gentle flow of the Yamunā,\nThe ground around the (Govardhana) mountain which is dark as a\nblue lotus,\nThe mountain caves that are imbued with the fragrance of\nKadamba flowers,\nAnd the sweet and charming Rādhā (as He saw Her) in their first\nrendezvous.\nMay the Lord, Who is overcome by sadness while He so reminisces,\ndelight the three worlds!","source":"Śrī Śaraṇa"},{"number":370,"topic":"While Residing In Dvārakā, Lord Hari Suffers Pain Of Separation (From Rādhā)","devanagari":"कामं कामयते न केलिनलिनर्नी नामोदते कौमुदी-\nनिस्यन्दैर्न समीहते मृगदृशामालापलीलामपि ।\nसीदन्नेष निशासु निःसहतनुर्भोगाभिलाषाल्सै-\nरङ्गैस्ताम्यति चेतसि व्रजवधूमाधाय मुग्धो हरिः ।।","iast":"kāmaṃ kāmayate na kelinalinarnī nāmodate kaumudī-\nnisyandairna samīhate mṛgadṛśāmālāpalīlāmapi |\nsīdanneṣa niśāsu niḥsahatanurbhogābhilāṣālsai-\nraṅgaistāmyati cetasi vrajavadhūmādhāya mugdho hariḥ ||","meaning":"No longer does He so fondly desire the play-lotus (offered to\nHim by His queens),\nNo more does He derive pleasure from the flood of moonlight,\nAnd nor does He long to indulge in playful talk with His deer-eyed\nqueens.\nUnable to bear the weight of His body, He reclines all night long.\nWhile His heart dwells on (Rādhā) the damsel of Vraja and as He craves Her company, His body succumbs to lassitude and He becomes stupefied with grief.\nAnd so remains the musing Lord Hari.","source":"Śrī Śaraṇa"},{"number":371,"topic":"While Residing In Dvārakā, Lord Hari Suffers Pain Of Separation (From Rādhā)","devanagari":"रलच्छायाच्छुरितजलधौ मन्दिरे द्वारकाया\nरुक्मिण्यापि प्रबलपुलकोद्ेदमालिङ्गितस्य।\nविश्वं पायान्मसृणयमुनातीरवानीरकुञ्जे\nराधाकेलीपरिमलभरध्यानमूच्छर्ा मुरारेः।।","iast":"ralacchāyācchuritajaladhau mandire dvārakāyā\nrukmiṇyāpi prabalapulakodedamāliṅgitasya|\nviśvaṃ pāyānmasṛṇayamunātīravānīrakuñje\nrādhākelīparimalabharadhyānamūccharā murāreḥ||","meaning":"The luster of the jewels (inlaid on the palace walls) are reflected in the waters of the ocean.\nIn His palace in Dvārakā, upon being embraced by queen Rukmiṇī, Lord Murāri experiences a state of intense horripilation.\nAnd then the Lord swoons as the queen's embrace reminds Him of the profuse fragrance He had experienced during His dalliance with Rādhā in the cane groves on the glistening banks of the Yamunā.\nMay the Lord's fainting spell protect the whole world!","source":"Śrī Umāpatidhara"},{"number":372,"topic":"While Residing In Dvārakā, Lord Hari Suffers Pain Of Separation (From Rādhā)","devanagari":"निर्मग्नेन मयाम्भसि प्रणयतः पाली समालिङ्गिता\nकेनालीकमदं तवाद्य कथितं राधे मुधा ताम्यसि।\nइत्युत्स्वप्नपरम्परासु शयने श्रुत्वा वचः शार्ङ्गिणो\nरुक्मिण्या शिथिलीकृतः सकपटं कण्ठग्रहः पातु वः।।","iast":"nirmagnena mayāmbhasi praṇayataḥ pālī samāliṅgitā\nkenālīkamadaṃ tavādya kathitaṃ rādhe mudhā tāmyasi|\nityutsvapnaparamparāsu śayane śrutvā vacaḥ śārṅgiṇo\nrukmiṇyā śithilīkṛtaḥ sakapaṭaṃ kaṇṭhagrahaḥ pātu vaḥ||","meaning":"(One day Lord Śārṅgī* and queen Rukmiṇī were sleeping, with their arms around each other, when the Lord spoke out in His dream:)\n\"O Rādhā! Who today has told You this falseness that while I was immersing Myself in the (river) waters, I lovingly hugged (the gopi) Pālī?\nYou are distressed in vain.\"\nUpon hearing these words that Lord Śārṅgī spoke while He was dreaming in His sleep, queen Rukmiṇī, on some pretext, slackened Her embrace.\nMay Lord Śārṅgī protect you.","source":"Śrī Umāpatidhara"},{"number":373,"topic":"The Song Of (Rādhā) The Empress Of Vṛndāvana As She Laments Her Separation From Her Beloved","devanagari":"याते द्वारवतीपुरं मुररिपौ तद्वस्त्रसंवनया\nकालिन्दीतटकुञ्जवञ्जुललतामालम्ब्य सोत्कण्ठया ।\nउद्गीतं गुरुबाष्पगद्गदगलत्तारस्वरं राधया\nयेनान्तर्जलचारिभिर्जलचरैरप्युत्कमूजितम् ।।","iast":"yāte dvāravatīpuraṃ muraripau tadvastrasaṃvanayā\nkālindītaṭakuñjavañjulalatāmālambya sotkaṇṭhayā |\nudgītaṃ gurubāṣpagadgadagalattārasvaraṃ rādhayā\nyenāntarjalacāribhirjalacarairapyutkamūjitam ||","meaning":"Upon Murāri’s departure for Dvārakā, Rādhā drapes Herself in His clothes and She reclines upon a branch of an Aśoka tree in a grove on the banks of the Yamunā.\nAnd upon so reclining, distressed by Her longing for Her beloved, weeping profusely, does She sing with faltering voice, in a pitch of such intensity that She causes the creatures dwelling in the river waters to become aroused with emotion and to cry out aloud.","source":"Śrī Aparājita"},{"number":374,"topic":"The Message Of The Gopīs Of Vraja","devanagari":"पान्थ द्वारवतीं प्रयासि यदि हे तद्देवकी नन्दनो\nवक्तव्यः स्मरमोहमन्त्रविवशा गोप्योऽपि नामोज्झिताः ।\nएताः केलिकदम्बधूलिपटलैरालोकशून्या दिशः\nकालिन्दी तटभूमयोऽपि भवतो नायान्ति चित्तास्पदम् ।।","iast":"pāntha dvāravatīṃ prayāsi yadi he taddevakī nandano\nvaktavyaḥ smaramohamantravivaśā gopyo’pi nāmojjhitāḥ |\netāḥ kelikadambadhūlipaṭalairālokaśūnyā diśaḥ\nkālindī taṭabhūmayo’pi bhavato nāyānti cittāspadam ||","meaning":"\"O traveller! If you are going to Dvārakā then give this message to the son of Devakī:\n'(Upon leaving Vraja, O Kṛṣṇa) You have indeed forsaken the gopis who have been possessed by Your love, Your love that is but a bewitching incantation.\nDo the grounds on the bank of the Yamunā, the environs of which have been obscured from view by the haze of pollen from the\n(flowers of the) Kadamba trees, the trees around which we used to play, find no place in Your heart?\"","source":"Śrī Govardhana Ācārya"},{"number":375,"topic":"The Message Of The Gopīs Of Vraja","devanagari":"ते गोवर्धनकन्दराः स यमुनाच्छः स चेष्टारसो\nभाण्डीरः स वनस्पतिः सहचरास्ते तच्च गोष्ठाङ्गनम्।\nकिं ते द्वारवतीभुजङ्ग हृदयं नायाति दोषैरपी-\nत्यव्याद्दो हृदि दुःखसहं व्रजवधूसन्देशशल्यं हरेः।।","iast":"te govardhanakandarāḥ sa yamunācchaḥ sa ceṣṭāraso\nbhāṇḍīraḥ sa vanaspatiḥ sahacarāste tacca goṣṭhāṅganam|\nkiṃ te dvāravatībhujaṅga hṛdayaṃ nāyāti doṣairapī-\ntyavyāddo hṛdi duḥkhasahaṃ vrajavadhūsandeśaśalyaṃ hareḥ||","meaning":"\"The caves of the Govardhana mountain,\nThe banks of the Yamunā river,\nThe fig-tree called Bhāṇḍīra that You played on,\nThe (Kadamba) tree (You climbed after stealing the clothes of the gopīs),\nYour (dear) friends,\nAnd the cow-pen (You used to play in).\nO gallant of Dvārakā!\nDo not the thoughts of all these disturb Your heart?\"\nThis message of the maidens of Vraja is but an unbearable splinter\nin the heart of the Lord.\nMay that splinter in the heart of Lord Hari protect You.\"","source":"Śrī Nīla"},{"number":376,"topic":"The Message Of The Gopīs Of Vraja","devanagari":"कालिन्द्याः पुलिनं प्रदोषमरुतो रम्याः शशाङ्कां शवः\nसन्तापं न हरन्तु नाम नितरां कुर्वन्ति कस्मात् पुनः।\nसदिष्टं व्रजयोषितामिति हरेः संश्रृण्वतोऽन्तः पुरे\nनिःश्वासाः प्रसृता जयन्ति रमणीसौभाग्यगर्वच्छिदः।।","iast":"kālindyāḥ pulinaṃ pradoṣamaruto ramyāḥ śaśāṅkāṃ śavaḥ\nsantāpaṃ na harantu nāma nitarāṃ kurvanti kasmāt punaḥ|\nsadiṣṭaṃ vrajayoṣitāmiti hareḥ saṃśrṛṇvato’ntaḥ pure\nniḥśvāsāḥ prasṛtā jayanti ramaṇīsaubhāgyagarvacchidaḥ||","meaning":"\"The banks of the Yamunā,\nThe evening breeze,\nAnd the soothing rays of the moon,\nDo not in the least remove our agony.\nBut why do they bring back our pain in its entirety?\"\nLord Hari was given this message of the damsels of Vraja in His palace.\nAs He heard the message He began to breathe deeply in great anguish.\nAnd thus was shattered the pride of good fortune* that had possessed the queens of the Lord.\nGlory be to those breaths of the Lord!","source":"The Pañcatantra"},{"number":377,"topic":"The King Of Dvārakā (Krsna) Addresses (His Friend) Sudāmā","devanagari":"मा गा इत्यपमङ्गलं व्रज सखे स्नेहेन शून्यं वचः\nतिष्ठेति प्रभुता यथाभिलषितं कुर्वित्यदासीनता ।\nब्रूमो हन्त सुदाम मित्र वचनं नैवोपचारादिदं\nस्मर्तव्या वयमादरेण भवता यावद् भवद्दर्शनम् ।।","iast":"mā gā ityapamaṅgalaṃ vraja sakhe snehena śūnyaṃ vacaḥ\ntiṣṭheti prabhutā yathābhilaṣitaṃ kurvityadāsīnatā |\nbrūmo hanta sudāma mitra vacanaṃ naivopacārādidaṃ\nsmartavyā vayamādareṇa bhavatā yāvad bhavaddarśanam ||","meaning":"(As Sudāmā leaves Dvārakā, Krsna addresses Him thus: )\n\"If I were to say to you ‘do not go’, then that will be inauspicious.\nTo say ‘go My friend’, would mean that I lack affection for you.\nIf I were to tell you to ‘stay on here’, then I will be (guilty of) giving you an order.\nAnd to say ‘do as you wish’, will be an expression of My indifference to you.\nO comrade! I do not say all this for the sake of mere courtesy.\nTill you see Me again you must, with great reverence, meditate upon Me.\"","source":"Śrī Hari"},{"number":378,"topic":"Sudāmā’S Expression (Of Surprise) At Seeing His Own House Etc.","devanagari":"तद्गेहं नतभित्ति मन्दिरमिदं लब्धावकाशं दिवः\nसा धेनुर्जरती चरन्ति करिणामेता घनाभा घटाः।\nस क्षुद्रो मुषलध्वनिः कलमिदं सङ्गीतकं योषितां\nचित्रं हन्त कथं द्विजोऽयमितो भूमिं समारोपितः।।","iast":"tadgehaṃ natabhitti mandiramidaṃ labdhāvakāśaṃ divaḥ\nsā dhenurjaratī caranti kariṇāmetā ghanābhā ghaṭāḥ|\nsa kṣudro muṣaladhvaniḥ kalamidaṃ saṅgītakaṃ yoṣitāṃ\ncitraṃ hanta kathaṃ dvijo’yamito bhūmiṃ samāropitaḥ||","meaning":"“In place of my house, the walls of which were collapsing (from decrepitude), there is this palace which reaches upto the sky.\nInstead of my old cow grazing here, there are these troops of (magnificent) elephants that exude the (dark) hue of rain clouds.\nWhere could be heard the pathetic sound of the pestle (of my wife) I now hear this wonderful, melodious music of (heavenly) damsels.\nOh! How has a (humble) brāhmaṇa like me been placed unto such a blessed state?”","source":"Anonymous"},{"number":379,"topic":"The Gestures Of (Rādhā) The Empress Of Vrndāvana On The Battlefield Of Kuruksetra","devanagari":"येनैव सूचितनवाभ्युदयप्रसङ्गा\nमीनाहतिस्फुरिततामरसोपमेन ।\nअन्यन्निमील्य नयनं मुदितैव राधा\nवामेन तेन नयनं ददर्श कृष्णम् ।।","iast":"yenaiva sūcitanavābhyudayaprasaṅgā\nmīnāhatisphuritatāmarasopamena |\nanyannimīlya nayanaṃ muditaiva rādhā\nvāmena tena nayanaṃ dadarśa kṛṣṇam ||","meaning":"Her (left) eye, quivering like a lotus flower struck by fish, announced the novel occasion (of Her meeting Krsna on the battlefield).\nWhile winking with Her other eye, Rādhā was extremely gladdened as She looked upon Krsna with Her left eye.","source":"Śrī Hara"},{"number":380,"topic":"The Gestures Of (Rādhā) The Empress Of Vrndāvana On The Battlefield Of Kuruksetra","devanagari":"आनन्दोद्गतबाष्पपूरपिहितं चक्षुः क्षमं नेक्षितुं\nबाहू सीदत एव कम्पविधुरौ शक्तौ न कण्ठग्रहे ।\nवाणी सम्भ्रमगद्गदाक्षरपदा संक्षोभलोलं मनः\nसत्यं वल्लभसङ्गोऽपि सुचिराज्जातो वियोगायते ।।","iast":"ānandodgatabāṣpapūrapihitaṃ cakṣuḥ kṣamaṃ nekṣituṃ\nbāhū sīdata eva kampavidhurau śaktau na kaṇṭhagrahe |\nvāṇī sambhramagadgadākṣarapadā saṃkṣobhalolaṃ manaḥ\nsatyaṃ vallabhasaṅgo’pi sucirājjāto viyogāyate ||","meaning":"(Upon seeing Krsna, such is Rādhā's state that: )\nHer eyes are so filled with tears of ecstasy that She is unable to see,\nAfflicted by tremour, Her arms are so languid that She cannot embrace Him,\nHer speech falters as She utters words of incoherent syllables.\nAnd Her mind becomes tumultuous with emotion.\nIt is indeed true that She has been away from Her beloved for so long, that Her meeting with Him arouses in Her all those pangs of separation that She experienced during His absence.","source":"Śrī Śubhra"},{"number":381,"topic":"Rādhā Addresses Kṛṣṇa While They Are Alone And When He Is Supplicating Her (For Forgiveness)","devanagari":"किं पादान्ते लुठसि विमनाः स्वामिनो हि स्वतन्त्राः\nकश्चित् कालं कचिदभिरतस्तत्र कस्तेऽपराधः।\nआगस्कारिण्यहमह यया जीवितं तद्वियोगे\nभर्तृप्राणाः स्त्रिय इति ननु त्वं ममैवानुनेयः।।","iast":"kiṃ pādānte luṭhasi vimanāḥ svāmino hi svatantrāḥ\nkaścit kālaṃ kacidabhiratastatra kaste’parādhaḥ|\nāgaskāriṇyahamaha yayā jīvitaṃ tadviyoge\nbhartṛprāṇāḥ striya iti nanu tvaṃ mamaivānuneyaḥ||","meaning":"\"Why do You, Who are so sad at heart, fall at My feet?\nYou are My master and are thus sovereign.\nWhat fault is it of Yours if You have been absorbed in some task for some period of time?\nI am the guilty One here for I have made it the mode of My life to pine for You when You are away from Me.\nA husband is the very life of a woman. Thus it is You Who deserve to be the object of My supplication.\"","source":"Anonymous"},{"number":382,"topic":"Rādhā Addresses Her Sakhī At That Place","devanagari":"यः कौमारहरः स एव हि वरस्ता एव चैत्रक्षपा-\nस्ते चोन्मीलितमालतीसुरभयः प्रौढाः कदम्बानिलाः ।\nसा चैवास्मि तथापि तत्र सुरतव्यापारलीलाविधौ\nरेवारोधसि वेतसीतरुतले चेतः समुत्कण्ठते ।।","iast":"yaḥ kaumāraharaḥ sa eva hi varastā eva caitrakṣapā-\nste conmīlitamālatīsurabhayaḥ prauḍhāḥ kadambānilāḥ |\nsā caivāsmi tathāpi tatra suratavyāpāralīlāvidhau\nrevārodhasi vetasītarutale cetaḥ samutkaṇṭhate ||","meaning":"“The most excellent One (Kṛṣṇa), Who stole My heart in My childhood, is present here.\nThese are those very nights of the month of Caitra*.\nThis is the same fragrance of blooming jasmine flowers.\nAnd as before is this strong breeze blowing through the Kadamba trees.\nI too am the very same person.\nBut yet My heart pines for the sequence of amorous play (that I once had with Kṛṣṇa) at the base of a palm tree on the banks of the Narmadā river.”","source":"Anonymous"},{"number":383,"topic":"Rādhā Addresses Her Sakhī At That Place","devanagari":"प्रियः सोऽयं कृष्णः सहचरि कुरुक्षेत्रमिलित-\nस्तथाऽहं सा राधा तदिदमुभयोः सङ्गमसुखम्।\nतथाप्यन्तःखेलन्मधुरमुरलीपञ्चमजुषे\nमनो मे कालिन्दीपुलिनविपिनाय स्पृहयति।।","iast":"priyaḥ so’yaṃ kṛṣṇaḥ sahacari kurukṣetramilita-\nstathā’haṃ sā rādhā tadidamubhayoḥ saṅgamasukham|\ntathāpyantaḥkhelanmadhuramuralīpañcamajuṣe\nmano me kālindīpulinavipināya spṛhayati||","meaning":"\"O friend!\nThis is the same beloved Kṛṣṇa Who I have thus met at Kurukṣetra.\nAnd this is Me, the same Rādhā.\nThe mutual bliss of Our meeting each other is the same.\nYet My heart craves for the forest on the banks of the Yamunā; for the forest that is graced with the fifth note of Kṛṣṇa’s charming flute resonating in its interiors.","source":"Śrī Rūpa Gosvāmī"},{"number":384,"topic":"Concluding Invocatory Verses (Maṅgalācaraṇam)","devanagari":"मुग्धे मुञ्च विषादमत्र बलभित्कम्पो गुरुस्त्यज्यतां\nसद्भावं भज पुण्डरीकनयने मान्यानिमान् मानय।\nलक्ष्मी शिक्षयतः स्वयंवरविधौ धन्वन्तरेर्वाञ्छला-\nदित्यन्यप्रतिषेधमात्मनि विधिं शृण्वन् हरिः पातु वः।।","iast":"mugdhe muñca viṣādamatra balabhitkampo gurustyajyatāṃ\nsadbhāvaṃ bhaja puṇḍarīkanayane mānyānimān mānaya|\nlakṣmī śikṣayataḥ svayaṃvaravidhau dhanvantarervāñchalā-\ndityanyapratiṣedhamātmani vidhiṃ śṛṇvan hariḥ pātu vaḥ||","meaning":"\"O charming One! On this occasion let go of this enervating dejection and of this oppressive tremour (of Your limbs). Assume gracious feelings, O lotus-eyed One, and pay Your respects to all these venerable ones (assembled here).\"\nLord Hari thus hears goddess Lakṣmī being instructed by Dhanvantari on the procedures of the svayaṃvara*. And how, by dexterity of speech, Dhanvantari beguiles Her into accepting the Lord while forbidding Her from considering the other aspirants of the syayamvara.\nMay Lord Hari Who thus hears all this protect you.","source":"Anonymous"},{"number":385,"topic":"Concluding Invocatory Verses (Maṅgalācaraṇam)","devanagari":"यदुवंशवतंसाय वृन्दाबनविहारिणे।\nसंसारसागरोत्तारे हरये नमः।।","iast":"yaduvaṃśavataṃsāya vṛndābanavihāriṇe|\nsaṃsārasāgarottāre haraye namaḥ||","meaning":"I offer My salutation to Lord Hari,\nWho is the crest-jewel of the Yadu clan,\nWho sports in the forests of Vṛndāvana,\nAnd Who is the boat that delivers us across the ocean of worldly existence.","source":"Śrī Avilamba Sarasvatī"},{"number":386,"topic":"Concluding Invocatory Verses (Maṅgalācaraṇam)","devanagari":"भ्राम्यद्भास्वरमन्तराद्रिशिखरव्याघट्टनाद्विस्फुर-\nत्केयूराः पुरूहूतकुञ्जरकराप्राग्भारसंवर्धिनः ।\nदैत्येन्द्रप्रमदाकपोलविलसत्पत्राङ्कुरच्छेदिनो\nदोर्दण्डाः कलिकाल्कलमषमुषः कंसद्विषः पान्तु वः ।।","iast":"bhrāmyadbhāsvaramantarādriśikharavyāghaṭṭanādvisphura-\ntkeyūrāḥ purūhūtakuñjarakarāprāgbhārasaṃvardhinaḥ |\ndaityendrapramadākapolavilasatpatrāṅkuracchedino\ndordaṇḍāḥ kalikālkalamaṣamuṣaḥ kaṃsadviṣaḥ pāntu vaḥ ||","meaning":"The Lord's bracelets shine as they rub against the resplendent\npeaks of the Mandara mountain which is revolving (in the ocean of\nmilk),\nHe restores to Indra his elephant (Airāvata), whose trunk is then\nhonoured with more duties than before.\nAnd He deprives the wives of the demon-kings of the glittering\ndesigns painted on their cheeks.\nMay those strong arms of the enemy of Kamsa, that dispel the evils\nof kali yuga, protect you.","source":"Śrī Yogeśvara"},{"number":387,"topic":"Concluding Invocatory Verses (Maṅgalācaraṇam)","devanagari":"जयदेवबिल्वमङ्गलमुखैः कृता येऽत्र सन्ति सन्दर्भाः।\nतेषां पद्यानि विना समाहानीतराण्यत्र।।","iast":"jayadevabilvamaṅgalamukhaiḥ kṛtā ye’tra santi sandarbhāḥ|\nteṣāṃ padyāni vinā samāhānītarāṇyatra||","meaning":"Verses from the extant works of Jayadeva and Bilvamangala have not been included here (in this anthology).","source":"Śrī Rūpa Gosvāmī"},{"number":388,"topic":"Concluding Invocatory Verses (Maṅgalācaraṇam)","devanagari":"लसदुज्ज्वलरससुमना गोकुलकुलपालिकालिकलितः\nमदभीप्सितमभिध्यात् तरुणतमालकल्पपादपः कोऽपि।।","iast":"lasadujjvalarasasumanā gokulakulapālikālikalitaḥ\nmadabhīpsitamabhidhyāt taruṇatamālakalpapādapaḥ ko’pi||","meaning":"May some young Tamāla wish-fulfilling tree*,\nThat has for flowers the resplendently magnificent rasas of bhakti,\nAnd the environs of which resound with the chatter** of the denizens of Goloka,\nGrant the desires of my heart.","source":"Śrī Rūpa Gosvāmī"}]</script>
  <script>
    const DATA = JSON.parse(document.getElementById('sloka-data').textContent);
    const els = {
      reader: document.getElementById('reader'),
      prev: document.getElementById('prev'),
      next: document.getElementById('next'),
      jumpNumber: document.getElementById('jumpNumber'),
      toggleIAST: document.getElementById('toggleIAST'),
      bookmark: document.getElementById('bookmark'),
      theme: document.getElementById('theme'),
      toast: document.getElementById('toast')
    };

    let currentIndex = Number(localStorage.getItem('padyavali_current_index') || 0);
    let showIAST = localStorage.getItem('padyavali_show_iast') !== 'false';
    let bookmarks = new Set(JSON.parse(localStorage.getItem('padyavali_bookmarks') || '[]'));

    if (currentIndex < 0 || currentIndex >= DATA.length) currentIndex = 0;
    if (localStorage.getItem('padyavali_theme') === 'dark') document.body.classList.add('dark');

    const escapeHTML = value => (value || '').toString().replace(/[&<>"']/g, char => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
    }[char]));

    function saveState() {
      localStorage.setItem('padyavali_current_index', currentIndex);
      localStorage.setItem('padyavali_show_iast', showIAST);
      localStorage.setItem('padyavali_bookmarks', JSON.stringify([...bookmarks]));
    }

    function render() {
      const item = DATA[currentIndex];
      const saved = bookmarks.has(item.number);

      els.reader.innerHTML = `
        <div class="card-top">
          <div class="meta">
            <span class="num">${item.number}</span>
            <span class="topic">${escapeHTML(item.topic)}</span>
          </div>
        </div>

        <p class="devanagari">${escapeHTML(item.devanagari)}</p>
        <p class="iast ${showIAST ? '' : 'hidden'}">${escapeHTML(item.iast)}</p>

        <h2 class="commentary-title">Commentary / Meaning</h2>
        <p class="meaning">${escapeHTML(item.meaning)}</p>
        <div class="source"><strong>Source:</strong> ${escapeHTML(item.source || 'Not stated')}</div>
      `;

      els.jumpNumber.value = item.number;
      els.prev.disabled = currentIndex === 0;
      els.next.disabled = currentIndex === DATA.length - 1;
      els.toggleIAST.textContent = showIAST ? 'IAST On' : 'IAST Off';
      els.bookmark.textContent = saved ? '★' : '☆';
      els.bookmark.classList.toggle('saved', saved);
      els.theme.textContent = document.body.classList.contains('dark') ? 'Light' : 'Dark';
      saveState();
    }

    function goToIndex(index) {
      currentIndex = Math.max(0, Math.min(DATA.length - 1, index));
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function goToVerseNumber(number) {
      const index = DATA.findIndex(item => item.number === number);
      if (index !== -1) goToIndex(index);
    }

    els.prev.addEventListener('click', () => goToIndex(currentIndex - 1));
    els.next.addEventListener('click', () => goToIndex(currentIndex + 1));

    els.jumpNumber.addEventListener('change', () => {
      const number = Number(els.jumpNumber.value);
      if (!Number.isFinite(number)) return render();
      goToVerseNumber(number);
    });

    els.jumpNumber.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        goToVerseNumber(Number(els.jumpNumber.value));
      }
    });

    els.toggleIAST.addEventListener('click', () => {
      showIAST = !showIAST;
      render();
    });

    els.bookmark.addEventListener('click', () => {
      const number = DATA[currentIndex].number;
      bookmarks.has(number) ? bookmarks.delete(number) : bookmarks.add(number);
      render();
    });

    els.theme.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('padyavali_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      render();
    });

    function blocked(event) {
      event.preventDefault();
      els.toast.classList.add('show');
      setTimeout(() => els.toast.classList.remove('show'), 1800);
      return false;
    }

    ['copy','cut','paste','dragstart','selectstart'].forEach(eventName => document.addEventListener(eventName, blocked));

    document.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if ((event.ctrlKey || event.metaKey) && ['c','x','s','p','u','a'].includes(key)) blocked(event);
      if (key === 'f12' || ((event.ctrlKey || event.metaKey) && event.shiftKey && ['i','j','c'].includes(key))) blocked(event);
    });

    render();
  </script>
</body>
</html>
