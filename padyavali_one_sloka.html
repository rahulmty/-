jagadīśa kāmaye|\nmama janmani janmanīśvare\nbhavatādbhaktirahaitukī tvayi||","meaning":"O Lord Jagadīśa!\nI have no desire for wealth,\nI do not seek a large number of followers,\nI care not for beautiful women,\nAnd nor do I desire excellence in poetical expression.\nAll I pray for is to be blessed, life after life, with devotion to Thee --\nwith devotion that is free from all motives.","source":"Lord Caitanya"},{"number":95,"topic":"The Earnest Prayers Of Devotees","devanagari":"गोवर्धनप्रस्थनवाम्बुवाह:\nकलिन्दक्यानवनीलपद्मम् ।\nवृन्दावनोदारतमालशाखी\nतापत्रयस्याभिभवं करोतु ।।","iast":"govardhanaprasthanavāmbuvāha:\nkalindakyānavanīlapadmam |\nvṛndāvanodāratamālaśākhī\ntāpatrayasyābhibhavaṃ karotu ||","meaning":"May that Lord Who is the likeness of\nA fresh rain-cloud adorning the plateaued ground on Govardhana mountain,\nA newly bloomed blue lotus in the river Yamunā,\nAnd a splendidly large Tamāla tree in Vṛndāvana,\nVanquish our three-fold* worldly torments.","source":"A devotee from Bengal"},{"number":96,"topic":"The Earnest Prayers Of Devotees","devanagari":"व्रजोल्लसितनागरीनिकररासलास्योत्सुकः\nस मे सपदि मानसे स्फुरतु कोऽपि गोपालकः ।।","iast":"vrajollasitanāgarīnikararāsalāsyotsukaḥ\nsa me sapadi mānase sphuratu ko’pi gopālakaḥ ||","meaning":"The orbs of the beautiful eyes of some cowherd boy are quivering with the expression of erotic sentiment.\nHis pendulating crocodile-shaped earrings glitter against His cheeks.\nAnd He is eager to engage in amorous dance with the host of ecstatic gopis of Vraja.\nMay that cowherd boy (Kṛṣṇa), this very instant, be manifest in my heart.","source":"Śrī Mādhavendra Purī"},{"number":97,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"श्रुतयः पलालाल्पाः किमिह वयं साम्प्रतं चिनुमः।\nअह्रियत पुरैव नयनैराभीरीभिः परं ब्रह्म।।","iast":"śrutayaḥ palālālpāḥ kimiha vayaṃ sāmprataṃ cinumaḥ|\nahriyata puraiva nayanairābhīrībhiḥ paraṃ brahma||","meaning":"Why do we now, in this world, revere the Vedas, which are as relevant to us as husk of grain?\nThe gopis have, already, merely by the glances of their eyes, extracted param Brahman from the Vedas, just as grain is removed from its husk.","source":"Śrī Raghupati Upādhyāya"},{"number":98,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"कम्प्रति कथयितुमीशे सम्प्रति को वा प्रतीतिमायातु ।\nगोपतितनयाकुञ्जे गोपवधूटीविटं ब्रह्म ।।","iast":"kamprati kathayitumīśe samprati ko vā pratītimāyātu |\ngopatitanayākuñje gopavadhūṭīviṭaṃ brahma ||","meaning":"At this moment, I am not competent to speak of this profound\ntruth to anyone.\nAnd who will believe me?\nThe truth is that He Who sports with Rādhā in the forest gardens,\nand is the paramour of the wives of the cowherd men, is none other\nthan Brahman, the Supreme Spirit.","source":"Śrī Raghupati Upādhyāya"},{"number":99,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"ज्ञातं काणभुजं मतं परिचितैवान्वीक्षिकी शिक्षिता\nमीमांसा विदितैव सांख्यसरणियेंगे वितीर्णा मतिः ।\nवेदान्ताः परिशीलिताः सरभसं किं तु स्फुरन्माधुरी-\nधारा काचन नन्दसूनुमुरली मच्छित्तमाकर्षति ।।","iast":"jñātaṃ kāṇabhujaṃ mataṃ paricitaivānvīkṣikī śikṣitā\nmīmāṃsā viditaiva sāṃkhyasaraṇiyeṃge vitīrṇā matiḥ |\nvedāntāḥ pariśīlitāḥ sarabhasaṃ kiṃ tu sphuranmādhurī-\ndhārā kācana nandasūnumuralī macchittamākarṣati ||","meaning":"I am proficient in the Vaiśeṣika doctrine of Kaṇāda,\nAm well versed in the Nyāya logic of Gautama,\nHave learnt the Mīmāṃsā philosophy of Jaimini,\nAm experienced in the path of Sāmkhya of Kapila,\nHave applied my faculties in mastering the Yoga system of Patañjali,\nAnd have diligently made a deep study of Vedānta of Bādarāyaṇa.\n(But all these disciplines have yielded no satisfaction to me.)\nBut my heart becomes infatuated by even a little strain of the enchanting music issuing forth from the flute of the son of Nanda.","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":100,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"अमरीमुखसीधुमाधुरीणां\nलहरी काचन चातुरी कलानाम्।\nतरलीकुरुते मनो मदीयं\nमुरलीनादपरम्परा मुरारेः।।","iast":"amarīmukhasīdhumādhurīṇāṃ\nlaharī kācana cāturī kalānām|\ntaralīkurute mano madīyaṃ\nmuralīnādaparamparā murāreḥ||","meaning":"Not waves of the delicious liqueurs savoured by celestial damsels,\nNor mastery over the sixty-four arts*,\nRender viscid my heart,\nAs do the melodious sequences of divine sounds issuing forth from the flute of Lord Murāri.","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":101,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"अपहरति मनो मे कोऽप्ययं कृष्णचौरः\nप्रणतदुरितचौरः पूतनाप्राणचौरः।\nवलयवसनचौरो बालगोपीजनानां\nनयनहृदयचौरः पश्यतां सज्जनानाम्।।","iast":"apaharati mano me ko’pyayaṃ kṛṣṇacauraḥ\npraṇataduritacauraḥ pūtanāprāṇacauraḥ|\nvalayavasanacauro bālagopījanānāṃ\nnayanahṛdayacauraḥ paśyatāṃ sajjanānām||","meaning":"The thief Who divests those surrendered to Him of their sins,\nThe thief Who relieved the demoness Pūtanā of her life,\nThe thief Who stole the clothes and ornaments of the young gopis (while they were bathing),\nThe thief Who captivates the eyes and hearts of those pious ones who set their eyes on Him,\nSome such dark hued thief (Kṛṣṇa) has stolen away my mind and heart.","source":"Anonymous"},{"number":102,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"अलं त्रिदिववार्तया किमिति सार्वभौमश्रिया\nविदूरतर्वर्तिनी भवतु मोक्षलक्ष्मीरिपि।\nकलिन्दगिरिनन्दिनीतटनिकुञ्जपुञ्जोदरे\nमनो हरति केवलं नवतमालनीलं महः।।","iast":"alaṃ tridivavārtayā kimiti sārvabhaumaśriyā\nvidūratarvartinī bhavatu mokṣalakṣmīripi|\nkalindagirinandinītaṭanikuñjapuñjodare\nmano harati kevalaṃ navatamālanīlaṃ mahaḥ||","meaning":"I need no more deliberation on the prospect of attaining to heaven (in the after-life),\nAnd what do I care for dominion over the earth (in this life).\nMay even the great benediction of mokṣa remain distant and elusive.\nFor I am bewitched by none other than the One Who resides in the interiors of the numerous arbours on the banks of river Yamunā,\nThe One Who sports the luster of the dark hued bark of a young, blossoming Tamāla tree.","source":"Śrī Hari Dāsa"},{"number":103,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"अवलोकितमनुमोदितमालिङ्गितमङ्गनाभिरनुरागैः।\nअधिवृन्दावनकुञ्जं मरकतपुञ्जं नमस्यामः।।","iast":"avalokitamanumoditamāliṅgitamaṅganābhiranurāgaiḥ|\nadhivṛndāvanakuñjaṃ marakatapuñjaṃ namasyāmaḥ||","meaning":"The Lord is the likeness of a bunch of emeralds*.\nThe loving gopis behold Him in their glances.\nThey embrace Him in expressing their love,\nAnd they give Him immeasurable delight.\nTo that Lord Who is situated in the forest-groves of Vṛndāvana,\nDo we offer our salutations.","source":"Śrī Sarvavidyāvinoda"},{"number":104,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"कदा द्रक्ष्यामि नन्दस्य बालकं नीपमालकम्।\nपालकं सर्वसत्त्वानां लसत्तिलकभालकम्।।","iast":"kadā drakṣyāmi nandasya bālakaṃ nīpamālakam|\npālakaṃ sarvasattvānāṃ lasattilakabhālakam||","meaning":"O when will I chance to have a vision of the son of Nanda, the guardian and protector of all living beings.\nWho is adorned with a garland of Kādamba flowers and Whose forehead is graced with a bright tilaka*.","source":"Śrī Mādhavendra Purī"},{"number":105,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"कदा वृन्दारण्ये मिहिरदुहितुः सङ्गमहिते\nमुहुर्भ्रामं भ्रामं चरितलहरीं गोकुलपतेः ।\nलपन्नुच्चैरुच्चैर्नयनपयसां वेणिभिरहं\nकरिष्ये सोत्कण्ठो निविडमवसेकं विटपिनाम् ।।","iast":"kadā vṛndāraṇye mihiraduhituḥ saṅgamahite\nmuhurbhrāmaṃ bhrāmaṃ caritalaharīṃ gokulapateḥ |\nlapannuccairuccairnayanapayasāṃ veṇibhirahaṃ\nkariṣye sotkaṇṭho niviḍamavasekaṃ viṭapinām ||","meaning":"When will I traverse, over and over again, the Vṛndāvana forest, which is graced by the daughter of the Sun*?\nWhen will I, while reciting loudly and with fervent devotion the glories of the Lord of Gokula, irrigate the dense woods of Vṛndāvana with the streams of tears flowing from my eyes?","source":"Śrī Rūpa Gosvāmī"},{"number":106,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"दुरारोहे लक्ष्मीवति भगवतीनामपि पदं\nदधाना धम्मिल्ले नटति कठिनो योपनिषदाम् ।\nरतिर्वशीजन्मा धृतमधुरिमा सा मधुरिपो-\nरकस्मादस्माकं श्रुतिशिखरमारोक्ष्यति कदा ।।","iast":"durārohe lakṣmīvati bhagavatīnāmapi padaṃ\ndadhānā dhammille naṭati kaṭhino yopaniṣadām |\nratirvaśījanmā dhṛtamadhurimā sā madhuripo-\nrakasmādasmākaṃ śrutiśikharamārokṣyati kadā ||","meaning":"The melodious sound emanating from the flute of Madhuripu, the slayer of the demon Madhu,\nPlaces its foot upon the head of the sacred Upaniṣads,\nAnd stepping upon its stiff tuft of hair, which are as beautiful as they are inaccessible,\nDances thereupon.\nWhen will that sound of His flute, graced with all its beauty and charm,\nSuddenly, some day, ascend upon the crests of our ears*?","source":"Śrī Rūpa Gosvāmī"},{"number":107,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"उत्फुल्लापिच्छमनोरमश्री-\nर्मातुः स्तनन्यस्तमुखारविन्दः।\nसञ्चालयन् पादसरोरुहाग्रं\nकृष्णः कदा यास्यति दृक्पथं मे।।","iast":"utphullāpicchamanoramaśrī-\nrmātuḥ stananyastamukhāravindaḥ|\nsañcālayan pādasaroruhāgraṃ\nkṛṣṇaḥ kadā yāsyati dṛkpathaṃ me||","meaning":"His lotus like face,\nLustrous and beautiful like a blooming Tamāla flower,\nIs ensconced in mother Yaśodā's breast,\nWhile His lotus feet are kicking about in delight.\nO when will this scene of my Lord Kṛṣṇa become visible to me?","source":"Anonymous"},{"number":108,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"रोहिणीरमणमण्डलद्युति-\nद्रोहिणी वदनकान्तिसन्ततिम्।\nकृष्ण नूतनमालकोमलां\nकोऽमलां तव तनुं च विस्मरेत्।।","iast":"rohiṇīramaṇamaṇḍaladyuti-\ndrohiṇī vadanakāntisantatim|\nkṛṣṇa nūtanamālakomalāṃ\nko’malāṃ tava tanuṃ ca vismaret||","meaning":"O Lord Kṛṣṇa,\nHow can anyone ever forget the ever-waxing effulgence of Thy visage, which outshines the glow of the disc of the moon,\nOr ever forget Thy body, which is the embodiment of purity and is as tender as a young, blossoming Tamāla tree.","source":"Anonymous"},{"number":109,"topic":"The Yearning Of The Devotees For Their Lord","devanagari":"बर्हापीडं मौलौ विभ्रद्धशीनादानात्न्वन्\nनानाकल्पश्रीसम्पन्नो गोपस्त्रीभिः संवीतः ।\nनेत्रानन्दं कुर्वन् कृष्ण त्वं चेदस्मान् वीक्षेथाः\nसर्वे कामाः सम्पद्येरन्नस्माकं हृद्यासीनाः ।।","iast":"barhāpīḍaṃ maulau vibhraddhaśīnādānātnvan\nnānākalpaśrīsampanno gopastrībhiḥ saṃvītaḥ |\nnetrānandaṃ kurvan kṛṣṇa tvaṃ cedasmān vīkṣethāḥ\nsarve kāmāḥ sampadyerannasmākaṃ hṛdyāsīnāḥ ||","meaning":"O Lord Kṛṣṇa,\nYou adorn Your crown with a chaplet of peacock feathers,\nYou cause the effusion of the all pervading sound of Your flute,\nYou are graced by the beauty of numerous ornaments and are surrounded by cowherd maids.\nWhile You delight our eyes by Your sight,\nIf You were to only glance upon us,\nThen all the deep-seated desires of our hearts would be fulfilled.","source":"Śrī Sarva Bhaṭṭa"},{"number":110,"topic":"Denunciation Of Mokṣa","devanagari":"भक्ति: सेवा भगवतो मुक्तिस्तत्पदलङ्घनम् ।\nको मूढो दासतां प्राप्य प्राभवं पदमिच्छति ।।","iast":"bhakti: sevā bhagavato muktistatpadalaṅghanam |\nko mūḍho dāsatāṃ prāpya prābhavaṃ padamicchati ||","meaning":"Bhakti consists of service to Bhagavān while the aspiration for mukti* disregards such a privilege.\nAfter attaining to the state of servitude to the Lord, which fool would wish for the emancipation of his soul in the state of mukti?","source":"Śrī Śivamauni"},{"number":111,"topic":"Denunciation Of Mokṣa","devanagari":"भवबन्धच्छिदे तस्यै स्पृहयामि न मुक्तये ।\nभवान् प्रभुरहं दास इति यत्र विलुप्यते ।।","iast":"bhavabandhacchide tasyai spṛhayāmi na muktaye |\nbhavān prabhurahaṃ dāsa iti yatra vilupyate ||","meaning":"(O my Lord)\nI have no desire for mukti which destroys the shackles of worldly existence.\nFor in that state is lost that blessed relationship in which You are my master and I Your servant.","source":"Lord Hanūmāna"},{"number":112,"topic":"Denunciation Of Mokṣa","devanagari":"हन्त चित्रीयते मित्र स्मृत्वा तान् मम मानसम्।\nविवेकिनोऽपि ये कुर्युस्तृष्णामात्यन्तिके लये।।","iast":"hanta citrīyate mitra smṛtvā tān mama mānasam|\nvivekino’pi ye kuryustṛṣṇāmātyantike laye||","meaning":"Alas my friend!\nMy mind wonders at the thought of those persons who, despite being spiritually enlightened, crave for the absolute dissolution of their souls (in the state of nirvāṇa).","source":"Anonymous"},{"number":113,"topic":"Denunciation Of Mokṣa","devanagari":"का त्वं मुक्तिरुपागतास्मि भवती कस्मादकस्मादिह\nश्रीकृष्णस्मरणेन देव भवतो दासीपदं प्रापिता।\nदूरे तिष्ठ मनागनागसि कथं कुर्यादनार्यं मयि\nत्वद्गन्धान्निजनामचन्दनरसालेपस्य लोपो भवेत्।।","iast":"kā tvaṃ muktirupāgatāsmi bhavatī kasmādakasmādiha\nśrīkṛṣṇasmaraṇena deva bhavato dāsīpadaṃ prāpitā|\ndūre tiṣṭha manāganāgasi kathaṃ kuryādanāryaṃ mayi\ntvadgandhānnijanāmacandanarasālepasya lopo bhavet||","meaning":"Devotee: Who are you?\nMukti: I am Mukti and have come here seeking you, your lordship.\nDevotee: Why have you come here uninvited and unannounced, and who has sent you?\nMukti: My Lord! By the power of your meditation on Śrī Kṛṣṇa I have come to be assigned as your servant.\nDevotee: Then be seated at a distance (come not near me)! Why do you wish to defile me who is most sinless? By your smell alone will be destroyed the sandalwood like unguent of the holy name of the Lord by which I have anointed myself.","source":"Anonymous"},{"number":114,"topic":"Eulogizing Bhāgavata Dharma","devanagari":"अर्च्ये विष्णौ शिलाधीर्गुरुषु नरमतिर्वैष्णवे जातिबुद्धि-\nर्विष्णोर्वा वैष्णवानां कलिमलथमने पादतीर्थेऽम्बुबुद्धिः।\nश्रीविष्णोर्नाम्नि मन्त्रे सकलकलुषहे शब्दसामान्यबुद्धि-\nर्विष्णौ सर्वेश्वरेशे तदितरसमधीर्यस्य वा नारकी सः।।","iast":"arcye viṣṇau śilādhīrguruṣu naramatirvaiṣṇave jātibuddhi-\nrviṣṇorvā vaiṣṇavānāṃ kalimalathamane pādatīrthe’mbubuddhiḥ|\nśrīviṣṇornāmni mantre sakalakaluṣahe śabdasāmānyabuddhi-\nrviṣṇau sarveśvareśe taditarasamadhīryasya vā nārakī saḥ||","meaning":"The person who considers\nThe installed temple deity of Lord Viṣṇu as no more than a piece of stone,\nThe guru as an ordinary human being,\nThe vaiṣṇavas* as just another social community,\nThe caraṇa-amṛta** of the temple deity of Viṣṇu or of His devotees, which removes the impurities of this age of kali-yuga, to be plain water,\nThe mantra comprising the names of Viṣṇu, which is the destroyer of all sins, to be an ordinary sound,\nAnd Lord Viṣṇu to be no different from the other gods, when in fact He is the Lord of all gods,\nSuch a person verily is fit to be a denizen of hell.","source":"A devotee from South India"},{"number":115,"topic":"Eulogizing Bhāgavata Dharma","devanagari":"हत्यां हन्ति यदङ्घ्रिसङ्गतुलसी स्तेयं च तोयं पदे\nनैवेद्यं बहुमद्यपानदुरितं गुर्वङ्गनासङ्गजम् ।\nश्रीशाधीनमतिः स्थितिर्हरिजनैस्तत्सङ्गजं किल्विषं\nशालग्रामशिलानृसिंहमहिमा कोऽप्येष लोकोत्तरः।।","iast":"hatyāṃ hanti yadaṅghrisaṅgatulasī steyaṃ ca toyaṃ pade\nnaivedyaṃ bahumadyapānaduritaṃ gurvaṅganāsaṅgajam |\nśrīśādhīnamatiḥ sthitirharijanaistatsaṅgajaṃ kilviṣaṃ\nśālagrāmaśilānṛsiṃhamahimā ko’pyeṣa lokottaraḥ||","meaning":"The leaves of the holy Tulasi plant, which have come in contact with the feet of the Lord, destroy the sin of murder.\nThe water left over from washing the feet of the Lord removes the sin of theft.\nThe preparations of food offered to the Lord negate the sin of indulging in alcohol.\nMeditation upon the Lord, Who is the husband of Lakṣmī-Devī, absolves a man guilty of the sin of copulating with his guru's wife.\nA person who has been defiled by the association of these four types of sinners, is redeemed by associating with those devotees of the Lord who serve the Śālagrāma* stone.\nSuch is the transcendental glory of the sacred Śālagrāma stone, which is but the embodiment of Lord Nrsimha Himself.","source":"The Āgama (Pañcarātra Saṃhitā)"},{"number":116,"topic":"Prayers To The Lord While Making Offerings To The Deity","devanagari":"द्विजस्त्रीणां भक्ते मृदुनि विदुरान्ने व्रजगवां\nदधिक्षीरे सख्यः स्फुटचिपिटमुष्टौ मुररिपो ।\nयशोदायाः स्तन्ये व्रजयुवतिदत्ते मधुनि ते\nयथासीदामोदस्तमयमुपहारेऽपि कुरुताम् ।।","iast":"dvijastrīṇāṃ bhakte mṛduni vidurānne vrajagavāṃ\ndadhikṣīre sakhyaḥ sphuṭacipiṭamuṣṭau muraripo |\nyaśodāyāḥ stanye vrajayuvatidatte madhuni te\nyathāsīdāmodastamayamupahāre’pi kurutām ||","meaning":"O Muraripu, foe of the demon Mura,\nYou took great delight in accepting\nThe boiled rice offered to You by the wives of the brāhmaṇas of Mathurā,\nThe tender vegetables fed to You by Vidura,\nThe milk and yogurt obtained from the cows of Vraja,\nThe fistful of flattened rice brought to You by your friend Sudāmā,\nThe milk flowing from the breasts of mother Yaśodā,\nAnd the sweets brought by the young gopīs of Vraja.\nJust as You took immense pleasure in savouring the offerings of these great devotees,\nSo please do accept this offering I am making to You.","source":"Śrī Rāmānuja"},{"number":117,"topic":"Prayers To The Lord While Making Offerings To The Deity","devanagari":"या प्रीतिर्विदुरार्पिते मुररिपो कुन्त्यार्पिते यादृशी\nया गोवर्धनमूर्ध्नि या च पृथके स्तन्ये यशोदार्पिते ।\nभारद्वाजसमर्पिते शवरिकादत्तेऽधरे योषितां\nया वा ते मुनिभाविनीविनिहितेऽन्नेऽत्रापि तामर्पय ।।","iast":"yā prītirvidurārpite muraripo kuntyārpite yādṛśī\nyā govardhanamūrdhni yā ca pṛthake stanye yaśodārpite |\nbhāradvājasamarpite śavarikādatte’dhare yoṣitāṃ\nyā vā te munibhāvinīvinihite’nne’trāpi tāmarpaya ||","meaning":"O Muraripu, enemy of Mura,\nThe love that You bestowed upon\nThe offerings of Vidura,\nThose of queen Kuntī,\nThe offerings made to Govardhana Hill by the residents of Vraja,\nThe flattened rice given by Sudāmā,\nThe breast-milk of mother Yaśodā,\nThe sumptuous dishes offered by the sage Bhārdvāja,\nThe berries fed to You by the savage woman Śabarī,\nUpon the nectar of the lips of the gopis,\nAnd upon the various preparations of the wives of the brāhmaṇas\nof Mathurā,\nThat love, O Lord, please bestow upon this offering of mine.","source":"Anonymous"},{"number":118,"topic":"Prayers To The Lord While Making Offerings To The Deity","devanagari":"न्यस्तेऽस्मिन् पुरस्त्वमर्पय हरे रम्योपहारे रतिम् ।।","iast":"nyaste’smin purastvamarpaya hare ramyopahāre ratim ||","meaning":"The satiation You experienced, O Lord Hari,\nIn the milk offered to You by Śyāmalā,\nIn the dessert brought by Kamalā,\nIn the laḍḍu sweets given by Bhadrā,\nAnd in the honey procured for You by Somābhā,\nA hundred times that pleasure,\nMay You bestow in the form of Your love,\nUpon this delightful gift that I place, under the directions of Your beloved Rādhā, before You.","source":"Śri Rūpa Gosvāmī"},{"number":119,"topic":"The Glories Of The City Of Mathurā","devanagari":"हे मातर्मथुरे त्वमेव नियतं धन्यासि भूमीतले\nनिर्व्याजं नतयः शतं सविधयस्तुभ्यं सदा सन्तु नः।\nहित्वा हन्त नितान्तम्अद्भुतगुणं वैकुण्ठमुत्कण्ठया\nत्वय्यम्भोजविलोचनः स भगवान् येनावतीर्णो हरिः ।।","iast":"he mātarmathure tvameva niyataṃ dhanyāsi bhūmītale\nnirvyājaṃ natayaḥ śataṃ savidhayastubhyaṃ sadā santu naḥ|\nhitvā hanta nitāntamadbhutaguṇaṃ vaikuṇṭhamutkaṇṭhayā\ntvayyambhojavilocanaḥ sa bhagavān yenāvatīrṇo hariḥ ||","meaning":"O mother Mathurā, you are without doubt the most blessed city on the face of the earth.\nMay the hundreds of obeisances we make, with utmost purity of feeling and with due regard to religious rituals, be always accepted by you.\nYou are so glorious, that the lotus-eyed Lord Hari, forsaking all the great delights of His divine abode Vaikuṇṭha, has with great eagerness, chosen to descend unto none other city but you.","source":"Anonymous"},{"number":120,"topic":"The Glories Of The City Of Mathurā","devanagari":"अत्रासीत् किल नन्दसद्म शकटस्यात्राभवद्भञ्जनं\nबन्धच्छेदकरोऽपि दामभिरभूद् बद्धोऽत्र दामोदरः।\nइत्थं माथुरवृद्धवक्त्रविगलत्पीयूषधारां पिब-\nन्नानन्दाश्रुधरः कदा मधुपुरीं धन्यश्चरिष्याम्यहम्।।","iast":"atrāsīt kila nandasadma śakaṭasyātrābhavadbhañjanaṃ\nbandhacchedakaro’pi dāmabhirabhūd baddho’tra dāmodaraḥ|\nitthaṃ māthuravṛddhavaktravigalatpīyūṣadhārāṃ piba-\nnnānandāśrudharaḥ kadā madhupurīṃ dhanyaścariṣyāmyaham||","meaning":"Here, verily, in this city of Mathurā,\nWas located the palace of Lord Nanda,\nDid Kṛṣṇa, as quite a boy, slay the demon Śakaṭa,\nAnd was the Supreme Lord Dāmodara*, Who cuts the worldly fetters of His devotees, Himself tied down by His mother Yaśodā, with a rope around His waist.\nOh! When will I,\nSavouring the streams of the nectar of spiritual wisdom flowing from the mouths of the aged savants of Mathurā,\nAnd graced with tears of divine bliss,\nBe so blessed as to traverse this city of Madhupurī (Mathurā).","source":"Śrī Kaviśekhara"},{"number":121,"topic":"The Glories Of The City Of Mathurā","devanagari":"यत्राखिलादिगुरुरम्बुजसम्भवोऽपि\nस्तम्बात्मना जनुरनु स्पृहयाम्बभूव।\nचक्रध्वजाङ्कुशलसत्पदराजिरम्या\nसा राजतेऽद्य मथुरा हरिराजधानी।।","iast":"yatrākhilādigururambujasambhavo’pi\nstambātmanā januranu spṛhayāmbabhūva|\ncakradhvajāṅkuśalasatpadarājiramyā\nsā rājate’dya mathurā harirājadhānī||","meaning":"The city of Mathurā,\nWhere the lotus-born Lord Brahmā, the original guru of the whole universe, yearned to take birth as a clump of grass.\nWhich at the time of the appearance of the Lord (thousands of years ago), was as enchanting as the distinguishing marks* of the discus, flag and the elephant-goad, on the feet of the Lord.\nThat capital city of Lord Hari is, even to this day, as resplendent as ever.","source":"Anonymous"},{"number":122,"topic":"The Glories Of The City Of Mathurā","devanagari":"मध्नातु व्यसनानि माथुरपुरी सा वः श्रियं च क्रियात् ।।","iast":"madhnātu vyasanāni māthurapurī sā vaḥ śriyaṃ ca kriyāt ||","meaning":"The city of Mathurā blesses her residents with two forms of spiritual potencies -- Tāraka and Pāraka.\nTāraka delivers the soul from all the accretions of sin and comprises the seed of the tree of salvation (mukti).\nPāraka causes to fulfill all the desires of one's heart and is the abode of the quintessence of divine love (prema-rasa).\nO city of Mathurā! Destroy all our misfortunes and bless us with every felicity.","source":"Śrī Rūpa Gosvāmī"},{"number":123,"topic":"The Glories Of The City Of Mathurā","devanagari":"वितरति मुरमर्दनः प्रभुस्ते\nन हि भजमानजनाय यं कदापि।\nवितरसि वत भक्तियोगमेतं\nतव मधुरे महिमा गिरामभूमिः।।","iast":"vitarati muramardanaḥ prabhuste\nna hi bhajamānajanāya yaṃ kadāpi|\nvitarasi vata bhaktiyogametaṃ\ntava madhure mahimā girāmabhūmiḥ||","meaning":"O Mathurā! The great benediction of bhakti-yoga,\nWhich your Lord Muramardana, the slayer of the demon Mura, does not, ever, grant to even those who are engaged in His worship,\nThat do you bestow upon those residing within you.\nYour glory thus, O Mathurā, is beyond the scope of words.","source":"Śrī Rūpa Gosvāmī"},{"number":124,"topic":"The Glories Of The City Of Mathurā","devanagari":"श्रवणे मधुरा नयने मधुरा\nवदने मधुरा हृदये मधुरा ।\nपुरतो मधुरा परतो मधुरा\nमधुरा मधुरा मधुरा मधुरा ।।","iast":"śravaṇe madhurā nayane madhurā\nvadane madhurā hṛdaye madhurā |\npurato madhurā parato madhurā\nmadhurā madhurā madhurā madhurā ||","meaning":"May I always hear the name of Mathurā,\nMay my eyes constantly witness the scenery of Mathurā city.\nMay I incessantly utter praises of Mathurā,\nMay Mathurā forever dwell in my heart.\nMay Mathurā be in front of me and behind me as well.\nMathurā is sweet; sweet is Mathurā.","source":"Śrī Govinda Miśra"},{"number":125,"topic":"Eulogy To Vṛndāvana","devanagari":"त्वं भज हिरण्यगर्भं त्वमपि हरं त्वं च तत्परं ब्रह्म ।\nविनिहितकृष्णानन्दामहं तु वृन्दाटवीं वन्दे ।।","iast":"tvaṃ bhaja hiraṇyagarbhaṃ tvamapi haraṃ tvaṃ ca tatparaṃ brahma |\nvinihitakṛṣṇānandāmahaṃ tu vṛndāṭavīṃ vande ||","meaning":"May you worship Hiraṇyagarbha (Lord Brahmā),\nOr may you worship Hara (Lord Śiva),\nOr may you worship the Supreme Brahman.\nI, however, worship Vṛndāvana, where the bliss of Kṛṣṇa is placed.\n(As for me)\nI adore only Vṛndāvana, which is imbued with the divine bliss that is Kṛṣṇa.","source":"Anonymous"},{"number":126,"topic":"Eulogy To Vṛndāvana","devanagari":"श्रुतिमितरे स्मृतिम्परे भारतमन्ये भजन्तु भवभीताः।\nअहमਿਹ नन्दं वन्दे यस्यालिन्दे परं ब्रह्म।।","iast":"śrutimitare smṛtimpare bhāratamanye bhajantu bhavabhītāḥ|\nahamaਿਹ nandaṃ vande yasyālinde paraṃ brahma||","meaning":"Of those who are fearful of the never-ending cycle of birth, death and rebirth,\nSome take recourse to Veda,\nWhile others resort to dharma-śāstra*,\nAnd some repose faith in the Mahābhārata.\n(As for me)\nI worship that Lord Nanda, on whose doorstep is (playing and frolicking) the Supreme Brahman (Lord Kṛṣṇa).","source":"Śrī Raghupati Upādhyāya"},{"number":127,"topic":"Eulogy To Vṛndāvana","devanagari":"बन्धूकारुणवसनं सुन्दरभ्रू मुकुन्दहतनयनम्।\nनन्दं तुन्दिलवपुषं चन्दनगौरत्विषं वन्दे।।","iast":"bandhūkāruṇavasanaṃ sundarabhrū mukundahatanayanam|\nnandaṃ tundilavapuṣaṃ candanagauratviṣaṃ vande||","meaning":"Lord Nanda, who is adorned in red attire of the colour of the flowers of the Bandhūka tree,\nWhose eyebrows are extremely beautiful,\nWhose eyes have been captivated by his son Mukunda,\nWho has a large beautiful belly,\nWhose body is resplendent as the white hue of sandalwood.\nTo that Lord Nanda, I offer my salutations.","source":"Śrī Rūpa Gosvāmī"},{"number":128,"topic":"Eulogy To Vṛndāvana","devanagari":"अङ्गपङ्कजनामां नव्यघनामां विचित्ररुचिसिचयाम्।\nविरचितजगत्प्रमोदां मुहुर्यशोदां नमस्यामि।।","iast":"aṅgapaṅkajanāmāṃ navyaghanāmāṃ vicitrarucisicayām|\nviracitajagatpramodāṃ muhuryaśodāṃ namasyāmi||","meaning":"Mother Yaśodā, on whose lap is ensconced our Lord Paṅkajanābha*,\nWho exudes the splendid hue of a fresh rain-cloud,\nWhose attire is splendidly variegated,\nWho (by her love) caused the manifestation of our Lord for the sake of delighting the whole world,\nTo that mother Yaśodā, do I, again and again, offer my obeisance.","source":"Śrī Rūpa Gosvāmī"},{"number":129,"topic":"Lord Kṛṣṇa’S Childhood Exploits","devanagari":"अतिलोहितकरचरणं मङ्गलगोरोचनातिलकम्।\nहठपरिवर्तितशकटं मुररिपुमुत्तानशायिनं वन्दे।।","iast":"atilohitakaracaraṇaṃ maṅgalagorocanātilakam|\nhaṭhaparivartitaśakaṭaṃ muraripumuttānaśāyinaṃ vande||","meaning":"I offer my salutations to my Lord Muraripu, the enemy of the demon Mura,\nWhose (tiny) hands and feet are radiant with reddish tinge,\nWhose forehead is decorated with a charming yellow tilaka of goracanā*,\nWho has forcefully overturned His toy cart,\nAnd Who is now playfully reclining on His back.","source":"Anonymous"},{"number":130,"topic":"Lord Kṛṣṇa’S Childhood Exploits","devanagari":"अधोन्मीलितलोचनस्य पिबतः पर्याप्तमेकं स्तनं\nसद्यःप्रस्तुतदुग्धदिग्धमपरं हस्तेन सम्मार्जत: ।\nमात्रा चाङ्गुलिलालितस्य वदने स्मेरायमाने मुहु-\nविष्णोः क्षीरकणोरुधामधवला दन्तद्युतिः पातु वः ।।","iast":"adhonmīlitalocanasya pibataḥ paryāptamekaṃ stanaṃ\nsadyaḥprastutadugdhadigdhamaparaṃ hastena sammārjata: |\nmātrā cāṅgulilālitasya vadane smerāyamāne muhu-\nviṣṇoḥ kṣīrakaṇorudhāmadhavalā dantadyutiḥ pātu vaḥ ||","meaning":"With His eyes half-closed, our Lord* is suckling the breast of mother Yaśodā.\nWhile one breast is sufficient for the Lord’s satiation, milk instantly begins to flow from the second breast as well, and upon which the Lord playfully rubs the breast with His hand.\nMother Yaśodā fondles the Lord’s face while He is constantly smiling.\nAs He smiles, His glittering teeth appear whiter and brighter than the large droplets of milk smeared on His face.\nO Lord Viṣṇu! (Who so delights mother Yaśodā)!\nProtect us (from worldliness and ignorance)!","source":"Śrī Maṅgala"},{"number":131,"topic":"Lord Kṛṣṇa’S Childhood Exploits","devanagari":"गोपेशवरीवदनचूतकृतितलोलनेत्रं\nजानुद्वयेन धरणीमनु सञ्चरन्तम् ।\nकश्चिन्नवस्मितसुधामधुराधराभं\nबालं तमालदलनीलमहं भजामि ।।","iast":"gopeśavarīvadanacūtakṛtitalolanetraṃ\njānudvayena dharaṇīmanu sañcarantam |\nkaścinnavasmitasudhāmadhurādharābhaṃ\nbālaṃ tamāladalanīlamahaṃ bhajāmi ||","meaning":"The Lord’s eyes quiver in delight when the queen of gopis, mother Yaśodā, blows a puff of air on His face.\nHe then begins moving on His knees and frolics about on the ground.\nAnd His gentle laughter exudes the nectar of innocence from His charming lips.\nThat little boy (Kṛṣṇa), Whose complexion is dark as the leaves of a Tamāla tree,\nDo I worship.","source":"Śrī Raghunātha Dāsa"},{"number":132,"topic":"Lord Kṛṣṇa’S Childhood Exploits","devanagari":"काननं क्व नयनं क्व नासिका\nक्व श्रुतिः क्व शिखेति देशितः।\nतत्र तत्र निहिताङ्गुलीदलो\nवल्लवीकुलमनन्दयत् प्रभुः।।","iast":"kānanaṃ kva nayanaṃ kva nāsikā\nkva śrutiḥ kva śikheti deśitaḥ|\ntatra tatra nihitāṅgulīdalo\nvallavīkulamanandayat prabhuḥ||","meaning":"(While playing with the infant Lord)\nA group of gopis playfully ask Him:\n“Where is Thy face?\nWhere are Thy eyes?\nWhere is Thy nose?\nWhere are Thy ears?\nWhere is Thy śikhā?\nShow them to us!”\nThe Lord then, placing His fingers at the respective places, causes immense delight to the gopis.","source":"Śrī Kavi Sārvabhauma"},{"number":133,"topic":"Lord Kṛṣṇa’S Childhood Exploits","devanagari":"इदानीमङ्गमाक्षालि रचिं चानुलेपनम्।\nइदानीमेव ते कृष्ण धूलीधूसरितं वपुः।।","iast":"idānīmaṅgamākṣāli raciṃ cānulepanam|\nidānīmeva te kṛṣṇa dhūlīdhūsaritaṃ vapuḥ||","meaning":"(Mother Yaśodā addresses Kṛṣṇa thus:-)\n\"Only just now had I bathed You and anointed You with unguents.\nAnd now O Kṛṣṇa! (O naughty One), You have already rendered Yourself grey with dust (by Your playful antics).\"","source":"Śrī Sārvabhauma Bhaṭṭācārya"},{"number":134,"topic":"Lord Kṛṣṇa’S Childhood Exploits","devanagari":"पञ्चवर्षमतिलोलमङ्गने\nधावमानमलकाकुलेक्षणम्।\nकिङ्किणीवलयहारनूपुरै\nरक्षितं नमत नन्दनन्दनम्।।","iast":"pañcavarṣamatilolamaṅgane\ndhāvamānamalakākulekṣaṇam|\nkiṅkiṇīvalayahāranūpurai\nrakṣitaṃ namata nandanandanam||","meaning":"(O devotees of the Lord who are absorbed in vātsalya bhāva*)\nOffer your salutations to the son of Nanda,\nWho, at the tender age of five years, is playing about in the courtyard of His father’s house,\nWhose eyes are obscured by His hair falling over them,\nAnd Who is adorned with a small bell around His waist, with a bracelet, a necklace and with anklets.","source":"The Āgama (Pañcarātra Saṃhitā)"},{"number":135,"topic":"The Lord'S Boyish Playfulness During His Infancy","devanagari":"अधरमधरे कण्ठं कण्ठे सचाटु दृशौ दृशो-\nरलिकमलिके कृत्वा गोपीजनेन ससम्भ्रमम् ।\nशिशुरिति रुदन् कृष्णो वक्ष:स्थले निहितश्चिरा-\nत्रिभृतपुलक: स्मेर: पायात् स्मरालसविग्रह: ।।","iast":"adharamadhare kaṇṭhaṃ kaṇṭhe sacāṭu dṛśau dṛśo-\nralikamalike kṛtvā gopījanena sasambhramam |\nśiśuriti rudan kṛṣṇo vakṣa:sthale nihitaścirā-\ntribhṛtapulaka: smera: pāyāt smarālasavigraha: ||","meaning":"Seeing the baby Kṛṣṇa crying,\nThe gopis hastily picked Him up and then they gently placed their lips against His lips,\nTheir necks against His neck,\nTheir eyes against His eyes,\nAnd their foreheads against His forehead.\nThey then placed Him against their bosoms for a very long time.\nUpon doing so the bodies of the gopis became charged with horripilation,\nAnd as they smiled languidly, their bodies succumbed to the lassitude of loving emotion.\nThey then began to pray thus, “O Lord! Protect* us!","source":"Śrī Divākara"},{"number":136,"topic":"The Lord'S Boyish Playfulness During His Infancy","devanagari":"ब्रूमस्त्वच्चरितं तवाभि जननीं छद्मातिबालाकृते\nत्वं यादृग् गिरिकन्दरेषु नयनानन्दः कुरङ्गीदृशाम् ।।\nइत्युक्तः परिलेहनच्छलतया न्यस्ताङ्गुलिः स्वानने\nगोपीभिः पुरतः पुनातु जगतीमुत्तानसुप्तो हरिः ।।","iast":"brūmastvaccaritaṃ tavābhi jananīṃ chadmātibālākṛte\ntvaṃ yādṛg girikandareṣu nayanānandaḥ kuraṅgīdṛśām ||\nityuktaḥ parilehanacchalatayā nyastāṅguliḥ svānane\ngopībhiḥ purataḥ punātu jagatīmuttānasupto hariḥ ||","meaning":"“You have assumed this child form to deceive us, but we shall narrate all Your naught exploits to Your mother. That is, how You delight the deer-eyed gopis in the mountain caves (by Your amorous deeds)”.\nThe gopis having thus spoken, the Lord, with the pretext of suckling, placed His finger in His mouth. He then lay down on His back and went to sleep in the presence of the gopis.\nO Lord Hari! May You purify the earth You recline upon.","source":"Śrī Vanamālī"},{"number":137,"topic":"The Lord'S Boyish Playfulness During His Infancy","devanagari":"वनमालिनि पितुरङ्गे रचयति बाल्योचितं चरितम् ।\nनवनवगोपवधूटीस्मितपरिपाटी परिस्फुरति ।।","iast":"vanamālini pituraṅge racayati bālyocitaṃ caritam |\nnavanavagopavadhūṭīsmitaparipāṭī parisphurati ||","meaning":"When Lord Vanamālī, Who is adorned with a chaplet of wild-flowers,\nWhile seated on His father’s lap, indulges in deeds befitting His childlike nature,\nThen the young gopīs break out into a cascade of gentle laughter.","source":"Śrī Mukunda Bhaṭṭācārya"},{"number":138,"topic":"The Lord'S Boyish Playfulness During His Infancy","devanagari":"नीतं नवनवनीतं कियदिति कृष्णो यशोदया पृष्टः।\nइयदिति गुरुजनसविधे विधृतधनिष्ठापयोधरः पायात्।।","iast":"nītaṃ navanavanītaṃ kiyaditi kṛṣṇo yaśodayā pṛṣṭaḥ|\niyaditi gurujanasavidhe vidhṛtadhaniṣṭhāpayodharaḥ pāyāt||","meaning":"\"How much fresh butter have You taken away?\" asked mother Yaśodā to Kṛṣṇa.\n\"This much!\" replied the Lord and so saying, in the presence of His elders, swiftly grasped His mother's breast.\nMay the Lord (Who engages in such delightful līlās) protect us!","source":"Śrī Sāraṅga"},{"number":139,"topic":"The Lord'S Boyish Playfulness During His Infancy","devanagari":"क्व यासि ननु चौरिके प्रमुषितं स्फुटं दृश्यते\nद्वितीयमिह मामकं वहसि कञ्चुके कन्दुकम्।\nत्यजेति नवगोपिकाकुचयुगं निमथ्नन् बला-\nल्लसत्पुलकमण्डलो जयति गोकुले केशवः।।","iast":"kva yāsi nanu caurike pramuṣitaṃ sphuṭaṃ dṛśyate\ndvitīyamiha māmakaṃ vahasi kañcuke kandukam|\ntyajeti navagopikākucayugaṃ nimathnan balā-\nllasatpulakamaṇḍalo jayati gokule keśavaḥ||","meaning":"\"Where are you going, you thief of a gopī?\nThe two playing balls of mine that you have stolen from me and are concealing beneath your bodice are clearly visible to Me.\nReturn them to Me!\"\nSaying thus, the Lord began forcefully caressing the breasts of the young gopi.\nAnd on doing so, the Lord's body began to bloom with horripilation.\nGlory be to that Lord Keśava,\nWho is endowed with beautiful, luxuriant hair,\nAnd Who graces Gokula by His very presence.","source":"Śrī Dīpaka"},{"number":140,"topic":"The Lord Steals Butter","devanagari":"दूरदृष्टनवनीतभाजनं\nजानुचङ्क्रमणजातसम्भ्रमम्।\nमातृभीतिपरिवर्तिताननं\nकैशवं किमपि शैशवं भजे।।","iast":"dūradṛṣṭanavanītabhājanaṃ\njānucaṅkramaṇajātasambhramam|\nmātṛbhītiparivartitānanaṃ\nkaiśavaṃ kimapi śaiśavaṃ bhaje||","meaning":"I worship that wonderful Lord in His child-form,\nWho, becoming wistful upon spying the butter-pot from a distance,\nbegan moving towards it tortuously on His knees.\nBut Who (suddenly) turned His face away from the butter-pot for\nfear of His mother (who would have become angry had He stolen\nthe butter).","source":"Anonymous"},{"number":141,"topic":"The Lord Steals Butter","devanagari":"सम्मुष्णन् नवनीतमन्तिकमणिस्तम्भे स्वबिम्बोगमं\nदृष्ट्वा मुग्धतया कुमारमपरं सञ्चिन्तयन् शङ्कया।।\nमन्मित्रं हि भवान् मयात्र भवतो भागः समः कल्पितो।\nमा मां सूचय सूचयेत्यनुयनन् बालो हरिः पातु वः।।","iast":"sammuṣṇan navanītamantikamaṇistambhe svabimbogamaṃ\ndṛṣṭvā mugdhatayā kumāramaparaṃ sañcintayan śaṅkayā||\nmanmitraṃ hi bhavān mayātra bhavato bhāgaḥ samaḥ kalpito|\nmā māṃ sūcaya sūcayetyanuyanan bālo hariḥ pātu vaḥ||","meaning":"While stealing butter the Lord chanced to see His own reflection in a jewel-studded pillar. In His child-like innocence, He thought His reflection to be another young boy.\nHe then addressed His reflection thus:\n\"Oh! You are my friend. Look, I have set aside your equal share of butter. But please do not complain to my mother or else she will spank Me (for stealing butter).\"\nMay Lord Hari, Who in the form of a little boy was thus pleading with His own reflection, protect you.","source":"Anonymous"},{"number":142,"topic":"The Lord Steals Butter","devanagari":"दधिमथननिनादैस्त्यक्तनिद्रः प्रभाते\nनिभृतपदमगारं वल्लवीनां प्रविष्टः।\nमुखकमलसमीरैराशु निर्वाप्य दीपान्\nकवलितनवनीतः पातु मां बालकृष्णः।।","iast":"dadhimathananinādaistyaktanidraḥ prabhāte\nnibhṛtapadamagāraṃ vallavīnāṃ praviṣṭaḥ|\nmukhakamalasamīrairāśu nirvāpya dīpān\nkavalitanavanītaḥ pātu māṃ bālakṛṣṇaḥ||","meaning":"My Lord Bāla-Kṛṣṇa!\nHaving been awakened in the morning by the sound of the churning of yogurt,\nWalks stealthily into the homes of the cowherd girls,\nExtinguishes the lamps with the breath from His lotus-like mouth,\nAnd eats the butter. May He protect me.\nHastily extinguishes their lamps by blowing from His lotus-like mouth.\nAnd then eats up all the butter (in their homes).\nMay that Lord always protect me!","source":"Anonymous"},{"number":143,"topic":"The Lord Steals Butter","devanagari":"सव्ये पाणौ नियमितरवं किङ्किणीदाम धृत्वा\nकुब्जीभूय प्रपदगतिभिर्मन्दमन्दं विहस्य ।\nअक्षोर्भेङ्ग्या विहसितमुखीर्वारयन् सम्मुखीना\nमातुः पश्चादहरत हरिर्जातु हैयङ्गवीनम् ।।","iast":"savye pāṇau niyamitaravaṃ kiṅkiṇīdāma dhṛtvā\nkubjībhūya prapadagatibhirmandamandaṃ vihasya |\nakṣorbheṅgyā vihasitamukhīrvārayan sammukhīnā\nmātuḥ paścādaharata harirjātu haiyaṅgavīnam ||","meaning":"One day, Lord Hari, (desiring to steal butter),\nMaintaining utmost silence, held firmly in His left hand the thread of the tinkling bell around His waist (so as to make no sound),\nBending forward and moving on tip-toe while sporting a gentle smile,\nGesturing with His eyes to the smiling gopis seated before Him to remain silent,\nCame up from behind His mother and stole away the butter.","source":"Śrī Śrīmata"},{"number":144,"topic":"The Lord Steals Butter","devanagari":"स्मितं बिभ्रद् व्यक्तं दधिहरणलीलाचतुलधीः\nसशङ्कं गोपीनां मधुरिपुरगारं प्रविशति।।","iast":"smitaṃ bibhrad vyaktaṃ dadhiharaṇalīlācatuladhīḥ\nsaśaṅkaṃ gopīnāṃ madhuripuragāraṃ praviśati||","meaning":"Pacing a few steps before placing His feet upon the threshold of the entrance (to the home of a gopi),\nThrowing His gaze in all directions with His roving eyes,\nSporting an unabashed smile, expressing His preoccupation with His naughty designs of stealing butter,\nLord Madhuripu, the enemy of Mura, cautiously enters the homes of the gopis (to steal butter).","source":"Śrī Rūpa Gosvāmī"},{"number":145,"topic":"The Lord Steals Butter","devanagari":"मृदन् क्षीरादिचौर्यनमृणसुरभिणी सृक्कणी पाणिघर्षै-\nराघ्रायाघ्राय हस्तं सपदि परुषयन् किङ्किणीमेखलायाम्।\nवारं वारं विशाले दिशि दिशि विकिरँल्लोचने लोलतारे\nमन्दं मन्दं जनन्याः परिसरमयते कूटगोपालबालः।।","iast":"mṛdan kṣīrādicauryanamṛṇasurabhiṇī sṛkkaṇī pāṇigharṣai-\nrāghrāyāghrāya hastaṃ sapadi paruṣayan kiṅkiṇīmekhalāyām|\nvāraṃ vāraṃ viśāle diśi diśi vikiram̐llocane lolatāre\nmandaṃ mandaṃ jananyāḥ parisaramayate kūṭagopālabālaḥ||","meaning":"Wiping, with His hands, His unctuous, fragrant lips, smeared as they are, with all the milk, yoghurt and butter stolen by Him,\nSmelling His hands again and again, (for the remnants of any butter), He instantly rubs them against the strap bearing the little tinkling bell around His waist,\nHis large eyes, His roving eyeballs, throwing their gaze in every direction, over and over again,\nThe naughty, playful, little cowherd boy, Gopāla, slowly approaches His mother.","source":"Anonymous"},{"number":146,"topic":"The Lord'S Visions In His Dreams","devanagari":"शम्भो स्वागतमास्यतामित इतो वामेन पद्मोद्भव\nक्रौञ्चारे कुशलं सुखं सुरपते वित्तेश नो दृश्यसे ।\nइत्थं स्वप्नगतस्य कैटभरिपोः श्रुत्वा जनन्या गिरः\nकिं किं बालक जल्पसीत्यनुचितं थूथूकृतं पातु वः ।।","iast":"śambho svāgatamāsyatāmita ito vāmena padmodbhava\nkrauñcāre kuśalaṃ sukhaṃ surapate vitteśa no dṛśyase |\nitthaṃ svapnagatasya kaiṭabharipoḥ śrutvā jananyā giraḥ\nkiṃ kiṃ bālaka jalpasītyanucitaṃ thūthūkṛtaṃ pātu vaḥ ||","meaning":"(One day while dreaming in His sleep), the Lord was murmuring --\n\"O Śambhu (Śiva), the giver of prosperity, welcome to you. Come and seat yourself by My side.\nO Brahmā, the lotus-born, be seated to My left.\nO Krauñcāri (Kārtikeya), the one who pierced the Krauñca mountain, I hope you are well.\nO king of gods, Indra, may you be happy.\nO Kubera, god of wealth, I have not seen you in quite some time.\"\nHearing the sleeping Lord, the slayer of the demon Kaiṭabha, speaking thus, mother Yaśodā said --\n\"What nonsense are You murmuring to Yourself\", and then uttered a gentle reprimand.\nMay that mother Yaśodā protect you.","source":"Śrī Mayūra"},{"number":147,"topic":"The Lord'S Visions In His Dreams","devanagari":"धीरा धरित्रि भव भारमवेहि शान्तं\nन्वेष कंसहतकं विनिपातयामि ।\nइत्यद्भुतस्तिमितगोपवधूश्रुतानि\nस्वप्नायितानि वसुदेवशिशोर्जयन्ति ।।","iast":"dhīrā dharitri bhava bhāramavehi śāntaṃ\nnveṣa kaṃsahatakaṃ vinipātayāmi |\nityadbhutastimitagopavadhūśrutāni\nsvapnāyitāni vasudevaśiśorjayanti ||","meaning":"(The Lord said in His dream)\n\"O mother Earth!\nMay you have patience and fortitude.\nMay you be relieved of the burden that you now bear.\nLo! I am vanquishing this wretched demon Kamsa.\"\nHearing thus, the gopis became stupefied with adulation as they marveled at the Lord's expression of His dream.\nGlory be to the dream utterances of the son of Vasudeva!","source":"Śrī Vasudeva"},{"number":148,"topic":"Expressions Of Krsna'S Parents' Astonishment At Their Son'S Exploits. Their Tutelege Of Their Son And Other Sports","devanagari":"कालिन्दीपुलिने मया न न मया शैलोपशल्ये न न\nन्यग्रोधस्य तले मया न न मया राधापितुः प्राङ्गने ।\nदृष्टः कृष्ण इतीरिते सनियमं गोपैर्यशोदापते-\nविस्मेरस्य पुरो हसन्निजगृहान्निर्यन् हरिः पातु वः ।।","iast":"kālindīpuline mayā na na mayā śailopaśalye na na\nnyagrodhasya tale mayā na na mayā rādhāpituḥ prāṅgane |\ndṛṣṭaḥ kṛṣṇa itīrite saniyamaṃ gopairyaśodāpate-\nvismerasya puro hasannijagṛhānniryan hariḥ pātu vaḥ ||","meaning":"(Once when the Lord had been absent from home all day long, His father Nanda made anxious inquires to His friends, who answered thus):\n\"I did not see Him on the banks of the Yamunā\", said one.\n\"I did not see Him in the vicinity of the Govardhana Hill\", said another friend.\n\"I did not see Him in the fig-tree forest\", said a third.\n\"I did not see Him in the courtyard of the house of Rādhā's father (at Barsāna)\", said a fourth.\nThus spoke the cowherd boys, devoted as they were to the Lord, when,\nTo his astonishment, Lord Nanda, husband of Yaśodā, saw Kṛṣṇa emerging from His home, and Who smiling gently, came and stood before him.\nMay Lord Hari, (Who never ceases to astonish His devotees), protect you.","source":"Śrī Umāpatidhara"},{"number":149,"topic":"Expressions Of Krsna'S Parents' Astonishment At Their Son'S Exploits. Their Tutelege Of Their Son And Other Sports","devanagari":"वत्स स्थावरकन्दरेषु विचरन् दूरप्रचारे गवां\nहिंस्रान् वीक्ष्य पुरः पुराणपुरुषं नारायणं ध्यास्यसि ।\nइत्युक्तस्य यशोदया मुररिपोरव्याज्जगन्ति स्फुरद्-\nबिम्बोष्ठद्वयगाढपीडनवशादव्यक्तभावं स्मितम् ।।","iast":"vatsa sthāvarakandareṣu vicaran dūrapracāre gavāṃ\nhiṃsrān vīkṣya puraḥ purāṇapuruṣaṃ nārāyaṇaṃ dhyāsyasi |\nityuktasya yaśodayā murariporavyājjaganti sphurad-\nbimboṣṭhadvayagāḍhapīḍanavaśādavyaktabhāvaṃ smitam ||","meaning":"(As the Lord was setting out to graze His cows, mother Yaśodā was giving Him instructions).\nYaśodā said:\n\"My child! While grazing cows or while wandering in mountain caves, if You happen to go too far, and if You are confronted by wild beasts, then call upon Lord Nārāyaṇa, the Primordial Person. (He will protect You).\"\nMother Yaśodā having thus spoken, Lord Muraripu became amused at His mother's naivete. (Her maternal affection for the child form of the Supreme Lord made her think of Him as an ordinary child).\nThe lips of the Lord, red as the fruit of the Bimba tree, quivered as He smiled to Himself and attempted to conceal His amusement at the intensity of His mother's concern for Him.","source":"Śrī Abhinanda"},{"number":150,"topic":"Expressions Of Krsna'S Parents' Astonishment At Their Son'S Exploits. Their Tutelege Of Their Son And Other Sports","devanagari":"रामो नाम बभूव हुं तदबला सीतेति हुं तां पितु-\nर्वचा पञ्चवटीवने निवसतस्तस्याहरद्रावणः।\nकृष्णस्येति पुरातनीं निजकथामाकर्ण्य मात्रेरितां\nसौमित्रे क्व धनुर्धनुर्ध्नुरिति व्यग्रा गिरः पान्तु वः।।","iast":"rāmo nāma babhūva huṃ tadabalā sīteti huṃ tāṃ pitu-\nrvacā pañcavaṭīvane nivasatastasyāharadrāvaṇaḥ|\nkṛṣṇasyeti purātanīṃ nijakathāmākarṇya mātreritāṃ\nsaumitre kva dhanurdhanurdhnuriti vyagrā giraḥ pāntu vaḥ||","meaning":"(The infant Lord Kṛṣṇa was hearing, from mother Yaśodā, the story of Lord Rāma of Ayodhyā\nAs the Lord listened to attentively to Her words He would exclaim \"Hum!\").\nMother Yaśodā said:\n\"A long time ago there was a king named Rāma.\" \"Hum!\" said the Lord in acknowledgement.\n\"His wife was Sītā.\" said Mother Yaśodā. \"Hum!\" said the Lord once again.\n\"By the order of His father (Daśratha), Rāma went into exile. While He was living in the Pañcavaṭī forest, Sītā was abducted by the demon-king Rāvaṇa',\" continued Mother Yaśodā.\nUpon hearing from His mother the ancient narrative of His own earlier incarnation, Kṛṣṇa, with all the intensity of possession, began expressing Himself as Lord Rāma. He said:\n\"O Saumitra (Lakṣmaṇa)!\nWhere is My bow?\nWhere is My bow?\nWhere is My bow?\"\nMay the impassioned speech of the Lord, Who was thus possessed by His own earlier incarnation, protect you.","source":"Anonymous"},{"number":151,"topic":"Expressions Of Krsna'S Parents' Astonishment At Their Son'S Exploits. Their Tutelege Of Their Son And Other Sports","devanagari":"श्यामोच्चन्द्रा स्वपोषि न शिशो नैति मामम्ब निद्रा\nनिद्राहेतोः शृणु सुत कथां कामपूर्वा कुरुष्व।\nव्यक्तः स्तम्भान्नरहरिरभूदानवं दारयिष्य-\nत्रियुक्तस्य स्मितमुदयते देवकी नन्दनस्य।।","iast":"śyāmoccandrā svapoṣi na śiśo naiti māmamba nidrā\nnidrāhetoḥ śṛṇu suta kathāṃ kāmapūrvā kuruṣva|\nvyaktaḥ stambhānnaraharirabhūdānavaṃ dārayiṣya-\ntriyuktasya smitamudayate devakī nandanasya||","meaning":"Yaśodā said, \"It is late into the night and the moon is high in the sky. Why are You not sleeping my child?\"\nKṛṣṇa replied, \"Sleep does not come to Me tonight\".\nYaśodā said, \"Then listen my son, (to help you fall asleep) I shall tell You a story which is like none You have ever heard.\"\n(So saying Yasoda narrated the story of the incarnation of Lord Nrsimha).\nYasoda said, \"Lord Narahari manifested Himself from a pillar to slay the demon Hiranyakasipu (and to rescue His devotee Prahlada).\"\nHis mother having thus spoken, the face of the son of Devaki* began to bloom with a gentle smile.","source":"Sri Sarvananda"},{"number":152,"topic":"The Lord Protects The Cows And Other Sports","devanagari":"देवस्वामेकजङ्घावलयितलगुडीमूर्ध्नि विन्यस्तबाहु-\nगायन् गोयुद्धगीतिरुपरचितशिरःशेखरः प्रग्रहेण ।\nदर्पस्फूर्जन्महोषद्वयसमरकलाबद्धदीर्घानुबन्धः\nक्रीडागोपालमूर्तिर्मुररिपुरवतात्तात्तगोरक्षलीलः ।।","iast":"devasvāmekajaṅghāvalayitalaguḍīmūrdhni vinyastabāhu-\ngāyan goyuddhagītiruparacitaśiraḥśekharaḥ pragraheṇa |\ndarpasphūrjanmahoṣadvayasamarakalābaddhadīrghānubandhaḥ\nkrīḍāgopālamūrtirmuraripuravatāttāttagorakṣalīlaḥ ||","meaning":"O Lord, You are standing with Your hand upon the crown of Your curved staff that is lying against Your thigh,\nSinging war songs and wearing a wreath made of ropes used for tethering cows,\nYour war cry incites passion in two large bulls to fight each other,\nYou have deep fondness for fighting sports.\n(For the sake of Your devotees) You have assumed the form of the playful cowherd boy, Gopāla,\nAnd, in the likeness of Your exploits as the slayer of the demon Mura, have assumed the pastime of protecting cows.","source":"Śrī Yogeśvara"},{"number":153,"topic":"The Lord Protects The Cows And Other Sports","devanagari":"यावद्गोपा मधुरमुरलीनादसत्ता मुकुन्दं\nमन्दस्पन्दैरहह सकलैरलोचनैरापिबन्ति ।\nगावस्तावनमृणयवसग्रासलुब्धा विदूरं\nयाता गोवर्धनगिरिदरीद्रोणिकाभ्यन्तरेषु ।।","iast":"yāvadgopā madhuramuralīnādasattā mukundaṃ\nmandaspandairahaha sakalairalocanairāpibanti |\ngāvastāvanamṛṇayavasagrāsalubdhā vidūraṃ\nyātā govardhanagiridarīdroṇikābhyantareṣu ||","meaning":"The cowherd boys become inebriated by the sound of Lord Mukunda's flute.\nAnd by the time they savour His form with gently quivering but attentive eyes,\nBy that time their cows, desirous of feasting on soft, sweet grass, disappear far into the caves in the recesses of the Govardhana mountain.","source":"Śrī Keśava Chatrī"},{"number":154,"topic":"The Intense Love Of The Gopīs For Kṛṣṇa","devanagari":"धैर्यं नामपरिग्रहेऽपि जघने यद्यंशुकलम्बनं\nगोपीनां च विवेचनं निधुवनारम्भे रहोमार्गणम् ।\nसाध्वीसच्चरितं विलासविरतौ पत्युर्गुहान्वेषणं\nतत्तद्गौरवरक्षणं मुररिपोर्वंशीरवापेक्षणम् ।।","iast":"dhairyaṃ nāmaparigrahe’pi jaghane yadyaṃśukalambanaṃ\ngopīnāṃ ca vivecanaṃ nidhuvanārambhe rahomārgaṇam |\nsādhvīsaccaritaṃ vilāsaviratau patyurguhānveṣaṇaṃ\ntattadgauravarakṣaṇaṃ murariporvaṃśīravāpekṣaṇam ||","meaning":"The gopis always maintained conscious resolve to uphold their self-restraint and dignity,\nBut upon hearing the enchanting sound of the flute of Lord Muraripu, the intensity of their love would compel them to abandon all inhibitions.\nLetting go of their innermost garments they would care not even to seek a solitary place to perform erotic sports with the Lord.\nWhile absorbed in conjugal bliss with the Lord, they would forsake all commitment to chastity and fail to duly return to their husbands' homes.\nSuch was their love and attraction for the Lord that they became oblivious to preserving their honour and propriety.","source":"Śrī Sarvavidyāvinoda"},{"number":155,"topic":"The Intense Love Of The Gopīs For Kṛṣṇa","devanagari":"विलोक्य कृष्णं व्रजवामनेत्राः\nसर्वेन्द्रियाणां नयनत्वमेव ।\nआकर्ण्य तद्बेणुनिनादभङ्गी-\nमैच्छन् पुनस्ताः श्रवणत्वमेव ।।","iast":"vilokya kṛṣṇaṃ vrajavāmanetrāḥ\nsarvendriyāṇāṃ nayanatvameva |\nākarṇya tadbeṇuninādabhaṅgī-\nmaicchan punastāḥ śravaṇatvameva ||","meaning":"Upon seeing Lord Kṛṣṇa, the fair-eyed damsels of Vraja prayed that all their sensory faculties be changed into the sense of sight.\nBut when they heard the enchanting sound of the Lord's flute, they began to wish for all their senses to acquire the power of hearing.\n(They wanted more eyes to savour the Lord's beauty and more ears to relish the sound of His flute.)","source":"Anonymous"},{"number":156,"topic":"The Lord'S Sports With The Gopīs","devanagari":"कालिन्दीजलेकेलिलोलतरुणीरावीतचीनांशुका\nनिर्गत्याङ्गजलानि सारितवतीरालोक्य सर्वा दिशः।\nतीरोपान्तमिलन्निकुञ्जभवने गूढं चिरात् पश्यतः\nशौरेः सम्भ्रमयन्न्रिमा विजयते साकूतवेणुध्वनिः।।","iast":"kālindījalekelilolataruṇīrāvītacīnāṃśukā\nnirgatyāṅgajalāni sāritavatīrālokya sarvā diśaḥ|\ntīropāntamilannikuñjabhavane gūḍhaṃ cirāt paśyataḥ\nśaureḥ sambhramayannrimā vijayate sākūtaveṇudhvaniḥ||","meaning":"After playing and frolicking in the Yamunā river, the young gopis came out of the water clad in silken undergarments. Shaking off the water from their limbs and looking in all directions (to ensure privacy), the gopis presented a truly colourful spectacle.\nAll this while, Lord Śauri (Kṛṣṇa), seated in a bower on the river-bank, was stealthily gazing at the gopis.\nThe Lord then began playing His flute and this flustered the gopis (who were inadequately clad).\nGlory be to the sound of the flute of the Lord that is pregnant with the sentiment of love!","source":"Śrī Puruṣottamadeva"},{"number":157,"topic":"Krsna'S Love For The Gopīs","devanagari":"विस्रस्तमविजानतो मुरलिकां पादारविन्दोपरि।\nलीलावेलितवल्लवीकवलितस्वान्तस्य वृन्दावने\nजीयात् कंसरिपोस्त्रिभङ्गवपुषः शून्यौदया फूत्कृतिः।।","iast":"visrastamavijānato muralikāṃ pādāravindopari|\nlīlāvelitavallavīkavalitasvāntasya vṛndāvane\njīyāt kaṃsaripostribhaṅgavapuṣaḥ śūnyaudayā phūtkṛtiḥ||","meaning":"The playfully dancing gopis of Vrndāvana captivated the Lord's mind, upon which His body began to tremble and His hands, that are in the likeness of lotus-buds, became effused with perspiration.\nAnd (during this moment of ecstasy) He was unaware that His flute had slipped from His hand and had fallen on His lotus-feet.\nYet the Lord kept blowing vacuously from His mouth (oblivious to the absence of His flute).\nGlory be to the thrice-bent form of the enemy of Kamsa!","source":"Śrī Cirañjīva"},{"number":158,"topic":"Rādhā'S Questions (To Her Friend) When She First Set Sight On Kṛṣṇa","devanagari":"भ्रूवल्लिताण्डवकलामधुराननश्रीः\nकङ्केलिकोरककरम्बितकर्णपूरः।\nकोऽयं नवीननिकषोपलतुल्यवेशो\nवंशीरवेण सखि मामवशीकरोति।।","iast":"bhrūvallitāṇḍavakalāmadhurānanaśrīḥ\nkaṅkelikorakakarambitakarṇapūraḥ|\nko’yaṃ navīnanikaṣopalatulyaveśo\nvaṃśīraveṇa sakhi māmavaśīkaroti||","meaning":"\"My dear friend, Who is this person (Who stands before Me)?\nWhose eyebrows, quivering to and fro, are gracing His pleasant countenance with their artful dance,\nWhose ears are decorated with garlands made of flower-buds of the Aśoka tree,\nWhose body exudes a hue as magnificent as a new unmarked touchstone,\nAnd the sound of Whose flute so captivates My heart?","source":"Anonymous"},{"number":159,"topic":"Rādhā'S Questions (To Her Friend) When She First Set Sight On Kṛṣṇa","devanagari":"इन्दीवरोदरसहोदरमेदुरश्री-\nवासो द्रवत्कनकवृन्दनिभं दधानः।\nआमुक्तमौक्तिकमनोहरहारवक्षाः\nकोऽयं युवा जगदनङ्गमयं करोति।।","iast":"indīvarodarasahodarameduraśrī-\nvāso dravatkanakavṛndanibhaṃ dadhānaḥ|\nāmuktamauktikamanoharahāravakṣāḥ\nko’yaṃ yuvā jagadanaṅgamayaṃ karoti||","meaning":"\"Who is this youth Who exudes the lustre of the unctuous interior of a lotus flower,\nWho is dressed in clothes of the colour of molten gold,\nWhose chest is graced with an enchanting necklace of pearls,\nAnd Who bewitches the whole world?","source":"Śrī Sarvavidyāvinoda"},{"number":160,"topic":"The Friend'S Reply","devanagari":"अस्ति कोऽपि तिमिरस्तनन्धयः\nकिञ्चिदञ्चितपदं स गायति ।\nयन्मनागपि निशम्य का वधू-\nर्नविधूतहृदयोपजायते ।।","iast":"asti ko’pi timirastanandhayaḥ\nkiñcidañcitapadaṃ sa gāyati |\nyanmanāgapi niśamya kā vadhū-\nrnavidhūtahṛdayopajāyate ||","meaning":"\"This is some child of darkness*.\nWho sings verses so enchanting,\nThat upon hearing even a fragment of them,\nThe heart of any newly wed bride would succumb to trepidation.\"","source":"Anonymous"},{"number":161,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"मनोगतां मन्मथबाणबाधा-\nमावेदयन्तीव तनोर्विकारैः ।\nदीनानना वाचमुवाच राधा\nतदा तदालीजनसम्मुखे सा ।।","iast":"manogatāṃ manmathabāṇabādhā-\nmāvedayantīva tanorvikāraiḥ |\ndīnānanā vācamuvāca rādhā\ntadā tadālījanasammukhe sā ||","meaning":"Afflicted by the arrows of Cupid.\nExpressing Her heart's woes by physical symptoms.\nWearing a crestfallen expression on Her face,\nRādhā spoke of Her feelings to Her friends.","source":"Śrī Puruṣottamadeva"},{"number":162,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"यदवधि यामुनकुञ्जे धनरुचिरवलोकितः कोऽपि ।\nनलिनीदल इव सलिलं तदवधि तरलायते चेतः ।।","iast":"yadavadhi yāmunakuñje dhanaruciravalokitaḥ ko’pi |\nnalinīdala iva salilaṃ tadavadhi taralāyate cetaḥ ||","meaning":"(Rādhā said to Her friends:)\n\"Ever since, in the woods on the banks of the Yamunā, I have seen some person exuding the hue of a rain-cloud, My mind has become as fickle as water on a lotus-leaf.\"","source":"Śrī Kavicandra"},{"number":163,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"अकस्मादेकस्मिन् पथि सखि मया यामुनतटं\nव्रजन्त्या दृष्टोऽयं नवजलधरश्याममतनुः ।\nस दृग्भङ्ग्या किं वा कुरुत न हि जाने तत इदं\nमनो मे व्यालोलं क्वचन गृहकृत्ये न बलते ।।","iast":"akasmādekasmin pathi sakhi mayā yāmunataṭaṃ\nvrajantyā dṛṣṭo’yaṃ navajaladharaśyāmamatanuḥ |\nsa dṛgbhaṅgyā kiṃ vā kuruta na hi jāne tata idaṃ\nmano me vyālolaṃ kvacana gṛhakṛtye na balate ||","meaning":"(Rādhā said to Her friend:)\n\"O sakhi!\nWhile roaming on the banks of the Yamunā river,\nSuddenly did I set My eyes upon this person on a pathway. Whose body was in the likeness of a dark, fresh rain-cloud.\nI know not what He did to Me when He gave Me a sidelong glance,\nFor since then, My mind, having lost its composure, finds no interest in any household work.”","source":"Śrī Jayanta"},{"number":164,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"पुरो नीलज्योत्स्ना तदनु मृगनाभीपरिमल-\nस्ततो लीलावेणुक्वणितमनु काञ्चीकलरवः।\nततो विद्युद्वलीवलयितचत्कारलहरी-\nतरङ्गालावण्यं तदनु सहजानन्द उदगात्।।","iast":"puro nīlajyotsnā tadanu mṛganābhīparimala-\nstato līlāveṇukvaṇitamanu kāñcīkalaravaḥ|\ntato vidyudvalīvalayitacatkāralaharī-\ntaraṅgālāvaṇyaṃ tadanu sahajānanda udagāt||","meaning":"(Upon seeing Kṛṣṇa, Rādhā described Him to Her friends thus:)\n“At first I saw (emanating from Him) a glow in the likeness of blue moonlight,\nThen there was the fragrance of musk,\nSoon after which He playfully sounded His flute,\nAnd then I heard the tinkling sound of the ornaments around His waist.\nAfter that I saw magnificent waves enclosed by a girdle of lightening, the waves being none other than His ravishing form.\nAnd there upon I slipped away into a state of transcendental bliss.”","source":"Anonymous"},{"number":165,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"अद्य सुन्दरि कलिन्दनन्दिनी-\nतीरकुञ्जभुवि केलिलम्पट:।\nवादयन् मुरलिकां मुहुर्मुहु-\nर्माधवो हरति मामकं मनः।।","iast":"adya sundari kalindanandinī-\ntīrakuñjabhuvi kelilampaṭa:|\nvādayan muralikāṃ muhurmuhu-\nrmādhavo harati māmakaṃ manaḥ||","meaning":"“Today, O lovely one,\nOn the forest land on the banks of the Yamunā river,\nMādhava, Who has a fancy for amorous sports,\nSounded His flute over and over again,\nAnd thus stole away My heart.”","source":"Anonymous"},{"number":166,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"यदवधि यमुनायास्तीरवानीरकुञ्जे\nमुररिपुदलीला लोचनाभ्यामलোকि।\nतदवधि मम चित्तं कुत्रचित् कार्यमात्रे\nन हि लगति मुहूर्तं किं विधेयं न जाने।।","iast":"yadavadhi yamunāyāstīravānīrakuñje\nmuraripudalīlā locanābhyāmalaোকi|\ntadavadhi mama cittaṃ kutracit kāryamātre\nna hi lagati muhūrtaṃ kiṃ vidheyaṃ na jāne||","meaning":"“Ever since My eyes witnessed the graceful gait of the feet of\nMuraripu, in the cane forest on the banks of the Yamunā,\nHave I been unable, for even a single moment, to apply My mind to\nany of My daily tasks.\nAnd now I know not what I am supposed to do.”","source":"Śrī Kavicandra"},{"number":167,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"यदवधि यदुनन्दाननेन्दुः\nसहचरि लोचनगोचरीबभूव।\nतदवधि मलयानिलेऽनले वा\nसहजविचारपराङ्मुखं मनो मे।।","iast":"yadavadhi yadunandānanenduḥ\nsahacari locanagocarībabhūva|\ntadavadhi malayānile’nale vā\nsahajavicāraparāṅmukhaṃ mano me||","meaning":"“O My friend!\nEver since I set My eyes upon the moon-like visage of the scion of the Yadu clan,\nSince then has My mind come to be indifferent to the distinction between a scorching fire and the cool breeze blowing from the Malaya* mountain.”","source":"Śrī Sañjaya Kaviśekhara"},{"number":168,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"असमञ्जसमसमञ्जसमसमञ्जसमेतदापतितम्।\nवल्लवकुमारबुद्ध्या हरि हरि हरीक्षितः कुतुकात्।।","iast":"asamañjasamasamañjasamasamañjasametadāpatitam|\nvallavakumārabuddhyā hari hari harīkṣitaḥ kutukāt||","meaning":"“What absurdity, what foolishness, what impropriety has come upon Me!\nOut of mere curiosity did I look upon Him (Kṛṣṇa) and I had thought of Him as no more than a mere cowherd boy.\nO Hari! O Hari! O Hari!\n(I have now become possessed by infatuation of Him.)”","source":"Śrī Śaraṇa"},{"number":169,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"शुष्यति मुखमूरुयुगं पुष्यति जडतां प्रवेपते हृदयम्।\nस्विद्यति कपोलपाली सखि वनमाली किमालोकि ।।","iast":"śuṣyati mukhamūruyugaṃ puṣyati jaḍatāṃ pravepate hṛdayam|\nsvidyati kapolapālī sakhi vanamālī kimāloki ||","meaning":"“O sakhi!\nWhy did I have to have a glimpse of Vanamālī*?\n(For since I have seen Him,)\nMy mouth has become parched,\nMy thighs have grown stiff,\nMy heart is palpitating,\nAnd My cheeks are perspiring profusely.”","source":"Śrī Mukunda Bhaṭṭācārya"},{"number":170,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"उपरि तमालतरो: सखि परिणतशरदिन्दुमण्डल: कोऽपि।\nतत्र च मुरलीखुरली कुलमर्यादामधो नयति।।","iast":"upari tamālataro: sakhi pariṇataśaradindumaṇḍala: ko’pi|\ntatra ca muralīkhuralī kulamaryādāmadho nayati||","meaning":"(Referring to Kṛṣṇa, Rādhā said to Her friend:)\n“O sakhi!\nOn top of a Tamāla* tree,\nDid I see the orb of an autumn moon in full bloom,\nAnd therein was the flute being played in a manner as to bring disgrace** to the clan.”","source":"Śrī Sañjaya Kaviśekhara"},{"number":171,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"हन्त कान्तमपि तं दिदृक्षते\nमानसं मम न साधु यत्कृते ।\nइन्दुरिन्दुमुखि मन्दमारुत-\nश्चन्दनं च वितनोति वेदनाम् ।।","iast":"hanta kāntamapi taṃ didṛkṣate\nmānasaṃ mama na sādhu yatkṛte |\nindurindumukhi mandamāruta-\nścandanaṃ ca vitanoti vedanām ||","meaning":"(Rādhā addresses Her friend Indumukhī:)\n\"Alas! How much I crave to see My beloved,\nFor which reason My heart is not at peace.\nO Indumukhī!\nThe moon, the gentle breeze and the fragrance of sandalwood, all\nbut aggravate My distress.\"","source":"Anonymous"},{"number":172,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"गुरुजनगञ्जनमयशो गृहपतिचरितं च दारुणं किमपि ।\nविस्मारयति समस्तं शिव शिव मुरली मुरारेः ।।","iast":"gurujanagañjanamayaśo gṛhapaticaritaṃ ca dāruṇaṃ kimapi |\nvismārayati samastaṃ śiva śiva muralī murāreḥ ||","meaning":"\"The reprimands of My elders,\nDisgrace and infamy,\nThe harsh reactions of My husband,\n(For My being in love with Kṛṣṇa,)\nAll of these do I forget,\nBy the grace of the all-auspicious sound of the flute of the foe of the demon Mura.\"","source":"Śrī Sarvavidyāvinoda"},{"number":173,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"द्रविणं भवनमपत्यं तावन्मित्रं तथाभिजात्यं च ।\nउपयमुनं वनमाली यावन्नेत्रे न नर्तयति ।।","iast":"draviṇaṃ bhavanamapatyaṃ tāvanmitraṃ tathābhijātyaṃ ca |\nupayamunaṃ vanamālī yāvannetre na nartayati ||","meaning":"\"One remains conscious of one's wealth, property, progeny, friends and one's noble descent,\nOnly as long as Vanamālī, standing upon the banks of the Yamunā, does not afflict one with the artful dance of His eyes.\"","source":"Śrī Sarvavidyāvinoda"},{"number":174,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"तुष्यन्तु मे छिद्रमवाप्य शत्रवः\nकरोतु मे शास्तिभरं गृहेश्वरः ।\nमणिस्तु वक्षोरुहमध्यभूषणं\nममास्तु वृन्दावनकृष्णचन्द्रमाः ।।","iast":"tuṣyantu me chidramavāpya śatravaḥ\nkarotu me śāstibharaṃ gṛheśvaraḥ |\nmaṇistu vakṣoruhamadhyabhūṣaṇaṃ\nmamāstu vṛndāvanakṛṣṇacandramāḥ ||","meaning":"\"May My adversaries be pleased upon discovering My failings,\nAnd may the master of My house, My husband, instruct Me in great measure.\nBut (I care not because) the jewel adorning the centre of My bosom shall be none other than Kṛṣṇa, the ‘moon of Vṛndāvana’.”","source":"Anonymous"},{"number":175,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"स्वामी निहन्तु विहसन्तु पुरः सपत्न्यो\nभर्तृर्भजन्तु गुरवः पितरश्च लज्जाम्।\nएतावता यदि कलङ्कि कुलं तथास्तु\nरामानुजे मम तनोतु मनोऽनुरागम्।।","iast":"svāmī nihantu vihasantu puraḥ sapatnyo\nbhartṛrbhajantu guravaḥ pitaraśca lajjām|\netāvatā yadi kalaṅki kulaṃ tathāstu\nrāmānuje mama tanotu mano’nurāgam||","meaning":"\"May My husband chastise Me,\nMay My co-wives laugh at Me in My presence,\nAnd may the parents and elders of My husband suffer embarrassment because of Me.\nIf, in this way, disgrace comes to My clan, then so be it.\n(I care not.)\nBut may My heart's affection for the younger brother of Balarāma ever increase.\"","source":"Anonymous"},{"number":176,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"स्वामि कुप्यति कुप्यतां परिजना निन्दन्ति निन्दन्तु मा-\nमन्यत् किं प्रथतामयं च जगति प्रोढो ममोपद्रवः।\nआशास्यं पुनरेतदेव यदिदं चक्षुश्चिरं वर्धतां\nयेनेदं परिपीयते मुररिपोः सौन्दर्यसारं वपुः।।","iast":"svāmi kupyati kupyatāṃ parijanā nindanti nindantu mā-\nmanyat kiṃ prathatāmayaṃ ca jagati proḍho mamopadravaḥ|\nāśāsyaṃ punaretadeva yadidaṃ cakṣuściraṃ vardhatāṃ\nyenedaṃ paripīyate muraripoḥ saundaryasāraṃ vapuḥ||","meaning":"\"Should My husband become angry with Me, then let him be so,\nIf My attendants speak ill of Me, then let them do so,\nAnd let the whole world proclaim My (amorous) afflictions, intense as they are.\nThe only benediction that I seek is that the power of My sight may forever increase,\nFor it is by these eyes that I savour the form of Murāri, the quintessence of beauty.”","source":"Śrī Puskarākṣa"},{"number":177,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"किं दुर्मिलेन मम दूति मनोरथेन\nतावन्ति हन्त सुकृतानि कया कृतानि ।\nएतादेव मम जन्मफलं मुरारि-\nर्यन्नेत्रयोः पथि बिभर्ति गतागतानि ।।","iast":"kiṃ durmilena mama dūti manorathena\ntāvanti hanta sukṛtāni kayā kṛtāni |\netādeva mama janmaphalaṃ murāri-\nryannetrayoḥ pathi bibharti gatāgatāni ||","meaning":"“Alas! My friend! Who could have performed such pious deeds (in previous lives) as to aspire for something so hard to attain (as the love of Kṛṣṇa)?\nThe only reward that I have earned for this life is that Murāri remains in and out of My sight.”","source":"Anonymous"},{"number":178,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"सखि मम नियतिहतायास्तदर्शनभाग्यमस्तु वा मा वा ।\nपुनरपि स वेणुनादो यदि कर्णपथे पतेत्तदेवालम् ।।","iast":"sakhi mama niyatihatāyāstadarśanabhāgyamastu vā mā vā |\npunarapi sa veṇunādo yadi karṇapathe patettadevālam ||","meaning":"“O sakhī! I am so forsaken by destiny that I do not care whether or not I have the fortune of seeing My Lord.\nBut if the sound of His flute falls upon My ears only once more, then that is enough for Me.”","source":"Anonymous"},{"number":179,"topic":"Rādhā'S Expression Of Her Incipient Love For Kṛṣṇa Before They Met","devanagari":"ताराभिसारक चतुर्थनिशाशशाङ्क\nकामाम्बुराशिपरीवर्धन देव तुभ्यम्।\nअर्घो नमो भवतु मे सह तेन यूना\nमिथ्यापवादवचसाप्यभिमानसिद्धिः।।","iast":"tārābhisāraka caturthaniśāśaśāṅka\nkāmāmburāśiparīvardhana deva tubhyam|\nargho namo bhavatu me saha tena yūnā\nmithyāpavādavacasāpyabhimānasiddhiḥ||","meaning":"\"O Lord Moon, companion of the stars!\nO Moon of the fourth night*!\nTo you, by whom expands the ocean of love,\nDo I, along with My obeisance, offer respectful oblations.\nMy communion with you, which is but a semblance of a loving discourse (with My beloved Kṛṣṇa) is sufficient to satisfy My pride.\"","source":"Anonymous"},{"number":180,"topic":"The Deliberations Of One Of Rādhā'S Clever Friends","devanagari":"सिद्धान्तयति न किञ्चिद्द्रमयति दृशमेव केवलं राधा।\nतदवगतं सखि लग्नं कदम्बतुरुदेवतामरुता।।","iast":"siddhāntayati na kiñciddramayati dṛśameva kevalaṃ rādhā|\ntadavagataṃ sakhi lagnaṃ kadambaturudevatāmarutā||","meaning":"(On seeing Rādhā wistfully pining for Her beloved Kṛṣṇa\nduring Her separation from Him, one of Her friends spoke thus to\nanother friend:)\n\"Rādhā is not coming to any conclusions (regarding Her amorous\npreoccupations).\nRather, She simply keeps roving Her eyes (while She muses upon\nHer lover).\nWhat I have come to understand, O sakhi, is that She has been\npossessed by the spirit* of the deity of the Kadamba tree.\"","source":"Śrī Ranga"},{"number":181,"topic":"Questions To Rādhā By Her Friend","devanagari":"अथ राधां प्रति प्रश्नः\nकामं वपुः पुलकितं नयने धृतास्त्रे\nवाचः सगद्गदपदाः सखि कम्पि वक्षः।\nज्ञातं मुकुन्दमुरलीरवमाधुरी ते\nचेतः सुधांशुवदने तरलीकरोति।।","iast":"atha rādhāṃ prati praśnaḥ\nkāmaṃ vapuḥ pulakitaṃ nayane dhṛtāstre\nvācaḥ sagadgadapadāḥ sakhi kampi vakṣaḥ|\njñātaṃ mukundamuralīravamādhurī te\ncetaḥ sudhāṃśuvadane taralīkaroti||","meaning":"“O sakhi Rādhā! O One Whose face is beautiful as the moon!\nIn Your love stricken state,\nThe hair of Your body are standing on end,\nYour eyes are full of tears,\nYour speech is faltering,\nAnd Your heart is palpitating.\nThus we know that the sound, of sweetness itself, emanating from the flute of Mukunda,\nIs causing to unsettle Your heart.”","source":"Śrī Rāṅga"},{"number":182,"topic":"Questions To Rādhā By Her Friend","devanagari":"गतं कुलवधूव्रतं विदितमेव तत्तद्वच\nस्तथापि तरलाशये न विमतासि को दुर्गृहः।\nकरोमि सखि किं श्रुते दनुजवैरिवंशीरवे\nमनागपि मनो न मे सुमुखि धैर्यमालम्बते।।","iast":"gataṃ kulavadhūvrataṃ viditameva tattadvaca\nstathāpi taralāśaye na vimatāsi ko durgṛhaḥ|\nkaromi sakhi kiṃ śrute danujavairivaṃśīrave\nmanāgapi mano na me sumukhi dhairyamālambate||","meaning":"(Rādhā’s friend says to Her:)\n“You have forsaken the proprieties becoming a woman of noble lineage,\nAnd what others gossip about You is now well known to everyone.\nWhy do You not relent, O wanton One? What evil has come upon You?”\n(Rādhā replies:)\n\"My friend Sumukhī! What am I to do?\nUpon hearing even a little strain of the flute of (Kṛṣṇa) the enemy of demons,\nMy mind is unable to rest in peace.\"","source":"Anonymous"},{"number":183,"topic":"Questions To Rādhā By Her Friend","devanagari":"आस्तां तावदकीर्तिर्मे त्वया तथ्यं तु कथ्यताम् ।\nचित्तं कथमवासीत्ते हरिवंशीरवश्रुतौ ।।","iast":"āstāṃ tāvadakīrtirme tvayā tathyaṃ tu kathyatām |\ncittaṃ kathamavāsītte harivaṃśīravaśrutau ||","meaning":"(Rādhā asks Her friend:)\n\"Should I earn infamy (for being in love with Kṛṣṇa), then so be it.\nBut tell Me truthfully,\nWhat becomes the state of your mind upon hearing the sound of Hari's flute?\"","source":"Anonymous"},{"number":184,"topic":"Questions To Rādhā By Her Friend","devanagari":"सत्यं जल्पसि दुःखहा खलगिरः सत्यं कुलं निर्मलं\nसत्यं निष्करुणोऽप्ययं सहचरः सत्यं सुदूरे सरित् ।\nतत्सख विस्मरामि झटिति श्रोत्रातिथिर्जायते\nचेदुन्मादमुकुन्दमञ्जुमुरलीनिस्वानरागोद्गतिः।।","iast":"satyaṃ jalpasi duḥkhahā khalagiraḥ satyaṃ kulaṃ nirmalaṃ\nsatyaṃ niṣkaruṇo’pyayaṃ sahacaraḥ satyaṃ sudūre sarit |\ntatsakha vismarāmi jhaṭiti śrotrātithirjāyate\ncedunmādamukundamañjumuralīnisvānarāgodgatiḥ||","meaning":"\"O sakhi! You rightly say\nThat the words of wicked persons are hard to endure,\nThat we hail from noble families,\nThat the river (Yamunā) is far away from here,\nAnd that our friend (Kṛṣṇa) is truly heartless.\nBut all of that do I forget in a moment,\nWhen My ears receive the sweet, intoxicating, musical notes\nemanating from the flute of Mukunda.”","source":"Śrī Govinda Bhaṭṭa"},{"number":185,"topic":"The Jestful Assurances Of Rādhā’S Friend","devanagari":"निशा जलदसङ्कुला तिमिरगर्भलीनं जग-\nद्वयस्तव नवं नवं वपुरपूर्वलीलामयम्।\nअलं सुमुखि निद्रया व्रज गृहेऽपि नक्तञ्चरी\nकदम्बवनदेवता नवतमालनीलद्युतिः।।","iast":"niśā jaladasaṅkulā timiragarbhalīnaṃ jaga-\ndvayastava navaṃ navaṃ vapurapūrvalīlāmayam|\nalaṃ sumukhi nidrayā vraja gṛhe’pi naktañcarī\nkadambavanadevatā navatamālanīladyutiḥ||","meaning":"“The night sky is thronged by clouds,\nThe world is enveloped by the womb of darkness,\nYou are in the prime of youth,\nAnd Your body tonight is voluptuous like never before.\nDo not sleep tonight, O beautiful One,\nFor the night-wandering Lord of the forest of Kadamba trees,\nWho is magnificent as the dark bark of the Tamāla tree.\nIs present here in Vraja,\nIn Your very house.”","source":"Śrī Sarvavidyāvinoda"},{"number":186,"topic":"A Sakhī Describes To Krsna Rādhā’S Love For Him","devanagari":"त्वामञ्जनीयति फलासु विलोकयन्ती\nत्वां शृण्वती कुवलयीयति कर्णपूरम्।\nत्वां पूर्णमाविधुमुखी हृदि भावयन्ती\nवक्षोनिलीननवनीलमणिं करोति।।","iast":"tvāmañjanīyati phalāsu vilokayantī\ntvāṃ śṛṇvatī kuvalayīyati karṇapūram|\ntvāṃ pūrṇamāvidhumukhī hṛdi bhāvayantī\nvakṣonilīnanavanīlamaṇiṃ karoti||","meaning":"“Rādhā, Whose visage is in the likeness of the moon in full bloom,\nUpon looking at Your portrait, anoints Her eyes with Your image.\nShe decorates Her ears with narrations about You; narrations which are as glorious as garlands of blue lotuses.\nAnd with Your form, which is in the likeness of a freshly-cut blue sapphire, does She adorn Her bosom, when, in Her meditations, She places You in Her heart.”","source":"Anonymous"},{"number":187,"topic":"A Sakhī Describes To Krsna Rādhā’S Love For Him","devanagari":"तथैवास्ते हस्तः कलितफणिवल्लीकिसलय-\nस्तथैवास्यं तस्याः क्रमुकफलफालीपरिचितम् ।।","iast":"tathaivāste hastaḥ kalitaphaṇivallīkisalaya-\nstathaivāsyaṃ tasyāḥ kramukaphalaphālīparicitam ||","meaning":"\"O Murahara (slayer of Mura)!\nUpon the biddings of Her attendants, the beautiful Radha accepted the betel-leaves and areca-nuts offered to Her. But She forgot to eat them as Her mind went blank (due to Her pining for You).\nThe whole night went by while She held the leaves in Her hand and kept the nuts un-chewed in Her mouth.\"","source":"Sri Harihara"},{"number":188,"topic":"A Sakhī Describes To Krsna Rādhā’S Love For Him","devanagari":"प्रेमपावकलीढाङ्गी राधा तव जगतपते ।\nशय्यायाः स्खलिता भूमौ पुनस्तां गन्तुमक्षमा ।।","iast":"premapāvakalīḍhāṅgī rādhā tava jagatapate |\nśayyāyāḥ skhalitā bhūmau punastāṃ gantumakṣamā ||","meaning":"\"O Lord of the universe!\nHer body consumed by the fire of Her love for You, Radha has slipped out of Her bed and has fallen upon the ground.\nAnd now, (such is Her state that) She is unable to climb back onto Her bed.\"","source":"Sri Kavicandra"},{"number":189,"topic":"A Sakhī Describes To Krsna Rādhā’S Love For Him","devanagari":"मुरहर साहसगरिमा कथमिव वाच्यः कुरङ्गशावाक्ष्याः ।\nखेदार्णवपतितापि प्रेमधुरां ते समुद्रहति ।।","iast":"murahara sāhasagarimā kathamiva vācyaḥ kuraṅgaśāvākṣyāḥ |\nkhedārṇavapatitāpi premadhurāṃ te samudrahati ||","meaning":"\"O Murahara, slayer of the demon Mura!\nHow shall I describe to You the greatness of Radha's fortitude?\nRādhā, Whose eyes are like those of a deer-calf,\nDespite having fallen into the ocean of sorrow,\nStill bears the burden of Her love for You.”","source":"Śrī Kavicandra"},{"number":190,"topic":"A Sakhī Describes To Krsna Rādhā’S Love For Him","devanagari":"गायति गीते शंसति वंशे वादयति सा विपञ्चीषु ।\nपाठयति पञ्जरशुकं तव सन्देशाक्षरं राधा ।।","iast":"gāyati gīte śaṃsati vaṃśe vādayati sā vipañcīṣu |\npāṭhayati pañjaraśukaṃ tava sandeśākṣaraṃ rādhā ||","meaning":"“(O Kṛṣṇa!)\nThe wordings of the messages You send to Rādhā,\nDoes She recite in song,\nDoes She play on Her flute,\nDoes She tune on Her lute,\nAnd does She teach to Her caged parrot.”","source":"Śrī Govardhana Ācārya"},{"number":191,"topic":"Kṛṣṇa'S Feelings For Rādhā Are Narrated To Her","devanagari":"केलीकलासु कुशला नगरे मुरारे-\nराभीरनीरजदृशः कति वा न सन्ति ।\nराधे त्वया महदकारि तपो यदेष\nदामोदरस्त्वयि परं परमानुरागः ।।","iast":"kelīkalāsu kuśalā nagare murāre-\nrābhīranīrajadṛśaḥ kati vā na santi |\nrādhe tvayā mahadakāri tapo yadeṣa\ndāmodarastvayi paraṃ paramānurāgaḥ ||","meaning":"\"In this city, there are many lotus-eyed gopīs who are well-versed in the amorous sports of Murāri.\nBut then O Rādhā! Severe penances must You have performed, that Dāmodara loves You the most.\"","source":"Anonymous"},{"number":192,"topic":"Kṛṣṇa'S Feelings For Rādhā Are Narrated To Her","devanagari":"वत्सान्न चारयति वादयते न वेणु-\nमामोदते न यमुनावनमारुतेन ।\nकुञ्जे निलीय शिथिलं बलितोत्तमाङ्ग-\nमन्तस्त्वया श्वसिति सुन्दरि नन्दसूनुः।।","iast":"vatsānna cārayati vādayate na veṇu-\nmāmodate na yamunāvanamārutena |\nkuñje nilīya śithilaṃ balitottamāṅga-\nmantastvayā śvasiti sundari nandasūnuḥ||","meaning":"\"O beautiful One!\"\nThe son of Nanda, being preoccupied with thoughts of You,\nDoes not take His calves for grazing,\nDoes not play His flute,\nAnd finds no pleasure in the (gentle and fragrant) breeze blowing from the woods along the Yamunā.\nWithdrawing Himself into a forest-garden,\nSeated with His head bent down and overcome by lassitude,\nHe does no more than taking deep breaths.\"","source":"Śrī Daityāri Paṇḍita"},{"number":193,"topic":"Kṛṣṇa'S Feelings For Rādhā Are Narrated To Her","devanagari":"सर्वाधिकः सकलकेलिकलाविदग्धः\nस्निग्धः स एष मुरशत्रु रनर्घरूपः।\nत्वां याचते यदि भज व्रजनागरि त्वं\nसाध्यं किमन्त्यधिकं भुवने भवत्याः।।","iast":"sarvādhikaḥ sakalakelikalāvidagdhaḥ\nsnigdhaḥ sa eṣa muraśatru ranargharūpaḥ|\ntvāṃ yācate yadi bhaja vrajanāgari tvaṃ\nsādhyaṃ kimantyadhikaṃ bhuvane bhavatyāḥ||","meaning":"\"Lord Murāri is the most proficient of all in every amorous sport,\nIs endowed with an inexpressibly beautiful form.\nAnd is so affectionately disposed towards You.\nIf He pleads to You (for Your love),\nThen worship Him, O resident of Vraja!\nFor, in the whole world, what else is more worthy of Your\naspiration (than the privilege of worshipping Him)?\"","source":"Śrī Ranga"},{"number":194,"topic":"Rādhā Prepares To Meet Her Lover (Kṛṣṇa)","devanagari":"मन्दं निधेहि चरणौ परिधेहि नीलं\nवासः पिधेहि वलयावलिमञ्चलेन।\nमा जल्प साहसिनि शारदचन्द्रकान्ति-\nदन्तांस्तव तमांसि समापयन्ति।।","iast":"mandaṃ nidhehi caraṇau paridhehi nīlaṃ\nvāsaḥ pidhehi valayāvalimañcalena|\nmā jalpa sāhasini śāradacandrakānti-\ndantāṃstava tamāṃsi samāpayanti||","meaning":"(While Rādhā was preparing for Her rendezvous with Kṛṣṇa, Her friend instructed Her thus:)\n\"Place Your feet silently on the ground while waking,\nWear a dark-blue dress (to be inconspicuous in the dark),\nAnd conceal Your bangles under the edge of Your dress.\nDo not speak to anyone on the way, O impetuous One.\nFor if You do, Your teeth, which are resplendent as the autumn moon, will dispel the darkness of the night by the rays of light emanating from them.","source":"Śrī Ṣāṇmāsika"},{"number":195,"topic":"Rādhā Prepares To Meet Her Lover (Kṛṣṇa)","devanagari":"किमुत्तीर्णः पन्थाः कुपितभुजगीभोगविषमो\nविषोढा भूयस्यः किमिति कुलपालीकटुगिरः।\nइति स्मारं स्मारं दरदलितशीतद्युतिरुचौ\nसरोजाक्षी शोणं दिशि नयनकोणं विकिरति।।","iast":"kimuttīrṇaḥ panthāḥ kupitabhujagībhogaviṣamo\nviṣoḍhā bhūyasyaḥ kimiti kulapālīkaṭugiraḥ|\niti smāraṃ smāraṃ daradalitaśītadyutirucau\nsarojākṣī śoṇaṃ diśi nayanakoṇaṃ vikirati||","meaning":"\"Why did I traverse this (forest) path, which is as formidable as the hood of a ferocious serpent?\nWhy did I endure the unbearable, and exceedingly bitter, remarks of the elder women of My clan?\"\nThinking thus over and over again, the lotus-eyed Rādhā, from the red-tinged corner of Her eyes, scattered Her gaze in the direction of the mild glimmer of moonlight.","source":"Śrī Sarvavidyāvinoda"},{"number":196,"topic":"Rādhā Prepares To Meet Her Lover (Kṛṣṇa)","devanagari":"चित्रोत्कीर्णादपि विषधराद्वीतिभाजो रजन्यां\nकिं वा ब्रूमस्त्वदभिसरणे साहसं माधवास्याः ।\nध्वान्ते यान्त्या यदतिनिभृतं राधयात्मप्रकाश-\nत्रासात् पाणिः पधि फणिफणारत्नरोधी व्यधायि ।।","iast":"citrotkīrṇādapi viṣadharādvītibhājo rajanyāṃ\nkiṃ vā brūmastvadabhisaraṇe sāhasaṃ mādhavāsyāḥ |\ndhvānte yāntyā yadatinibhṛtaṃ rādhayātmaprakāśa-\ntrāsāt pāṇiḥ padhi phaṇiphaṇāratnarodhī vyadhāyi ||","meaning":"(Rādhā's friends say to Kṛṣṇa:)\n\"O Mādhava! Rādhā is fearful of even picture images of snakes,\nSo what can we tell You of Her courage in coming to meet You in the night?\nComing stealthily in the dark and fearful of being visible,\nShe obstructs (the light from) the jewels on the hoods of the serpents in Her path by holding up Her hand.\"","source":"Anonymous"},{"number":197,"topic":"Rādhā'S Friends Speak To Her","devanagari":"मन्मथोन्थितमच्युतं प्रति\nब्रूहि किञ्चन समुल्लसत्स्मितम् ।\nकिञ्च सिञ्च मृगाशवलोचने\nलोचनेङ्गितसुधौघनिर्झरैः ।।","iast":"manmathonthitamacyutaṃ prati\nbrūhi kiñcana samullasatsmitam |\nkiñca siñca mṛgāśavalocane\nlocaneṅgitasudhaughanirjharaiḥ ||","meaning":"\"(O Rādhā!) You unsettle even Cupid (by Your beauty).\nWearing Your enchanting smile, do please say something to Acyuta.\nAnd then, O One with eyes like those of a deer-calf,\nShower unto Him the abundant streams of nectar flowing out with the expressive glances of Your eyes.\"","source":"Anonymous"},{"number":198,"topic":"Rādhā'S Friends Speak To Her","devanagari":"गोविन्दे स्वयमकरोः सरोजनेत्रे\nप्रेमान्धा वरवपुरर्पणं सखि त्वम्।\nकार्पण्यं न कुर
