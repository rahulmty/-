ु दरावलोकदाने\nविक्रीते करिणि किमङ्कुशे विवादः।।","iast":"govinde svayamakaroḥ sarojanetre\npremāndhā varavapurarpaṇaṃ sakhi tvam|\nkārpaṇyaṃ na kuru darāvalokadāne\nvikrīte kariṇi kimaṅkuśe vivādaḥ||","meaning":"\"My lotus-eyed friend!\nYou Who are endowed with a beautiful form,\nBeing blinded in love,\nDid consecrate Yourself to Govinda.\nNow be not so uncharitable and grant Him atleast the privilege of Your glance.\nFor having sold an elephant, why debate a mere goading-hook*?\"","source":"Śrī Rūpa Gosvāmī"},{"number":199,"topic":"The Playful Sports (Of Rādhā And Krsna)","devanagari":"परमानुरागरपयाथ राधया\nपरिरम्भकौशलविकाशिभावया ।\nस तया सह स्मरसभाजनोत्सवं\nनिरवाहयच्छिखिशिखण्डशेखरः ।।","iast":"paramānurāgarapayātha rādhayā\nparirambhakauśalavikāśibhāvayā |\nsa tayā saha smarasabhājanotsavaṃ\nniravāhayacchikhiśikhaṇḍaśekharaḥ ||","meaning":"Supremely devoted in love (for the Lord). Rādhā expresses Her sentiments by Her prowess in the art of embracing Her beloved.\nThe Lord, Who is adorned with a wreath of peacock feathers, celebrates, along with Rādhā, a festival in honour of Cupid.","source":"Śrī Kavirāja Miśra"},{"number":200,"topic":"The Playful Sports (Of Rādhā And Krsna)","devanagari":"अस्मिन् कुञ्जे विनापि प्रचलति पवनं वर्तते कोऽपि नूनं\nपश्यामः किं न गत्वेत्यनुसरति गणे भीतभीतेऽर्भकाणाम् ।\nतस्मिन् राधासखो वः सुखयतु विलसन् क्रीडया कैटभारि-\nर्व्यतन्वानो मृगारिप्रबलघुरघुरारावरौद्रोच्चनादान् ।।","iast":"asmin kuñje vināpi pracalati pavanaṃ vartate ko’pi nūnaṃ\npaśyāmaḥ kiṃ na gatvetyanusarati gaṇe bhītabhīte’rbhakāṇām |\ntasmin rādhāsakho vaḥ sukhayatu vilasan krīḍayā kaiṭabhāri-\nrvyatanvāno mṛgāriprabalaghuraghurārāvaraudroccanādān ||","meaning":"\"Despite the absence of breeze, there is some noise in this forest-garden. There is certainly someone there. Why do we not go and see who it is?\"\nThus saying, a group of small (cowherd) boys, who were extremely terrified, began to move towards the garden.\nIn the forest-garden, Lord Kaiṭabhāri*, was indulging Himself in playful recreation.\nWhile so playing He would make loud, ferocious sounds, like the terrible roar of a lion, and which frightened the boys.\nMay the Lord, the friend of Rādhā, bless You with happiness.","source":"Anonymous"},{"number":201,"topic":"The Jestful Utterances Of Rādhā’S Observant Friends After The Playful Activities Of Rāhdā And Kṛṣṇa","devanagari":"इह निचुलनिकुञ्जे मध्य मध्यास्य रन्तु-\nर्विजनमजनि शय्या कस्य बालप्रबालैः।\nइति निगदति वृन्दे योषितां पान्तु युष्मान्\nस्मितशबलितराधामाधवालोकतानि।।","iast":"iha niculanikuñje madhya madhyāsya rantu-\nrvijanamajani śayyā kasya bālaprabālaiḥ|\niti nigadati vṛnde yoṣitāṃ pāntu yuṣmān\nsmitaśabalitarādhāmādhavālokatāni||","meaning":"“On this lonely path, in the very midst of this cane forest,\nWho has made this cot from shoots of reed?”\nWhen the group of young gopīs had thus spoken,\nRādhā and Mādhava were smitten with laughter,\nAnd they exchanged affectionate glances with each other.\nMay those loving glances of Rādhā and Mādhava protect you.","source":"Śrī Rūpadeva"},{"number":202,"topic":"The Utterances Of A Naive Cowherd Boy","devanagari":"कृष्ण त्वद्वनमालया सहकृतं केनापि कुञ्जोदरे\nगोपीकुन्तल बर्हदां तदिदं प्राप्तं मया गृह्यताम् ।\nइत्थं दुग्धमुखेन गोपशिशुनाख्याते त्रपानम्रयो\nराधामाधवयोर्जयन्ति बलितस्मेरालसा दृष्टयः ।।","iast":"kṛṣṇa tvadvanamālayā sahakṛtaṃ kenāpi kuñjodare\ngopīkuntala barhadāṃ tadidaṃ prāptaṃ mayā gṛhyatām |\nitthaṃ dugdhamukhena gopaśiśunākhyāte trapānamrayo\nrādhāmādhavayorjayanti balitasmerālasā dṛṣṭayaḥ ||","meaning":"\"O Kṛṣṇa! Please take this garland of flowers that was stolen from You. I found it, in the interior of a forest-garden, along with this wreath of peacock feathers belonging to some gopī.\"\nThe little cowherd boy, whose mouth was smeared with milk, having thus spoken,\nRādhā and Mādhava, whose eyes were languid with amusement, lowered their glances in embarrassment.\nGlory be to the eyes of Rādhā and Mādhava!","source":"Śrī Lakṣmaṇa Sena"},{"number":203,"topic":"The Comments Of A Friend During Her Daytime Sports With Rādhā","devanagari":"कलसस्तनि लालसीति कुञ्जे\nमुरलीकोमलकाकली मुरारेः।।","iast":"kalasastani lālasīti kuñje\nmuralīkomalakākalī murāreḥ||","meaning":"\"Why are You still engaged in churning yoghurt (that has\nalready been churned)?\nYou are so very absorbed in amorous fancies that Your limbs have\nturned languid.\nO Kalasastani*, O One endowed with a beautiful bosom!\nYou are hankering for the soft, sweet sound that Murāri, situated in\nthe forest-garden, plays on His flute.\"","source":"Śrī Rūpa Gosvāmī"},{"number":204,"topic":"Rādhā'S Emotionally Charged Utterances","devanagari":"श्वश्रूरिङ्गितदैवतं नयनयोर्यालिहो यातरः\nस्वामी निःश्वसितेऽप्यसूयति मनोजिघ्नः सपत्नीजनः।\nतद्दूरादयमञ्जलिः किमधुना दृग्भङ्गभावेन ते\nवैदग्धीविविधप्रबन्ध रसिक व्यर्थोऽयमत श्रमः।।","iast":"śvaśrūriṅgitadaivataṃ nayanayoryāliho yātaraḥ\nsvāmī niḥśvasite’pyasūyati manojighnaḥ sapatnījanaḥ|\ntaddūrādayamañjaliḥ kimadhunā dṛgbhaṅgabhāvena te\nvaidagdhīvividhaprabandha rasika vyartho’yamata śramaḥ||","meaning":"\"(O Kṛṣṇa!)\nMy mother-in-law interprets My gestures as if she were endowed with divine vision.\nThe wives of the brothers of My husband lap up every expression of My eyes.\nMy husband finds fault even with My breathing.\nAnd My co-wives read My mind with the ease of detecting a smell.\nTherefore, from a distance, do I offer You salutations with folded hands.\nSo why do You now give Me sidelong glances?\nYou contrive so many clever devices (to entice Me to come to You), O connoisseur of love!\nBut, over here, all Your efforts are in vain.\"","source":"Anonymous"},{"number":205,"topic":"Rādhā'S Emotionally Charged Utterances","devanagari":"सङ्केतीकृतकोकिलादिनिनदं कंसद्विषः कुर्वतो\nद्वारोन्मोचनलोलशङ्खवलयक्वाणं मुहुः शृण्वतः ।\nकेयं केयमिति प्रगल्भजरतीवाक्येन दूनात्मनो\nराधाप्राङ्गणकोणको लिविटपिक्रोडे गता शर्वरी ।।","iast":"saṅketīkṛtakokilādininadaṃ kaṃsadviṣaḥ kurvato\ndvāronmocanalolaśaṅkhavalayakvāṇaṃ muhuḥ śṛṇvataḥ |\nkeyaṃ keyamiti pragalbhajaratīvākyena dūnātmano\nrādhāprāṅgaṇakoṇako liviṭapikroḍe gatā śarvarī ||","meaning":"Kṛṣṇa, the enemy of Kamsa, beckoned Rādhā by the cuckoo's cry and other sounds.\nWhen Rādhā rushed eagerly to open the door, the sound of Her conch bangles was heard by the old woman in Her house.\nThe old woman began asking – “Who is it? Who is it?”\nHis mind disturbed by the intimidating words of the old woman, Kṛṣṇa hid Himself in a recess of the Badari tree in the corner of Rādhā’s courtyard.\nAnd He spent the entire night there.","source":"Śrī Hara"},{"number":206,"topic":"Rādhā'S Emotionally Charged Utterances","devanagari":"आहूताद्य महोत्सवे निशि गृहं शून्यं विमुच्यागता\nक्षैव: प्रेष्यजन: कथं कुलवधूरेकाकिनी यास्यति।\nवत्स त्वं तदिमां नयालयमिति श्रुत्वा यशोदागिरो\nराधामाधवयोर्जयन्ति मधुरस्मेरालसा दृष्टय:।।","iast":"āhūtādya mahotsave niśi gṛhaṃ śūnyaṃ vimucyāgatā\nkṣaiva: preṣyajana: kathaṃ kulavadhūrekākinī yāsyati|\nvatsa tvaṃ tadimāṃ nayālayamiti śrutvā yaśodāgiro\nrādhāmādhavayorjayanti madhurasmerālasā dṛṣṭaya:||","meaning":"(Mother Yaśodā said to Kṛṣṇa:)\n“Tonight, upon my invitation, Rādhā has come here for this grand festival, leaving Her house empty.\nOur servants are too engrossed in making merry.\nHow can a noble lady like Her go home all by Herself?\nSo my child, please escort Her to Her home.”\nUpon hearing these words of mother Yaśodā, Rādhā and Mādhava, smiling gently at each other, exchanged affectionate glances.\nGlory be to those glances of Rādhā and Mādhava!","source":"Śrī Lakṣmaṇa Sena"},{"number":207,"topic":"Rādhā'S Emotionally Charged Utterances","devanagari":"इत्यामन्त्रणभङ्गिसूचितवृथावस्थानखेदालसा-\nमाशिलष्यन् पुलकोत्कराञ्चिततनुर्गोपी हरिः पातु वः।।","iast":"ityāmantraṇabhaṅgisūcitavṛthāvasthānakhedālasā-\nmāśilaṣyan pulakotkarāñcitatanurgopī hariḥ pātu vaḥ||","meaning":"(Rādhā said to Kṛṣṇa:)\n\"I am leaving, O Acyuta!\nFor how can I be satiated merely by looking at You?\nAnd will not Our staying here in this desolate place cause some\nwretched people to think ill of us?\"\nRādhā having thus communed, with soliciting gestures, the futility\nof staying on,\nAnd as Kṛṣṇa, overcome with disappointment, languidly embraced\nthe cowherd girl Rādhā,\nAll His body's hair stood on end.\nMay Lord Hari protect You.","source":"Anonymous"},{"number":208,"topic":"Rādhā'S Friend Indulges In Humour","devanagari":"सखि पुलकिनी सकम्पा बहिःस्थलीतस्त्वमालयं प्राप्ता।\nविक्षोभितासि नूनं कृष्णभुजङ्गेन कल्याणि।।","iast":"sakhi pulakinī sakampā bahiḥsthalītastvamālayaṃ prāptā|\nvikṣobhitāsi nūnaṃ kṛṣṇabhujaṅgena kalyāṇi||","meaning":"\"My friend (Rādhā)!\nEver since You have come home from outdoors, You have been trembling and Your body's hair have become erect.\nCertainly, O blessed One! Some black* snake must have frightened You!\"","source":"Śri Rūpa Gosvāmi"},{"number":209,"topic":"The Next Day A Sakhī Reminds Rādhā About Her Tryst With Kṛṣṇa","devanagari":"अक्लान्त्युतिभिर्वसन्तकुसुमैरतंसयन् कुन्तला-\nनन्तः खेलति खञ्जरीटनयने कुञ्जेषु कञ्जेक्षणः।\nअस्मान्मिन्दिरकर्मतस्तव करौ नाद्यापि विश्राम्यतः\nकिं ब्रूमो रसिकाग्रणीरसि घटी नेयं विलम्बक्षमा।।","iast":"aklāntyutibhirvasantakusumairataṃsayan kuntalā-\nnantaḥ khelati khañjarīṭanayane kuñjeṣu kañjekṣaṇaḥ|\nasmānmindirakarmatastava karau nādyāpi viśrāmyataḥ\nkiṃ brūmo rasikāgraṇīrasi ghaṭī neyaṃ vilambakṣamā||","meaning":"\"(O Rādhā!) O One with eyes like the Khañjana*!\nThe lotus-eyed Ananta,\nWhose hair are decked with a chaplet of freshly blooming spring flowers,\nIs playing about in the forest-garden.\nBut as for You, O foremost among the connoisseurs of love,\nYour hands are not yet free from household chores.\nWhat else can I say, but that this moment (for enjoying the company of Your beloved) deserves no delay.","source":"Sri Rupa Gosvami"},{"number":210,"topic":"The Next Day A Sakhī Reminds Rādhā About Her Tryst With Kṛṣṇa","devanagari":"लज्जैवोड्ढरिता किमत्र कुलिशोदबद्धा कपाटस्थिति-\nर्मर्यादैव विलङ्घिता पथि पुनः केयं कलिन्दात्मजा ।\nआक्षिपता खलदृष्टिवैव सहसा व्यालावली कीदृशी\nप्राणा एव समर्पिताः सखि चिरं तस्मै किमेपा तनुः ।।","iast":"lajjaivoḍḍharitā kimatra kuliśodabaddhā kapāṭasthiti-\nrmaryādaiva vilaṅghitā pathi punaḥ keyaṃ kalindātmajā |\nākṣipatā khaladṛṣṭivaiva sahasā vyālāvalī kīdṛśī\nprāṇā eva samarpitāḥ sakhi ciraṃ tasmai kimepā tanuḥ ||","meaning":"\"My friend!\nHaving laid bare modesty itself, how can I be deterred by a door-latch, sealed may it be by a thunder-bolt?\nHaving transgressed propriety itself, how difficult can it be for Me to cross the river Yamuna which comes in My way?\nHaving so harshly disregarded the critical glances of wicked persons, how can I be afraid of the hosts of snakes on My path?\nHaving surrendered My very soul (to Krsna), why the delay in consecrating this body to Him?\"","source":"Anonymous"},{"number":211,"topic":"The Next Day A Sakhī Reminds Rādhā About Her Tryst With Kṛṣṇa","devanagari":"द्वित्रै: केलिसरोरुहं त्रिचतुरैर्धम्मिल्लमल्लीस्त्रजं\nकण्ठान्मौक्तिकमालिकां तदनु च त्यक्त्वा पदै: पञ्चषै:।\nकृष्णप्रेमविधूर्णितान्तरतया दूराभिसारातुरा\nतन्वङ्गी निरुपायमध्वनि परं श्रोणीभरं निन्दति।।","iast":"dvitrai: kelisaroruhaṃ tricaturairdhammillamallīstrajaṃ\nkaṇṭhānmauktikamālikāṃ tadanu ca tyaktvā padai: pañcaṣai:|\nkṛṣṇapremavidhūrṇitāntaratayā dūrābhisārāturā\ntanvaṅgī nirupāyamadhvani paraṃ śroṇībharaṃ nindati||","meaning":"Smitten with love for Kṛṣṇa, Rādhā's heart was tremulous,\nAnd, in Her impatience to meet Her beloved, She was intimidated by the distance She had to travel.\nSo, after walking two or three steps, She let go of the lotus flower She was playing with.\nUpon taking three or four steps She dropped the wreath of jasmine flowers that was tied to Her hair.\nAnd then, after five or six steps, She discarded Her necklace of pearls.\nAnd when at last, She was at a loss for any more solutions to hasten Her journey,\nThe slender-limbed Rādhā began to curse the weight of Her hips.","source":"Anonymous"},{"number":212,"topic":"Rādhā Dresses Herself And Prepares Her Abode To Recieve Her Beloved","devanagari":"तल्पं कल्पय दूति पल्लवकुलैर्नर्लतामण्डपे\nनिर्बन्धं मम पुष्पमण्डनविधौ नाद्यापि किं मुञ्चसि।\nपश्य क्रीडद मन्दमन्थतमसं वृन्दाटवीं तस्तरे\nतद्गोपेन्द्रकुमारमत्र मिलितप्रायं मन: शङ्कते।।","iast":"talpaṃ kalpaya dūti pallavakulairnarlatāmaṇḍape\nnirbandhaṃ mama puṣpamaṇḍanavidhau nādyāpi kiṃ muñcasi|\npaśya krīḍada mandamanthatamasaṃ vṛndāṭavīṃ tastare\ntadgopendrakumāramatra militaprāyaṃ mana: śaṅkate||","meaning":"(Rādhā addressed Her friend thus:)\n\"My friend! Inside this pavilion, erected from wild creepers, make\nMe a couch from blades of grass.\nOh, now why do you not give up your insistence on beautifying Me\nwith flowers?\nLook! Blinding darkness has cast itself over Vṛndāvana as if\nsomeone is playing a game with us.\nI have this suspicion in My mind that, over here, we are likely to\nmeet with our young cowherd chief (Kṛṣṇa).\"","source":"Śrī Raghunātha Dāsa"},{"number":213,"topic":"Rādhā 'S Longing For Her Separated Lover","devanagari":"सखि स विजितो वीणावाद्यैः कयाप्यपरस्त्रिया\nपणितमभवत्ताभ्यां तत्र क्षपाललितं ध्रुवम्।\nकथमितरथा शेफालिषु स्खलत्कुसुमास्वपि\nप्रसरति नभोमध्येऽपीन्दौ प्रियेण विलम्ब्यते।।","iast":"sakhi sa vijito vīṇāvādyaiḥ kayāpyaparastriyā\npaṇitamabhavattābhyāṃ tatra kṣapālalitaṃ dhruvam|\nkathamitarathā śephāliṣu skhalatkusumāsvapi\nprasarati nabhomadhye’pīndau priyeṇa vilambyate||","meaning":"(Rādhā tells Her friend:)\n\"O sakhī! I am certain that My beloved (Kṛṣṇa) has been out-\nperformed by another woman in playing the lute. And that they\nperformed by another woman in playing the lute. And that they\nhad placed a bet that, if He were to be outdone, He would oblige her tonight with amorous sports.\nFor why else is it that despite the Śephālī tree having shed its flowers, and the moon having appeared in the centre of the sky, He delays so much in coming to Me?\"","source":"Anonymous"},{"number":214,"topic":"Rādhā 'S Longing For Her Separated Lover","devanagari":"अरतिरियमुपैति मां न निद्रा\nगणयति तस्य गुणान्मनो न दोषान् ।\nविरमति रजनी न सङ्गमाशा\nव्रजति तनुस्तनुतां न चानुरागः ।।","iast":"aratiriyamupaiti māṃ na nidrā\ngaṇayati tasya guṇānmano na doṣān |\nviramati rajanī na saṅgamāśā\nvrajati tanustanutāṃ na cānurāgaḥ ||","meaning":"\"Distress comes to Me, but sleep does not.\nMy mind enumerates His virtues, but not His failings.\nThis night is coming to an end, but not My hopes for meeting My beloved.\nMy body is wasting away, and yet My love is not waning.\"","source":"Śrī Kaṅka"},{"number":215,"topic":"Rādhā'S Disappointment At Krsna'S Failing To Keep His Appointment With Her","devanagari":"उत्तिष्ठ दूति यामो यामो यातस्तथापि नायातः।\nयाऽतः परमपि जीवेज्जीवितनाथो भवेत्तस्याः।।","iast":"uttiṣṭha dūti yāmo yāmo yātastathāpi nāyātaḥ|\nyā’taḥ paramapi jīvejjīvitanātho bhavettasyāḥ||","meaning":"\"Arise My friend!\nThree hours have gone by, and My beloved has not yet come.\n(I have no desire to live any more.)\nWhichever one of us lives on, Our beloved Lord shall be husband to her.\"","source":"Śrī Kanka"},{"number":216,"topic":"Rādhā'S Anger At Krsna For His Infidelity","devanagari":"लाक्षालक्ष्म ललाटपट्टमभितः केयूरमुद्रा गले\nवक्त्रे कज्जलकालिमा नयनयोस्ताम्बूलरागो घनः।\nदृष्टा कोपविधायि मण्डनमिदं प्रातश्चिरं प्रेयसो\nलीलातामरसोदरे मृगदृशः श्वासाः समाप्तिं गताः।।","iast":"lākṣālakṣma lalāṭapaṭṭamabhitaḥ keyūramudrā gale\nvaktre kajjalakālimā nayanayostāmbūlarāgo ghanaḥ|\ndṛṣṭā kopavidhāyi maṇḍanamidaṃ prātaściraṃ preyaso\nlīlātāmarasodare mṛgadṛśaḥ śvāsāḥ samāptiṃ gatāḥ||","meaning":"His forehead was smeared, from side to side, with red unguent*,\nHis neck bore the imprints of a bracelet,\nHis face was blackened with collyrium,\nAnd His eyes were stained with the rich colour of tāmbūla**.\nIn the morning (such being the state of Kṛṣṇa),\nThe deer-eyed Rādhā, upon gazing for a long time, at Her lover\nWho was embellished with such telling signs*** as to make Her\nangry,\nCeased to breathe, as if Her breath terminated into the lotus She\nwas playing with.","source":"Śrī Autkala"},{"number":217,"topic":"Rādhā Addresses Krṣṇa When She Was Displeased At His Infidelity","devanagari":"कृतं मिथ्याजल्पैर्विरम विदितं कामुक चिरात्\nप्रियां तामेवोच्चैरभिसर यदीयैर्नखपदैः।\nविलासैश्च प्राप्तं तव हृदि पदं रागबहुलै-\nर्मया किं ते कृत्यं ध्रुवमकुटिलाचारपरया।।","iast":"kṛtaṃ mithyājalpairvirama viditaṃ kāmuka cirāt\npriyāṃ tāmevoccairabhisara yadīyairnakhapadaiḥ|\nvilāsaiśca prāptaṃ tava hṛdi padaṃ rāgabahulai-\nrmayā kiṃ te kṛtyaṃ dhruvamakuṭilācāraparayā||","meaning":"\"Stop speaking false words to Me, O promiscuous One!\nI have known for a long time about Your beloved companion.\nShe has secured her place in Your heart by giving You deep nail marks and by her sensuously charged romantic dalliances.\n(Go back to Her.)\nI am not fickle at heart nor am I devious in conduct.\nSo what is Your business with Me?\"","source":"Śrī Rudra"},{"number":218,"topic":"Rādhā Addresses Krṣṇa When She Was Displeased At His Infidelity","devanagari":"सार्धं मनोरथशतैस्तव धूर्त कान्ता\nसैव स्थिता मनसि कृत्रिमभावरम्या ।\nअस्माकमस्ति न हि कश्चिदिहावकाश-\nस्तस्मात् कृतं चरणपातविडम्बनाभिः।।","iast":"sārdhaṃ manorathaśataistava dhūrta kāntā\nsaiva sthitā manasi kṛtrimabhāvaramyā |\nasmākamasti na hi kaścidihāvakāśa-\nstasmāt kṛtaṃ caraṇapātaviḍambanābhiḥ||","meaning":"\"O deceitful One!\nNurturing a hundred amorous aspirations (with other damsels),\nYou have installed the charming maiden of hypocrisy in Your heart.\nSo what place do You have for Me in there?\nTherefore fall not at My feet and dispense with Your farcical gestures.\"","source":"Śrī Rudra"},{"number":219,"topic":"Rādhā Addresses Krṣṇa When She Was Displeased At His Infidelity","devanagari":"अनलङ्कृतोऽपि माधव हरसि मनो मे सदा प्रसभम् ।\nकिं पुनरलङ्कृतस्त्वं सम्प्रति नखरक्षतैस्तस्याः।।","iast":"analaṅkṛto’pi mādhava harasi mano me sadā prasabham |\nkiṃ punaralaṅkṛtastvaṃ samprati nakharakṣataistasyāḥ||","meaning":"\"O Mādhava!\nEven when You are without ornaments, You always, so forcefully, steal away My heart.\nThen, to what purpose are You now decorated with these nail marks given to You by Your paramour?","source":"Śrī Viśvanātha"},{"number":220,"topic":"Rādhā'S Outpourings During The Mood Of Dejection That Came Upon Her After The Episode Of Krsna'S Infidelity (And After His Consequent Departure)","devanagari":"व्यतीताः प्रारम्भाः प्रणयबहुमानो विगलितो\nदुराशा याता मे परिणतिरियं प्राणितुमपि।\nयथेष्टं चेष्टन्तां विरहिधविध्विख्यातयशसो\nविभावा मय्येते पिकमधुसुधांशुप्रभृतयः।।","iast":"vyatītāḥ prārambhāḥ praṇayabahumāno vigalito\ndurāśā yātā me pariṇatiriyaṃ prāṇitumapi|\nyatheṣṭaṃ ceṣṭantāṃ virahidhavidhvikhyātayaśaso\nvibhāvā mayyete pikamadhusudhāṃśuprabhṛtayaḥ||","meaning":"\"Our romantic adventure has come to an end,\nMy love for My beloved has dissolved away My pride,\nMy adverse feelings have gone away,\nAnd though alive, I feel that I have come to the end of My life.\nO moon! O spring season! O cuckoo! And all others like you who have earned fame as tormentors of separated lovers!\nHaving ignited My feelings, you may now do as you please.","source":"Śrī Puruṣottama Deva"},{"number":221,"topic":"Rādhā'S Outpourings During The Mood Of Dejection That Came Upon Her After The Episode Of Krsna'S Infidelity (And After His Consequent Departure)","devanagari":"मा मुञ्च पञ्चशर पञ्चशरीर शरीरे\nमा सिञ्च सान्द्रमकरन्दरसेन वायो ।\nअङ्गानि तत्प्रणयभङ्गविगंहितानि\nनालम्बितुं कथमपि क्षमतेऽद्य जीवः ।।","iast":"mā muñca pañcaśara pañcaśarīra śarīre\nmā siñca sāndramakarandarasena vāyo |\naṅgāni tatpraṇayabhaṅgavigaṃhitāni\nnālambituṃ kathamapi kṣamate’dya jīvaḥ ||","meaning":"O Cupid! Release not your arrows into My body.\nO wind! Pour not unto Me your rich nectar (drawn by you from the flowers you visit).\nAll parts of My body stand condemned for My failure in love.\nAnd today My soul is unable to bear their burden for even a moment.","source":"Śrī Purusottama Deva"},{"number":222,"topic":"Rādhā'S Friend Instructs Her When Krsna Returns In The Evening","devanagari":"कञ्चन वञ्चनचतुरे प्रपश्य त्वं मुरान्तके मानम् ।\nबहुवल्लभे हि पुरुषे दाक्षिण्यं दुःखमुद्वहति ।।","iast":"kañcana vañcanacature prapaśya tvaṃ murāntake mānam |\nbahuvallabhe hi puruṣe dākṣiṇyaṃ duḥkhamudvahati ||","meaning":"\"Assume a mood of arrogance towards that artful flatterer Murāri,\nFor courtesy to a man with many lovers is cause for pain.\"","source":"Śrī Rūpa Gosvāmī"},{"number":223,"topic":"Rādhā In Her Mood Of Jealous Pride","devanagari":"भवतु विदितं छद्मालापैरलं प्रिय गम्यतां\nतनुरपि न ते दोषोऽस्माकं विधिस्तु पराङ्मुखः।\nतव यदि तथाभूतं प्रेम प्रपन्नमिमां दशां\nप्रकृतिचपले का नः पीडा गते हतजीविते।।","iast":"bhavatu viditaṃ chadmālāpairalaṃ priya gamyatāṃ\ntanurapi na te doṣo’smākaṃ vidhistu parāṅmukhaḥ|\ntava yadi tathābhūtaṃ prema prapannamimāṃ daśāṃ\nprakṛticapale kā naḥ pīḍā gate hatajīvite||","meaning":"(Rādhā addresses Kṛṣṇa:)\n\"Enough My dear!\nWhatever I have come to know (about Your other lover) from Your deceptive talk,\nBe it so!\nAnd may You be gone from here (back to Your paramour).\nYou are not in the least to blame in this matter.\nFor it is Providence that has forsaken Me.\nIf the consequence of seeking Your love is this (wretched) state of Mine,\nThen what regret would I have if My life, fickle as it is, were to end.\n(All I care is for You to be pleased.)\"","source":"Śrī Amaru"},{"number":224,"topic":"Rādhā In Her Mood Of Jealous Pride","devanagari":"कस्त्वं तासु यदृच्छया कितव यास्तिष्ठन्ति गोपाङ्गनाः\nप्रेमाणं न विदन्ति यास्तव हरे किं तासु ते कैतवम्।\nएषा हन्त हताशया यदभवं त्वय्येवताना परं\nतेनास्याः प्रणयोऽधुना खलु मम प्राणैः समं यास्यति।।","iast":"kastvaṃ tāsu yadṛcchayā kitava yāstiṣṭhanti gopāṅganāḥ\npremāṇaṃ na vidanti yāstava hare kiṃ tāsu te kaitavam|\neṣā hanta hatāśayā yadabhavaṃ tvayyevatānā paraṃ\ntenāsyāḥ praṇayo’dhunā khalu mama prāṇaiḥ samaṃ yāsyati||","meaning":"\"O Hari! O deceitful One!\nWhy do You apply Your deceptive charms on those cowherd girls?\nThey are so whimsical and they know not the depth of Your love.\nAlas! My feelings of dejection are driving Me to focus single-mindedly on You.\nThis state of Mine will, at this very moment, cause My life to depart along with My affections for You.\"","source":"Śrī Purusottama Deva"},{"number":225,"topic":"Rādhā'S Friend Addresses Her Upon Krsna'S Departure","devanagari":"साचिकन्धरममुं किमीक्षसे\nयातु यातु सखि पूतनार्दनः।\nवामरीतिचतुरां हि पामरी\nसेवतां परमदेवतामिव।।","iast":"sācikandharamamuṃ kimīkṣase\nyātu yātu sakhi pūtanārdanaḥ|\nvāmarīticaturāṃ hi pāmarī\nsevatāṃ paramadevatāmiva||","meaning":"\"O sakhi! Why do You turn Your neck so much to look at Him, the slayer of the demoness Pūtanā?\nLet Him go! Let Him go!\nLet Him serve, as He would serve a Tutelary Deity*,\nHis wretched paramour who is skilled in the vile art of seduction.\"","source":"Śrī Rūpa Gosvāmī"},{"number":226,"topic":"The Statements Of The Messenger Krsna Sent To Rādhā","devanagari":"प्रेमावगाहनकृते मानं मा कुरु चिराय करभोरु ।\nनाकर्णि किं नु मुग्धे जातं पीयूषमन्थने गरळम् ।।","iast":"premāvagāhanakṛte mānaṃ mā kuru cirāya karabhoru |\nnākarṇi kiṃ nu mugdhe jātaṃ pīyūṣamanthane garaḻam ||","meaning":"\"If You wish to immerse Yourself in love,\nThen be not haughty for long O Karabhorū*.\nFor have You not heard, O charming One,\nThat when the gods had churned the ocean for the sake of nectar,\nPoison was obtained as well?\"","source":"Śrī Ranga"},{"number":227,"topic":"The Statements Of The Messenger Krsna Sent To Rādhā","devanagari":"विधुमुखि विमुखीभावं भाविनि मद्भाषणे मा गाः।\nमूढे निगमनिगूढः कतिपयकल्याणतो मिलति।।","iast":"vidhumukhi vimukhībhāvaṃ bhāvini madbhāṣaṇe mā gāḥ|\nmūḍhe nigamanigūḍhaḥ katipayakalyāṇato milati||","meaning":"“O Vidhumukhī*! O noble One!\nBe not indifferent to what I have to say.\nO foolish One!\nThe Lord Whose glories are obscured in the esoteric Vedas,\nIs attained after so many religious undertakings.\n(That Lord is so very accessible to You.)”","source":"Śrī Ranga"},{"number":228,"topic":"Rādhā Speaks To Krsna'S Messenger","devanagari":"अलमलमधृणस्य तस्य नाम्ना\nपुनरपि सैव कथा गतः स कालः।\nकथय कथय वा तथापि दूति\nप्रतिवचनं द्विषतोऽपि माननीयम्।।","iast":"alamalamadhṛṇasya tasya nāmnā\npunarapi saiva kathā gataḥ sa kālaḥ|\nkathaya kathaya vā tathāpi dūti\nprativacanaṃ dviṣato’pi mānanīyam||","meaning":"\"Enough! Enough of taking the name of that heartless One!\nAnd why tell the same story again?\nThe old times (when Krsna and I were lovers) are now over.\nBut even then, O messenger, say what you have to say.\nFor the message of even an enemy is worthy of consideration.\"","source":"Śrī Aṅgada"},{"number":229,"topic":"Comments Of Rādhā'S Shrewd Friend During Rādhā'S Estrangement With Krsna","devanagari":"अनालोच्य प्रेम्णः परिणति मनादृत्य सुहृद-\nस्त्वयाकाण्डे मानः किमिति सरले प्रेयसि कृतः।\nसमाकृष्टा ह्येते विरहदहनोद्भासुरशिखाः\nस्वहस्तेनाङ्गारास्तदलमधुनारण्यरुदितैः।।","iast":"anālocya premṇaḥ pariṇati manādṛtya suhṛda-\nstvayākāṇḍe mānaḥ kimiti sarale preyasi kṛtaḥ|\nsamākṛṣṭā hyete virahadahanodbhāsuraśikhāḥ\nsvahastenāṅgārāstadalamadhunāraṇyaruditaiḥ||","meaning":"\"O simple-minded One!\nWithout heeding the consequences of love and disregarding the\ncounsel of Your friends,\nWhy have You, so abruptly, assumed this attitude of indignation\ntowards Your beloved?\nYou have by Your own hand, drawn to Yourself, these burning embers of Your pride, and which are aglow with the flame of the agony of separation from Your lover.\nSo what is the sense of Your weeping in solitude, when there is no one to heed to Your woes?","source":"Śrī Amaru"},{"number":230,"topic":"The Counsel Of Rādhā'S Friend Who Was Harshly Disposed Towards Krsna","devanagari":"मानबन्धमभितः श्लथयन्ती\nगौरवं न खलु हारय गौरि ।\nआर्जवं न भजते दनुजारि-\nर्वञ्चके सरलता न हि साध्वी ।।","iast":"mānabandhamabhitaḥ ślathayantī\ngauravaṃ na khalu hāraya gauri |\nārjavaṃ na bhajate danujāri-\nrvañcake saralatā na hi sādhvī ||","meaning":"\"While You slacken Your indignation (towards Kṛṣṇa) in every way,\nDo not, O Gauri, let go of Your pride.\nThe crafty Danujāri* is not honest in His conduct,\nAnd so to be forthcoming with Him is not advisable.\"","source":"Śrī Rūpa Gosvāmī"},{"number":231,"topic":"Rādhā'S Reply To Her Friend","devanagari":"भ्रूभङ्गो गुणितश्चिरं नयनयोरभ्यस्तमामीलनं\nरोद्धुं शिक्षितमादरेण हसितं मौनेऽभियोगः कृतः।\nधैर्यं कर्तुमपि स्थिरीकृतमिदं चेतः कथञ्चिन्मया\nबद्धो मानपरिग्रहे परिकरः सिद्धिस्तु दैवे स्थिता।।","iast":"bhrūbhaṅgo guṇitaściraṃ nayanayorabhyastamāmīlanaṃ\nroddhuṃ śikṣitamādareṇa hasitaṃ maune’bhiyogaḥ kṛtaḥ|\ndhairyaṃ kartumapi sthirīkṛtamidaṃ cetaḥ kathañcinmayā\nbaddho mānaparigrahe parikaraḥ siddhistu daive sthitā||","meaning":"\"Since long have I acquired the art of gracefully bending My eyebrows,\nHave I practiced the gentle blinking of My eyes,\nHave I learnt how to respectfully restrain My laughter,\nAnd have I applied Myself to the practice of silence.\nFor the sake of acquiring patience I have somehow stilled My mind,\nAnd while I have taken a strong resolve to retain My mood of indignation (towards Kṛṣṇa),\nMy success (in maintaining My resolve) is dependent upon fate.","source":"Śrī Amaru"},{"number":232,"topic":"Rādhā'S Reply To Her Friend","devanagari":"जानामि मौनमलसाङ्ग वचोविभङ्गी-\nर्भङ्गीशतं नयनयोरपि चातुरीं च।\nआभीरनन्दनमुखाम्बुजसङ्गशंसी\nवंशीरवो यदि न मामवशीकरोति।।","iast":"jānāmi maunamalasāṅga vacovibhaṅgī-\nrbhaṅgīśataṃ nayanayorapi cāturīṃ ca|\nābhīranandanamukhāmbujasaṅgaśaṃsī\nvaṃśīravo yadi na māmavaśīkaroti||","meaning":"\"I know the art of silence, O friend Alasangi.\nI know the modulations of voice,\nAnd I am expert in hundreds of modes of expressions of the eyes.\nBut all these I know only if,\nThe sound of the flute of the cowherd boy (Krsna),\nWhich announces its contact with His lotus like mouth,\nDoes not overwhelm Me.\"","source":"Anonymous"},{"number":233,"topic":"Rādhā'S Reply To Her Friend","devanagari":"सत्यं शृणोमि सखि नित्यनवप्रियोऽसौ\nगोपस्तथापि हृदयं मदनो दुनोति ।\nयुक्त्या कथञ्चन समं गमितेऽपि तस्मिन्\nमां तस्य कालमुरली कवळीकरोति ।।","iast":"satyaṃ śṛṇomi sakhi nityanavapriyo’sau\ngopastathāpi hṛdayaṃ madano dunoti |\nyuktyā kathañcana samaṃ gamite’pi tasmin\nmāṃ tasya kālamuralī kavaḻīkaroti ||","meaning":"\"What I have heard is indeed true, O sakhi,\nThat the cowherd boy (Krsna) is eternally youthful and charming.\nAnd so My love for Him scorches My heart.\nEven if by means of reasoning I am somehow able to attain peace,\nHis flute, which embodies Time* itself, consumes Me.\"","source":"Sri Sanatana Gosvami"},{"number":234,"topic":"Rādhā'S Reply To Her Friend","devanagari":"न जाने सम्मुखायाते प्रियाणि वदति प्रिये ।\nप्रयान्ति मम गात्राणि श्रोत्रतां किमु नेत्रताम् ।।","iast":"na jāne sammukhāyāte priyāṇi vadati priye |\nprayānti mama gātrāṇi śrotratāṃ kimu netratām ||","meaning":"\"Upon coming face to face with My beloved and upon His speaking sweet words,\nI know not whether all parts of My body become eyes or become ears*.\"","source":"Anonymous"},{"number":235,"topic":"Rādhā'S Reply To Her Friend","devanagari":"मुरारिं पश्यन्त्याः सखि सकलमङ्गं न नयनं\nकृतं यच्छृण्वन्त्या हरिगुणगणं श्रोत्रनिश्चितम् ।\nसमं तेनालापं सपदि रचयन्त्या मुखमयं\nविधातुनैवायं घटनपरिपाटीमधुरिमा ।।","iast":"murāriṃ paśyantyāḥ sakhi sakalamaṅgaṃ na nayanaṃ\nkṛtaṃ yacchṛṇvantyā hariguṇagaṇaṃ śrotraniścitam |\nsamaṃ tenālāpaṃ sapadi racayantyā mukhamayaṃ\nvidhātunaivāyaṃ ghaṭanaparipāṭīmadhurimā ||","meaning":"\"O sakhi!\nWhen I look upon Murāri, why do not all My limbs become like eyes?\nWhen I hear the glories of Hari, why do not ears cover all of Me?\nAnd when I speak with Him, then at that moment, why am I not endowed entirely with mouths?\nThis design of creation of the Lord (where all this is not possible) has no sweetness in it at all.\"","source":"Śrī Śaraṇa"},{"number":236,"topic":"Rādhā’S Friend’S Critical Comments On Krsna","devanagari":"त्वमसि विशुद्धा सरले मुरलीवक्त्रस्त्रिधा वक्रः।\nभङ्गुरया खलु सुलभं तदुरः सखि वैजयन्त्येव ।।","iast":"tvamasi viśuddhā sarale muralīvaktrastridhā vakraḥ|\nbhaṅgurayā khalu sulabhaṃ taduraḥ sakhi vaijayantyeva ||","meaning":"“(O Rādhā!) O simple-minded One! You are too honest and straightforward.\nBut He Who sports a flute to His mouth, has a form that is bent* at three places.\nO sakhi! It is certain that only a woman who is crooked like a necklace of pearls can have access to His heart.”","source":"Śrī Rūpa Gosvāmī"},{"number":237,"topic":"Rādhā Speaks In Her State Of Distress","devanagari":"निःश्वासा वदनं दहन्ति हृदयं निर्मूलमुन्मथ्यते\nनिद्रा नैति न दृश्यते प्रियमुखं रात्रिविंदं रुद्यते ।\nअङ्गं शोषमुपैति पादपतितः प्रेयांसथोपेक्षितः\nसख्यः कं गुणाकलव्य दयिते मानं वयं कारिताः।।","iast":"niḥśvāsā vadanaṃ dahanti hṛdayaṃ nirmūlamunmathyate\nnidrā naiti na dṛśyate priyamukhaṃ rātriviṃdaṃ rudyate |\naṅgaṃ śoṣamupaiti pādapatitaḥ preyāṃsathopekṣitaḥ\nsakhyaḥ kaṃ guṇākalavya dayite mānaṃ vayaṃ kāritāḥ||","meaning":"“My outgoing breath scorches My face.\nMy heart is being dislodged like a rootless tree,\nSleep does not come to Me,\nI do not get to see the face of My beloved anymore,\nI weep night and day,\nAnd all My limbs are withering away.\nI had disregarded My lover Who had fallen at My feet.\nO sakhīs! What virtue did You see in making Me behave\narrogantly with My beloved?”","source":"Śrī Amaru"},{"number":238,"topic":"A Friend Speaks To Rādhā When She Is Lost In Thought Of Her Separated Lover","devanagari":"आहारे विरतिः समस्तविषयग्रामे निवृत्तिः परा\nनासाग्रे नयनं यदेतदपरं यच्चैकतानं मनः।\nमौनं चेदमिदं च शून्यमखिलं यद्विश्वमाभाति ते\nतद् ब्रूयाः सखि योगिनी किमसि भोः किं वा वियोगिन्यसि।।","iast":"āhāre viratiḥ samastaviṣayagrāme nivṛttiḥ parā\nnāsāgre nayanaṃ yadetadaparaṃ yaccaikatānaṃ manaḥ|\nmaunaṃ cedamidaṃ ca śūnyamakhilaṃ yadviśvamābhāti te\ntad brūyāḥ sakhi yoginī kimasi bhoḥ kiṃ vā viyoginyasi||","meaning":"“(O Rādhā!)\nYou have lost interest in eating,\nYou have attained supreme detachment from all worldly objects.\nYour eyes have become focused on the tip of Your nose,\nAnd Your mind has attained concentration.\nYou have undertaken a pledge of silence,\nAnd the whole world appears to You like a void.\nSo tell us, O friend,\nAre You a yogini or are You a viyogini*?","source":"Anonymous"},{"number":239,"topic":"Rādhā’S Reply To Her Friend","devanagari":"सङ्गमविरहविकल्पे वरमिह विरहो न सङ्गमस्तस्य ।\nएकः स एव सङ्गे त्रिभुवनमपि तन्मयं विरहे ।।","iast":"saṅgamavirahavikalpe varamiha viraho na saṅgamastasya |\nekaḥ sa eva saṅge tribhuvanamapi tanmayaṃ virahe ||","meaning":"“Of the two alternatives,\nOf the association of My beloved or of separation from Him,\nSeparation is superior to association.\nFor when He is present, He is only one,\nBut in His absence, all the three worlds appear like Him.”","source":"Anonymous"},{"number":240,"topic":"Kṛṣṇa Pines For His Beloved (Rādhā)","devanagari":"सञ्जाते विरहे कयापि हृदये सन्दानिते चिन्तया\nकालिन्दतटवेतसीवनघनच्छायानिषण्णात्मनः ।\nपायासुः कलकण्ठकूजितकला गोपस्य कंसद्विषो\nजिह्वावर्जिततालुमूर्च्छतमरुद्विस्फारिता गीतयः ।।","iast":"sañjāte virahe kayāpi hṛdaye sandānite cintayā\nkālindataṭavetasīvanaghanacchāyāniṣaṇṇātmanaḥ |\npāyāsuḥ kalakaṇṭhakūjitakalā gopasya kaṃsadviṣo\njihvāvarjitatālumūrcchatamarudvisphāritā gītayaḥ ||","meaning":"Pained by separation from His lover and His mind afflicted by some worry,\nThe cowherd boy, the enemy of Kamsa, was overcome with dejection,\nWhen He seated Himself in the dense shade of the cane-forest on the banks of the Yamunā river.\nThe air flowing over His tongue, being intensified by contact with His palate, sounded melodious notes (on His flute) in the likeness of the sound of the cuckoo bird.\nMay those melodious notes sounded by the Lord protect all of you.","source":"Anonymous"},{"number":241,"topic":"Rādhā Is Pleased By Kṛṣṇa’S Entreaties","devanagari":"शिरश्छायां कृष्णः स्वयमकृत राधाचरणयो-\nर्भुजावल्लीच्छायमियमपि तदीयप्रतिकृतौ ।\nइति क्रीडाकोपे निभृतमुभयोरप्यनुनय-\nप्रसादौ जीयास्तामपि गुरुसमक्षं स्थितवतोः।।","iast":"śiraśchāyāṃ kṛṣṇaḥ svayamakṛta rādhācaraṇayo-\nrbhujāvallīcchāyamiyamapi tadīyapratikṛtau |\niti krīḍākope nibhṛtamubhayorapyanunaya-\nprasādau jīyāstāmapi gurusamakṣaṃ sthitavatoḥ||","meaning":"As Kṛṣṇa shaded Rādhā’s feet by the shadow of His own head,\nRādhā in turn shaded Him by Her slender arms.\nIn the presence of their elders but concealed from public view,\nRādhā and Kṛṣṇa indulged in expressions of feigned anger.\nAnd they became delightful upon making entreaties to each other.\nGlory be to the entreaties and to the delight of Rādhā and Kṛṣṇa!","source":"Śrī Hara"},{"number":242,"topic":"Rādhā'S Friend Speaks To Kṛṣṇa","devanagari":"सा सर्वथैव रक्ता रागं गुञ्जेव न तु मुखे वहति ।\nवचनपटोस्तव रागः केवलमास्ये शुकस्येव।।","iast":"sā sarvathaiva raktā rāgaṃ guñjeva na tu mukhe vahati |\nvacanapaṭostava rāgaḥ kevalamāsye śukasyeva||","meaning":"\"O eloquent One (Kṛṣṇa)!\nRādhā is in every way infused with love for You.\nBut in the likeness of the guñja berry*,\nShe expresses not Her love on Her face.\nBut Your love for Rādhā,\nIs worn by You only on Your countenance,\nIn the likeness of a parrot**.\"","source":"Śrī Govardhana Ācārya"},{"number":243,"topic":"Rādhā'S Friend Speaks To Kṛṣṇa","devanagari":"सुभग भवता हृद्य तस्या ज्वलत्स्मरपावकेऽ-\nप्यभिनिविशता प्रेमाधिक्यं चिरात् प्रकटीकृतम्।\nतव तु हृदये शीतेऽप्येवं सदैव सुखाप्तये\nमम सहचरी सा निःस्नेहा मनागपि न स्थिता।।","iast":"subhaga bhavatā hṛdya tasyā jvalatsmarapāvake’-\npyabhiniviśatā premādhikyaṃ cirāt prakaṭīkṛtam|\ntava tu hṛdaye śīte’pyevaṃ sadaiva sukhāptaye\nmama sahacarī sā niḥsnehā manāgapi na sthitā||","meaning":"\"O blessed One (Kṛṣṇa)!\nYou have entered Her (Rādhā's) heart which burns with the fire of love,\nAnd You have caused intense love to be manifest in Her heart for a long time now.\nBut My friend (Rādhā), Who is always indifferent to the attainment of happiness,\nFinds not the least place in Your cold heart.”","source":"Śri Rudra"},{"number":244,"topic":"The Events Of The Next Day","devanagari":"आगत्य प्रणिपातसान्त्वतसखीदत्तान्तरे सागसि\nस्वैरं कुर्वति तल्पपार्श्वनिभृते धूर्तेऽङ्गसंवाहनम्।\nज्ञात्वा स्पर्शवशात्तया किल सखीभ्रान्त्येव वक्ष: शनै:\nखिन्नासीत्यभिधाय मीलितदृशा सानन्दमारोपित:।।","iast":"āgatya praṇipātasāntvatasakhīdattāntare sāgasi\nsvairaṃ kurvati talpapārśvanibhṛte dhūrte’ṅgasaṃvāhanam|\njñātvā sparśavaśāttayā kila sakhībhrāntyeva vakṣa: śanai:\nkhinnāsītyabhidhāya mīlitadṛśā sānandamāropita:||","meaning":"Upon arriving (at Rādhā’s house), Kṛṣṇa greeted the sakhi who was massaging Rādhā’s feet. Being pleased with Kṛṣṇa’s salutation, the sakhi gave way to Him.\nThen, in a manner of willful transgression of propriety, the mischievous Kṛṣṇa approached Rādhā’s bed, and pretending to be Her sakhi, He began caressing Her feet.\nEven upon knowing Kṛṣṇa form His touch, Rādhā pretended that it was Her sakhi and said:\n“Press slowly. You are very disturbed (by Kṛṣṇa’s absence).”\nThus speaking, She gazed into Kṛṣṇa’s eyes, and (embracing Him) She delightfully placed Him on Her chest.","source":"Anonymous"},{"number":245,"topic":"The Events Of The Next Day","devanagari":"वस्तुतस्तु गुरुभीतया तया\nव्यञ्जिते कपटमानकुट्‌मले ।\nपेशलप्रियसखीदृशा हरि-\nर्बोधितस्तटलतागृहं ययौ ।।","iast":"vastutastu gurubhītayā tayā\nvyañjite kapaṭamānakuṭ‌male |\npeśalapriyasakhīdṛśā hari-\nrbodhitastaṭalatāgṛhaṃ yayau ||","meaning":"Out of fear of Her elders,\nRādhā feigned, in the likeness of a blossoming flower bud, an expression of arrogance.\nLord Hari, upon understanding the situation from the gestures of the eyes of Rādhā’s shrewd friend,\nRetreated to an arbour on the banks of the Yamunā river.","source":"Anonymous"},{"number":246,"topic":"The Events Of The Next Day","devanagari":"माधवो मधुरमाधवीलता-\nमण्डपे पटुरटन्मधुव्रते ।\nसञ्जगौ श्रवणचारु गोपिका-\nमानमीनबडिशेन वेणुना ।।","iast":"mādhavo madhuramādhavīlatā-\nmaṇḍape paṭuraṭanmadhuvrate |\nsañjagau śravaṇacāru gopikā-\nmānamīnabaḍiśena veṇunā ||","meaning":"Inside a pavilion made of sweet spring creepers,\nIn which could be heard the shrill humming of honey-bees,\nLord Mādhava played on His flute,\nA tune so pleasing to the ears,\nThat He subdued the pride of the gopis,\nIn the manner in which a fishing-hook ensnares a fish.","source":"Anonymous"},{"number":247,"topic":"A Friend Speaks To Rādhā When, With The Pretext Of Plucking Flowers, She Was Searching For Kṛṣṇa","devanagari":"पन्थाः क्षेममयोऽस्तु ते परिहर प्रत्यूहसम्भावना-\nमेतन्मात्रमधारि सुन्दरि मया नेत्रप्रणालीपथे।\nनीरे नीलसरोजमुज्ज्वलगुणं तीरे तमालाङ्कुरः\nकुञ्जे कोऽपि कलिन्दशैलदुहितुः पुंस्कोकिलः खेलति।।","iast":"panthāḥ kṣemamayo’stu te parihara pratyūhasambhāvanā-\nmetanmātramadhāri sundari mayā netrapraṇālīpathe|\nnīre nīlasarojamujjvalaguṇaṃ tīre tamālāṅkuraḥ\nkuñje ko’pi kalindaśailaduhituḥ puṃskokilaḥ khelati||","meaning":"“O beautiful One (Rādhā)!\nMay Your passage be safe and comfortable!\nPut aside Your apprehensions of impediments in Your path,\nFor all that I behold in my field of vision,\nIs a male cuckoo bird,\nResplendent as a blue-lotus in the waters of the Yamunā river,\nAnd endowed with the dark hue of a tender Tamāla tree on the\nriver-bank,\nPlaying about in a forest-garden.”","source":"Śrī Sarvavidyāvinoda"},{"number":248,"topic":"Lord Hari'S Conversation With Rādhā When She Went To The Bank Of The Yamunā River","devanagari":"का त्वं माधवदूतिका वदसि किं मानं जहीहि प्रिये\nधूर्तः सोऽन्यमना मनागपि सखि त्वय्यादरं नोज्झति ।\nइत्यन्योन्यकथारसैः प्रमुदितां राधां सखीवेशवान्\nनीत्वा कुञ्जगृहं प्रकाशिततनुः स्मेरो हरिः पातु वः।।","iast":"kā tvaṃ mādhavadūtikā vadasi kiṃ mānaṃ jahīhi priye\ndhūrtaḥ so’nyamanā manāgapi sakhi tvayyādaraṃ nojjhati |\nityanyonyakathārasaiḥ pramuditāṃ rādhāṃ sakhīveśavān\nnītvā kuñjagṛhaṃ prakāśitatanuḥ smero hariḥ pātu vaḥ||","meaning":"(Rādhā speaks to Kṛṣṇa Who is in the disguise of a sakhi (female friend).)\nRādhā: Who are You?\nKṛṣṇa: I am a messenger of Mādhava.\nRādhā: What do you have to say?\nKṛṣṇa: Give up Your mood of indignation towards Your beloved.\nRādhā: He is a rogue and has given His heart to other lovers.\nKṛṣṇa: Dear friend! He has not in the slightest measure given up the regard He has for You.\nRādhā was immensely delighted upon savouring this conversation. She was taken by Lord Hari, Who was in the guise of a sakhi, to an abode in a forest garden.\nThere, smiling gently, He revealed His true form.\nMay Lord Hari protect you.","source":"Śrī Vāsava"},{"number":249,"topic":"Lord Hari'S Conversation With Rādhā When She Went To The Bank Of The Yamunā River","devanagari":"वसन्तः सन्नद्धो विपिनमजनं त्वं च तरुणी\nस्फुरत्कामावेशे वयसि वयमप्याहितपदाः।\nव्रज त्वं वा राधे क्षणमथ विलम्बस्व यदि वा\nस्फुटं जातस्तावच्चतुरवचनानामवसरः।।","iast":"vasantaḥ sannaddho vipinamajanaṃ tvaṃ ca taruṇī\nsphuratkāmāveśe vayasi vayamapyāhitapadāḥ|\nvraja tvaṃ vā rādhe kṣaṇamatha vilambasva yadi vā\nsphuṭaṃ jātastāvaccaturavacanānāmavasaraḥ||","meaning":"(Kṛṣṇa addresses Rādhā thus: )\n“The spring season is here,\nThere is nobody in the forest,\nAnd while You are so youthful,\nWe have both stepped into the stage of life when the power of love has manifest itself.\nWhether You leave now, O Rādhā,\nOr whether You stay on for a few moments,\nIt is certain that loquacious ones shall have an occasion for gossip.”","source":"Anonymous"},{"number":250,"topic":"Rādhā'S Words (When Kṛṣṇa Tried To Prevent Her From Leaving)","devanagari":"स्वामी मुग्धतरो वनं धनमिदं बालाहमेकाकिनी\nक्षौणीमावृणुते तमालमलिनच्छायातमःसन्ततिः।\nतन्मे सुन्दर कृष्ण मुञ्च सहसा वर्त्मेति राधागिरः\nश्रुत्वा तां परिरभ्य मन्मथकलासक्तो हरिः पातु वः।।","iast":"svāmī mugdhataro vanaṃ dhanamidaṃ bālāhamekākinī\nkṣauṇīmāvṛṇute tamālamalinacchāyātamaḥsantatiḥ|\ntanme sundara kṛṣṇa muñca sahasā vartmeti rādhāgiraḥ\nśrutvā tāṃ parirabhya manmathakalāsakto hariḥ pātu vaḥ||","meaning":"\"My Lord is so very naive,\nThe forest is thick and dense,\nAnd I am very young and am alone here.\nIn the likeness of the black bark of the Tamāla tree,\nThe darkness of the night has spread and overcast the earth.\nTherefore, O Kṛṣṇa, O handsome One,\nLeave My path immediately.\"\nUpon hearing these words of Rādhā,\nLord Hari embraced Her,\nAnd engrossed Himself in performing the arts of Cupid.\nMay Lord Hari protect You.","source":"Anonymous"},{"number":251,"topic":"Rādhā In Full Control Of Her Lover (Kṛṣṇa)","devanagari":"मकरीविरचनभङ्गत्या राधाकुचकलसमर्दनव्यसनी ।\nऋजुमपि रेखां लुम्पन् वल्लववेशो हरिर्जयति ।।","iast":"makarīviracanabhaṅgatyā rādhākucakalasamardanavyasanī |\nṛjumapi rekhāṃ lumpan vallavaveśo harirjayati ||","meaning":"Glory be to Lord Hari,\nWho in the form of a cowherd boy,\nIs devoted to caressing Rādhā’s bosom,\nIn the likeness of the churning of the ocean,\nAnd Who in doing so, causes the disappearance of the straight line between Rādhā’s breasts.","source":"Anonymous"},{"number":252,"topic":"Kṛṣṇa’S Dreams After His Playful Activities","devanagari":"एते लक्ष्मण जानकीविरहिणं मां खेदयन्त्यम्बुदा\nमर्माणीव च घट्टयन्त्यलममी क्रूराः कदम्बानिलाः ।\nइत्थं व्याहृतपूर्वजन्मविरहो यो राधया वीक्षितः\nसेर्ष्य शङ्कितया स वः सुखयतु स्वप्नायमानो हरिः ।।","iast":"ete lakṣmaṇa jānakīvirahiṇaṃ māṃ khedayantyambudā\nmarmāṇīva ca ghaṭṭayantyalamamī krūrāḥ kadambānilāḥ |\nitthaṃ vyāhṛtapūrvajanmaviraho yo rādhayā vīkṣitaḥ\nserṣya śaṅkitayā sa vaḥ sukhayatu svapnāyamāno hariḥ ||","meaning":"(Kṛṣṇa speaks out in His dream:)\n“O Lakṣmaṇa*,\nThis rain cloud torments Me while I pine for My beloved Jānakī (Sītā),\nAnd this cruel breeze, charged with the fragrance of Kadamba flowers, afflicts Me as severely as a needle piercing My heart.”\nMay the dreaming Lord Hari,\nWho spoke thus of the agony of separation from His beloved of His\nprevious incarnation,\nAnd Who Rādhā beheld with envy and suspicion,\nBless you with happiness.","source":"Śrī Śubhāṅka"},{"number":253,"topic":"Kṛṣṇa’S Flute Is Stolen (By Rādhā)","devanagari":"नीचैर्न्यासादथ चरणयोर्नूपुरे मूकयन्ती\nधृत्वा धृत्वा कनकवलयान््युत्क्षिपन्ती भुजान्ते ।\nमुद्रामक्षोश्चकितचकितं शश्वदालोकयन्ती\nस्मित्वा स्मित्वा हरति मुरलीमङ्कतो माधवस्य ।।","iast":"nīcairnyāsādatha caraṇayornūpure mūkayantī\ndhṛtvā dhṛtvā kanakavalayānyutkṣipantī bhujānte |\nmudrāmakṣoścakitacakitaṃ śaśvadālokayantī\nsmitvā smitvā harati muralīmaṅkato mādhavasya ||","meaning":"(Intending to steal Kṛṣṇa’s flute,)\nSilencing Her anklets by placing Her feet on the ground very gently,\nRaising Her arms and clasping Her gold bangles (so that they make\nno sound),\nWatching constantly, with cautious attention, the movements of the\n(sleeping) Lord’s eyes,\nAnd smiling to Herself,\nRādhā takes away Mādhava's flute from His lap.","source":"Śrī Daityāri Paṇḍita"},{"number":254,"topic":"Rādhā Addresses Krsna'S Flute","devanagari":"अच्छिद्रमस्तु हृदयं परिपूर्णमस्तु\nमौखर्यमस्तमितमस्तु गुरुत्वमस्तु।\nकृष्णप्रिये सखि दिशामि सदाशिषस्ते\nयद्वासरे मुरलि मे करुणां करोषि।।","iast":"acchidramastu hṛdayaṃ paripūrṇamastu\nmaukharyamastamitamastu gurutvamastu|\nkṛṣṇapriye sakhi diśāmi sadāśiṣaste\nyadvāsare murali me karuṇāṃ karoṣi||","meaning":"\"O flute! O sakhi*! O beloved of Kṛṣṇa!\nThe day you bestow mercy upon Me,\nThat day shall I bless you thus --\nThat may you be without fault,\nThat may your heart become replete with love,\nThat may you acquire the power of speech,\nThat may your expression acquire moderation,\nAnd that may you attain greatness.\"","source":"Śrī Govinda Miśra"},{"number":255,"topic":"Rādhā Addresses Krsna'S Flute","devanagari":"शून्यत्वं हृदये श्लाघवमिदं शुष्कत्वमङ्गेषु मे\nमौखर्यं व्रजनाथनामकथने दत्तं भवत्या निजम्।\nतत् किं नो मुरलि प्रयच्छसि पुनर्गोविन्दवक्त्रासवं\nयं पीत्वा भुवनं वशे विदधती निर्लज्जमुद्गायसि।।","iast":"śūnyatvaṃ hṛdaye ślāghavamidaṃ śuṣkatvamaṅgeṣu me\nmaukharyaṃ vrajanāthanāmakathane dattaṃ bhavatyā nijam|\ntat kiṃ no murali prayacchasi punargovindavaktrāsavaṃ\nyaṃ pītvā bhuvanaṃ vaśe vidadhatī nirlajjamudgāyasi||","meaning":"\"You have made My heart as barren as you are,\nYou have rendered My limbs light and dry like your self,\nWhile you have gifted Me your eloquence, so that I may chant the\nnames of the Lord of Vraja.\nThen why O flute,\nDo you not grant Me the nectar flowing from Govinda's mouth,\nUpon savouring which,\nYou enchant the whole world while you sing with abandon?\"","source":"Śrī Govinda Miśra"},{"number":256,"topic":"Lord Hari Returns To Vraja In The Evening (After Grazing His Cows)","devanagari":"मन्दक्वाणितवेणुरहि शिथिले व्यावर्तयन् गोकुलं\nबर्हापीडकमुत्तमाङ्गरचितं गोधूलिधूम्रं दधत्।\nम्लायन्त्या वनमालया परिगतः श्रान्तोऽपि रम्याकृति-\nर्गोपस्त्रीनयनोत्सवो वितरतु श्रेयांसि वः केशवः।।","iast":"mandakvāṇitaveṇurahi śithile vyāvartayan gokulaṃ\nbarhāpīḍakamuttamāṅgaracitaṃ godhūlidhūmraṃ dadhat|\nmlāyantyā vanamālayā parigataḥ śrānto’pi ramyākṛti-\nrgopastrīnayanotsavo vitaratu śreyāṃsi vaḥ keśavaḥ||","meaning":"While returning to Gokula at the end of the day,\nLord Keśava plays a grave note on His flute.\nHis head is adorned with a wreath of peacock feathers.\nHis body blackened by the dust raised by His herd of cows,\nAnd He wears a garland of flowers that had withered away.\nBut even in His state of fatigue,\nHis enchanting form presents a delightful sight to the cowherd girls\n(who are awaiting His return).\nMay Lord Keśava bestow prosperity and happiness upon you.","source":"Anonymous"},{"number":257,"topic":"The Utterances Of A Gopī Upon Kṛṣṇa'S Return","devanagari":"दृष्ट्या केशव गोपरागतहया किञ्चिन्न दृष्टं मया\nतेनाद्य स्खलितास्मि नाथ पतितां किं नाम नालम्बसे ।\nएकस्त्वं विषमेषु खिन्नमनसां सर्वाबलानां गति-\nर्गोप्यैवं गदितः सलेशमवताद् गोष्ठे हरिविश्वरम् ।।","iast":"dṛṣṭyā keśava goparāgatahayā kiñcinna dṛṣṭaṃ mayā\ntenādya skhalitāsmi nātha patitāṃ kiṃ nāma nālambase |\nekastvaṃ viṣameṣu khinnamanasāṃ sarvābalānāṃ gati-\nrgopyaivaṃ gaditaḥ saleśamavatād goṣṭhe hariviśvaram ||","meaning":"\"O Keśava,\nThis day, my sight being obscured by the dust raised by Your cows,\nI am unable to see anything.\nI have thus stumbled and fallen down.\nSo why do You, O master, not lend Me Your support?\nFor You are the only salvation for all those distressed cowherd girls\nwho happen to fall into adversity.\"\nMay Lord Hari,\nWho, in His cow-shed, was addressed so earnestly by a gopi,\nProtect you for all time to come.","source":"Anonymous"},{"number":258,"topic":"The Utterances Of A Gopī Upon Kṛṣṇa'S Return","devanagari":"नाभिदेशविनिवेशितवेणु-\nधेनुपुच्छनिहितैककराब्जः।\nअन्यपाणिपरिमण्डितदण्डः\nपुण्डरीकनयनो व्रजमाप।।","iast":"nābhideśaviniveśitaveṇu-\ndhenupucchanihitaikakarābjaḥ|\nanyapāṇiparimaṇḍitadaṇḍaḥ\npuṇḍarīkanayano vrajamāpa||","meaning":"Placing His flute in (the belt around) His waist,\nGrasping a cow's tail with one of His lotus-like hands,\nAnd His other hand adorning His wooden staff,\nThe lotus-eyed Lord reached the town of Vraja.","source":"Anonymous"},{"number":259,"topic":"Rādhā'S Good Fortune (Of Meeting Krsna Upon His Return To Vraja)","devanagari":"भ्रूवल्लीबलनैः कयापि नयनोन्मेषैः कयापि स्मित-\nज्योत्स्नाविच्छुरितैः कयापि निभृतं सम्भावितस्याध्वनि।\nगर्वोद्वेदकृतावेहलललितश्रीभाजि राधानने\nसातङ्कानुनयं जयन्ति पतिताः कंसद्विषो दृष्टयः।।","iast":"bhrūvallībalanaiḥ kayāpi nayanonmeṣaiḥ kayāpi smita-\njyotsnāvicchuritaiḥ kayāpi nibhṛtaṃ sambhāvitasyādhvani|\ngarvodvedakṛtāvehalalalitaśrībhāji rādhānane\nsātaṅkānunayaṃ jayanti patitāḥ kaṃsadviṣo dṛṣṭayaḥ||","meaning":"While on His way (to the town of Vraja).\nThe Lord was greeted by the graceful movements of the eyebrows of a gopi,\nHe was glanced upon by the blooming eyes of another gopi,\nAnd was graced by the smile of yet another gopi, her smile greeting Him like the illumination of moonlight.\nThus honoured (by the gopis) in (the) seclusion (of the forest), the Lord was aroused to pride.\nAnd thereupon, did the slayer of (the mighty demon) Kamsa, succumb to a state of fearful supplication, as He set His eyes upon the reservoir of all beauty -- the face of the spontaneously charming Rādhā.\nGlory be to that gaze of the Lord.","source":"Śrī Umāpatidhara"},{"number":260,"topic":"Rādhā'S Good Fortune (Of Meeting Krsna Upon His Return To Vraja)","devanagari":"तिर्यक्‌कन्धरमंसदेशमिलितश्रोत्रावतंसं स्फुरद्‌\nबहोतम्भितकेशपाशमृजुभ्रूवल्लरिविभ्रमम्‌।\nगुञ्जेणुनिवेशिताधरपुटं साकूतराधानन-\nन्यस्तामीलितदृष्टि गोपवपुषो विष्णोर्मुखं पातु वः।।","iast":"tiryak‌kandharamaṃsadeśamilitaśrotrāvataṃsaṃ sphurad‌\nbahotambhitakeśapāśamṛjubhrūvallarivibhramam‌|\nguñjeṇuniveśitādharapuṭaṃ sākūtarādhānana-\nnyastāmīlitadṛṣṭi gopavapuṣo viṣṇormukhaṃ pātu vaḥ||","meaning":"The Lord's earrings touch His shoulders while He bends His\nneck (to play His flute),\nHis hair are adorned with lustrous peacock feathers,\nHis arched eyebrows are quivering expressively,\nHis flute, sounding a melodious note, is placed on His lips,\nWhile, with wide open eyes, He fixes His amorous gaze upon\nRādhā's face.\nMay the lotus-like countenance of the lord of Gokula protect you.","source":"Śrī Lakṣmaṇa Sena"},{"number":261,"topic":"Rādhā'S Good Fortune (Of Meeting Krsna Upon His Return To Vraja)","devanagari":"अंसासत्तकपोलवंशवदनव्यासक्तबिम्बाधर-\nद्वन्द्वोदीरितमन्दमन्दपवनप्रारब्धमुग्धध्वनिः।\nईषद्धिक्रमलोलहारनिकरः प्रत्येकरोकानन-\nन्यञ्चच्चञ्चदङ्गुलिच्यस्त्वतां पातु राधाधवः।।","iast":"aṃsāsattakapolavaṃśavadanavyāsaktabimbādhara-\ndvandvodīritamandamandapavanaprārabdhamugdhadhvaniḥ|\nīṣaddhikramalolahāranikaraḥ pratyekarokānana-\nnyañcaccañcadaṅgulicyastvatāṃ pātu rādhādhavaḥ||","meaning":"The Lord's cheek rests on His shoulder while His flute is\nplaced to His mouth,\nGentle puffs of air flowing from His red lips are giving rise to an\nenchanting tune,\nThe strings of necklaces around His neck are tilting slightly to one side and are pendulating gently,\nWhile His fingers are moving up and down over each hole of His flute.\nMay that lord and master of Rādhā protect you.","source":"Śrī Nāthoka"},{"number":262,"topic":"The Lord Milks His Cow","devanagari":"अङ्गुष्ठाग्रमयन्त्रिताङ्‌गुलिरसौ पादाधनीरुद्धभू-\nराद्रीकृत्य पयोधराञ्जलमलं सद्यः पयोबिन्दुभिः।\nन्यग्जानुद्वयमध्ययन्त्रितघटीवक्त्रान्तरालस्खल-\nद्धाराध्वानमनोहरं सखि पयो गां दोग्धि दामोदरः।।","iast":"aṅguṣṭhāgramayantritāṅ‌gulirasau pādādhanīruddhabhū-\nrādrīkṛtya payodharāñjalamalaṃ sadyaḥ payobindubhiḥ|\nnyagjānudvayamadhyayantritaghaṭīvaktrāntarālaskhala-\nddhārādhvānamanoharaṃ sakhi payo gāṃ dogdhi dāmodaraḥ||","meaning":"O sakhī! Dāmodara is milking His cow!\nHis toes adhere so closely to the big toe of His foot,\nHe subdues the earth with His feet as He raises His heels,\nHe wets the udders (of His cow) with only a few drops of milk,\nAnd so pleasant is the sound emanating from the stream of milk trickling into the mouth of the vessel that He grasps between His downward bent knees.”","source":"Śrī Śaraṇa"},{"number":263,"topic":"The Message Of Sakhī Candrāvalī Is Narrated To Krsna","devanagari":"शठान्वस्याः काञ्चीमणिरणितमाकर्ण्य सहसा\nयदाश्लिष्यन्नेव प्रशिथिलभुजग्रन्थिरभवः।\nतदेतत् क्वाचक्षे घृतमधुमय त्वद्बहवचो-\nविषेणाघूर्णन्ती किमपि न सखी मे गणयति।।","iast":"śaṭhānvasyāḥ kāñcīmaṇiraṇitamākarṇya sahasā\nyadāśliṣyanneva praśithilabhujagranthirabhavaḥ|\ntadetat kvācakṣe ghṛtamadhumaya tvadbahavaco-\nviṣeṇāghūrṇantī kimapi na sakhī me gaṇayati||","meaning":"(A friend of sakhi Candravali addresses Krsna:)\n\"O wicked One!\nWhen You embraced My friend (Candrāvalī), then upon hearing the tinkling sound of the jewels in the ornaments around the waist of another sakhi, You all of a sudden, slackened the grip of Your arms.\nWhere (and to whom) shall I narrate all this?\nYour flattering words, being poisonous like a mixture* of ghi and honey, have made my friend so delirious that she has abandoned all care for her wellbeing.\"","source":"Anonymous"},{"number":264,"topic":"The Lord Lifts The Govarhana Mountain","devanagari":"सत्रासार्ति यशोदया प्रियगुणप्रीतेक्षणं राधया\nलग्नैर्वल्लवसूनुभिः सरभसं सम्भावितात्मोर्जितैः ।\nभीतानन्दितविस्मितेन विषमं नन्देन चालोकितः\nपायाद्ः करपद्मसुस्थितमहाशैलः सलीलो हरिः।।","iast":"satrāsārti yaśodayā priyaguṇaprītekṣaṇaṃ rādhayā\nlagnairvallavasūnubhiḥ sarabhasaṃ sambhāvitātmorjitaiḥ |\nbhītānanditavismitena viṣamaṃ nandena cālokitaḥ\npāyādḥ karapadmasusthitamahāśailaḥ salīlo hariḥ||","meaning":"(When the Lord lifted the Govardhana mountain, all those present witnessed the spectacle with very varied feelings.)\nMother Yaśodā was tormented by fear (for the safety of her son).\nRādhā was delighted in beholding the divine prowess of Her beloved.\nThe unclad cowherd boys (who were friends of the Lord) enthusiastically attempted to express their strength (by wanting to emulate the Lord).\nAnd Lord Nanda was overcome with fear, yet experienced joy and wonder (over the feat of His son).\nMay Lord Hari, Who was thus seen, sportively lifting the Govardhana mountain with His lotus-hands, protect you.","source":"Śrī Sohnoka"},{"number":265,"topic":"The Lord Lifts The Govarhana Mountain","devanagari":"न्यञ्चच्छैलभरादिते विरुवति स्मेरो हरिः पातुः वः।।","iast":"nyañcacchailabharādite viruvati smero hariḥ pātuḥ vaḥ||","meaning":"(The cowherd boys addressed their friend Kṛṣṇa thus:)\n\"O Kṛṣṇa! For a long time now have You been, all by Yourself, holding this Govardhana mountain. You must be tired. Now rest a few moments while we all bear the weight for You.\"\nThus speaking, the cowherd boys, overzealous in their desire to help their friend, attempt to hold the mountain.\nThe Lord, slackening His arms slightly, lowers the mountain a little.\nBeing oppressed by the weight, the cowherd boys cry out.\nMay the Lord, Who then smiles in amusement (at the naivete of His friends), protect you.","source":"Śrī Śaraṇa"},{"number":266,"topic":"The Lord Lifts The Govarhana Mountain","devanagari":"खिन्नोऽसि मुञ्च शैलं बिभृमो वयमिति वदत्सु शिथिलभुजः।\nभरभुग्नविततबाहुषु गोपेषु हसन् हरिजियति।।","iast":"khinno’si muñca śailaṃ bibhṛmo vayamiti vadatsu śithilabhujaḥ|\nbharabhugnavitatabāhuṣu gopeṣu hasan harijiyati||","meaning":"\"You must be very tired. Let go of the mountain and let us bear the burden.\"\nThe cowherd boys having thus spoken, the Lord slackens His arms a little.\nAs the outstretched arms of the cowherd boys give way under the weight of the mountain, the Lord laughs.\nGlory be to Lord Hari!","source":"Śrī Subandhu"},{"number":267,"topic":"The Lord Lifts The Govarhana Mountain","devanagari":"दूरं दृष्टिपात्तिरोभव हरेर्गोवर्धनं बिभ्रत-\nस्त्वय्यासक्तदृशः कृशोदरि करस्ततोऽस्य मा भूदयम्।\nगोपीनामिति जल्पितं कलयतो राधानिरोधाश्रयं\nश्वासाः शैलभरश्रमभ्रमकराः कंसद्विषः पान्तु वः।।","iast":"dūraṃ dṛṣṭipāttirobhava harergovardhanaṃ bibhrata-\nstvayyāsaktadṛśaḥ kṛśodari karastato’sya mā bhūdayam|\ngopīnāmiti jalpitaṃ kalayato rādhānirodhāśrayaṃ\nśvāsāḥ śailabharaśramabhramakarāḥ kaṃsadviṣaḥ pāntu vaḥ||","meaning":"(The gopīs said to Rādhā:)\n\"O One Who endowed with a slender waist! Disappear from here!\"\nBe far away from the sight of Hari Who holds the Govardhana mountain. His eyes being riveted upon You, the mountain will slip from His hands.\"\nUpon hearing the gopīs telling Rādhā to leave, the Lord breathes heavily and His hands grow weary from bearing the weight of the mountain.\nMay those deep breaths of the enemy of Kamsa protect you.","source":"Śrī Śubhāṅka"},{"number":268,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"कुरु पारं यमुनाया मुहुरिति गोपीभिरुक्तराहूतः।\nतरितटकपटश्यालुर्दिंगुणालस्यो हरिर्जयति।।","iast":"kuru pāraṃ yamunāyā muhuriti gopībhiruktarāhūtaḥ|\ntaritaṭakapaṭaśyālurdiṃguṇālasyo harirjayati||","meaning":"(The Lord once assumed the guise of a ferryman and lay asleep in His boat. Some gopis who desired to cross the river Yamunā approached His boat.)\n\"Take us across the Yamunā\", said the gopis and repeated their request several times.\nLord Hari, Who lay sleeping in the corner of His boat, then pretended to be lazier than before (and continued to sleep).\nGlory be to Lord Hari!","source":"Śrī Sañjaya Kaviśekhara"},{"number":269,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"उत्तिष्ठारात्तरौ मे तरुणि मम तरोः शक्तिरारोहणे का\nसाक्षादाख्यामि मुग्धे तरणिमिह रवेराख्यया का रतिर्मे।\nवार्तेयं नौप्रसङ्गे कथमपि भविता नावयोः सङ्गमार्या\nवार्तापीति स्मितास्यं जितगिरमजितं राधयाराधयामि।।","iast":"uttiṣṭhārāttarau me taruṇi mama taroḥ śaktirārohaṇe kā\nsākṣādākhyāmi mugdhe taraṇimiha raverākhyayā kā ratirme|\nvārteyaṃ nauprasaṅge kathamapi bhavitā nāvayoḥ saṅgamāryā\nvārtāpīti smitāsyaṃ jitagiramajitaṃ rādhayārādhayāmi||","meaning":"(Kṛṣṇa once invited Rādhā to ride in His boat.)\nKṛṣṇa: O youthful One! Come and quickly sit in My ‘boat’.\nRādhā: What ability do I have to climb a ‘tree’?\nKṛṣṇa: I speak directly O charming One! I mean ‘boat’.\nRādhā: What do I care for invoking the ‘sun’.\nKṛṣṇa: I have thus far spoken about My ‘boat’.\nRādhā: There is no purpose for ‘the two of us’ to be together.\nThe Lord then smiled in amusement over His conversation with Rādhā.\nI worship that unconquerable Lord Ajita, Who was defeated in His debate with Rādhā.","source":"Śrī Rūpa Gosvāmī"},{"number":270,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"मुक्ता तरङ्गनिवहेन पतङ्गपुत्री\nनव्या च नौरिति वचस्तव तथ्यमेव ।\nशङ्कानिदमिव मे मतिमात्रं\nत्वं चञ्चलो यदिह माधव नाविकोडसि ।।","iast":"muktā taraṅganivahena pataṅgaputrī\nnavyā ca nauriti vacastava tathyameva |\nśaṅkānidamiva me matimātraṃ\ntvaṃ cañcalo yadiha mādhava nāvikoḍasi ||","meaning":"(Rādhā Who was hesitating to enter Kṛṣṇa's boat said to Him:)\n\"O Mādhava! It is true as You say,\nThat the river Yamunā, the daughter* of the Sun, is flowing smoothly without any waves,\nAnd that Your boat is nice and new.\nBut the reason for this overwhelming doubt in My mind is that You, here, are a mischievous boatman.\"","source":"Śrī Rūpa Gosvāmī"},{"number":271,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"जीर्णा तरि: सरिदतीवगभीरनीरा\nबाला वयं सकलमित्यमनर्थहेतु: ।\nनिस्तारबीजमिदमेव कृशोदरीणां\nयन्माधव त्वमसि सम्प्रति कर्णधार: ।।","iast":"jīrṇā tari: saridatīvagabhīranīrā\nbālā vayaṃ sakalamityamanarthahetu: |\nnistārabījamidameva kṛśodarīṇāṃ\nyanmādhava tvamasi samprati karṇadhāra: ||","meaning":"(Some gopis said to Kṛṣṇa:)\n\"O Mādhava!\nYour boat is old, the river waters are very deep and we are very young.\nAll these are cause for calamity.\n(But we shall ride in Your boat nevertheless.)\nFor us gopis, who are endowed with slender waists, the ‘seed of salvation’ lies with You, now that You are our helmsman.\"","source":"Śrī Jagadānanda Rāya"},{"number":272,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"अम्भसि तरणिःसुताया: स्तम्भिततरणि: स देवकीसूनु: ।\nआतरविरहितगोप्या: कातरमुखमीक्षते स्मेर: ।।","iast":"ambhasi taraṇiḥsutāyā: stambhitataraṇi: sa devakīsūnu: |\nātaravirahitagopyā: kātaramukhamīkṣate smera: ||","meaning":"While ferrying the gopis, the son of Devakī stopped His boat in the middle of the waters of the Yamunā river.\nWhen He asks for the fare, the gopis, having nothing to give, become anxious.\nThe Lord then smiles as He looks at the expression of distress on their faces.","source":"Śrī Surya Dāsa"},{"number":273,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"वाचा तवैव यदुनन्दन गव्यभारो\nहारोऽपि वारिणि मया सहसा विकीर्णः।\nदूरीकृतं च कुचयोरनयोर्दुकूलं\nकूलं कलिन्ददुहितुर्न तथाप्यदूरम्।।","iast":"vācā tavaiva yadunandana gavyabhāro\nhāro’pi vāriṇi mayā sahasā vikīrṇaḥ|\ndūrīkṛtaṃ ca kucayoranayordukūlaṃ\nkūlaṃ kalindaduhiturna tathāpyadūram||","meaning":"(When the Lord was ferrying Rādhā across the river He complained about the boat being too heavy. He asked Rādhā to discard Her belongings. She complied and said:)\n\"I have done as You said, O son of Nanda!\nI have, all at once, thrown into the water all the milk, yoghurt and butter I was carrying. I have also thrown My necklace. I have even discarded the cloth over My blouse.\nBut the shore of the Yamunā is yet so far!\"","source":"Anonymous"},{"number":274,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"पयःपूरैः पूर्णा सपदि गतघूर्णा च पवनै-\nर्गभीरे कालिन्दीपयसि तरिरेषा प्रविशति।\nअहो मे दुर्दैवं परमकुतुकाक्रान्तहृदयो\nहरिर्वारं वारं तदपि करतालिं रचयति।।","iast":"payaḥpūraiḥ pūrṇā sapadi gataghūrṇā ca pavanai-\nrgabhīre kālindīpayasi tarireṣā praviśati|\naho me durdaivaṃ paramakutukākrāntahṛdayo\nharirvāraṃ vāraṃ tadapi karatāliṃ racayati||","meaning":"(While traveling in Kṛṣṇa's boat, Rādhā said to Her friends:)\n\"This boat is fast filling up by the surging water, is being tossed about by the wind and is sinking into the deep waters of the Yamunā.\"\nAnd alas! Such is My misfortune that (instead of being concerned) this Hari is becoming extremely exited and is making merry by repeatedly clapping His Hands.\"","source":"Śrī Manohara"},{"number":275,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"पानीयसेचनविधौ मम नैव पाणी\nविश्राम्यतस्तदपि ते परिहासवाणी ।\nजीवामि चेत् पुनरहं न तदा कदापि\nकृष्ण त्वदीयतरणौ चरणौ ददामि ।।","iast":"pānīyasecanavidhau mama naiva pāṇī\nviśrāmyatastadapi te parihāsavāṇī |\njīvāmi cet punarahaṃ na tadā kadāpi\nkṛṣṇa tvadīyataraṇau caraṇau dadāmi ||","meaning":"(When the boat had filled up with water, Rādhā began to throw out the water with Her hands. She said to Kṛṣṇa:)\n“My arms have had no respite from this task of removing water (from the boat). Yet You continue to mock Me.\nIf I survive and live on, O Kṛṣṇa, I shall not set foot in Your boat ever again.”","source":"Śrī Manohara"},{"number":276,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"इदमुदिश्य वयस्याः स्वसमीहितदैवतं नमत ।\nयमुनैव जानुदघ्नी भवतु न वा नाविकोसत्त्वपरः।।","iast":"idamudiśya vayasyāḥ svasamīhitadaivataṃ namata |\nyamunaiva jānudaghnī bhavatu na vā nāvikosattvaparaḥ||","meaning":"(When the boat was filling up with water, Rādhā said to Her friends:)\n“O My friends! May all of you invoke your respective tutelary deities and pray to them that the waters of the Yamunā may become knee-deep. Or that some other boatman may come our way.”","source":"Śrī Mukunda Bhaṭṭācārya"},{"number":277,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"तरिरुत्तरला सरिद्गभीरा\nतरलो नन्दसुतश्च कर्णधारः।\nअबलाहमुपैति भानुरस्तं\nसखि दूरे नगरीह किं करोमि।।","iast":"tariruttaralā saridgabhīrā\ntaralo nandasutaśca karṇadhāraḥ|\nabalāhamupaiti bhānurastaṃ\nsakhi dūre nagarīha kiṃ karomi||","meaning":"(Rādhā said to Her friend in the boat:)\n\"O sakhi!\nThe boat is becoming unsteady (due to the wind).\nThe river is very deep,\nOur boatman, the son of Nanda, is so mischievous.\nI am a woman (and thus helpless),\nThe sun is setting,\nAnd the city is yet so far.\nOh! What shall I do in this situation?\"","source":"Anonymous"},{"number":278,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"नापेक्षते स्तुतिकथां न शृणोति काकुं\nशश्वत्कृतं न मनुते प्रणिपातजातम्।\nहा किं विधेयमधुना सखि नन्दसूनु-\nर्मध्येतरङ्गिणि तरिं तरलो धुनोति।।","iast":"nāpekṣate stutikathāṃ na śṛṇoti kākuṃ\nśaśvatkṛtaṃ na manute praṇipātajātam|\nhā kiṃ vidheyamadhunā sakhi nandasūnu-\nrmadhyetaraṅgiṇi tariṃ taralo dhunoti||","meaning":"(Rādhā complains about Kṛṣṇa to Her friend:)\n\"He pays no heed to My flattering words,\nHe does not listen to My endless cries of distress,\nAnd He disregards all the obeisances that I make to Him.\nOh! What shall I do now, O sakhi?\nThis mischievous son of Nanda has brought us to the middle of the\nriver and now He is rocking the boat.\"","source":"Śrī Rūpa Gosvāmī"},{"number":279,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"एषोतुङ्गतरङ्गल्लङ्घिततटसङ्गा पतङ्गात्मजा\nपूर्णेयं तरिरम्बुभिर्न हि हरेः शङ्का कलङ्कादपि ।\nकाठिन्यं भज नाद्य सुन्दरि वयं राधे प्रसादेन ते\nजीवामः स्फुटमातरीकुरु गिरिद्रोणीविनोदोत्सवम् ।।","iast":"eṣotuṅgataraṅgallaṅghitataṭasaṅgā pataṅgātmajā\npūrṇeyaṃ tarirambubhirna hi hareḥ śaṅkā kalaṅkādapi |\nkāṭhinyaṃ bhaja nādya sundari vayaṃ rādhe prasādena te\njīvāmaḥ sphuṭamātarīkuru giridroṇīvinodotsavam ||","meaning":"\"The Yamunā river, who is the daughter of the Sun, is\ninundating her banks with her lofty waves.\nThe boat is filling up with water, and Hari is not in the least\nconcerned about this.\"\n(Upon hearing these words of Rādhā, Kṛṣṇa said:)\n\"Be not so harsh today, O beautiful One!\nFor I am alive only by Your grace, O Rādhā!\nLook upon (the delight You gave Me during) our dalliances in the\nmountain valleys as the fare for traveling in My boat.\"","source":"Śrī Rūpa Gosvāmī"},{"number":280,"topic":"The Lord'S Sporting Pastimes In His Boat","devanagari":"काकुं करोषि गृहकोणकरीषपुञ्ज-\nगूढाङ्ग किं ननु वृथा कितव प्रयाहि ।\nकुत्राद्य जीर्णतरणिभ्रमणातिभीत-\nगोपाङ्गनागणविडम्बनचातुरी ते ।।","iast":"kākuṃ karoṣi gṛhakoṇakarīṣapuñja-\ngūḍhāṅga kiṃ nanu vṛthā kitava prayāhi |\nkutrādya jīrṇataraṇibhramaṇātibhīta-\ngopāṅganāgaṇaviḍambanacāturī te ||","meaning":"(After riding in Kṛṣṇa's boat, the frightened gopis began to depart. When Kṛṣṇa tried to console them, a sakhi said to Him:)\n\"You plead in vain, O deceitful One! Begone from here!\nYou deserve to have Your limbs smeared by the heap of cowdung lying in the corner of Your house.\nNow where is gone all the cleverness You displayed in beguiling us cowherd girls, who have now become extremely terrified after riding in Your dilapidated boat?\"","source":"Śrī Rūpa Gosvāmī"},{"number":281,"topic":"Kṛṣṇa'S Dialogues With Rādhā","devanagari":"अङ्गुल्या कः कवाटं प्रहरति कुटिले माधवः किं वसन्तो\nनो चक्री किं कुलालो न हि धरणिधरः किं द्विजिव्हः फणीन्द्रः।\nनाहं घोराहिमर्दी किमसि खगपर्तिर्नो हरिः किं कपीशो\nराधावाणीभिरित्थं प्रहसितवदनः पातु वश्चक्रपाणिः।।","iast":"aṅgulyā kaḥ kavāṭaṃ praharati kuṭile mādhavaḥ kiṃ vasanto\nno cakrī kiṃ kulālo na hi dharaṇidharaḥ kiṃ dvijivhaḥ phaṇīndraḥ|\nnāhaṃ ghorāhimardī kimasi khagapartirno hariḥ kiṃ kapīśo\nrādhāvāṇībhiritthaṃ prahasitavadanaḥ pātu vaścakrapāṇiḥ||","meaning":"(Kṛṣṇa goes to Rādhā's house and knocks on Her door.)\nRādhā: Who knocks on the door with his fingers?\nKṛṣṇa: I am Mādhava, O deceitful One.\nRādhā: Are You the spring season?\nKṛṣṇa: No. I am Cakrī, the weilder of the discus.\nRādhā: Are You a potter?\nKṛṣṇa: No. I am Dharnidhara, the bearer of the earth.\nRādhā: Are You Śeṣa, the lord of serpents?\nKṛṣṇa: No. I am the vanquisher of dreadful serpents (such as Kāliyā).\nRādhā: Are You Garuda, the king of birds?\nKṛṣṇa: No. I am Hari.\nRādhā: Are You a king of monkeys?\nMay Lord Cakrapāṇi, Who graces His countenance with a smile upon hearing Rādhā speak in this manner, protect you.","source":"Anonymous"},{"number":282,"topic":"Kṛṣṇa'S Dialogues With Rādhā","devanagari":"कस्त्वं भो निशि केशव: शिरसिजै: किं नाम गर्वायसे\nभद्रे शौरिरहं गुणै: पितृगतै: पुत्रस्य किं स्यादिह।\nचक्री चन्द्रमुखि प्रयच्छसि न मे कुण्डीं घटीं दोहनी-\nमित्थं गोपवधूजितोत्तरतया ह्रीणो हरि: पातु व:।।","iast":"kastvaṃ bho niśi keśava: śirasijai: kiṃ nāma garvāyase\nbhadre śaurirahaṃ guṇai: pitṛgatai: putrasya kiṃ syādiha|\ncakrī candramukhi prayacchasi na me kuṇḍīṃ ghaṭīṃ dohanī-\nmitthaṃ gopavadhūjitottaratayā hrīṇo hari: pātu va:||","meaning":"(Kṛṣṇa comes to Rādhā's house and they speak thus:)\nRādhā: Who comes here in the night?\nKṛṣṇa: I am Keśava*.\nRādhā: Why are You so proud of Your beautiful hair?\nKṛṣṇa: O noble One! I am Śauri, descendant of Śūra**.\nRādhā: Then why does the son not have the virtues of His forefathers?\nKṛṣṇa: O Candramukhi! I am Cakrī***, the weilder of the discus.\nRādhā: Have You brought Me a water-pitcher, a jar and a milk-pail?\nMay Lord Hari, Who becomes bashful upon being thus humbled by the replies of Rādhā, protect you.","source":"Śri Cakrapāṇi"},{"number":283,"topic":"Kṛṣṇa'S Dialogues With Rādhā","devanagari":"वासः सम्प्रति केशव क्व भवतो मुग्धेक्षणे नन्विदं\nवासं ब्रूहि शठ प्रकामसुभगे त्वद्गात्रसंसर्गतः ।\nयामिन्यामुषितः क्व धूर्त वितनुर्मुष्णाति किं यामिनीं\nशौरिर्गोपवधू छलैः परिहसन्नेवंविधैः पातु वः ।।","iast":"vāsaḥ samprati keśava kva bhavato mugdhekṣaṇe nanvidaṃ\nvāsaṃ brūhi śaṭha prakāmasubhage tvadgātrasaṃsargataḥ |\nyāminyāmuṣitaḥ kva dhūrta vitanurmuṣṇāti kiṃ yāminīṃ\nśaurirgopavadhū chalaiḥ parihasannevaṃvidhaiḥ pātu vaḥ ||","meaning":"Rādha: Where is Your abode* now, O Keśava?\nKṛṣṇa: Here they are, O lovely-eyed One (i.e. here are My clothes).\nRādhā: I am saying ‘abode’, O crafty One.\nKṛṣṇa: I have acquired this (fragrance) by contact with Your body, O most blessed One.\nRādhā: (If that is so, then) where were You at night, O wicked One?\nKṛṣṇa: How can the night, which is not embodied, engage in theft**?\nMay Lord Śauri, Who amuses Himself by indulging in such deception with Rādhā, protect you.","source":"Anonymous"},{"number":284,"topic":"Kṛṣṇa'S Dialogues With Rādhā","devanagari":"राधे त्वं कुपिता त्वमेव कुपिता स्रष्टासि भूमेर्यतो\nमाता त्वं जगतां त्वमेव जगतां माता न विज्ञोऽपरः।\nदेवि त्वं परिहासकेलिकलहेऽनन्ता त्वमेवेत्यसौ\nस्मेरो वल्लवसुन्दरीमवनमच्छौरिः श्रियं वः क्रियात्।।","iast":"rādhe tvaṃ kupitā tvameva kupitā sraṣṭāsi bhūmeryato\nmātā tvaṃ jagatāṃ tvameva jagatāṃ mātā na vijño’paraḥ|\ndevi tvaṃ parihāsakelikalahe’nantā tvamevetyasau\nsmero vallavasundarīmavanamacchauriḥ śriyaṃ vaḥ kriyāt||","meaning":"Kṛṣṇa: You are kupitā (angry), O Rādhā!\nRādhā: You are ku-pitā (father of the earth), for You are the creator of the earth.\nKṛṣṇa: You are the mātā (mother) of the whole world.\nRādhā: You are the only mātā (truly enlightened One) in whole world, for there is none more wise than You.\nKṛṣṇa: O divine One! You are anantā (having no limits) in the game of humorous debate.\nRādhā: You are ananta (infinite Supreme Spirit).\nMay Lord Śauri, Who smiled as He became humbly disposed to Rādhā, grant you prosperity.","source":"Śrī Harihara"},{"number":285,"topic":"The Lord'S Rāsa Dance","devanagari":"वृन्दारण्ये प्रमदस The मल्लिकापुष्पमोदे\nश्रीशुभांशोः किरणरुचिरे कोकिलाद्यैर्मनोज्ञे ।\nरात्रौ चित्रे पशुपवनिताचित्तदेहापहारी\nकंसारातेर्मधुरमुरलीवाद्यराजो रराज ।।","iast":"vṛndāraṇye pramadasa The mallikāpuṣpamode\nśrīśubhāṃśoḥ kiraṇarucire kokilādyairmanojñe |\nrātrau citre paśupavanitācittadehāpahārī\nkaṃsārātermadhuramuralīvādyarājo rarāja ||","meaning":"Vrndāvana, the abode of pleasure,\nWas graced by the fragrance of Mallikā flowers,\nWas resplendent by the rays of the moon,\nAnd was pervaded by the pleasing sound of the cuckoo and other birds.\nIn that Vrndāvana,\nDuring the night that offers many wonderful delights,\nThe sweet sounding flute of the enemy of Kamsa,\nThat is sovereign among instruments of music,\nAnd which abducts the minds and bodies of the cowherd girls,\nReigned supreme.","source":"Anonymous"},{"number":286,"topic":"The Lord'S Rāsa Dance","devanagari":"अधरामृतमाधुरीधुरीणो हरिलालामुरलीनिनाद एषः।\nप्रततान मनःप्रमोदमुच्चैर्हरिणीदृशां मुनीनाम्।।","iast":"adharāmṛtamādhurīdhurīṇo harilālāmuralīnināda eṣaḥ|\npratatāna manaḥpramodamuccairhariṇīdṛśāṃ munīnām||","meaning":"The sound of the flute of Lord Hari,\nThat narrates His lilās and carries the sweetness of the nectar flowing from His lips,\nImmensely intensified the bliss that the deer, the deer-eyed gopis and the sages (of Vraja) experienced in their hearts.","source":"Śrī Mādhavendra Purī"},{"number":287,"topic":"The Lord'S Rāsa Dance","devanagari":"लीलामुखरितमुरलीतरलीकृतगोपभाविनिवहः।\nतदधरमधुनि सतृष्णः कृष्णः पायादपायतो भवतः।।","iast":"līlāmukharitamuralītaralīkṛtagopabhāvinivahaḥ|\ntadadharamadhuni satṛṣṇaḥ kṛṣṇaḥ pāyādapāyato bhavataḥ||","meaning":"May Lord Kṛṣṇa,\nWho unsettles the hearts of the host of gopis with His sportively resounding flute,\nAnd Who craves the nectar of their lips,\nProtect you from misfortune.","source":"Śrī Mādhava Cakravartī"},{"number":288,"topic":"The Lord'S Rāsa Dance","devanagari":"कारय नाम्ब विलम्बं मुञ्च करं मे हरिं यामि।\nन सहे स्थातुं यदसौ गर्जति मुरली प्रगल्भदीव।।","iast":"kāraya nāmba vilambaṃ muñca karaṃ me hariṃ yāmi|\nna sahe sthātuṃ yadasau garjati muralī pragalbhadīva||","meaning":"(Rādhā says to her friend:)\n\"Delay Me no more O noble one! Let go of My hand. I am going to (My beloved) Hari.\nI cannot bear to stay here any longer for His flute is crying out like a vociferous messenger.\"","source":"Śrī Rūpa Gosvāmī"},{"number":289,"topic":"The Lord'S Rāsa Dance","devanagari":"चूडाचुम्बितचारुचन्द्रकचयं चामीकराभम्बरं\nकर्णोत्ंसितकर्णिकारकुसुमं कन्दर्पकल्लोलिनम्।\nवंशीवादनवावदूकवदनं वक्रीभवद्वीक्षणं\nभाग्यं भङ्गुरमध्यमाः परिणतं कुञ्जान्तरे भेजिरे।।","iast":"cūḍācumbitacārucandrakacayaṃ cāmīkarābhambaraṃ\nkarṇotṃsitakarṇikārakusumaṃ kandarpakallolinam|\nvaṃśīvādanavāvadūkavadanaṃ vakrībhavadvīkṣaṇaṃ\nbhāgyaṃ bhaṅguramadhyamāḥ pariṇataṃ kuñjāntare bhejire||","meaning":"The Lord's head is adorned with an elegant wreath of peacock feathers,\nHis attire is resplendent as gold,\nHis ears are embellished with Karnikāra flowers,\nHe embodies the undulatory power of Cupid,\nHis mouth expressively sounds the flute,\nAnd His eyes cast sidelong glances.\nThus was the form of the Lord that the gopis, who are endowed with slender waists, beheld in the interiors of a forest garden. And in so beholding the Lord did they attain the fulfillment of their destiny.","source":"Śrī Jivadāsa Vāhinīpati"},{"number":290,"topic":"Krsna Adresses The Gopīs","devanagari":"दुष्टः कोऽपि करोति वः परिभवं शङ्के मुहुर्गोकुले\nधावन्त्यःस्खलदम्बरं निशि वने यूयं यदभ्यागताः ।\nआः का भीतिरमन्ददानववधू सिन्दूरमुद्राहरे\nदोर्दण्डे मम भाति दीव्यत पतिक्रोडे कुरङ्गीदृशः ।।","iast":"duṣṭaḥ ko’pi karoti vaḥ paribhavaṃ śaṅke muhurgokule\ndhāvantyaḥskhaladambaraṃ niśi vane yūyaṃ yadabhyāgatāḥ |\nāḥ kā bhītiramandadānavavadhū sindūramudrāhare\ndordaṇḍe mama bhāti dīvyata patikroḍe kuraṅgīdṛśaḥ ||","meaning":"\"O deer-eyed ones! In this forest, in the night time, have all of you come running to Me and (in such haste that) your dresses are slipping from your bodies. I suspect that some evil one in Gokula has been persistently tormenting you.\nBut look! What reason have you to fear when so glorious are My strong arms that they are capable of taking away the sindūra* from the wives of the ferocious demons.\nGo home all of you and play in the laps of your husbands.\"","source":"Śrī Rūpa Gosvāmī"},{"number":291,"topic":"Krsna Adresses The Gopīs","devanagari":"धूतौत्तापे वहति गहने धर्मपूरे व्रजान्तः\nका वस्तृष्णा बलति हृदये दुर्मदेयं सतीनाम् ।\nसीमन्तिन्यः स्पृहयत गृहान् मा विरुद्धं कुरुध्वं\nनायं दृष्टौ मम विघटते हन्त पुण्यस्य पन्थाः ।।","iast":"dhūtauttāpe vahati gahane dharmapūre vrajāntaḥ\nkā vastṛṣṇā balati hṛdaye durmadeyaṃ satīnām |\nsīmantinyaḥ spṛhayata gṛhān mā viruddhaṃ kurudhvaṃ\nnāyaṃ dṛṣṭau mama vighaṭate hanta puṇyasya panthāḥ ||","meaning":"You virtuous women bear in your hearts an abundance of that profound dharma that frees one from worldly torments. Then, in this city of Vraja, what is this mad desire that thrives in your hearts?\nYou ladies must hasten to your homes and must not do anything that is contrary (to dharma). For, in My view, this* does not make for virtuous conduct.","source":"Śrī Rūpa Gosvāmī"},{"number":292,"topic":"The Replies Of The Blessed Gopīs Of Vraja","devanagari":"कथं वीथीमस्मानुपदिशसि धर्मप्रणयिणी\nप्रसीद स्वां शिक्षामतिखलमुखीं शाधि मुरलीम् ।\nहरन्ती मर्यादां शिव शिव परे पुंसि हृदयं\nनयन्ती धृष्टेयं यदुवर यथा नाह्यति नः।।","iast":"kathaṃ vīthīmasmānupadiśasi dharmapraṇayiṇī\nprasīda svāṃ śikṣāmatikhalamukhīṃ śādhi muralīm |\nharantī maryādāṃ śiva śiva pare puṃsi hṛdayaṃ\nnayantī dhṛṣṭeyaṃ yaduvara yathā nāhyati naḥ||","meaning":"“Why do You enjoin us to adhere to the path of dharma?\nMay You bestow Your grace upon us!\nGo preach to Your disciple, Your wicked flute.\nŚiva! Śiva*!\nYour impudent flute robs us of our sense of propriety and enchants our hearts into seeking (You) our paramour.\nO king of Yadus! Pray let Your flute not beckon us so.”","source":"Śrī Rūpa Gosvāmī"},{"number":293,"topic":"The Replies Of The Blessed Gopīs Of Vraja","devanagari":"गोपीजनालिङ्गितमध्यभागं\nवेणुं धमन्तं भृशलोलनेत्रम्।\nकलेवरे प्रस्फुटरोमवृन्दं\nनमामि कृष्णं जगदेककन्दम्।।","iast":"gopījanāliṅgitamadhyabhāgaṃ\nveṇuṃ dhamantaṃ bhṛśalolanetram|\nkalevare prasphuṭaromavṛndaṃ\nnamāmi kṛṣṇaṃ jagadekakandam||","meaning":"I offer my salutations to Kṛṣṇa, Who is the one and only\nsustainer of the world,\nWhose waist is embraced by the gopis,\nWho plays the flute,\nWho has large roving eyes,\nAnd Whose body is charged with horripilation.","source":"Śrī Puruṣottamadeva"},{"number":294,"topic":"The Replies Of The Blessed Gopīs Of Vraja","devanagari":"कालिन्द्याः पुलिनेषु केलिकुपितामुत्सृज्य रासे रसं\nगच्छन्तीमनुगच्छतोऽश्रुकलुषां कंसद्विषो राधिकाम्।\nतत्पादप्रतिमानिवेशितपदस्योद्भूतरोमोद्गते-\nरक्षुण्णोऽनुिनयः प्रसन्नदयितादृष्टस्य पुष्णातु वः।।","iast":"kālindyāḥ pulineṣu kelikupitāmutsṛjya rāse rasaṃ\ngacchantīmanugacchato’śrukaluṣāṃ kaṃsadviṣo rādhikām|\ntatpādapratimāniveśitapadasyodbhūtaromodgate-\nrakṣuṇṇo’nuinayaḥ prasannadayitādṛṣṭasya puṣṇātu vaḥ||","meaning":"Upon being vexed at Kṛṣṇa’s playful antics, Rādhā discarded all the sentiments that were aroused in Her during the rāsa dance. And, with Her eyes full of tears, She went to the banks of the Yamunā river.\nThe enemy of Kamsa (Kṛṣṇa) followed Her, placing His feet upon Her footprints. Upon doing so (He became so ecstatic that) His body’s hair stood on end.\nRādhā then became pleased and looked upon the Lord Who was relentless in His propitiatory gestures.\nMay those relentless propitiatory gestures of the Lord cherish you.","source":"Śrī Bhaṭṭa Nārāyaṇa"},{"number":295,"topic":"The Questions Asked By Rādhā And The Gopīs When Kṛṣṇa Disappeared From The Scene","devanagari":"तुलसि विलससि त्वं मल्लि जातासि फुल्ला\nस्थलकमलिनि भृङ्गैः सङ्गताङ्गी विभासि ।\nकथयत वत सख्यः क्षिप्रमस्मासु कस्मिन्\nवसति कपटकन्दः कन्दरे नन्दसूनुः।।","iast":"tulasi vilasasi tvaṃ malli jātāsi phullā\nsthalakamalini bhṛṅgaiḥ saṅgatāṅgī vibhāsi |\nkathayata vata sakhyaḥ kṣipramasmāsu kasmin\nvasati kapaṭakandaḥ kandare nandasūnuḥ||","meaning":"(Rādhā addresses Her friends:)\n\"Tulasi! You are indulging yourself in play.\nMalli! You are blooming with joy.\nSthalakamalini! Having applied talc to your limbs, you look so beautiful!\nBut alas! Tell me quickly O sakhis! In which of the caves (of the Govardhana mountain) is hiding the source of all deceit, the son of Nanda?\"","source":"Śrī Rūpa Gosvāmī"},{"number":296,"topic":"The Questions Asked By Rādhā And The Gopīs When Kṛṣṇa Disappeared From The Scene","devanagari":"दृष्ट: क्वापि स माधवो व्रजवधूमादाय काञ्चिद्गत
